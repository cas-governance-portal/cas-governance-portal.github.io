    implementation: ideas-to-life/setup-cas@main
    evidence_ids:
    - ev-wf-cas-continuous-architecture
    confidence: high
  - id: step:3:pre-flight-environment-credent
    name: Pre-flight Environment & Credential Check
    sequence: 3
    depends_on:
    - step:2:set-up-cas-cli
    implementation: "cas governance check-env --target-dir .\nif [ -z \"$KNOWLEDGE_TOKEN\"\
      \ ]; then\n  echo \"has_knowledge_token=false\" >> \"$GITHUB_OUTPUT\"\n  echo\
      \ \"[CAS][WARN] CAS_KNOWLEDGE_BRAIN (or legacy CAS_KNOWLEDGE_TOKEN) is not configured.\"\
      \n  echo \"[CAS][INFO] Degrading gracefully to local deterministic diagnostics\
      \ mode.\"\n  echo \"[CAS][HINT] Configure secrets at: https://github.com/${{\
      \ github.repository }}/settings/secrets/actions\"\nelse\n  echo \"has_knowledge_token=true\"\
      \ >> \"$GITHUB_OUTPUT\"\nfi\n"
    evidence_ids:
    - ev-wf-cas-continuous-architecture
    confidence: high
    control_roles:
    - Prevent
  - id: step:4:run-deterministic-architecture
    name: Run Deterministic Architecture Linter & Control Bands
    sequence: 4
    depends_on:
    - step:3:pre-flight-environment-credent
    implementation: 'echo "[CAS][INFO] Running deterministic architecture health checks
      and statistical control bands..."

      cas governance lint --target-dir .

      cas governance check-bands --target-dir . --advisory

      '
    evidence_ids:
    - ev-wf-cas-continuous-architecture
    confidence: high
    control_roles:
    - Prevent
    - Detect
  - id: step:5:checkout-central-knowledge-lay
    name: Checkout Central Knowledge Layer (cas-brain/knowledge)
    sequence: 5
    depends_on:
    - step:4:run-deterministic-architecture
    implementation: actions/checkout@v4
    evidence_ids:
    - ev-wf-cas-continuous-architecture
    confidence: high
    control_roles:
    - Prevent
  - id: step:6:run-continuous-architecture-sy
    name: Run Continuous Architecture Synthesis Loop
    sequence: 6
    depends_on:
    - step:5:checkout-central-knowledge-lay
    implementation: "if [ -z \"$OPENAI_API_KEY\" ] && [ -z \"$GEMINI_API_KEY\" ] &&\
      \ [ -z \"$HF_TOKEN\" ]; then\n  echo \"[CAS][WARN] No LLM provider API keys\
      \ configured (OPENAI_API_KEY / GEMINI_API_KEY / HF_TOKEN). Skipping AI synthesis\
      \ loop.\"\nelse\n  cas run continuous-architecture-loop \\\n    --project \"\
      $CAS_PROJECT\" \\\n    --target-dir . \\\n    --override '{\"governance_fail_on_error\"\
      : false}'\nfi\n"
    evidence_ids:
    - ev-wf-cas-continuous-architecture
    confidence: high
  - id: step:7:run-pattern-discovery-classifi
    name: Run Pattern Discovery & Classification Flow
    sequence: 7
    depends_on:
    - step:6:run-continuous-architecture-sy
    implementation: "if [ -n \"$OPENAI_API_KEY\" ] || [ -n \"$GEMINI_API_KEY\" ] ||\
      \ [ -n \"$HF_TOKEN\" ]; then\n  cas run pattern-lifecycle-flow \\\n    --project\
      \ \"$CAS_PROJECT\" \\\n    --target-dir . \\\n    --override '{\"governance_fail_on_error\"\
      : false}'\nfi\n"
    evidence_ids:
    - ev-wf-cas-continuous-architecture
    confidence: high
  - id: step:8:commit-push-updated-architectu
    name: Commit & Push Updated Architectural Models to Central Brain
    sequence: 8
    depends_on:
    - step:7:run-pattern-discovery-classifi
    implementation: "git config --global user.name \"CAS Bot\"\ngit config --global\
      \ user.email \"cas-bot@users.noreply.github.com\"\ngit add .\nif ! git diff\
      \ --staged --quiet; then\n  git commit -m \"chore(cas): automated architecture\
      \ synthesis for ${CAS_PROJECT}\"\n  git pull --rebase --autostash origin main\n\
      \  git push origin main\nelse\n  echo \"[CAS][INFO] No architectural model updates\
      \ to persist.\"\nfi\n"
    evidence_ids:
    - ev-wf-cas-continuous-architecture
    confidence: high
  component_ids: []
