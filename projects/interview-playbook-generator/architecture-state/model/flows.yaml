- id: flow:workflow:github:auto-generate-architecture-diagrams
  name: Auto-Generate Architecture Diagrams
  type: workflow
  description: GitHub Actions workflow defined in .github/workflows/architecture-diagrams.yml
  trigger:
    type: event
    event: push, pull_request
    source: GitHub Actions
    evidence_id: ev-wf-architecture-diagrams
  entrypoint:
    path: .github/workflows/architecture-diagrams.yml
    command: github workflow Auto-Generate Architecture Diagrams
    evidence_id: ev-wf-architecture-diagrams
  steps:
  - id: step:1:determine-ref-to-checkout
    name: Determine ref to checkout
    sequence: 1
    depends_on: []
    implementation: "if [ \"${{ github.event_name }}\" = \"pull_request\" ]; then\n\
      \  echo \"ref=${{ github.head_ref }}\" >> $GITHUB_OUTPUT\nelse\n  echo \"ref=${{\
      \ github.ref_name }}\" >> $GITHUB_OUTPUT\nfi\n"
    evidence_ids:
    - ev-wf-architecture-diagrams
    confidence: high
    control_roles:
    - Prevent
  - id: step:2:checkout-code
    name: Checkout Code
    sequence: 2
    depends_on:
    - step:1:determine-ref-to-checkout
    implementation: actions/checkout@v4
    evidence_ids:
    - ev-wf-architecture-diagrams
    confidence: high
    control_roles:
    - Prevent
  - id: step:3:prevent-loops-skip-if-last-com
    name: Prevent loops (skip if last commit made by the bot)
    sequence: 3
    depends_on:
    - step:2:checkout-code
    implementation: "LAST_AUTHOR=\"$(git log -1 --pretty=%an)\"\nif [ \"$LAST_AUTHOR\"\
      \ = \"github-actions[bot]\" ]; then\n  echo \"Last commit by github-actions[bot];\
      \ exiting to avoid workflow loop.\"\n  exit 0\nfi\n"
    evidence_ids:
    - ev-wf-architecture-diagrams
    confidence: high
    control_roles:
    - Prevent
  - id: step:4:set-up-python
    name: Set up Python
    sequence: 4
    depends_on:
    - step:3:prevent-loops-skip-if-last-com
    implementation: actions/setup-python@v5
    evidence_ids:
    - ev-wf-architecture-diagrams
    confidence: high
  - id: step:5:install-dependencies
    name: Install Dependencies
    sequence: 5
    depends_on:
    - step:4:set-up-python
    implementation: 'python -m pip install --upgrade pip

      pip install pyyaml pytest

      '
    evidence_ids:
    - ev-wf-architecture-diagrams
    confidence: high
    control_roles:
    - Detect
  - id: step:6:generate-architecture-diagrams
    name: Generate Architecture Diagrams
    sequence: 6
    depends_on:
    - step:5:install-dependencies
    implementation: 'python src/scripts/generate_architecture_diagrams.py

      '
    evidence_ids:
    - ev-wf-architecture-diagrams
    confidence: high
    control_roles:
    - Generate
  - id: step:7:verify-git-status-check-for-un
    name: Verify Git Status (Check for uncommitted diagram changes)
    sequence: 7
    depends_on:
    - step:6:generate-architecture-diagrams
    implementation: "git status --porcelain\nif [ -n \"$(git status --porcelain)\"\
      \ ]; then\n  echo \"::warning title=Architecture Diagrams Out of Date::Architecture\
      \ diagrams or documentation were updated by the generator.\"\n  echo \"changed=true\"\
      \ >> $GITHUB_OUTPUT\nelse\n  echo \"changed=false\" >> $GITHUB_OUTPUT\nfi\n"
    evidence_ids:
    - ev-wf-architecture-diagrams
    confidence: high
    control_roles:
    - Prevent
  - id: step:8:commit-and-push-generated-diag
    name: Commit and push generated diagrams back to branch
    sequence: 8
    depends_on:
    - step:7:verify-git-status-check-for-un
    implementation: "git config user.name \"github-actions[bot]\"\ngit config user.email\
      \ \"github-actions[bot]@users.noreply.github.com\"\ngit add docs/architecture/*.drawio.xml\
      \ ARCHITECTURE.md README.md || true\nif [ -n \"$(git status --porcelain)\" ];\
      \ then\n  git commit -m \"chore: auto-generate architecture diagrams [ci skip]\"\
      \ || true\n  git push origin HEAD:${BRANCH}\nelse\n  echo \"No changes to commit\"\
      \nfi\n"
    evidence_ids:
    - ev-wf-architecture-diagrams
    confidence: high
    control_roles:
    - Generate
  component_ids: []
  control_roles:
  - Prevent
  - Generate
  - Detect
  artefacts: []
  implementation:
  - .github/workflows/architecture-diagrams.yml
  evidence_ids:
  - ev-wf-architecture-diagrams
  confidence: high
  status: discovered
- id: flow:workflow:github:cas-continuous-architecture-loop
