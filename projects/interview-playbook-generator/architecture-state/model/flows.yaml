    command: github workflow CAS Continuous Architecture Loop
    evidence_id: ev-wf-cas-continuous-architecture
  steps:
  - id: step:1:checkout-target-repository
    name: Checkout Target Repository
    sequence: 1
    depends_on: []
    implementation: actions/checkout@v4
    evidence_ids:
    - ev-wf-cas-continuous-architecture
    confidence: high
    control_roles:
    - Prevent
  - id: step:2:set-up-cas-cli
    name: Set up CAS CLI
    sequence: 2
    depends_on:
