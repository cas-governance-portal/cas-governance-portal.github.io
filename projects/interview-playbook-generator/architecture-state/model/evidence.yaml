- id: ev-wf-346438
  path: .github/workflows/cas-continuous-architecture.yml
  type: workflow
  reference: cas-continuous-architecture.yml
  snippet: "name: CAS Continuous Architecture Loop\n\non:\n  workflow_dispatch:\n\
    \  pull_request:\n    branches: [ main, master ]\n    paths:\n      - '.cas/**'\n\
    \      - 'src/**'\n      - 'specs/**'\n      - 'tests/**'\n  # schedule:\n  #\
    \   - cron: '0 2 * * *'\n\npermissions:\n  contents: read\n\njobs:\n  continuous-architecture:\n\
    \    runs-on: ubuntu-latest\n    env:\n      CAS_PROJECT: ${{ vars.CAS_PROJECT\
    \ || github.event.repository.name }}\n      KNOWLEDGE_REPO_NAME: ${{ vars.KNOWLEDGE_REPO_NAME\
    \ || 'cas-brain/knowledge' }}\n      CAS_DEFAULT_PROVIDER: ${{ vars.CAS_DEFAULT_PROVIDER\
    \ || 'openai' }}\n      CAS_DEFAULT_MODEL: ${{ vars.CAS_DEFAULT_MODEL || 'gpt-6.1-sol'\
    \ }}"
  confidence: high
