global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Multiple implemented clients (LiteLLMClient, MockLLMClient) across
    cas_runner, used by runners, mergers, and CI workflows. Consistent interface with
    deterministic mock fallback.
  rationale: Decouples agent logic from any specific LLM provider, enabling portability,
    offline testing, and multi-vendor switching. General architectural mechanism applicable
    to any system using LLM.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine enforce valid governance
    state changes in multiple modules, with typed action models and exceptions. Used
    for lifecycle transitions.
  rationale: Prevents unauthorized or invalid state transitions in autonomous governance
    systems. Generalizable to any artifact lifecycle management requiring auditable,
    rule-based transitions.
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: ComplianceEngine evaluates architectural deltas against codified
    rules, producing typed findings and metrics. Integrated in CI workflows and governance
    validation.
  rationale: Provides deterministic, schema-enforced compliance checking critical
    for automated governance. Reusable across any system needing rule-based evaluation
    of changes.
  promotion_readiness: high
- id: git-delta-prompt-fact-projection
  scope: global
  classification: core
  evidence_summary: Steering models (RawGitDelta, PromptFact, ArchitecturalDelta)
    transform raw git changes into structured, prompt-ready facts. Used in CI-driven
    steering projections.
  rationale: Grounds LLM reasoning in verified repository evidence, reducing hallucination
    and context bloat. General pattern for any agent system requiring factual context
    from version control.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: Version-controlled filesystem (cas-knowledge) stores global rules,
    patterns, decisions, and runtime state. Bootstrap and KnowledgeProvider manage
    the layout.
  rationale: Provides transparent, auditable, and human-reviewable persistent memory
    for agents, without relying on external databases. Applicable to any multi-agent
    knowledge system.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner orchestrates multi-step agent workflows with shared
    context, deterministic ordering, and early exit on failures. Central to runner
    architecture.
  rationale: Ensures predictable execution of complex autonomous workflows, supporting
    governance and CI/CD requirements. Reusable as a generic orchestration backbone.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic models and JSON Schema enforce strict data contracts
    for governance entities, compliance findings, and steering facts, preventing malformed
    LLM outputs.
  rationale: Essential for reliable integration of AI-generated data into deterministic
    systems. Generalizable to any domain requiring validated, typed data boundaries.
  promotion_readiness: high
- id: agentic-merge-resolution
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger uses LLM to resolve semantic conflicts in governance
    documents and architectural deltas, producing structured ResolutionResult.
  rationale: Addresses merge failures beyond git text diffing, applicable to any system
    needing intelligent reconciliation of structured artifacts.
  promotion_readiness: medium
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry integration and TraceableMetric models provide traceability
    of agent steps, runtime metrics, and decision provenance.
  rationale: Enables auditability and performance monitoring for autonomous systems,
    a cross-cutting concern for production AI governance.
  promotion_readiness: medium
- id: health-model-observability-guardrail
  scope: global
  classification: supporting
  evidence_summary: Pure functions calculate health status and reasons from governance
    metrics (health_model.py), used in dashboards and workflows.
  rationale: Provides deterministic, explainable health scoring for complex systems,
    reusable for any monitoring or observability framework.
  promotion_readiness: medium
- id: workspace-governance-injection-bootstrap
  scope: global
  classification: supporting
  evidence_summary: Bootstrap routines initialize workspaces and merge governance
    blocks into agent-facing files (AGENTS.md, CLAUDE.md, etc.) to enforce steering.
  rationale: Standardizes adoption of governance across projects with minimal manual
    setup, applicable to any multi-agent repository onboarding.
  promotion_readiness: medium
- id: template-driven-artifact-evolution
  scope: global
  classification: supporting
  evidence_summary: Markdown templates (pattern, rule, ADR, heuristic-to-pattern)
    enforce consistent knowledge artifact structure and lifecycle promotion.
  rationale: Ensures machine-readable and human-reviewable knowledge artifacts across
    distributed contributors, applicable to any knowledge management process.
  promotion_readiness: medium
- id: capability-lineage-anchoring
  scope: global
  classification: supporting
  evidence_summary: Capability records maintain lineage tracks, linking architectural
    changes to provenance and enabling impact analysis.
  rationale: Critical for tracking evolution of capabilities in long-lived systems,
    reusable for any architecture that needs traceable change history.
  promotion_readiness: medium
- id: service-layer-facade
  scope: global
  classification: supporting
  evidence_summary: GovernanceActionService and similar facades encapsulate multi-engine
    orchestration behind simplified application interfaces.
  rationale: Reduces coupling between CLI/automation and domain engines, a general
    architectural pattern for any complex subsystem.
  promotion_readiness: medium
- id: structural-cicd-policy-validation
  scope: global
  classification: supporting
  evidence_summary: Validation script enforces CI workflow structural rules (YAML
    syntax, no hardcoding, pinned installers, composite actions) as executable quality
    gates.
  rationale: Ensures maintainability and security of CI/CD pipelines across repositories,
    generalizable to any organization standardizing GitHub Actions.
  promotion_readiness: medium
- id: pattern-proposal-only-steering-projection
  scope: global
  classification: supporting
  evidence_summary: Steering projection emits proposal artifacts without directly
    mutating target files, preserving human approval gates.
  rationale: Provides a safe, reviewable mechanism for automated architectural updates,
    applicable to any system requiring non-destructive automated changes.
  promotion_readiness: medium
