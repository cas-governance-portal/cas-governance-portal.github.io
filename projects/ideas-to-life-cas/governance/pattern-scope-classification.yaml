global_pattern_candidates:
- id: provider-agnostic-llm-gateway
  scope: global
  classification: core
  evidence_summary: Evidence centers on LiteLLMClient production invocation and MockLLMClient
    deterministic testing across runner, governance, and merger components.
  rationale: 'This is a reusable abstraction for LLM-dependent agentic systems: it
    decouples orchestration from provider-specific APIs and enables deterministic
    offline execution. Keep this as the canonical provider-abstraction pattern instead
    of the numerous equivalent client/adapter variants.'
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner and CLI entry points demonstrate ordered multi-stage
    execution with shared context propagation across discovery, steering, governance,
    and reporting steps.
  rationale: A deterministic sequential pipeline is a foundational execution mechanism
    for agentic architecture workflows. It provides predictable ordering, context
    handoff, failure short-circuiting, and CI-friendly behavior that is reusable beyond
    this project.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry, GovernanceActionEngine, GovernanceAction,
    and GovernanceException evidence show explicit lifecycle validation before governance
    state mutation.
  rationale: A registry-guarded state machine is a core governance guardrail for autonomous
    agents. It prevents arbitrary lifecycle transitions, supports auditability, and
    generalizes to any governed artifact lifecycle.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic and JSON-schema-style models across governance, steering,
    compliance, and capability catalogs show typed contracts for agent outputs and
    persisted domain data.
  rationale: Strict domain contracts are foundational for LLM-driven systems because
    they validate generated data before consumption. The pattern is stable, broadly
    reusable, and distinct from orchestration or provider abstraction.
  promotion_readiness: high
- id: file-backed-knowledge-repository
  scope: global
  classification: core
  evidence_summary: The cas-knowledge directory hierarchy, bootstrap routines, templates,
    runtime artifacts, and portal processors show a version-controlled file-based
    knowledge base.
  rationale: Using Git-versioned files as an auditable agent blackboard is a highly
    reusable architectural pattern for human-reviewable, branchable, persistent architecture
    knowledge without a dedicated database backend.
  promotion_readiness: high
- id: declarative-steering-projection
  scope: global
  classification: supporting
  evidence_summary: Steering models and CI projection workflows show transformation
    of repository deltas and capability records into structured prompt facts for agent
    context.
  rationale: Grounding agent prompts in typed, repository-derived facts is a valuable
    supporting pattern for controlled agentic reasoning. It is reusable but more specialized
    than the core runtime and contracts patterns.
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: supporting
  evidence_summary: ComplianceEngine, findings models, metrics models, and CI validation
    flows indicate deterministic rule evaluation producing structured compliance outputs.
  rationale: Rule-grounded compliance evaluation is a reusable governance capability,
    but cross-project evidence is still limited and the current proposals overlap
    heavily with health scoring and schema contracts.
  promotion_readiness: medium
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry dependencies, TraceableMetric models, and runtime
    trace directories indicate step-level observability for latency, cost, and agent
    decision tracing.
  rationale: Observability is broadly reusable and likely to become important for
    agentic governance, but the current evidence is partly dependency-driven and the
    pattern has not yet stabilized in enough independent systems.
  promotion_readiness: medium
project_pattern_candidates:
- id: deterministic-mock-evaluation-harness
  scope: project
  rationale: Valuable CI/testing harness within this project, but it largely overlaps
    the canonical LLM gateway pattern and does not yet stand as an independent reusable
    global pattern.
  future_promotion_potential: medium
- id: declarative-agent-command-registry
  scope: project
  rationale: Useful declarative command configuration, but tied to this project's
    agent command layout and tooling rather than a broadly stable architectural mechanism.
  future_promotion_potential: medium
- id: capability-lineage-anchoring
  scope: project
  rationale: Helpful for tracking capability evolution, but currently appears as a
    project-local refinement of steering and delta models rather than a reusable standalone
    pattern.
  future_promotion_potential: medium
- id: ci-driven-steering-projection
  scope: project
  rationale: Important CI orchestration for this system, but the reusable concept
    is better captured by steering projection; the CI workflow itself remains project-specific.
  future_promotion_potential: high
- id: heuristic-to-pattern-promotion-lifecycle
  scope: project
  rationale: Strong governance idea for maturing agent-learned heuristics, but it
    is still a project-local lifecycle and needs cross-project validation before global
    promotion.
  future_promotion_potential: high
- id: pattern-proposal-only-steering-projection
  scope: project
  rationale: A useful safety mode that separates proposal generation from mutation,
    but it is a project-level workflow control rather than a globally foundational
    architectural pattern.
  future_promotion_potential: high
- id: pattern-continuous-governance-loop
  scope: project
  rationale: Valuable closed-loop governance workflow, but the current evidence is
    strongly coupled to this project's CI topology and domain artifacts.
  future_promotion_potential: high
- id: template-driven-artifact-evolution
  scope: project
  rationale: Templates are central to this knowledge repository, but the pattern mainly
    describes authoring conventions rather than a broadly reusable architectural mechanism.
  future_promotion_potential: medium
- id: docs-as-code-portal-projection
  scope: project
  rationale: The MkDocs portal is a useful projection of governance state, but it
    is a presentation and publishing concern that has not demonstrated cross-project
    reusability.
  future_promotion_potential: medium
- id: cli-to-runner-orchestration-boundary
  scope: project
  rationale: A sound application boundary between CLI parsing and pipeline execution,
    but it is more of a project architecture convention than a distinct global pattern.
  future_promotion_potential: medium
- id: service-facade-orchestration
  scope: project
  rationale: Valuable layered boundary, but the current proposals duplicate generic
    service/facade concepts and should remain project-scoped until a canonical form
    is validated.
  future_promotion_potential: medium
- id: layered-governance-service-facade
  scope: project
  rationale: Reflects the same layered boundary as other service facade proposals
    and should be consolidated before any global consideration.
  future_promotion_potential: medium
- id: pydantic-domain-entity-modeling
  scope: project
  rationale: Important implementation-level modeling practice, but it is better treated
    as a supporting detail of the schema-enforced contracts pattern than as a separate
    global pattern.
  future_promotion_potential: medium
- id: pure-functional-health-evaluation
  scope: project
  rationale: A clean deterministic evaluation pattern, but it currently overlaps compliance
    scoring and health model patterns and needs consolidation before broader promotion.
  future_promotion_potential: high
- id: swappable-client-adapter
  scope: project
  rationale: Duplicate wording of the provider abstraction pattern; retain only if
    it adds project-specific adapter guidance beyond the canonical LLM gateway.
  future_promotion_potential: low
- id: client-adapter-test-double
  scope: project
  rationale: Valuable testing practice, but subsumed by the provider-agnostic LLM
    gateway pattern and should remain project-scoped unless a distinct generic test-double
    pattern is needed.
  future_promotion_potential: low
- id: file-system-knowledge-repository
  scope: project
  rationale: Useful but largely duplicative of the file-backed knowledge repository
    pattern; keep project-scoped pending consolidation.
  future_promotion_potential: medium
- id: declarative-health-scoring-pipeline
  scope: project
  rationale: A reasonable project-level health evaluation approach, but it overlaps
    several scoring and observability proposals and is not yet a stable reusable pattern.
  future_promotion_potential: medium
- id: declarative-transition-registry
  scope: project
  rationale: Duplicate framing of the finite-state governance engine; retain only
    as supporting project documentation unless the registry itself becomes a reusable
    configuration artifact.
  future_promotion_potential: medium
- id: pluggable-adapter-client
  scope: project
  rationale: Conceptually identical to the provider-agnostic LLM gateway group and
    should be consolidated rather than treated as a separate reusable pattern.
  future_promotion_potential: low
- id: idempotent-workspace-bootstrap-merger
  scope: project
  rationale: Important onboarding behavior, but tied to this project's workspace bootstrap
    mechanics and not yet evidenced as a reusable global capability.
  future_promotion_potential: medium
- id: workspace-bootstrapping-scaffolding
  scope: project
  rationale: Useful repository initialization behavior, but it overlaps the broader
    bootstrap governance injection concept and remains project-scoped.
  future_promotion_potential: medium
- id: rule-driven-health-evaluation-model
  scope: project
  rationale: A project-local health model interpretation that should be consolidated
    with the other health and compliance scoring candidates.
  future_promotion_potential: medium
- id: hierarchical-filesystem-knowledge-repository
  scope: project
  rationale: Reinforces the file-backed knowledge repository concept, but the specific
    hierarchy is still project-local until cross-system reuse is shown.
  future_promotion_potential: medium
- id: application-service-facade
  scope: project
  rationale: A valid layered architecture convention, but multiple near-identical
    proposals exist and it has not yet reached canonical, globally reusable form.
  future_promotion_potential: medium
- id: service-engine-separation
  scope: project
  rationale: Supports clean dependency layering, but it overlaps service facade and
    pipeline orchestration patterns and should remain project-scoped pending consolidation.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: reconciliation-agentic-merger
  rationale: Several proposals describe LLM-assisted semantic reconciliation of governance
    or architectural documents, but the cluster is large, partly strategic, and still
    project-bound.
  evidence_gaps: No cross-project validation, limited evidence that the merge logic
    is deterministic enough for global reuse, and unclear separation from bootstrap
    merge behavior.
  recommended_next_step: Consolidate the agentic merger cluster into one representative
    proposal and validate it against at least one non-CAS reconciliation scenario.
- id: telemetry-grounded-runtime-tracing
  rationale: Telemetry proposals are broadly useful but overlap heavily and currently
    rely on dependency and model evidence rather than fully demonstrated operational
    tracing.
  evidence_gaps: Lack of visible span emission, trace correlation examples, and cross-run
    diagnostic usage beyond model definitions and dependency declarations.
  recommended_next_step: Merge overlapping telemetry candidates and require evidence
    of real trace output consumed by dashboards or CI diagnostics.
- id: knowledge-repository-abstraction
  rationale: The provider/protocol abstraction is architecturally sound, but it overlaps
    the file-backed knowledge repository pattern and may be a sub-concept rather than
    a separate pattern.
  evidence_gaps: Unclear whether the abstraction is independently reusable across
    persistence mechanisms or merely an internal interface for the file-based repository.
  recommended_next_step: Determine whether this should be a supporting sub-pattern
    of file-backed knowledge repository or promoted as an independent repository abstraction
    pattern.
- id: schema-guided-reasoning
  rationale: This proposal is conceptually close to schema-enforced domain contracts,
    with the added implication that schemas shape LLM reasoning rather than only validating
    outputs.
  evidence_gaps: No clear evidence that schema-guided prompting is materially different
    from output validation plus structured contracts in this codebase.
  recommended_next_step: Review whether this should be merged into schema-enforced
    domain contracts or kept as a separate prompt-engineering pattern with distinct
    evidence.
- id: service-facade-application-boundary
  rationale: A reasonable boundary pattern, but it duplicates other service facade
    and layered orchestration proposals without a clear independent canonical form.
  evidence_gaps: No sufficiently distinct evidence showing this boundary is reusable
    beyond the current project's CLI/service/engine split.
  recommended_next_step: Consolidate all service/facade-related candidates into one
    project-scoped pattern or mark them as review-only until a canonical boundary
    is selected.
- id: pure-functional-metric-evaluation
  rationale: Potentially valuable as a deterministic evaluation style, but it overlaps
    health scoring, compliance scoring, and telemetry metric patterns.
  evidence_gaps: Unclear whether the pure-functional evaluation style is a stable
    standalone pattern or merely an implementation property of the dashboard health
    model.
  recommended_next_step: Merge into the canonical health or compliance scoring pattern
    unless additional evidence shows the evaluation style is independently reusable.
- id: pattern-scope-classification-framework
  rationale: Meta-governance pattern with high strategic value, but evidence is mostly
    internal to this project's governance workflow.
  evidence_gaps: Need evidence that the classification framework is applied consistently
    across multiple projects or pattern governance domains.
  recommended_next_step: Keep under review and validate against at least two independent
    pattern governance processes before considering global promotion.
- id: pattern-cas-decoupled-execution-model
  rationale: Describes a decoupling of orchestration, reasoning, and persistence,
    which is important but overlaps the sequential pipeline and service boundary patterns.
  evidence_gaps: Unclear whether this is an independent architectural pattern or a
    restatement of the existing pipeline, contracts, and layering patterns.
  recommended_next_step: Determine whether the decoupled execution model should be
    documented as a project principle, a supporting note under pipeline orchestration,
    or a separate global supporting pattern.
