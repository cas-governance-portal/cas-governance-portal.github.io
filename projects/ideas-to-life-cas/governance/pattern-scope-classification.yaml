global_pattern_candidates:
- id: provider-agnostic-llm-abstraction
  scope: global
  classification: core
  evidence_summary: Multiple proposals reference LiteLLMClient and MockLLMClient as
    interchangeable adapters, demonstrating consistent production and mock implementations
    across the runner, governance, and steering components.
  rationale: Decoupling LLM provider specifics is foundational for any LLM-enabled
    system, enabling deterministic testing, provider portability, and cost control.
    The pattern is repeatedly evidenced across the codebase and is independent of
    project-specific logic.
  promotion_readiness: high
- id: sequential-pipeline-orchestration
  scope: global
  classification: core
  evidence_summary: FlowRunner is consistently described as a central, deterministic
    pipeline orchestrator coordinating multi-step agentic flows and shared context
    propagation.
  rationale: Predictable step ordering and context handoff are essential for any autonomous
    workflow engine. This pattern is broadly reusable and stable across many implementations.
  promotion_readiness: high
- id: governance-transition-registry
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine appear in numerous
    governance proposals, enforcing allowed state transitions and preventing arbitrary
    agent actions.
  rationale: Governance safety in autonomous systems requires explicit, auditable
    transition rules. This is a general mechanism applicable to any stateful governance
    domain.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic and JSON Schema models are used for governance entities,
    steering facts, compliance findings, and metrics across multiple modules.
  rationale: Strongly typed contracts are essential to prevent malformed data from
    LLM outputs and to ensure validation, serialization, and reliable communication
    between components. This is a foundational architectural practice.
  promotion_readiness: high
- id: file-backed-knowledge-repository
  scope: global
  classification: supporting
  evidence_summary: The cas-knowledge directory hierarchy is extensively used as a
    version-controlled, human-readable knowledge blackboard across global, project,
    runtime, and template scopes.
  rationale: Persisting architecture knowledge and governance state as files in Git
    is a broadly applicable pattern for auditability, PR-based review, and cross-run
    continuity without database infrastructure.
  promotion_readiness: high
- id: compliance-evaluation-engine
  scope: global
  classification: supporting
  evidence_summary: ComplianceEngine consistently evaluates rules against artifacts
    and produces typed findings and metrics, often used as a guardrail before governance
    actions.
  rationale: Rule-based compliance checking is a general mechanism for enforcing policies
    on agent outputs and architectural changes. It is reusable across governance domains
    and CI/CD integrations.
  promotion_readiness: medium
- id: agentic-semantic-merge-reconciliation
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger is repeatedly referenced as an LLM-assisted component
    for reconciling divergent governance documents, architectural deltas, and multi-source
    edits.
  rationale: Semantic merge resolution is a reusable pattern for any system needing
    to integrate AI-generated or concurrent changes beyond textual 3-way merge capabilities.
    The strategic direction is consistent and evidence-backed, though implementation
    maturity varies.
  promotion_readiness: medium
- id: prompt-fact-grounding
  scope: global
  classification: supporting
  evidence_summary: Multiple steering models and workflows transform raw git deltas
    and capability records into structured PromptFacts to ground LLM prompts.
  rationale: Reducing hallucination and context bloat by providing verified, typed
    facts to LLMs is a general intelligence pattern applicable to any agentic system.
  promotion_readiness: high
