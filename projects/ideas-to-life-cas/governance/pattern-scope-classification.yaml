governance_risks:
- risk: Premature promotion of agentic merge patterns
  impact: Many merge proposals are still marked strategic_direction; promoting them
    too early could force a pattern that is not yet stable across implementations.
  mitigation: Keep merge patterns as global supporting only after consolidating duplicate
    implementations and validating across at least two independent projects.
- risk: Duplicate promotion
  impact: Multiple LLM provider abstraction proposals have nearly identical content;
    promoting more than one would fragment governance and confuse adopters.
  mitigation: Promote only the canonical provider-agnostic-llm-facade and mark all
    duplicates as deprecated variants in the pattern catalogue.
- risk: Insufficient evidence for health and telemetry patterns
  impact: Many telemetry and health proposals only show models or dependencies, not
    operational trace data or dashboards.
  mitigation: Require trace artifacts and dashboard outputs as evidence before promoting
    telemetry/health patterns beyond project scope.
- risk: Scope ambiguity between global and project for CI patterns
  impact: CI-related patterns could be viewed as global governance patterns but their
    current implementation is tightly coupled to this repository's GitHub workflows.
  mitigation: Classify CI patterns as project until they are extracted into portable,
    reusable components with configuration beyond repo-specific triggers.
- risk: Pattern proliferation without consolidation
  impact: Over 200 proposals contain many duplicate clusters; promoting without grouping
    would create a bloated pattern catalogue.
  mitigation: Use the duplicate groupings in this output as the basis for consolidation
    before any promotion decision.
