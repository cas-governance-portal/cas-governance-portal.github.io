global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Recurs across many signals via LiteLLMClient and MockLLMClient,
    enabling provider portability and deterministic offline execution. Strong implementation
    evidence in src/cas_runner/llm/.
  rationale: Foundational architectural mechanism for decoupling agent logic from
    model providers, reusable across any LLM-driven system.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine are consistently
    used to constrain autonomous actions across multiple governance flows. High evidence
    strength.
  rationale: Core governance guardrail ensuring only valid state transitions occur,
    applicable to any autonomous agent system requiring auditability and control.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic and JSON schema models are used across governance, steering,
    and skills to validate agent-produced data. High evidence strength.
  rationale: Typed contracts are foundational for safe agent integration, preventing
    malformed or hallucinated outputs from propagating. Reusable across all agent
    pipelines.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner is the central orchestration component enabling deterministic
    step sequencing and shared context propagation. High evidence strength.
  rationale: Predictable sequential execution is a universal requirement for agentic
    workflows, providing auditability and reproducibility.
  promotion_readiness: high
- id: git-delta-prompt-fact-projection
  scope: global
  classification: supporting
  evidence_summary: Steering models define RawGitDelta, PromptFact, ArchitecturalDelta
    and are used in CI workflows to ground agent context. High evidence strength.
  rationale: Turning raw git changes into typed prompt facts is a reusable mechanism
    for reducing hallucinations and context bloat in any code-aware agent system.
  promotion_readiness: high
- id: knowledge-as-code-blackboard
  scope: global
  classification: supporting
  evidence_summary: The cas-knowledge file hierarchy is used as a persistent, Git-backed
    shared memory across many runs and projects. High evidence strength.
  rationale: File-backed blackboards with version control and human review are a generic
    pattern for durable agent memory.
  promotion_readiness: medium
- id: heuristic-to-pattern-promotion-lifecycle
  scope: global
  classification: supporting
  evidence_summary: Templates and architecture docs describe an explicit heuristic-to-pattern
    promotion path with decision records. Medium-high evidence strength.
  rationale: A governed learning loop from heuristics to validated patterns is broadly
    applicable in agent-based knowledge systems.
  promotion_readiness: medium
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry dependencies and TraceableMetric models provide
    runtime observability across governance and steering steps. High evidence strength.
  rationale: Traceability and performance monitoring are essential for any autonomous
    agent platform, making this a reusable supporting pattern.
  promotion_readiness: medium
project_pattern_candidates:
- id: declarative-agent-command-registry
  scope: project
  rationale: TOML command manifests are useful but currently tied to the project's
    agent skill conventions; not yet proven as a general pattern.
  future_promotion_potential: medium
- id: ci-driven-steering-projection
  scope: project
  rationale: GitHub Actions workflows for steering projection are specific to this
    repo's CI/CD setup; could become reusable with abstraction.
  future_promotion_potential: medium
- id: agentic-reconciliation-merger
  scope: project
  rationale: LLM-assisted merging is emerging but still project-specific in its current
    implementation and evidence base.
  future_promotion_potential: high
- id: capability-lineage-anchoring
  scope: project
  rationale: Capability lineage is meaningful here but needs more cross-project validation
    before becoming global.
  future_promotion_potential: medium
- id: template-driven-knowledge-capture
  scope: project
  rationale: Markdown templates are useful but tightly coupled to this repository's
    knowledge taxonomy; not yet generic.
  future_promotion_potential: medium
- id: skill-packaged-agent-procedures
  scope: project
  rationale: Skills are a project-level packaging choice; could be generalized but
    current evidence is single-project.
  future_promotion_potential: high
- id: workspace-bootstrap-injection
  scope: project
  rationale: Bootstrap logic is effective but tied to this project's workspace layout
    and agent config expectations.
  future_promotion_potential: medium
- id: declarative-steering-projection
  scope: project
  rationale: Steering projection is a useful pattern but still appears as a project-specific
    implementation detail.
  future_promotion_potential: medium
- id: rule-grounded-compliance-evaluation
  scope: project
  rationale: Compliance evaluation is emerging but currently grounded in this repository's
    rule-context and governance structures.
  future_promotion_potential: high
- id: agentic-merge-resolution
  scope: project
  rationale: Agentic merge resolution is compelling but its evidence is limited to
    this project's document conflict types.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: git-delta-prompt-facts
  rationale: Low evidence strength, only one model location; scope unclear without
    recurrence.
  evidence_gaps: Only a single model module reference; no observed multiple systems
    or repeated signals.
  recommended_next_step: Collect further evidence from other projects or signals before
    deciding scope.
- id: capability-record-lineage
  rationale: Medium evidence, but only model definitions; no clear governance usage.
  evidence_gaps: Lacks concrete operational evidence and cross-project validation.
  recommended_next_step: Analyze capability lineage usage in more than one project.
- id: runtime-rule-context
  rationale: Low evidence; runtime files are present but consumption is not fully
    evidenced.
  evidence_gaps: No clear indication of how rule-context.json is read and used consistently.
  recommended_next_step: Verify runtime context is actually used by governance components.
- id: externalized-runtime-context
  rationale: Medium evidence; execution-profile and rule-context exist, but pattern
    is not proven.
  evidence_gaps: No strong signal of repeatable benefit across projects.
  recommended_next_step: Assess whether externalized runtime state improves governance
    reproducibility.
- id: health-monitor-derived
  rationale: Medium evidence; health model exists but derived health is not yet a
    stable cross-project pattern.
  evidence_gaps: Only one implementation; no evidence of reuse.
  recommended_next_step: Apply health scoring in a second project or domain to confirm
    generality.
- id: prompt-fact-contract
  rationale: Medium evidence; typed prompts are useful but not yet demonstrated as
    a separate reusable pattern beyond steering projection.
  evidence_gaps: Limited evidence outside the originating project; overlap with git-delta-prompt-fact-projection.
  recommended_next_step: Determine whether this is a distinct pattern or a duplicate
    of git-delta-prompt-fact-projection.
- id: traceable-metric-telemetry-envelope
  rationale: Medium evidence; traceable metrics are modeled but not universally consumed.
  evidence_gaps: Few concrete uses beyond health score; needs more evidence of general
    applicability.
  recommended_next_step: Gather evidence from execution logs and dashboards to support
    promotion.
- id: distributed-tracing-observability
  rationale: Medium evidence; OpenTelemetry is present but usage patterns are not
    well-defined.
  evidence_gaps: No clear example of distributed tracing being used to debug complex
    agent flows.
  recommended_next_step: Document specific tracing use cases and outcomes.
- id: health-evaluation-metric
  rationale: Medium evidence; health model is implemented but not yet reused across
    projects.
  evidence_gaps: Single-project evidence; no cross-project validation.
  recommended_next_step: Monitor reuse and consider promoting to global after another
    implementation.
- id: ci-embedded-orchestration
  rationale: Medium evidence; GitHub Actions workflows are used, but CI-embedding
    is common and not distinctive enough.
  evidence_gaps: Lacks evidence of a generalizable CI orchestration pattern beyond
    repository structure.
  recommended_next_step: Evaluate if the CI workflow design adds governance value
    beyond standard automation.
