candidate_patterns_requiring_review:
- id: git-delta-prompt-facts
  rationale: Evidence is limited to model names in steering/models.py; no implementation
    or recurrence is shown.
  evidence_gaps: No code execution evidence, no cross-project validation, no clear
    output from the fact projection.
  recommended_next_step: Gather evidence from running steering projection and validate
    prompt fact quality across at least two projects.
- id: capability-record-lineage
  rationale: Only model symbols indicate capability lineage; no operational evidence
    of lineage tracking.
  evidence_gaps: No persistence or usage examples, no evidence of lineage accuracy
    or performance.
  recommended_next_step: Instrument a pilot demonstrating lineage updates and verify
    provenance retrieval across multiple runs.
- id: runtime-execution-context-store
  rationale: Runtime directory exists but no code path confirms it is actively used
    for context store operations.
  evidence_gaps: No API, no write/read implementation, no evidence of how runtime
    state is loaded or persisted.
  recommended_next_step: Map the runtime directory usage in runner and determine whether
    it is a real pattern or a byproduct.
- id: agentic-merger-artifact-reconciliation
  rationale: AgenticMerger class exists, but no details on reconciliation logic or
    evidence of successful merges.
  evidence_gaps: No test coverage, no examples of semantic merge outcomes, no metrics
    for conflict resolution.
  recommended_next_step: Create a test suite with conflicting governance artifacts
    and document resolution results.
- id: flow-runner-application-orchestration
  rationale: FlowRunner exists, but evidence is mostly inferred from class names and
    docs, not from explicit run traces.
  evidence_gaps: No execution log or sequence diagram showing step-by-step shared
    context flow.
  recommended_next_step: Publish a concrete execution trace from a real CAS run and
    identify state propagation issues.
- id: prompt-fact-extraction
  rationale: PromptFact is defined, but no extraction logic or prompt flow is evidenced.
  evidence_gaps: No examples of fact extraction from prompts, no schema validation
    outcomes.
  recommended_next_step: Implement and test a prompt-to-fact extraction module with
    structured output validation.
- id: pattern-evolution-promotion
  rationale: Only references to docs and templates; no actual promotion event is recorded.
  evidence_gaps: No promotion decision records, no signal-to-pattern conversion examples.
  recommended_next_step: Capture a real promotion decision from the CAS pattern lifecycle
    and use it as evidence.
- id: architectural-intent-tracking
  rationale: Steering models exist, but no evidence of measuring architectural intent
    against implementation.
  evidence_gaps: No delta analysis over time, no evaluation of intent drift.
  recommended_next_step: Generate an architectural intent report from a known code
    change and compare expected vs actual capabilities.
- id: distributed-tracing-observability
  rationale: OpenTelemetry dependencies exist, but no evidence of actual spans being
    recorded or consumed.
  evidence_gaps: No trace files, no span examples, no dashboard integration proof.
  recommended_next_step: Instrument a flow and export traces to confirm span creation
    and correlation with health metrics.
