global_pattern_candidates:
- id: provider-agnostic-llm-gateway
  scope: global
  classification: core
  evidence_summary: Implemented across LiteLLMClient and MockLLMClient abstractions
    in src/cas_runner/llm/ with high test coverage and verified production usage.
  rationale: Foundational architectural facade decoupling generative agent logic from
    specific upstream model vendor APIs and enabling deterministic test doubles.
  promotion_readiness: high
- id: registry-guarded-governance-state-machine
  scope: global
  classification: core
  evidence_summary: Fully verified in src/cas_runner/governance/governance_action_engine.py
    and governance_action_service.py with strict TransitionRegistry lifecycle checks.
  rationale: Essential governance mechanism ensuring autonomous reasoning agents cannot
    transition architecture or knowledge entities through unauthorized lifecycle paths.
  promotion_readiness: high
- id: sequential-pipeline-orchestration
  scope: global
  classification: core
  evidence_summary: Implemented in FlowRunner (src/cas_runner/runner.py) and CLI,
    providing deterministic sequential stage execution and shared context propagation.
  rationale: Provides a predictable, testable orchestration spine that terminates
    immediately on governance violations and prevents runaway agent execution loops.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Extensively declared in src/cas_runner/governance/models.py using
    Pydantic contracts across findings, metrics, and state artifacts.
  rationale: Mandatory boundary protection ensuring LLM outputs conform to typed contracts
    before altering repository state or informing decisions.
  promotion_readiness: high
- id: file-system-knowledge-repository
  scope: global
  classification: core
  evidence_summary: Structured directory conventions under cas-knowledge/ and LocalKnowledgeProvider
    implementations in src/cas_runner/io.py.
  rationale: Git-native architectural persistence pattern enabling reviewability,
    pull-request governance, and auditable history without external database dependencies.
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: Validated in src/cas_runner/governance/compliance_engine.py generating
    deterministic audit findings and quantitative compliance metrics.
  rationale: Prevents reliance on subjective LLM evaluations by evaluating concrete
    architectural deltas against explicit, deterministic rule sets.
  promotion_readiness: high
- id: declarative-agent-command-registry
  scope: global
  classification: supporting
  evidence_summary: Used in .agents/commands/ TOML declarations to externalize agent
    tool capabilities.
  rationale: Decouples agent operational task declarations from procedural code, standardizing
    prompt schemas and runtime execution hooks.
  promotion_readiness: high
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry dependencies in pyproject.toml and TraceableMetric
    schemas in src/cas_runner/governance/models.py.
  rationale: Standardizes step-level tracing and token telemetry across heterogeneous
    agentic operations for cost and latency observability.
  promotion_readiness: medium
- id: pure-functional-health-evaluation
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/dashboard/health_model.py as side-effect-free
    calculation functions mapping metrics to health enums.
  rationale: Enables reproducible, unit-testable health scoring and diagnostic reason
    generation decoupled from filesystem or network I/O.
  promotion_readiness: high
- id: heuristic-to-pattern-promotion-lifecycle
  scope: global
  classification: supporting
  evidence_summary: Documented governance flows in docs/architecture/cas-pattern-evolution-flow.md
    and cas-knowledge/templates/.
  rationale: Evidence-backed framework ensuring empirical architectural knowledge
    matures from raw signals into formal patterns with explicit gating.
  promotion_readiness: high
- id: docs-as-code-portal-projection
  scope: global
  classification: supporting
  evidence_summary: MkDocs automation workflows (.github/workflows/cas-portal-publish.yml)
    and preprocessing scripts in src/cas_runner/portal_preprocessor.py.
  rationale: Generalizable technique for projecting machine-readable architecture
    states and human documentation into static, browsable portals.
  promotion_readiness: high
