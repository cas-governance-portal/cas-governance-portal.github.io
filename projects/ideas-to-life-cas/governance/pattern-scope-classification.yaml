global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Multiple implementations (LiteLLMClient, MockLLMClient) and consistent
    use across runner, governance, and steering components demonstrate a stable, widely
    applicable abstraction for LLM invocation.
  rationale: Provider-agnostic LLM client is a fundamental mechanism for any agentic
    system that uses LLMs, enabling portability, testability, and cost control. It
    is reusable across domains and projects.
  promotion_readiness: high
  promotion_rationale: High evidence strength, high maturity, and explicit dual-client
    pattern indicate strong governance readiness.
- id: state-machine-governance-guardrail
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine are implemented
    and used to enforce legal state transitions across governance artifacts, with
    explicit evidence of high confidence.
  rationale: Finite-state governance is a core pattern for any system that requires
    auditable, controlled lifecycle changes. It is independent of project specifics
    and essential for safe automation.
  promotion_readiness: high
  promotion_rationale: Clearly defined, implemented, and applied across governance
    actions; high stability and reuse potential.
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: ComplianceEngine evaluates architectural deltas against rules
    and produces structured findings and metrics; used in CI workflows and governance
    actions.
  rationale: A rule-based compliance evaluation pattern is applicable to any organization
    that needs automated enforcement of architectural standards, independent of project
    specifics.
  promotion_readiness: high
  promotion_rationale: High evidence, clear separation of concerns, and strong potential
    for cross-project reuse.
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner orchestrates multi-step workflows with shared context,
    used in CI/CD and CLI across many flows.
  rationale: A deterministic, sequential pipeline runner is a common architectural
    pattern for any agentic or batch processing system, providing predictability and
    observability.
  promotion_readiness: high
  promotion_rationale: Implemented and exercised extensively; high stability and applicability
    across many use cases.
- id: declarative-steering-projection
  scope: global
  classification: core
  evidence_summary: Steering models transform raw git deltas into typed prompt facts
    and runtime indices, used in CI and agent workflows.
  rationale: Grounding LLM prompts with structured, evidence-backed facts is a pattern
    that reduces hallucination and token costs, broadly applicable to AI-driven systems.
  promotion_readiness: high
  promotion_rationale: High evidence, strong abstraction level, and clear cross-domain
    applicability.
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: The cas-knowledge directory hierarchy stores global, project,
    runtime, and template artifacts, acting as a Git-versioned blackboard for agents
    and humans.
  rationale: A file-backed knowledge repository is a simple, auditable, and versionable
    way to share governance, patterns, and runtime state. It is reusable across any
    project needing persistent agent memory.
  promotion_readiness: high
  promotion_rationale: High evidence, high maturity, and directly supports governance
    and agent collaboration.
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic models and JsonSchema validation are used for governance,
    steering, and compliance data, ensuring type safety and preventing malformed LLM
    outputs.
  rationale: Enforcing schemas on agent I/O is a fundamental practice for reliable
    AI integration, applicable to any system that consumes unstructured LLM outputs.
  promotion_readiness: high
  promotion_rationale: High evidence, clear abstraction, and widespread use in this
    and similar systems.
- id: reconciliation-agentic-merger
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger uses LLM reasoning to resolve semantic conflicts
    in governance documents, demonstrated in multiple scenarios.
  rationale: Agentic merge resolution is a powerful but more specialised pattern for
    handling semantic conflicts that Git cannot resolve. It has cross-project utility
    for collaborative document governance.
  promotion_readiness: medium
  promotion_rationale: High evidence but lower maturity (emerging). Requires careful
    oversight but has clear reuse potential.
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry dependencies and traceable metrics are integrated
    across the runner, providing distributed tracing and performance visibility.
  rationale: Observability is a cross-cutting concern for any multi-step agentic system,
    enabling debugging, cost analysis, and health assessment.
  promotion_readiness: medium
  promotion_rationale: Implemented with high evidence, but still evolving; reusable
    pattern with clear benefits.
- id: capability-lineage-anchoring
  scope: global
  classification: supporting
  evidence_summary: CapabilityRecord, CapabilitySet, and CapabilityLineage models
    track provenance and evolution of architectural capabilities.
  rationale: Tracking capability lineage is useful for understanding system evolution,
    impact analysis, and governance of architectural knowledge.
  promotion_readiness: medium
  promotion_rationale: Medium evidence, but the pattern is domain-agnostic and supports
    long-term architectural reasoning.
- id: heuristic-to-pattern-promotion-lifecycle
  scope: global
  classification: supporting
  evidence_summary: Templates and workflows define a controlled path from observed
    heuristics to validated patterns, including promotion decisions.
  rationale: A formalised pattern lifecycle is essential for any knowledge-driven
    organisation to prevent premature standardisation and encourage evidence-based
    evolution.
  promotion_readiness: medium
  promotion_rationale: High strategic value, but implementation is still emerging;
    needs more evidence across projects.
- id: bootstrap-governance-block-injection
  scope: global
  classification: supporting
  evidence_summary: Bootstrap routines merge governance blocks and configuration into
    target workspaces, ensuring consistent agent context.
  rationale: Reproducible workspace setup is a pattern for onboarding projects to
    agentic governance, applicable across many repositories.
  promotion_readiness: medium
  promotion_rationale: Implemented, but project-specific in some respects; potential
    for reuse in standardised onboarding.
- id: health-model-observability-guardrail
  scope: global
  classification: supporting
  evidence_summary: HealthModel aggregates compliance and traceability metrics into
    a health status with actionable reasons.
  rationale: A deterministic health model is a valuable pattern for any automated
    system that needs to signal operational status and explain issues.
  promotion_readiness: medium
  promotion_rationale: Implemented with high evidence; reusable across monitoring
    and governance dashboards.
