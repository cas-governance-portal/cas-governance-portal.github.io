global_pattern_candidates:
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/models.py across multiple
    typed models with high evidence strength.
  rationale: Contract validation is foundational for ensuring deterministic agent
    outputs and zero-tolerance runtime corruption across any autonomous agent architecture.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/governance_action_engine.py
    and models.py with explicit state transition gating.
  rationale: Essential mechanism for enforcing invariant preconditions before allowing
    automated systems or agents to alter architectural state.
  promotion_readiness: high
- id: pattern-closed-loop-governance
  scope: global
  classification: core
  evidence_summary: Derived from continuous architecture loop workflows, multiple
    architecture work signals, and alignment reports.
  rationale: Foundational architectural pattern linking automated drift detection
    directly to impact evaluation and remediation workflows across systems.
  promotion_readiness: medium
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/runner.py via FlowRunner coordinating
    registered flow steps deterministically.
  rationale: Core execution primitive establishing deterministic, sequential stage
    transitions and context accumulation across agent pipelines.
  promotion_readiness: high
- id: provider-agnostic-llm-facade
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/llm/litellm_client.py providing
    a standardized invocation layer.
  rationale: High reusability across any system needing LLM decoupling from vendor-specific
    schemas and error payloads.
  promotion_readiness: high
- id: deterministic-mock-evaluation-harness
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/llm/mock_client.py to support offline
    testing of runner workflows.
  rationale: Highly reusable test-double architecture preventing flake, network costs,
    and nondeterminism in CI/CD pipelines.
  promotion_readiness: high
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: Configured via OpenTelemetry dependencies in pyproject.toml and
    TraceableMetric domain models.
  rationale: Standardized distributed tracing and metrics emission critical for multi-step
    agent observability.
  promotion_readiness: medium
- id: declarative-agent-command-registry
  scope: global
  classification: supporting
  evidence_summary: Defined via TOML manifests under .agents/commands/ for planning
    and analysis workflows.
  rationale: Externalizing agent capabilities into declarative manifests provides
    strong abstraction for agentic repos.
  promotion_readiness: medium
- id: docs-as-code-portal-projection
  scope: global
  classification: supporting
  evidence_summary: Implemented via MkDocs configuration in pyproject.toml, portal
    scripts, and GitHub Pages publish workflows.
  rationale: Reusable pattern for transforming architectural findings and machine
    models into browsable static documentation.
  promotion_readiness: medium
- id: pattern-scope-classification-framework
  scope: global
  classification: supporting
  evidence_summary: Supported by multiple architecture work records (aw-ideas-to-life-cas-20260614-1)
    and architectural state reports.
  rationale: Defines an objective governance lifecycle to prevent global pattern rule
    bloat and premature promotion.
  promotion_readiness: medium
project_pattern_candidates:
- id: ci-driven-steering-projection
  scope: project
  rationale: Current implementation is coupled to specific GitHub Actions workflows
    and local repo steering document conventions.
  future_promotion_potential: high
- id: pure-functional-health-evaluation
  scope: project
  rationale: Assessment logic is currently tuned specifically to CAS dashboard health
    status calculation and metric entities.
  future_promotion_potential: medium
- id: layered-governance-service-facade
  scope: project
  rationale: Orchestrates project-specific domain engines (compliance engine, governance
    action service) tailored to ideas-to-life-cas.
  future_promotion_potential: medium
- id: reconciliation-agentic-merger
  scope: project
  rationale: Emerging experimental capability addressing divergence between human
    and agent models within current project ASTs.
  future_promotion_potential: high
candidate_patterns_requiring_review:
- id: pydantic-domain-entity-modeling
  rationale: Duplicates the abstraction of schema-enforced-domain-contracts while
    being tied to a specific third-party library implementation.
  evidence_gaps: Lacks vendor-neutral architectural framing; overlaps directly with
    schema-enforced-domain-contracts.
  recommended_next_step: Merge domain concepts into schema-enforced-domain-contracts
    and retire this duplicate proposal.
- id: transition-registry-state-machine
  rationale: Subsumed by finite-state-governance-engine, which covers the transition
    registry alongside engine execution rules.
  evidence_gaps: Distinct value proposition separate from finite-state-governance-engine
    is not demonstrated.
  recommended_next_step: Consolidate into finite-state-governance-engine as an implementation
    detail.
- id: swappable-client-adapter
  rationale: General Gang-of-Four adapter pattern that overlaps heavily with provider-agnostic-llm-facade
    and deterministic-mock-evaluation-harness.
  evidence_gaps: Distinction between generic software design pattern and CAS-specific
    intelligence pattern is ambiguous.
  recommended_next_step: Review whether a broad architectural adapter pattern is needed
    or if specific intelligence facades suffice.
- id: pattern-architecture-knowledge-graph
  rationale: Strategic direction pattern with significant potential, but lacks verified
    runtime code implementation in current state.
  evidence_gaps: No active container, component, or AST symbol implementation evidence
    in repository state.
  recommended_next_step: Retain in candidate status until graph storage and lineage
    traversal components are implemented.
- id: pattern-business-intent-traceability
  rationale: Strategic vision pattern with medium confidence and no direct AST or
    code evidence in current architecture state.
  evidence_gaps: Absence of schema or engine code demonstrating bidirectional mapping
    from intent to ADR/code.
  recommended_next_step: Defer promotion review until ingestion contracts and intent
    models are formally authored.
duplicate_overlapping_patterns:
- patterns:
  - schema-enforced-domain-contracts
  - pydantic-domain-entity-modeling
  recommended_action: Consolidate into schema-enforced-domain-contracts
  rationale: Both describe domain object validation; schema-enforced-domain-contracts
    captures the architectural intent without library-specific coupling.
- patterns:
  - finite-state-governance-engine
  - transition-registry-state-machine
  recommended_action: Consolidate into finite-state-governance-engine
  rationale: TransitionRegistry is an integral component of the finite-state governance
    engine rather than a distinct architectural pattern.
- patterns:
  - provider-agnostic-llm-facade
  - swappable-client-adapter
  - deterministic-mock-evaluation-harness
  recommended_action: Maintain specialized intelligence facade and harness, deprecate
    generic swappable-client-adapter
  rationale: The intelligence-specific facade and mock harness capture domain nuances
    of LLM invocation better than an overly generic adapter pattern.
promotion_recommendations:
  immediate_candidates:
  - schema-enforced-domain-contracts
  - finite-state-governance-engine
  - provider-agnostic-llm-facade
  - deterministic-mock-evaluation-harness
  deferred_candidates:
  - pattern-closed-loop-governance
  - sequential-pipeline-flow-runner
  - declarative-agent-command-registry
  - telemetry-observable-agent-steps
  - docs-as-code-portal-projection
  - pattern-scope-classification-framework
  - ci-driven-steering-projection
  additional_evidence_required:
  - pattern-architecture-knowledge-graph
  - pattern-business-intent-traceability
  - reconciliation-agentic-merger
  - swappable-client-adapter
  - pydantic-domain-entity-modeling
  - transition-registry-state-machine
