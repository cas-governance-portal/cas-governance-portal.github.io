  - typed-governance-data-contracts
  - dual-client-llm-provider-abstraction
  - pattern-automated-detect-analyse-execute-loop
  additional_evidence_required:
  - pattern-architecture-knowledge-graph
  - pattern-business-intent-traceability
  - dummy_string
