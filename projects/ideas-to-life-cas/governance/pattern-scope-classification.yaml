global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Implemented across src/cas_runner/llm/litellm_client.py and mock_client.py
    with unified invocation semantics and deterministic CI mocking.
  rationale: Decoupling orchestration and reasoning logic from specific model providers
    via an adapter and symmetric mock client is universally applicable to any agentic
    system.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Extensively verified in src/cas_runner/governance/governance_action_engine.py
    and models.py through formal transition registries.
  rationale: Constraining autonomous agent decisions and lifecycle promotions through
    deterministic state machine registries prevents state corruption across any governed
    platform.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Validated across models.py, io.py, and reasoning engine using
    Pydantic and JSON Schema to gate LLM outputs.
  rationale: Mandatory schema validation of non-deterministic LLM outputs prior to
    state persistence is a foundational reliability pattern for production AI pipelines.
  promotion_readiness: high
- id: pattern-continuous-governance-loop
  scope: global
  classification: core
  evidence_summary: Demonstrated across .github/workflows/cas-continuous-architecture.yml
    and governance validation steps executing detect-analyse-remediate loops.
  rationale: Automated closed-loop continuous governance triggered in CI/CD delivery
    pipelines is essential to prevent architectural drift across multi-repo ecosystems.
  promotion_readiness: high
- id: pattern-architecture-work-registry
  scope: global
  classification: core
  evidence_summary: Documented in architectural state and aw-* work records separating
    persistent change intent from ephemeral projected dashboards.
  rationale: Treating architecture work items as authoritative planning records and
    downstream visualisations as derived views resolves state overwrite hazards universally.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: Realized via cas-knowledge filesystem hierarchies, template suites,
    and local knowledge provider protocols.
  rationale: Employing version-controlled filesystem structures as transparent, pull-request-governed
    blackboards eliminates complex external state infrastructure for autonomous runners.
  promotion_readiness: high
- id: ci-driven-steering-projection
  scope: global
  classification: supporting
  evidence_summary: Implemented in .github/workflows/cas-build-steering-projection.yml
    generating read-only steering summaries on build events.
  rationale: Compiling verified architectural facts into prompt steering context during
    CI runs provides safe, proposal-only synchronization for developer agents.
  promotion_readiness: high
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: Supported by OpenTelemetry SDK dependencies in pyproject.toml
    and TraceableMetric data envelopes in models.py.
  rationale: Attaching distributed trace IDs, token usage, and latency metadata to
    agent reasoning steps provides requisite observability across distributed systems.
  promotion_readiness: medium
- id: pattern-scope-classification-framework
  scope: global
  classification: supporting
  evidence_summary: Detailed in reference-architecture-pattern-scope-classification-framework.md
    and implemented in classification pipeline flows.
  rationale: Formal taxonomies assigning emerging architectural knowledge to explicit
    governance tiers (global, domain, project) are reusable across enterprise platforms.
  promotion_readiness: high
- id: heuristic-to-pattern-promotion-lifecycle
  scope: global
  classification: supporting
  evidence_summary: Standardized templates in cas-knowledge/templates/heuristic-to-pattern_template.md
    and cas-pattern-evolution-flow.md.
  rationale: Graduating architectural insights from informal heuristics to validated
    patterns based on multi-project recurrence prevents premature policy codification.
  promotion_readiness: medium
project_pattern_candidates:
- id: declarative-agent-command-registry
  scope: project
  rationale: Specific to speckit TOML command manifests (.agents/commands/) in this
    repository rather than a generalized cross-platform specification format.
  future_promotion_potential: medium
- id: reconciliation-agentic-merger
  scope: project
  rationale: Heuristic and LLM-assisted merge logic tightly bound to specific markdown
    frontmatter and CAS governance block layouts in bootstrap.py and agentic_merger.py.
  future_promotion_potential: high
- id: deterministic-governance-injection-bootstrap
  scope: project
  rationale: Implements repository onboarding by injecting concrete markdown blocks
    (CLAUDE.md, AGENTS.md, GEMINI.md) tailored to CAS project conventions.
  future_promotion_potential: medium
- id: docs-as-code-portal-projection
  scope: project
  rationale: Coupled to the specific MkDocs Material and DrawIO build setup configured
    in pyproject.toml and portal/ directory.
  future_promotion_potential: low
- id: pattern-cas-decoupled-execution-model
  scope: project
  rationale: Describes the internal procedural separation between FlowRunner, Step
    registry, and IO abstraction within the cas_runner codebase.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: pattern-business-intent-traceability
  rationale: Strategically critical vision for linking business drivers to AST-extracted
    code reality, but concrete ingestion contracts and automated drift calculators
    remain emerging.
  evidence_gaps: Lacks multi-project verification and empirical demonstration of automated
    strategic drift detection in runtime pipelines.
  recommended_next_step: Implement prototype business intent schema ingestion in cas_runner
    and evaluate across two distinct projects.
- id: pattern-architecture-knowledge-graph
  rationale: Offers high potential for cross-project dependency traversal and multi-hop
    lineage reasoning over isolated markdown files.
  evidence_gaps: Currently documented as an aspirational architectural direction without
    a production graph storage engine or query interface implementation.
  recommended_next_step: Construct an in-memory graph projection prototype using networkx
    or RDF within the forensic extractor step.
- id: pattern-lifecycle-promotion-gate
  rationale: Enforces mandatory ADR ratification before advancing work items from
    PROPOSED to ACTIVE.
  evidence_gaps: Overlap with finite-state-governance-engine; requires evaluation
    whether this is an independent pattern or a rule rule-context configuration.
  recommended_next_step: Review against TransitionRegistry implementation to decide
    whether to formalize as a discrete pattern or registry transition rule.
