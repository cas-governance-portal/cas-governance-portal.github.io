global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Multiple proposals across the codebase implement a provider-agnostic
    LLM client abstraction (LiteLLMClient and MockLLMClient) with consistent interfaces,
    used in all agentic flows including runners and mergers. Evidence strength high
    with high confidence.
  rationale: This pattern decouples agent logic from specific LLM vendors, enables
    deterministic testing via mock fallbacks, and is universally applicable across
    any autonomous system that invokes LLMs. It appears in many forms across the repository,
    indicating stable, recurrent usage.
  promotion_readiness: high
  promotion_rationale: Established, implemented in multiple components, and clearly
    foundational for any LLM-based agentic architecture. Cross-project applicability
    is immediate and no further evidence is needed.
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner pattern appears across multiple proposals (sequential-pipeline-flow-runner,
    centralized-flow-runner-orchestration, sequential-pipeline-orchestration, etc.)
    with consistent shared-context execution and deterministic step ordering. Evidence
    strength high.
  rationale: A central sequential pipeline orchestrator with a mutable shared context
    is a general architectural mechanism for multi-step agent workflows. It is reusable
    across projects requiring deterministic execution, error gating, and context propagation.
    No project-specific coupling exists.
  promotion_readiness: high
  promotion_rationale: Well-implemented, used as the primary execution engine, and
    conceptually stable. It is a core architectural backbone for any multi-step automation
    system.
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Governance state machine with explicit transition registry is
    present in many proposals (finite-state-governance-engine, state-machine-governance-guardrail,
    transition-registry-governance-actions, etc.), enforcing valid state changes and
    auditability. Evidence strength high.
  rationale: Preventing invalid state transitions via an explicit registry is a foundational
    governance mechanism applicable to any system where artifacts (decisions, rules,
    patterns) have lifecycle states. It is not project-specific and provides a reusable,
    auditable control layer.
  promotion_readiness: high
  promotion_rationale: Established, central to governance, and clearly broadly applicable.
    The registry-based design is generic and can be adapted to multiple domains.
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic models and JSON schema validation are used pervasively
    across governance models, steering models, and skills models. Multiple proposals
    (schema-enforced-domain-contracts, typed-contracts-for-agent-context, schema-contract-enforcement)
    highlight this as a core pattern. Evidence strength high.
  rationale: Enforcing strongly typed contracts for agent inputs, outputs, and internal
    state is a universal requirement to prevent hallucinated or malformed data from
    propagating. This pattern is foundational for trustworthy agentic systems and
    is provider-agnostic.
  promotion_readiness: high
  promotion_rationale: Widely implemented and indispensable for data integrity. Applies
    to any project using LLM-driven data processing.
- id: compliance-engine-guardrail
  scope: global
  classification: supporting
  evidence_summary: Compliance engine pattern appears in multiple proposals (rule-grounded-compliance-evaluation,
    declarative-compliance-findings-aggregation, evidence-grounded-compliance-scoring,
    etc.) with structured findings, metrics, and pre-commit gating. Evidence strength
    high.
  rationale: A rule-based compliance engine that validates agent outputs and architectural
    deltas is a reusable governance mechanism, especially for organizations managing
    architectural drift and automated reviews. It is not project-specific and can
    be applied to any system requiring rule enforcement on generated artifacts.
  promotion_readiness: medium
  promotion_rationale: Well-evidenced but governance rules are often domain-specific;
    however, the engine pattern itself is reusable. Requires adaptation of rules but
    the mechanism is global.
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry integration and traceable metrics appear in many
    proposals (telemetry-observable-agent-steps, traceable-metric-telemetry-envelope,
    open-telemetry-trace-pipeline, etc.) with dependencies and persistent traces.
    Evidence strength high.
  rationale: Observability is a cross-cutting concern for any distributed or agentic
    system. Instrumenting execution with OpenTelemetry spans and storing trace metadata
    is a generic pattern applicable across projects.
  promotion_readiness: medium
  promotion_rationale: Implementation is widespread but the exact telemetry schemas
    and storage may vary. The pattern concept is global.
- id: file-backed-knowledge-blackboard
  scope: global
  classification: supporting
  evidence_summary: Multiple proposals (file-backed-blackboard-workspace, git-backed-knowledge-blackboard,
    persistent-knowledge-store, evidence-driven-knowledge-blackboard) describe using
    a versioned, file-based blackboard for shared agent memory. Evidence strength
    high.
  rationale: Using a filesystem structure to persist architectural knowledge, decisions,
    and runtime state is a portable, auditable, and reviewable approach. It is broadly
    applicable, especially in CI/CD-driven agent systems.
  promotion_readiness: medium
  promotion_rationale: The pattern is implementable in any repository and provides
    clear benefits; however, it may be organization-specific in terms of directory
    conventions. Still, the core concept of file-backed shared memory is global.
- id: agentic-merger
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger appears across many proposals (reconciliation-agentic-merger,
    agentic-state-reconciliation-merger, agentic-merge-resolution, etc.) for semantic
    reconciliation of conflicting governance and architecture artifacts. Evidence
    strength high.
  rationale: Using an LLM-driven merger to resolve semantic conflicts in structured
    documents is a general pattern for environments with parallel edits on markdown/YAML
    files. It is applicable beyond this project to any system needing automated conflict
    resolution in knowledge artifacts.
  promotion_readiness: medium
  promotion_rationale: Widely evidenced and conceptually reusable, but depends on
    LLM capabilities and may require adaptation to different document schemas.
project_pattern_candidates:
- id: declarative-agent-command-registry
  scope: project
  rationale: This pattern externalizes agent commands into TOML manifests specific
    to the CAS workflow (speckit plan/analyze). It is useful for this project's agent
    skill management but may not generalize across projects without major adaptation.
  future_promotion_potential: medium
  governance_observation: The pattern is well-implemented but tied to the project's
    specific command set and naming conventions. Future promotion could occur if similar
    command registries appear in other projects.
- id: ci-driven-steering-projection
  scope: project
  rationale: CI workflows to generate steering projections are highly integrated with
    GitHub Actions and the CAS-specific flow definitions. The concept is valuable
    but the implementation is project-specific.
  future_promotion_potential: low
  governance_observation: The pattern may become more generic if extracted as a reusable
    CI action, but currently it is tightly coupled to this repository's workflow structure.
- id: heuristic-to-pattern-promotion-lifecycle
  scope: project
  rationale: The heuristic-to-pattern promotion lifecycle, including templates and
    decision records, is designed for this project's knowledge management workflow.
    It may be adaptable but is currently shaped by the project's governance conventions.
  future_promotion_potential: high
  governance_observation: High potential as a generic pattern for knowledge maturation,
    but requires more evidence from other projects before promotion.
- id: declarative-steering-projection
  scope: project
  rationale: Declarative steering projection models (PromptFact, SteeringRuntimeIndex)
    are tailored to the CAS architecture steering use case and rely on specific schemas
    for git deltas and capability lineage.
  future_promotion_potential: medium
  governance_observation: The core idea of grounding prompts in structured facts is
    general, but the current models are project-coupled.
- id: capability-lineage-anchoring
  scope: project
  rationale: Capability lineage tracking is used to manage evolving capability definitions
    in the CAS knowledge base. It is specific to this project's capability catalog
    and steering model.
  future_promotion_potential: medium
  governance_observation: Could become a generic pattern for tracking provenance in
    any knowledge base, but needs broader implementation.
- id: telemetry-grounded-health-scoring
  scope: project
  rationale: Health scoring models (HealthStatus, calculate_health) are designed for
    the CAS governance dashboard and use project-specific metrics (compliance findings,
    governance risks).
  future_promotion_potential: medium
  governance_observation: The algorithmic approach is general, but the metric definitions
    and thresholds are project-specific.
- id: bootstrap-governance-block-injection
  scope: project
  rationale: Bootstrap functions merge governance blocks into AGENTS.md, CLAUDE.md,
    etc., which is specific to the CAS agent configuration structure and the set of
    supported agent tools.
  future_promotion_potential: low
  governance_observation: May be generalized to a pattern for injecting governance
    into any agent config, but currently tied to this project's file set.
- id: skill-packaged-agent-procedures
  scope: project
  rationale: Skills like cas-add-or-modify-feature, cas-drawio-generator are specific
    to this project's domain and tooling (Claude Code). The packaging concept is generic
    but the content is not.
  future_promotion_potential: medium
  governance_observation: The idea of packaging agent capabilities as reusable skill
    directories could be a global pattern if extracted as a framework-agnostic mechanism.
- id: rule-context-snapshot
  scope: project
  rationale: Persisting rule-context.json for runtime governance is tied to the CAS
    knowledge repository layout and compliance engine expectations.
  future_promotion_potential: low
  governance_observation: Very project-specific.
- id: pattern-cas-continuous-governance-loop
  scope: project
  rationale: The continuous governance loop (Detect-Analyse-Plan-Execute-Publish-Observe)
    is a strategic vision for this project, currently implemented partly in CI workflows.
    It is not yet mature enough for cross-project reuse.
  future_promotion_potential: high
  governance_observation: Architecturally significant but requires more evidence and
    a more generic implementation.
candidate_patterns_requiring_review:
- id: git-delta-prompt-fact-projection
  rationale: The transformation of git deltas into PromptFacts is a promising concept
    but the evidence is emerging and there are many overlapping proposals (git-delta-prompt-facts,
    delta-driven-prompt-fact-projection, grounded-prompt-fact-projection). Need to
    clarify unified model.
  evidence_gaps: Only one primary implementation; abstraction level may be too closely
    tied to the CAS steering models.
  recommended_next_step: Consolidate overlapping proposals into a single pattern and
    gather evidence from additional projects or use cases.
- id: deterministic-mock-evaluation-harness
  rationale: The mock LLM client is a well-evidenced pattern, but it is often part
    of the provider-agnostic LLM abstraction. Standalone classification may not be
    necessary.
  evidence_gaps: It is always used alongside the real client; duplication with provider
    abstraction.
  recommended_next_step: Decide whether to keep as a separate pattern or subsume under
    the provider-agnostic LLM client pattern.
- id: health-dashboard-projection
  rationale: Health scoring models are emerging and appear in multiple forms (telemetry-grounded-health-scoring,
    compliance-driven-health-scoring). There is overlap and unclear canonical representation.
  evidence_gaps: Inconsistent naming and scope; may be project-specific.
  recommended_next_step: Merge health-related proposals and evaluate if the health
    calculation logic is domain-agnostic.
- id: pattern-cas-architecture-knowledge-graph
  rationale: The architecture knowledge graph is a strategic direction but only expressed
    in future direction proposals, with no implementation yet.
  evidence_gaps: No concrete implementation or evidence of cross-project benefits.
  recommended_next_step: Gather more evidence from architecture work or pilot projects.
- id: pattern-cas-business-intent-integration
  rationale: Business intent integration is a future vision with no implemented components.
  evidence_gaps: No codebase evidence; only architectural signals.
  recommended_next_step: Review architecture work to determine feasibility and define
    concrete evidence requirements.
