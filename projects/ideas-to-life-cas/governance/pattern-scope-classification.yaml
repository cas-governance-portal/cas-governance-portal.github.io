global_pattern_candidates:
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner and equivalent central orchestrators appear in dozens
    of proposals across execution, governance, and steering. The pattern is implemented
    in src/cas_runner/runner.py with high evidence strength and stable description.
  rationale: Sequential pipeline execution with shared mutable context is a fundamental
    architectural mechanism for deterministic multi-step agent workflows. It is reusable
    across any automated governance, analysis, or generation pipeline.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic/JSON Schema typed models are used for governance, steering,
    compliance, and agent I/O across many proposals. Evidence spans multiple modules
    and is consistently high.
  rationale: Typed, validated contracts are foundational for agentic systems where
    LLM outputs must be bounded and inspectable. This pattern applies across domains
    and provides the backbone for trust and integration.
  promotion_readiness: high
- id: finite-state-governance-action-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine appear in many proposals,
    all enforcing legal state transitions for autonomous actions. Multiple implementations
    and references support the same concept.
  rationale: Explicit state machine governance is a core control mechanism for agent
    autonomy. It prevents invalid lifecycle transitions and is applicable to architectural
    artifacts, rules, patterns, and any governed entity.
  promotion_readiness: high
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: LiteLLMClient and MockLLMClient are referenced across the codebase
    and in dozens of proposals as a unified client with deterministic mock fallback.
    Evidence strength is high.
  rationale: Decoupling agent logic from LLM providers is a foundational requirement
    for any AI-driven platform. The dual production/mock client pattern ensures testability,
    cost control, and provider portability.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: cas-knowledge as a version-controlled knowledge blackboard is
    described in numerous proposals. It supports global/project/runtime separation,
    templates, and asynchronous agent collaboration.
  rationale: A persistent, auditable, human-readable knowledge store is foundational
    for multi-agent governance. Git-backed file structure is reusable across projects
    and provides traceability and reviewability.
  promotion_readiness: high
- id: steering-fact-projection
  scope: global
  classification: supporting
  evidence_summary: PromptFact, SteeringRuntimeIndex, and git-delta-derived facts
    appear in many proposals. The pattern is implemented in steering models and workflows
    with high evidence.
  rationale: Converting raw git deltas and repository state into structured, bounded
    prompt facts is a reusable mechanism for grounding LLM reasoning and reducing
    context noise.
  promotion_readiness: high
- id: reconciliation-agentic-merger
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger and related reconciliation logic are described in
    multiple proposals and implemented in governance/agentic_merger.py. Evidence strength
    is high.
  rationale: Semantic merge resolution through an LLM-driven component is a reusable
    pattern for reconciling structured documents and governance artifacts beyond ordinary
    git merge.
  promotion_readiness: high
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry dependencies and TraceableMetric models appear across
    proposals, with runtime trace directories and health dashboards. Evidence strength
    is high.
  rationale: Instrumenting agent steps with distributed tracing and traceable metrics
    is broadly applicable to any intelligent automation platform that requires operational
    visibility and audit.
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: supporting
  evidence_summary: ComplianceEngine and structured ComplianceFinding/ComplianceMetrics
    appear in many proposals and workflows. The pattern is implemented and used in
    CI validation.
  rationale: Rule-based compliance evaluation with typed findings is a reusable governance
    gate for agent outputs and architectural changes across organizations.
  promotion_readiness: high
- id: capability-lineage-anchoring
  scope: global
  classification: supporting
  evidence_summary: CapabilityRecord, CapabilitySet, and CapabilityLineage models
    are referenced in multiple proposals. Evidence strength is high.
  rationale: Tracking capability provenance and evolution is a general architectural
    intelligence pattern, useful for any system that manages evolving capabilities
    and impact analysis.
  promotion_readiness: high
project_pattern_candidates:
- id: declarative-agent-command-registry
  scope: project
  rationale: TOML-based agent command manifests are useful but currently evidenced
    only in .agents/commands for speckit workflows. The abstraction level is not yet
    proven across diverse projects.
  future_promotion_potential: medium
- id: ci-driven-steering-projection
  scope: project
  rationale: CI-triggered steering projection is tightly coupled to this repository's
    GitHub Actions and knowledge layout. It could become a pattern but needs cross-project
    evidence.
  future_promotion_potential: medium
- id: heuristic-to-pattern-promotion-lifecycle
  scope: project
  rationale: The heuristic-to-pattern process is defined in templates and docs, but
    its implementation and success are only observable within this project. Promotion
    criteria need broader validation.
  future_promotion_potential: high
- id: workspace-bootstrap-governance-injection
  scope: project
  rationale: Bootstrap routines that inject governance blocks into AGENTS.md/CLAUDE.md/GEMINI.md
    are useful, but they are tied to this project's tooling and workspace conventions.
  future_promotion_potential: medium
- id: template-driven-artifact-evolution
  scope: project
  rationale: Markdown templates for ADRs, patterns, rules, and heuristics enforce
    consistency within cas-knowledge but are not yet proven as a portable pattern
    outside this repository.
  future_promotion_potential: medium
- id: skill-packaged-agent-procedures
  scope: project
  rationale: Packaging agent skills in directories like .agents/skills and .claude/skills
    is a project-specific organizational approach. Cross-tool skill sharing may be
    useful but needs more evidence.
  future_promotion_potential: medium
- id: dedicated-verifier-subagent
  scope: project
  rationale: A separate verifier subagent is defined for this repo's agent workflows.
    While promising, it is not yet observed in multiple independent systems.
  future_promotion_potential: medium
- id: ci-workflow-validation
  scope: project
  rationale: Custom workflow validation scripts (validate_workflows.py) enforce repo-specific
    CI policies. The checks are tied to this repository's CI conventions.
  future_promotion_potential: low
- id: continuous-architecture-governance-loop
  scope: project
  rationale: The continuous architecture loop as a CI workflow is specific to this
    project's GitHub integration and knowledge layer. It may become a pattern but
    requires broader adoption evidence.
  future_promotion_potential: high
- id: multi-agent-instruction-manifests
