global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Multiple proposals converge on a common pattern of encapsulating
    LLM interactions behind a unified client interface with a deterministic mock fallback
    for testing and CI. Evidence spans production code (liteLLMClient), mock_client,
    and numerous pattern proposals referencing the same architectural intent.
  rationale: This pattern is a foundational integration boundary for any agentic system,
    decoupling domain logic from model provider SDKs and enabling deterministic offline
    testing. It is broadly reusable across projects, as it is not specific to any
    one domain.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Many proposals describe a transition registry/state machine to
    constrain governance actions and lifecycle transitions. Evidence includes GovernanceActionEngine,
    TransitionRegistry, and supporting models with high confidence and consistent
    usage across the CAS runner.
  rationale: Governance and lifecycle management require explicit, auditable state
    transitions. This pattern is generally applicable to any system with governed
    state transitions, making it a core architectural pattern.
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: ComplianceEngine and associated findings/metrics are used across
    governance workflows. Multiple pattern proposals highlight the need to evaluate
    changes against codified rules and produce structured findings, indicating high
    evidence and recurrence.
  rationale: Automated compliance evaluation is a universal need for governance systems.
    The pattern of rule-based evaluation with structured outputs is cross-cutting
    and reusable in any regulatory or policy-driven project.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: Proposals consistently reference a version-controlled file system
    as a shared knowledge/state repository. Evidence includes bootstrap routines,
    cas-knowledge structure, and persistent storage patterns.
  rationale: Using a git-backed file system for shared knowledge and agent memory
    is a simple, auditable, and portable pattern applicable to many multi-agent or
    governance systems. It is a foundational architectural decision for persistence.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: Many proposals describe a central FlowRunner that executes a deterministic
    sequence of steps with shared context. Evidence from runner.py and FlowRunner
    confirms a stable implementation.
  rationale: A deterministic sequential pipeline is a core orchestration pattern for
    multi-step agentic workflows, providing reproducibility and control. It is broadly
    reusable across different domains and systems.
  promotion_readiness: high
- id: declarative-steering-projection
  scope: global
  classification: supporting
  evidence_summary: Proposals outline the transformation of raw git deltas and repository
    metadata into typed prompt facts for agent context. Evidence from steering models
    and CI workflows indicates practical implementation.
  rationale: Grounding agent prompts in structured, verified facts is a complement
    to LLM interaction, improving reliability and reducing hallucination. This pattern
    is reusable for any system that provides context to AI agents.
  promotion_readiness: medium
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: Multiple proposals and code evidence (OpenTelemetry dependencies,
    TraceableMetric model) support instrumenting agent execution with metrics and
    traces.
  rationale: Observability is critical for any autonomous system to diagnose issues,
    monitor performance, and audit behaviour. This pattern is generic and can be adopted
    across many projects.
  promotion_readiness: medium
- id: reconciliation-agentic-merger
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger is implemented and referenced in multiple proposals
    for semantic reconciliation of conflicting governance or architectural artifacts.
  rationale: Automated reconciliation of complex documents/state conflicts is a reusable
    capability, especially in collaborative or multi-agent environments. Though more
    specialized, it supports governance processes broadly.
  promotion_readiness: medium
project_pattern_candidates:
- id: workspace-governance-injection-bootstrap
  scope: project
  rationale: Bootstrap logic that merges governance blocks into workspace files is
    tailored to the specific onboarding and setup of this CAS project. The pattern
    is important but its exact implementation is tied to the project's file structure
    and agent tools.
  future_promotion_potential: medium
- id: ci-workflow-constraint-suite
  scope: project
  rationale: The CI validation scripts (validate_workflows.py) enforce project-specific
    workflow conventions. While some principles could be generalized, the current
    checks are highly specific to this repository's CI/CD setup.
  future_promotion_potential: low
- id: skill-packaged-agent-procedures
  scope: project
  rationale: Skills are packaged agent procedures designed for this specific agent
    ecosystem and its domain (CAS). The pattern of skill packaging could be reusable,
    but the content and discovery mechanism are tightly coupled to the project's environment.
  future_promotion_potential: medium
- id: heuristic-to-pattern-promotion-lifecycle
  scope: project
  rationale: The pattern of promoting heuristics to patterns is still emerging in
    this project, with templates and workflow definitions only being validated here.
    More evidence is needed from other projects before it can be considered global.
  future_promotion_potential: high
- id: layered-governance-service-facade
  scope: project
  rationale: The service facade pattern is used to decouple CLI from governance engines,
    but it is not yet demonstrated as a reusable architectural pattern across multiple
    systems. It is a good practice but may be too generic to warrant promotion without
    broader evidence.
  future_promotion_potential: medium
- id: schema-enforced-domain-contracts
  scope: project
  rationale: Strict Pydantic contracts are used across this project's governance models,
    but the pattern is a common Python practice rather than a unique architecture
    pattern. It is valuable locally but not sufficiently distinctive for global promotion.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: git-delta-prompt-facts
  scope: candidate
  rationale: The transformation of git deltas into prompt facts is a subset of the
    larger steering projection pattern, but current evidence is primarily from model
    definitions with limited implementation details.
  evidence_gaps: Only supporting evidence from steering/models.py; no direct usage
    in runtime flows or multiple projects.
  recommended_next_step: Seek additional evidence from cross-project implementations,
    possibly by documenting a concrete example of prompt fact ingestion in a CI workflow.
- id: pattern-evolution-lifecycle
  scope: candidate
  rationale: The pattern of evolving heuristics to patterns is documented in templates
    and architecture docs but has not been observed in practice beyond this project.
  evidence_gaps: Lack of concrete evidence that the lifecycle has been executed and
    validated; no promotion decisions recorded yet.
  recommended_next_step: Monitor for successful promotions and capture metrics on
    how often the lifecycle is followed.
- id: runtime-execution-context-store
  scope: candidate
  rationale: The idea of storing runtime execution context as YAML/JSON files is mentioned,
    but the pattern is not clearly distinct from the broader file-backed knowledge
    base and lacks sufficient usage evidence.
  evidence_gaps: No code evidence beyond directory structure; unclear if this is a
    general pattern or a project-specific convenience.
  recommended_next_step: Determine if the runtime context store provides unique benefits
    beyond standard configuration files, and whether it is used in multiple components.
