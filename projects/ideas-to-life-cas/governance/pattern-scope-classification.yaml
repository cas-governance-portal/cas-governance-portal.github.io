global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/llm/litellm_client.py (LiteLLMClient)
    and src/cas_runner/llm/mock_client.py (MockLLMClient), backed by pyproject.toml
    litellm dependency.
  rationale: Decouples application orchestration and agent reasoning from proprietary
    LLM vendor APIs while providing an interchangeable mock client for deterministic
    zero-cost testing. Reusable across any agentic architecture system.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/governance_action_engine.py
    (TransitionRegistry, GovernanceActionEngine) and models.py (GovernanceAction,
    GovernanceException).
  rationale: Prevents autonomous agents from executing illegal or arbitrary state
    transitions by gating mutation requests through an explicit transition registry.
    Critical guardrail pattern for enterprise AI governance.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/runner.py (FlowRunner) and src/cas_runner/cli.py
    (main), orchestrated via registry flow declarations.
  rationale: Enforces ordered, step-wise workflow execution with structured context
    propagation, preventing uncontrolled agent looping and supporting deterministic
    CI/CD stage auditing.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/bootstrap.py, src/cas_runner/io.py
    (KnowledgeProvider, LocalKnowledgeProvider), and repository directory conventions.
  rationale: Uses structured, version-controlled filesystem directories as an immutable
    and branchable shared blackboard for agent memory, templates, and execution state
    without database overhead.
  promotion_readiness: high
- id: heuristic-to-pattern-promotion-lifecycle
  scope: global
  classification: core
  evidence_summary: Documented in cas-knowledge/templates/heuristic-to-pattern_template.md,
    promotion_decision.md, and docs/architecture/cas-pattern-evolution-flow.md.
  rationale: Establishes a standardized progression lifecycle from empirical signals
    and heuristics to formal architectural patterns, preventing hallucinated or premature
    standardization across projects.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: supporting
  evidence_summary: Implemented across src/cas_runner/governance/models.py and src/cas_runner/steering/models.py
    using Pydantic contracts.
  rationale: Mandates strict schema boundaries at LLM input and output edges, ensuring
    structured data exchange and eliminating malformed payloads before domain consumption.
  promotion_readiness: high
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: Declared in pyproject.toml (opentelemetry-api, opentelemetry-sdk)
    and src/cas_runner/governance/models.py (TraceableMetric).
  rationale: Instruments agent step execution with distributed trace envelopes and
    metrics to maintain end-to-end auditability and token/latency observability across
    autonomous runs.
  promotion_readiness: medium
- id: pattern-continuous-governance-loop
  scope: global
  classification: supporting
  evidence_summary: Configured in .github/workflows/cas-continuous-architecture.yml
    and src/cas_runner/governance/governance_validator.py.
  rationale: Embeds automated architectural drift detection, compliance validation,
    and proposal synthesis directly into CI/CD pipelines to ensure continuous code-to-architecture
    alignment.
  promotion_readiness: high
- id: pattern-authoritative-architecture-work-registry
  scope: global
  classification: supporting
  evidence_summary: Evidenced by architecture work aw-ideas-to-life-cas-2026-05-31-001
    and cas-arch-state-ideas-to-life-cas-2026-09-28.
  rationale: Maintains persistent planning and decision intent in immutable backlog
    records while treating evolution maps and dashboards as derived, regenerated projections.
  promotion_readiness: medium
project_pattern_candidates:
- id: declarative-agent-command-registry
  scope: project
  rationale: Externalizes CLI commands and speckit specifications via TOML manifests
    specific to the ideas-to-life-cas workflow execution environment.
  future_promotion_potential: medium
- id: reconciliation-agentic-merger
  scope: project
  rationale: Employs LLM reasoning to reconcile conflicting markdown and YAML governance
    blocks during bootstrapping and steering sync. Highly specific to current CAS
    markdown block formatting.
  future_promotion_potential: high
- id: declarative-steering-projection
  scope: project
  rationale: Compiles Git deltas and capability lineage into PromptFact structures
    specifically tuned for the CAS steering projection engine.
  future_promotion_potential: medium
- id: docs-as-code-portal-projection
  scope: project
  rationale: Compiles MkDocs documentation and client-side metric dashboards for the
    Ideas to Life CAS governance portal deployment on GitHub Pages.
  future_promotion_potential: low
- id: pattern-scope-classification-framework
  scope: project
  rationale: Taxonomy and governance classification rules defined in knowledge/projects/ideas-to-life-cas/reference-architectures/
    tailored for project pattern evolution.
  future_promotion_potential: medium
- id: pat-prop-empirical-ast-forensic-extraction
  scope: project
  rationale: Forensic code parser extracting AST structures within isolated project
    container boundaries, currently tightly bound to Python project architectures.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: pattern-business-intent-traceability-contract
  rationale: Strategic proposal linking business objectives to architecture decisions
    and downstream code deltas.
  evidence_gaps: Lacks concrete runtime schema definitions and empirical implementation
    traces in cas_runner beyond alignment finding citations.
  recommended_next_step: Define a concrete Pydantic schema for BusinessIntent in models.py
    and validate end-to-end ingestion in an integration test.
- id: pattern-architecture-knowledge-graph-lineage
  rationale: Cross-project knowledge graph for recursive architectural dependency
    queries and portfolio impact assessment.
  evidence_gaps: Currently modeled as flat files and directory trees; graph database
    or network traversal engine is not yet implemented.
  recommended_next_step: Conduct an architectural spike prototyping graph serialization
    from existing LocalKnowledgeProvider artifacts.
