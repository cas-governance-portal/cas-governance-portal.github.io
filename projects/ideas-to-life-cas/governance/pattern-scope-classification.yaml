  - agentic-state-reconciliation-merger
  - agentic-merge-resolution
  - agentic-knowledge-reconciler
  - agentic-merge-resolution-loop
  recommended_action: 'Consolidate into candidate pattern: reconciliation-agentic-merger'
  rationale: All 5 proposals reference the experimental AgenticMerger in src/cas_runner/governance/agentic_merger.py.
- patterns:
  - ci-driven-steering-projection
  - declarative-steering-projection
  - git-delta-prompt-fact-projection
  - steering-fact-projection
  - lineage-aware-architectural-delta-slicing
  - delta-driven-prompt-fact-projection
  - pattern-proposal-only-steering-projection
  recommended_action: 'Consolidate into project pattern: ci-driven-steering-projection'
  rationale: All proposals describe converting git diffs into prompt facts during
