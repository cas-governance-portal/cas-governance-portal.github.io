governance_risks:
- risk: Premature promotion of overlapping patterns as global
  mitigation: Consolidate duplicates into canonical patterns before promotion. Only
    the consolidated pattern should be evaluated for global scope.
- risk: Promoting project-specific patterns to global without cross-project evidence
  mitigation: Require evidence from at least two independent projects before considering
    promotion. Use candidate classification when evidence is insufficient.
- risk: Scope ambiguity due to duplicate naming
  mitigation: Maintain a registry of canonical pattern IDs and map all proposals to
    it. This avoids multiple global entries for the same concept.
- risk: Insufficient validation of agentic merger and steering projections
  mitigation: Conduct pilot implementations in other projects and measure effectiveness
    before considering global promotion.
