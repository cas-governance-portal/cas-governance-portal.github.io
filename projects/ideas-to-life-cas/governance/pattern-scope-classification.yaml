global_pattern_candidates:
- id: provider-agnostic-llm-client
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/llm/litellm_client.py and src/cas_runner/llm/mock_client.py,
    backed by litellm in pyproject.toml.
  rationale: Foundational architectural requirement across all agentic and continuous
    governance systems to decouple business execution from vendor APIs while supporting
    zero-cost deterministic mock testing.
  promotion_readiness: high
- id: centralized-flow-runner-orchestration
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/runner.py (FlowRunner) and src/cas_runner/cli.py.
  rationale: Essential pipeline backbone providing predictable, ordered execution
    and shared mutable context propagation across multi-step agent and governance
    runs.
  promotion_readiness: high
- id: state-machine-governance-guardrail
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/governance_action_engine.py
    (TransitionRegistry, GovernanceActionEngine) and src/cas_runner/governance/models.py.
  rationale: Foundational guardrail mechanism preventing autonomous agents or generative
    processes from performing illegal state jumps or unvalidated lifecycle mutations.
  promotion_readiness: high
- id: schema-grounded-compliance-engine
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/compliance_engine.py
    and src/cas_runner/governance/models.py (ComplianceFinding, ComplianceMetrics).
  rationale: Core governance component providing deterministic, rule-based auditing
    of agent outputs and code deltas prior to state modification or commit.
  promotion_readiness: high
- id: file-backed-agentic-knowledge-repository
  scope: global
  classification: core
  evidence_summary: Implemented across cas-knowledge/ directory tree, templates/,
    and src/cas_runner/bootstrap.py.
  rationale: Foundational knowledge persistence strategy treating git-versioned file
    trees and standardized markdown templates as human-inspectable shared blackboard
    memory.
  promotion_readiness: high
- id: typed-governance-contracts
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/models.py and src/cas_runner/skills/models.py
    using Pydantic and JSON Schema.
  rationale: Foundational interface strategy enforcing immutable schemas and strict
    typing on all agent outputs, findings, and evaluation metrics.
  promotion_readiness: high
- id: multi-adapter-agent-telemetry
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/dashboard/agent_telemetry.py supporting
    Claude Code, Antigravity, and generic coding agents.
  rationale: Highly reusable supporting pattern that normalizes heterogeneous traces
    and token counts from disparate agent harnesses into a uniform observability model.
  promotion_readiness: high
- id: declarative-agent-skill-directory
  scope: global
  classification: supporting
  evidence_summary: Implemented under .agents/skills/ and .claude/skills/ with supporting
    models in src/cas_runner/skills/models.py.
  rationale: Standardizes the modular packaging of agent capabilities into reusable,
    harness-agnostic directories containing instructions, schemas, and assets.
  promotion_readiness: high
- id: independent-verifier-subagent
  scope: global
  classification: supporting
  evidence_summary: Implemented in .agents/subagents/verifier.md and .claude/agents/verifier.md.
  rationale: Generalizable agentic pattern establishing a separate read-only verifier
    role to counteract primary agent self-confirmation bias.
  promotion_readiness: medium
- id: evidence-derived-health-scoring
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/dashboard/health_model.py (HealthStatus,
    calculate_health, get_health_reasons).
  rationale: Reusable pure functional scoring pipeline converting multi-dimensional
    compliance findings into deterministic health categories and actionable reasons.
  promotion_readiness: high
- id: heuristic-to-pattern-promotion-lifecycle
  scope: global
  classification: supporting
  evidence_summary: Documented in docs/architecture/cas-pattern-evolution-flow.md
    and structured templates in cas-knowledge/templates/.
  rationale: Formalizes the lifecycle path for promoting emergent, low-confidence
    agent heuristics into verified organizational patterns through evidence gates.
  promotion_readiness: medium
- id: workspace-agent-steering-injection
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/bootstrap.py (merge_cas_governance_block,
    merge_claude_settings).
  rationale: Injects governance constraints and steering directives into agent config
    entrypoints (AGENTS.md, CLAUDE.md) during workspace initialization.
  promotion_readiness: high
project_pattern_candidates:
- id: deterministic-workflow-validation
  scope: project
  rationale: Script-based validation rules tailored specifically to the CAS CI/CD
    workflow conventions and path layout in specs/090-simplify-cicd-workflows/validate_workflows.py.
  future_promotion_potential: medium
- id: docs-as-code-portal-projection
  scope: project
  rationale: Tightly coupled to the local MkDocs setup, custom static JS dashboards
    (portal/docs/static/js/dashboard.js), and project publishing workflow.
  future_promotion_potential: low
- id: idempotent-symlink-scaffolding-bootstrap
  scope: project
  rationale: Specific filesystem symlink and copy fallback heuristics implementing
    the dual .agents and .claude folder alignment for the ideas-to-life-cas workspace.
  future_promotion_potential: medium
- id: agentic-state-reconciliation-merger
  scope: project
  rationale: Currently implemented for local governance block and markdown frontmatter
    reconciliation in src/cas_runner/governance/agentic_merger.py, still tied to local
    schema formats.
  future_promotion_potential: high
candidate_patterns_requiring_review:
- id: pattern-business-intent-traceability
  rationale: Strategic direction proposal linking requirements to runtime behavior,
    but lacks concrete runtime execution evidence in current codebase.
  evidence_gaps: Requires implementation proof linking strategic ADRs to live automated
    code verification beyond vision documents.
  recommended_next_step: Defer promotion; validate with multi-project case studies
    demonstrating automated business intent verification.
- id: pattern-architecture-knowledge-graph
  rationale: Proposes a graph database representation of architectural knowledge,
    while current architecture state is entirely file-backed in git.
  evidence_gaps: No graph database dependencies or graph traversal engines exist in
    the current runtime.
  recommended_next_step: Hold in candidate state until concrete graph extraction services
    are implemented and validated.
- id: closed-loop-detect-analyse-execute-governance
  rationale: Represents autonomous remediation of architectural drift without manual
    intervention, which poses governance safety concerns.
  evidence_gaps: Safety constraints and automated rollback mechanics for autonomous
    fixes are not yet proven.
  recommended_next_step: Gather runtime safety metrics from semi-automated proposal-only
    runs before enabling closed-loop execution.
- id: git-delta-prompt-fact-projection
  rationale: Transforms git deltas into PromptFact records, but currently overlaps
    with structured steering context and lacks evaluation on large diffs.
  evidence_gaps: Need benchmarks demonstrating token efficiency and hallucination
    reduction compared to conventional diff ingestion.
  recommended_next_step: Evaluate in CI pipelines against large feature pull requests
    to measure impact on agent precision.
