global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Implemented in LiteLLMClient (src/cas_runner/llm/litellm_client.py)
    with standardized multi-provider dispatch and interface decoupling across flows.
  rationale: Foundational architectural pattern decoupling autonomous orchestration
    workflows from vendor-specific model APIs, essential across any multi-agent or
    LLM-integrated system.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Implemented in TransitionRegistry and GovernanceActionEngine (src/cas_runner/governance/governance_action_engine.py)
    to guard state transitions.
  rationale: Core governance requirement preventing autonomous agents from fabricating
    invalid states or bypassing prerequisite conditions during architecture lifecycle
    mutations.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Extensively formalized across src/cas_runner/governance/models.py
    and src/cas_runner/steering/models.py using Pydantic models.
  rationale: Eliminates hallucinated, malformed, or incomplete structured outputs
    produced by non-deterministic agent steps prior to state ingestion.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: Implemented via FlowRunner in src/cas_runner/runner.py and registered
    execution flows in src/cas_runner/steps/registry.py.
  rationale: Coordinates multi-phase verification and steering pipelines with strict
    linear ordering and context accumulation, preventing uncontrolled agent loops.
  promotion_readiness: high
- id: heuristic-to-pattern-promotion-lifecycle
  scope: global
  classification: core
  evidence_summary: Defined via cas-knowledge/templates/heuristic-to-pattern_template.md
    and cas-knowledge/templates/promotion_decision.md.
  rationale: Enforces evidence-based architectural knowledge progression from raw
    signals to verified global assets, anchoring organizational learning governance.
  promotion_readiness: high
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: Instruments runtime pipeline execution with OpenTelemetry SDK
    in pyproject.toml and TraceableMetric schemas in models.py.
  rationale: Provides uniform distributed tracing, latency profiling, and token expenditure
    monitoring across distributed agent runs.
  promotion_readiness: medium
- id: pure-functional-health-evaluation
  scope: global
  classification: supporting
  evidence_summary: Deterministic computation in src/cas_runner/dashboard/health_model.py
    evaluating health scores and diagnostic explanations without I/O side effects.
  rationale: Isolates audit and scoring algorithms into deterministic, side-effect-free
    functions suitable for unit testing and CI gates.
  promotion_readiness: high
- id: file-system-knowledge-repository
  scope: global
  classification: supporting
  evidence_summary: Hierarchical directory structure under cas-knowledge/ managed
    by LocalKnowledgeProvider in src/cas_runner/io.py.
  rationale: Leverages git versioning and readable formats (Markdown, YAML, JSON)
    as primary persistence for transparent architecture review.
  promotion_readiness: high
project_pattern_candidates:
- id: declarative-agent-command-registry
  scope: project
  rationale: Tightly coupled to repo-specific Speckit CLI declarations (.agents/commands/*.toml)
    rather than general architecture execution.
  future_promotion_potential: medium
- id: workspace-bootstrap-template-injection
  scope: project
  rationale: Implements repository bootstrap and scaffold logic tailored to the CAS
    workspace layout in src/cas_runner/bootstrap.py.
  future_promotion_potential: medium
- id: docs-as-code-portal-projection
  scope: project
  rationale: Specific static site generation workflow based on MkDocs plugins and
    repo-level visualization assets (portal/docs/static/js/dashboard.js).
  future_promotion_potential: low
- id: pattern-proposal-only-steering-projection
  scope: project
  rationale: GitHub Actions branch isolation flow (.github/workflows/cas-build-steering-projection.yml)
    protecting root documentation in this specific repository.
  future_promotion_potential: medium
- id: capability-lineage-anchoring
  scope: project
  rationale: Models provenance of specific capability manifests within the ideas-to-life-cas
    runtime context.
  future_promotion_potential: high
candidate_patterns_requiring_review:
- id: reconciliation-agentic-merger
  rationale: Strategic direction component for LLM-assisted merge conflict resolution;
    potential risk of autonomous state divergence.
  evidence_gaps: Lacks empirical production evaluation across diverse merge conflicts
    and deterministic boundary validation.
  recommended_next_step: Run controlled comparative benchmark against git merge strategies
    on sample architectural drifts.
- id: pattern-proposal-business-intent-traceability
  rationale: High strategic importance connecting business intent to ADRs and code,
    but implementation contract is nascent.
  evidence_gaps: Only referenced in forward-looking signals and alignment reports;
    lacks functional implementation in runner codebase.
  recommended_next_step: Implement AST and schema parser mapping business intent specs
    directly to validation gates.
- id: pattern-proposal-automated-closed-loop-governance
  rationale: Proposes end-to-end autonomous detect-analyze-plan-execute cycles without
    human review for non-breaking changes.
  evidence_gaps: High operational blast radius; current workflows require explicit
    PR approval before merging managed changes.
  recommended_next_step: Conduct safety boundary audit defining exact criteria for
    non-breaking autonomous remediation.
- id: pattern-proposal-architecture-knowledge-graph
  rationale: Advanced concept for graph-based traversal of architecture decisions,
    AST relationships, and cross-project lineage.
  evidence_gaps: Knowledge substrate is currently file-system flat structure (cas-knowledge);
    no graph DB or indexer implemented.
  recommended_next_step: Create experimental spike demonstrating graph query utility
    over flat Markdown/YAML files.
- id: pattern-proposal-code-intelligence-alignment
  rationale: Empirical ground-truth verification comparing AST dependency graphs directly
    with Architecture Intent Documents.
  evidence_gaps: Only partial extraction exists in forensic flow extractor; lack of
    bi-directional intent-to-AST diff engine.
  recommended_next_step: Formalize AST extraction schemas and integrate into cas-build-validation
    CI flow.
- id: declarative-steering-projection
  rationale: Extracts structured prompt facts from git changes to steer downstream
    agent steps without token bloat.
  evidence_gaps: Needs validation across larger multi-file commits to assess prompt
    sizing and relevance filtering efficiency.
  recommended_next_step: Profile prompt fact extraction against high-variance commit
    histories.
duplicate_overlapping_patterns:
- patterns:
  - provider-agnostic-llm-facade
  - deterministic-mock-evaluation-harness
  - dual-tier-llm-gateway-abstraction
  - provider-agnostic-llm-client
  - swappable-client-adapter
  - client-adapter-test-double
  - pluggable-adapter-client
  recommended_action: Consolidate into 'provider-agnostic-llm-facade' with deterministic
    mock testing documented as a core capability.
  rationale: All seven proposals describe decoupling LLM providers behind an abstract
    gateway paired with an offline mock double for deterministic testing.
- patterns:
  - finite-state-governance-engine
  - finite-state-governance-action-engine
  - transition-registry-state-machine
  - declarative-transition-registry
  recommended_action: Consolidate under 'finite-state-governance-engine'.
  rationale: Identical mechanisms relying on TransitionRegistry and GovernanceActionEngine
    to gate and execute state transitions.
- patterns:
  - sequential-pipeline-flow-runner
  - sequential-pipeline-context-propagation
  - centralized-flow-runner-orchestration
  recommended_action: Consolidate under 'sequential-pipeline-flow-runner'.
  rationale: All describe FlowRunner coordinating ordered step execution while propagating
    updated contextual state.
- patterns:
  - reconciliation-agentic-merger
  - agentic-state-reconciliation-merger
  - agentic-merge-resolution
  recommended_action: Consolidate under 'reconciliation-agentic-merger'.
  rationale: Redundant proposals targeting the AgenticMerger component for resolving
    structural and architectural document conflicts.
- patterns:
  - file-system-knowledge-repository
  - file-backed-knowledge-repository
  recommended_action: Consolidate under 'file-system-knowledge-repository'.
  rationale: Duplicate descriptions of using version-controlled file hierarchies under
    cas-knowledge/ as the persistent source of truth.
- patterns:
  - pure-functional-health-evaluation
  - declarative-health-scoring-pipeline
  - deterministic-health-and-compliance-evaluation
  recommended_action: Consolidate under 'pure-functional-health-evaluation'.
  rationale: Duplicate proposals for the side-effect-free calculation of categorical
    health statuses and diagnostic explanations.
- patterns:
  - rule-grounded-compliance-evaluation
  - declarative-compliance-findings-aggregation
  recommended_action: Consolidate under 'rule-grounded-compliance-evaluation'.
  rationale: Both describe ComplianceEngine executing declarative validation checks
    and aggregating findings into compliance models.
- patterns:
  - layered-governance-service-facade
  - service-facade-orchestration
  recommended_action: Consolidate under 'layered-governance-service-facade'.
  rationale: Redundant proposals describing GovernanceActionService orchestrating
    underlying compliance and transition engines.
- patterns:
  - pattern-proposal-automated-closed-loop-governance
  - pattern-continuous-governance-loop
  recommended_action: Consolidate under 'pattern-continuous-governance-loop'.
  rationale: Identical closed-loop detect-analyse-execute continuous architecture
    cycle formulations.
- patterns:
  - pattern-proposal-business-intent-traceability
  - pattern-business-intent-traceability
  recommended_action: Consolidate under 'pattern-business-intent-traceability'.
  rationale: Duplicate conceptual proposals for governing business intent schemas
    and mapping to downstream architecture.
- patterns:
  - pattern-proposal-architecture-knowledge-graph
  - pattern-architecture-knowledge-graph
  recommended_action: Consolidate under 'pattern-architecture-knowledge-graph'.
  rationale: Identical future-direction proposals for graph-based architecture decision
    and code AST lineage modeling.
- patterns:
  - declarative-steering-projection
  - git-delta-prompt-fact-projection
  recommended_action: Consolidate under 'declarative-steering-projection'.
  rationale: Both describe transforming Git changes into PromptFact domain models
    to ground agent prompts.
- patterns:
  - telemetry-observable-agent-steps
  - telemetry-grounded-traceability
  - telemetry-grounded-health-scoring
  recommended_action: Consolidate under 'telemetry-observable-agent-steps'.
  rationale: Overlapping telemetry concerns covering tracing, execution metrics, and
    health metric grounding.
promotion_recommendations:
