global_pattern_candidates:
- id: pattern-continuous-governance-loop
  scope: global
  classification: core
  evidence_summary: Supported by active GitHub Actions workflows (cas-continuous-architecture.yml,
    cas-build-validation.yml), architecture state models, and execution traces across
    multiple delivery milestones.
  rationale: Foundational architectural concept establishing closed-loop automated
    architecture governance (detect-analyse-plan-execute-observe) applicable to any
    continuous software delivery organization.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/governance_action_engine.py
    and verified with TransitionRegistry and GovernanceAction models.
  rationale: Essential safeguard mechanism restricting autonomous AI agents and automated
    workflows to valid state transitions across architectural artifacts.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Extensively defined in src/cas_runner/governance/models.py and
    src/cas_runner/steering/models.py using Pydantic and JSON Schema.
  rationale: Core reliability pattern guaranteeing all inputs and outputs of agentic
    and programmatic workflows conform to strict typed contracts, eliminating malformed
    LLM outputs.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/runner.py (FlowRunner) and src/cas_runner/steps/registry.py,
    driving all defined execution flows.
  rationale: Predictable orchestration backbone passing shared execution context sequentially
    to prevent non-deterministic agent looping and facilitate clear stage gates.
  promotion_readiness: high
- id: heuristic-to-pattern-promotion-lifecycle
  scope: global
  classification: core
  evidence_summary: Codified in cas-knowledge/templates/heuristic-to-pattern_template.md,
    promotion_decision.md, and docs/architecture/cas-pattern-evolution-flow.md.
  rationale: Defines the empirical knowledge evolution pipeline preventing premature
    architectural standardization without verifiable multi-signal evidence.
  promotion_readiness: high
- id: provider-agnostic-llm-facade
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/llm/litellm_client.py (LiteLLMClient)
    paired symmetrically with src/cas_runner/llm/mock_client.py (MockLLMClient).
  rationale: Highly reusable structural adapter isolating application logic from underlying
    LLM provider APIs and supporting zero-cost offline test execution.
  promotion_readiness: high
- id: pure-functional-health-evaluation
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/dashboard/health_model.py (calculate_health,
    get_health_reasons) operating without I/O side effects.
  rationale: Deterministic derivation of operational health states and explanatory
    reasons from input metrics, ensuring reproducible and testable audits across projects.
  promotion_readiness: high
- id: pattern-proposal-only-steering-projection
  scope: global
  classification: supporting
  evidence_summary: Configured in .github/workflows/cas-build-steering-projection.yml
    and .github/workflows/cas-managed-steering-sync.yml.
  rationale: Ensures continuous generation of architecture steering projections does
    not corrupt authoritative files by isolating generation into read-only PR proposals.
  promotion_readiness: high
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: Configured in pyproject.toml with OpenTelemetry dependencies and
    integrated via TraceableMetric in src/cas_runner/governance/models.py.
  rationale: Provides vendor-neutral distributed tracing and token/latency observability
    across agent pipeline executions.
  promotion_readiness: medium
project_pattern_candidates:
- id: docs-as-code-portal-projection
  scope: project
  rationale: Coupled to the specific MkDocs and theme plugin configuration (mkdocs-material,
    ezlinks, roamlinks) within the ideas-to-life-cas repo.
  future_promotion_potential: high
- id: workspace-bootstrap-template-injection
  scope: project
  rationale: Current implementation in src/cas_runner/bootstrap.py assumes specific
    folder structures and local repo attach semantics unique to CAS workspace bootstrap.
  future_promotion_potential: medium
- id: declarative-agent-command-registry
  scope: project
  rationale: Directly models Speckit agentic skill TOML manifests in .agents/commands/
    rather than a generalized agent specification format.
  future_promotion_potential: medium
- id: file-system-knowledge-repository
  scope: project
  rationale: Reflects the current cas-knowledge directory layout and file-based state
    conventions of this runner, pending generalized multi-backend storage abstractions.
  future_promotion_potential: medium
- id: layered-governance-service-facade
  scope: project
  rationale: Application-level coordinator wrapping GovernanceActionService, ComplianceEngine,
    and FlowRunner specific to the CLI commands of ideas-to-life-cas.
  future_promotion_potential: low
candidate_patterns_requiring_review:
- id: reconciliation-agentic-merger
  rationale: Semantic three-way resolution of architectural Markdown/YAML via LLM
    is promising, but currently marked emerging with risk of hallucinated merges.
  evidence_gaps: Lacks empirical benchmarks evaluating conflict resolution accuracy
    against real-world merge edge cases across multiple project histories.
  recommended_next_step: Conduct structured testing against synthetic and real merge
    conflicts to determine error boundaries and failure fallbacks.
- id: pattern-business-intent-traceability
  rationale: High strategic value connecting business objectives to technical architecture
    deltas, but currently at future_direction maturity.
  evidence_gaps: No concrete schema contracts or ingestion runtime implementation
    currently exist in the codebase.
  recommended_next_step: Prototype schema models for business intent entities and
    evaluate ingestion within a sample project workflow.
- id: pattern-architecture-knowledge-graph
  rationale: Cross-project impact analysis and multi-hop relationship traversal would
    benefit enterprise portfolios, but relies on future direction signals.
  evidence_gaps: Lacks graph storage, query interface, or implementation artifacts
    in active runner components.
  recommended_next_step: Draft a formal ADR exploring graph database vs in-memory
    index projections from repository metadata.
- id: capability-lineage-anchoring
  rationale: Lineage schemas exist in steering models, but production validation of
    multi-hop capability ancestry across multiple repos is limited.
  evidence_gaps: Evidence is confined to single-project data structures without cross-repository
    verification.
  recommended_next_step: Run multi-repository pilot tracking capability ancestry during
    upstream governance propagation.
duplicate_overlapping_patterns:
- patterns:
  - provider-agnostic-llm-facade
  - deterministic-mock-evaluation-harness
  - dual-tier-llm-gateway-abstraction
  - provider-agnostic-llm-client
  - swappable-client-adapter
  - client-adapter-test-double
  - pluggable-adapter-client
  - dual-mode-llm-provider-abstraction
  - swappable-provider-adapter
  recommended_action: Consolidate into canonical 'provider-agnostic-llm-facade' with
    dual production/mock client contract.
  rationale: Nine separate proposals define the exact same LiteLLM client adapter
    paired with MockLLMClient in src/cas_runner/llm/.
- patterns:
  - finite-state-governance-engine
  - finite-state-governance-action-engine
  - transition-registry-state-machine
  - declarative-transition-registry
  - finite-transition-governance-guardrail
  recommended_action: Consolidate into canonical 'finite-state-governance-engine'.
  rationale: All proposals reference the TransitionRegistry and GovernanceActionEngine
    enforcing deterministic lifecycle transitions in src/cas_runner/governance/.
- patterns:
  - sequential-pipeline-flow-runner
  - sequential-pipeline-context-propagation
  - centralized-flow-runner-orchestration
  - sequential-pipeline-orchestration
  recommended_action: Consolidate into canonical 'sequential-pipeline-flow-runner'.
  rationale: Redundant proposals representing the FlowRunner execution coordinator
    in src/cas_runner/runner.py.
- patterns:
  - reconciliation-agentic-merger
  - agentic-state-reconciliation-merger
  - agentic-merge-resolution
  - agentic-knowledge-reconciler
  recommended_action: Consolidate into canonical 'reconciliation-agentic-merger'.
  rationale: All proposals describe the LLM-assisted state reconciliation engine located
    in src/cas_runner/governance/agentic_merger.py.
- patterns:
  - pure-functional-health-evaluation
  - declarative-health-scoring-pipeline
  - deterministic-health-and-compliance-evaluation
  - functional-health-evaluation
  - compliance-driven-health-scoring
  - telemetry-grounded-health-scoring
  recommended_action: Consolidate into canonical 'pure-functional-health-evaluation'.
  rationale: All proposals describe pure functional health calculations in src/cas_runner/dashboard/health_model.py.
- patterns:
  - layered-governance-service-facade
  - service-facade-orchestration
  - service-layer-facade
  recommended_action: Consolidate into canonical 'layered-governance-service-facade'.
  rationale: Duplicates describing GovernanceActionService aggregating ComplianceEngine
    and GovernanceActionEngine.
- patterns:
  - file-system-knowledge-repository
  - file-backed-knowledge-repository
  - file-backed-blackboard-workspace
  recommended_action: Consolidate into canonical 'file-system-knowledge-repository'.
  rationale: Identical definitions of using structured git-versioned file hierarchies
    for governance and blackboard memory.
- patterns:
  - pattern-continuous-governance-loop
  - pattern-closed-loop-governance-controller
  recommended_action: Consolidate into canonical 'pattern-continuous-governance-loop'.
  rationale: Identical Detect-Analyse-Plan-Execute closed loop governance cycles.
- patterns:
  - ci-driven-steering-projection
  - declarative-steering-projection
  - git-delta-prompt-fact-projection
  - steering-fact-projection
  - lineage-aware-architectural-delta-slicing
  - pattern-proposal-only-steering-projection
  recommended_action: Consolidate into 'pattern-proposal-only-steering-projection'
    for delivery synchronization and 'steering-fact-projection' for context compilation.
  rationale: Overlapping proposals separating non-destructive PR generation from prompt
    fact extraction.
- patterns:
  - rule-grounded-compliance-evaluation
  - declarative-compliance-findings-aggregation
  recommended_action: Consolidate into canonical 'rule-grounded-compliance-evaluation'.
  rationale: Identical descriptions of ComplianceEngine evaluating rules and producing
    ComplianceFinding models.
- patterns:
  - schema-enforced-domain-contracts
  - pydantic-domain-entity-modeling
  recommended_action: Consolidate into canonical 'schema-enforced-domain-contracts'.
  rationale: Duplicate proposals specifying strict Pydantic model validation on domain
    entities.
- patterns:
  - telemetry-observable-agent-steps
  - telemetry-grounded-traceability
  recommended_action: Consolidate into canonical 'telemetry-observable-agent-steps'.
  rationale: Redundant specifications of OpenTelemetry runtime instrumentation and
    TraceableMetric schemas.
