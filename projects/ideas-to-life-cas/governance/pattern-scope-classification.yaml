global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/llm/litellm_client.py (LiteLLMClient)
    and mock_client.py (MockLLMClient), providing transport abstraction and deterministic
    offline testing across agent workloads.
  rationale: Foundational design pattern decoupling business logic from proprietary
    model APIs and enabling zero-cost CI testing across any LLM-powered system.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/governance_action_engine.py
    with TransitionRegistry and GovernanceActionEngine validating state transitions
    against registered models.
  rationale: Essential guardrail preventing autonomous agents from triggering illegal
    state mutations, bypassing approvals, or creating inconsistent lifecycle states.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/runner.py (FlowRunner) orchestrating
    multi-stage execution and threading a shared mutable context across pipeline steps.
  rationale: Establishes a predictable, inspectable, and auditable execution model
    for composite agentic and architectural workflows, preventing nondeterministic
    task loops.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/models.py and steering/models.py
    using Pydantic schemas to validate entity structures prior to downstream consumption.
  rationale: Prevents malformed, incomplete, or hallucinated payloads generated by
    LLMs from propagating into system state.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: Extensively evidenced in cas-knowledge directory hierarchy across
    global, project, and runtime namespaces, integrated via git-native PR review workflows.
  rationale: Provides durable, human-auditable, and branchable shared memory for human-agent
    collaboration without the infrastructure burden of external databases.
  promotion_readiness: high
- id: template-driven-artifact-evolution
  scope: global
  classification: core
  evidence_summary: Implemented via standardized markdown templates in cas-knowledge/templates
    for decisions, patterns, rules, and promotion workflows.
  rationale: Enforces consistent structure and required frontmatter on generated architectural
    knowledge, enabling automated parsing and progressive promotion.
  promotion_readiness: high
- id: declarative-compliance-findings-aggregation
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/governance/compliance_engine.py
    producing structured ComplianceFinding and ComplianceMetrics models.
  rationale: Provides reusable mechanism for auditing candidate state against codified
    rule sets and converting findings into machine-readable scores.
  promotion_readiness: high
- id: pure-functional-health-evaluation
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/dashboard/health_model.py (calculate_health,
    get_health_reasons) as side-effect-free status and diagnostic functions.
  rationale: Decouples status calculation from presentation and storage, ensuring
    deterministic and easily testable health classifications across tooling.
  promotion_readiness: high
- id: dedicated-verifier-subagent
  scope: global
  classification: supporting
  evidence_summary: Configured in .agents/subagents/verifier.md and .claude/agents/verifier.md
    to review producer agent outputs independently.
  rationale: Separates artifact generation from compliance verification to counter
    optimistic self-review bias in autonomous agents.
  promotion_readiness: medium
- id: declarative-agent-skill-packaging
  scope: global
  classification: supporting
  evidence_summary: Established in .agents/skills/ and .claude/skills/ with declarative
    task manifests and instructions across multiple capability domains.
  rationale: Modularizes agent capabilities into discoverable, reusable, and version-controlled
    skill bundles across disparate agent runtimes.
  promotion_readiness: high
project_pattern_candidates:
- id: bootstrap-governance-block-injection
  scope: project
  rationale: Tightly coupled to ideas-to-life-cas workspace file scaffolding (CLAUDE.md,
    AGENTS.md, GEMINI.md) and specific bootstrap symlinking routines.
  future_promotion_potential: medium
- id: ci-driven-steering-projection
  scope: project
  rationale: Represents specific GitHub Actions CI automation (.github/workflows/cas-build-steering-projection.yml)
    tailored to the repository's build sequence.
  future_promotion_potential: medium
- id: structural-cicd-policy-validation
  scope: project
  rationale: Custom static checks in specs/090-simplify-cicd-workflows/validate_workflows.py
    enforcing local CI script formatting, unpinned installers, and retired workflow
    rules.
  future_promotion_potential: low
- id: bi-directional-external-review-broker
  scope: project
  rationale: Custom integration mediating between the local CAS runner and the proprietary
    ArchGov REST service for design authority synchronization.
  future_promotion_potential: low
- id: authoritative-architecture-work-backlog
  scope: project
  rationale: Governs the project-specific lifecycle of Architecture Work (AW) records
    generating Architecture Evolution Maps (AEM) within ideas-to-life-cas.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: reconciliation-agentic-merger
  rationale: Using LLMs to reconcile structural and semantic merge conflicts in markdown
    and YAML files is powerful but carries risks of silent schema degradation.
  evidence_gaps: Requires empirical evaluation of conflict resolution accuracy and
    boundary rules when merging contradictory policy statements.
  recommended_next_step: Define benchmark merge test suites and evaluate resolution
    determinism against traditional three-way merge tools.
- id: multi-project-architecture-knowledge-graph
  rationale: Graph-based recursive querying across project boundaries is strategically
    promising for enterprise visibility but currently lacks runtime container implementation.
  evidence_gaps: Existing evidence is limited to strategic direction notes and frontmatter
    links without a deployed graph database or query engine.
  recommended_next_step: Prototype graph extraction on real repository networks and
    measure traversal query performance versus flat file indexing.
- id: business-intent-traceability-bridge
  rationale: End-to-end linking of high-level business drivers to AST code components
    is highly desirable but lacks concrete AST parsing instrumentation.
  evidence_gaps: Implementation mechanisms linking business capabilities to specific
    code symbols remain conceptual.
  recommended_next_step: Develop automated attribution schemas connecting AST nodes
    to capability lineage identifiers.
- id: closed-loop-continuous-governance
  rationale: Automated Detect-Analyse-Plan-Execute-Publish loops risk uncontrolled
    repository commits if automated remediation is permitted on non-trivial drift.
  evidence_gaps: Safety boundaries for non-breaking automated fixes vs. mandatory
    human review gates need formal validation.
  recommended_next_step: Test advisory-only mode in pull request workflows before
    authorizing autonomous remediation commits.
