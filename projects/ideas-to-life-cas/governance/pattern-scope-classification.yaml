global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/llm/litellm_client.py and mock_client.py
    with dual production-mock parity across multiple execution flows.
  rationale: Fundamental architectural decoupling separating LLM consumption logic
    from proprietary vendor SDKs, highly reusable across any AI-assisted system.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Codified in src/cas_runner/governance/governance_action_engine.py
    with TransitionRegistry and GovernanceAction models.
  rationale: Essential safety invariant preventing autonomous agents from performing
    illegal lifecycle transitions or arbitrary state mutations.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Extensively evidenced across src/cas_runner/governance/models.py
    and steering/models.py using strict Pydantic schemas.
  rationale: Core boundary protection pattern ensuring all inputs and outputs between
    agents, storage, and CI runners adhere to deterministic typed contracts.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: Implemented in cas-knowledge directory layout and src/cas_runner/bootstrap.py,
    functioning as Git-native persistent memory.
  rationale: Foundational pattern for agent collaboration without requiring database
    infrastructure, leveraging Git versioning and pull-request gating.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/runner.py (FlowRunner) orchestrating
    linear execution stages and shared execution context.
  rationale: Core execution pattern ensuring deterministic step order and short-circuit
    failure boundaries, avoiding unbounded autonomous agent loops.
  promotion_readiness: high
- id: pattern-architecture-work-registry
  scope: global
  classification: core
  evidence_summary: Evidenced in architecture work items and flows separating planning
    backlog state from generated Architecture Evolution Maps.
  rationale: Prevents data loss during automated discovery runs by decoupling authoritative
    change backlogs from ephemeral derived visualizations.
  promotion_readiness: high
- id: declarative-steering-projection
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/steering/models.py and .github/workflows/cas-build-steering-projection.yml.
  rationale: Transforms VCS deltas and capabilities into typed PromptFacts to ground
    agent reasoning within tight token boundaries.
  promotion_readiness: high
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: Configured via opentelemetry-api and opentelemetry-sdk in pyproject.toml
    and models.py (TraceableMetric).
  rationale: Standardizes observability across agentic invocations, tracking latency,
    token consumption, and failure spans for auditability.
  promotion_readiness: medium
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/governance/compliance_engine.py
    with ComplianceFinding and ComplianceMetrics models.
  rationale: Replaces subjective qualitative agent reviews with deterministic, metric-grounded
    compliance evaluation against codified rules.
  promotion_readiness: medium
project_pattern_candidates:
- id: bootstrap-governance-block-injection
  scope: project
  rationale: Tightly coupled to CAS runner workspace initialization markers and local
    AGENTS.md conventions.
  future_promotion_potential: medium
- id: docs-as-code-portal-projection
  scope: project
  rationale: Specific to MkDocs material and static asset bundling configured for
    this repository's deployment target.
  future_promotion_potential: low
- id: declarative-agent-command-registry
  scope: project
  rationale: Specific to speckit TOML manifest contracts located in .agents/commands/
    for local runner toolchains.
  future_promotion_potential: medium
- id: pattern-proposal-only-steering-projection
  scope: project
  rationale: Operational configuration specific to cas-runner CI branches avoiding
    trunk branch mutations.
  future_promotion_potential: low
- id: pattern-scope-classification-framework
  scope: project
  rationale: Taxonomy document and reference architecture currently governing ideas-to-life-cas
    project workflows.
  future_promotion_potential: high
candidate_patterns_requiring_review:
- id: reconciliation-agentic-merger
  rationale: Semantic document reconciliation by an LLM is high risk for automated
    governance and requires deeper cross-project empirical testing.
  evidence_gaps: Lack of empirical data showing agentic merges avoid subtle schema
    corruptions across diverse project environments.
  recommended_next_step: Run shadow evaluation in CI comparing LLM merge outputs against
    human architect resolution decisions.
- id: pattern-business-intent-traceability
  rationale: Strategic direction proposal formalizing business goals into domain schemas
    bound to AST-extracted code components.
  evidence_gaps: No runtime implementation or AST extraction engine currently exists
    in the codebase.
  recommended_next_step: Develop prototype Pydantic schema and test AST linkage on
    a pilot capability before promoting to pattern.
- id: pattern-architecture-knowledge-graph
  rationale: Proposes replacing flat markdown and YAML frontmatter with a unified
    relational knowledge graph.
  evidence_gaps: Current architecture remains entirely file-backed; graph database
    schema and query engines are unproven.
  recommended_next_step: Validate storage trade-offs and GitOps compatibility with
    an experimental graph indexer.
- id: pattern-deterministic-lifecycle-gating
  rationale: Proposes machine-validated gating preventing state progression without
    accepted ADRs.
  evidence_gaps: Overlaps significantly with Finite State Governance Engine and requires
    verification of CI gating rules.
  recommended_next_step: Consolidate into transition registry rules and verify runner
    enforcement in integration tests.
- id: pattern-continuous-governance-loop
  rationale: Proposes closed-loop autonomous detection, analysis, and execution remediation
    in CI/CD pipelines.
  evidence_gaps: Automated code remediation safety boundaries and human approval gates
    require formal definition.
  recommended_next_step: Scope automated remediation to proposal-only generation before
    enabling unattended execution.
