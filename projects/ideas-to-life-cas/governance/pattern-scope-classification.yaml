global_pattern_candidates:
- id: provider-agnostic-llm-gateway
  scope: global
  classification: core
  evidence_summary: Multiple implementations (LiteLLMClient, MockLLMClient) across
    the entire runner, governance, and steering subsystems demonstrate consistent
    abstraction of LLM provider interactions with deterministic fallback.
  rationale: Provider-agnostic LLM gateway is a foundational architectural pattern
    decoupling agent logic from specific model vendors, enabling portability, testability,
    and cost control. It is reused by all LLM-dependent components and applicable
    to any AI orchestration system.
  promotion_readiness: high
  promotion_rationale: Evidence is high across many modules and stable across multiple
    iterations; the pattern is essential for any project integrating LLM providers.
- id: sequential-pipeline-orchestration
  scope: global
  classification: core
  evidence_summary: FlowRunner consistently coordinates multi-step agentic workflows
    with a shared mutable context, as evidenced across runner.py, CLI, and numerous
    workflow declarations.
  rationale: Deterministic sequential pipeline execution with shared context is a
    general orchestration pattern for agentic systems, ensuring reproducibility and
    auditability. It is widely reusable and a core architectural mechanism.
  promotion_readiness: high
  promotion_rationale: The pattern is stable, well-evidenced, and fundamental to multi-step
    automation in domains beyond this project.
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine enforce legal state
    transitions across governance artifacts, preventing invalid lifecycle changes.
  rationale: State machine governance is a universal pattern for controlled autonomous
    actions, applicable to any system requiring auditability and safe state transitions.
    Core to governance automation.
  promotion_readiness: high
  promotion_rationale: Highly reusable and critical for safe agent-driven state changes;
    evidence is strong and stable.
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: ComplianceEngine evaluates agent outputs against codified rules,
    producing structured findings and metrics across CI workflows and governance actions.
  rationale: Rule-based compliance evaluation is a general pattern for validating
    outputs in automated pipelines, ensuring governance adherence. Applicable across
    domains requiring regulatory or architectural compliance.
  promotion_readiness: high
  promotion_rationale: The pattern is stable, widely used, and essential for enforcing
    quality gates; promotion readiness is high.
- id: file-backed-knowledge-repository
  scope: global
  classification: core
  evidence_summary: cas-knowledge directory hierarchy (global, projects, runtime,
    templates) acts as persistent, version-controlled shared memory for agents and
    humans.
  rationale: File-backed knowledge repositories enable auditability, versioning, and
    human review of agent memory using standard Git workflows. Reusable across any
    agentic system needing persistent structured knowledge.
  promotion_readiness: high
  promotion_rationale: Pattern is stable, well-evidenced, and foundational for knowledge
    management in agentic architectures.
- id: steering-fact-projection
  scope: global
  classification: supporting
  evidence_summary: Transforms raw git deltas and capability records into typed PromptFacts,
    grounding LLM context in verifiable repository changes.
  rationale: Steering fact projection is a reusable pattern to reduce hallucination
    and context bloat in LLM-driven systems by providing structured, evidence-based
    context.
  promotion_readiness: medium
  promotion_rationale: Well-evidenced in this project but not yet demonstrated across
    multiple distinct systems; readiness is medium.
- id: agentic-merge-resolution
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger uses LLMs to reconcile conflicting governance/document
    artifacts, producing typed resolution outcomes.
  rationale: Agentic semantic merging is a reusable pattern for resolving complex
    merge conflicts beyond three-way text merging, applicable in collaborative multi-agent
    environments.
  promotion_readiness: medium
  promotion_rationale: Emerging but promising; evidence is high within this project,
    but broader adoption evidence is lacking.
- id: template-driven-artifact-evolution
  scope: global
  classification: supporting
  evidence_summary: Predefined markdown/YAML templates for ADRs, patterns, rules,
    and heuristics ensure consistent artifact structure and promote knowledge capture.
  rationale: Template-driven knowledge artifacts standardize agent output, improve
    machine-readability, and support governance review. Reusable in any knowledge-heavy
    agentic system.
  promotion_readiness: medium
  promotion_rationale: Stable and widely used in this project; readiness is medium
    due to limited cross-project evidence.
project_pattern_candidates:
- id: declarative-agent-command-registry
  scope: project
  rationale: Declarative command registry for agent skills is specific to the CAS
    repository structure and not yet proven outside.
  future_promotion_potential: medium
  governance_observation: Could become global if the registry pattern is reused in
    other agent frameworks.
- id: schema-enforced-domain-contracts
  scope: project
  rationale: Pydantic/JSON schema contracts are a general software engineering practice,
    but their specific implementation in governance models is project-specific.
  future_promotion_potential: medium
  governance_observation: The concept is universally applicable, but the current evidence
    is tied to this project's domain models.
- id: telemetry-observable-agent-steps
  scope: project
  rationale: OpenTelemetry instrumentation of agent steps is a common pattern, but
    the specific integration with governance models and runtime traces is project-specific.
  future_promotion_potential: high
  governance_observation: Could be promoted to global if standardized across multiple
    systems.
- id: ci-driven-steering-projection
  scope: project
  rationale: CI workflow triggering steering projection is tightly coupled to this
    repository's GitHub Actions and governance flow.
  future_promotion_potential: low
  governance_observation: The underlying concept of CI-driven architecture automation
    is reusable, but the concrete workflow is project-specific.
- id: capability-lineage-anchoring
  scope: project
  rationale: Tracking capability lineage is specific to the steering models of CAS
    and not yet demonstrated as a standalone reusable pattern.
  future_promotion_potential: medium
  governance_observation: May become global if capability lineage is applied to other
    knowledge domains.
- id: heuristic-to-pattern-promotion-lifecycle
  scope: project
  rationale: The lifecycle for promoting heuristics to patterns is defined with templates
    and governance workflows, but is still emerging and specific to CAS.
  future_promotion_potential: high
  governance_observation: This is a potentially valuable governance pattern for any
    agentic knowledge base, but requires broader evidence.
- id: telemetry-grounded-health-scoring
  scope: project
  rationale: Health scoring from telemetry and compliance metrics is designed for
    this system's dashboard and governance reporting.
  future_promotion_potential: medium
  governance_observation: Could be reusable in other monitoring systems, but not yet
    standardized.
- id: deterministic-governance-injection-bootstrap
  scope: project
  rationale: Bootstrap governance block injection is specific to onboarding projects
    into CAS.
  future_promotion_potential: low
  governance_observation: The pattern of idempotent config merging is generic, but
    the governance content is project-specific.
- id: pattern-proposal-only-steering-projection
  scope: project
  rationale: Emission of proposal-only steering artifacts without mutation is a safety
    mechanism specific to CAS CI workflows.
  future_promotion_potential: low
  governance_observation: Could be generalized as a change-management pattern, but
    current evidence is project-bound.
- id: pattern-continuous-governance-loop
  scope: project
  rationale: Embedding governance validation in CI/CD pipelines is a specific implementation
    of continuous architecture enforcement.
  future_promotion_potential: medium
  governance_observation: The concept is reusable, but the concrete workflow design
    is tailored to this project.
- id: declarative-compliance-findings-aggregation
  scope: project
  rationale: Aggregating compliance findings into typed metrics is a project-specific
    extension of compliance evaluation.
  future_promotion_potential: medium
  governance_observation: Could be promoted if the aggregation model is generalized.
- id: registry-guarded-governance-state-machine
  scope: project
  rationale: Registry-guarded transitions are essentially the same as finite-state-governance-engine
