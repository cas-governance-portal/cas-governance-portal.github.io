global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Multiple implementations (LiteLLMClient, MockLLMClient) across
    the codebase; used in all LLM-dependent components; high evidence strength.
  rationale: Decouples agent logic from LLM provider APIs, enables deterministic testing,
    and is broadly reusable across any agentic system.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine enforce valid state
    changes; high evidence from governance module; multiple related proposals.
  rationale: Essential governance pattern for autonomous agents to prevent illegal
    state transitions; applicable to any system requiring auditable lifecycle control.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic/JSON Schema models for governance, steering, and compliance;
    high evidence from models.py and dependencies.
  rationale: Ensures reliable typed data across agent boundaries, prevents malformed
    LLM outputs, and is a foundational reliability pattern.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner centralizes multi-step orchestration; multiple pipeline-related
    proposals; high evidence.
  rationale: Provides deterministic, inspectable execution order for multi-stage agent
    workflows, essential for CI/CD and complex tasks.
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: ComplianceEngine produces typed findings/metrics; used in CI and
    governance; high evidence.
  rationale: Standardized compliance checking against codified rules is a general
    governance need, enabling auditability and gate enforcement.
  promotion_readiness: high
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry integration and traceable metrics; high evidence
    from pyproject and models.
  rationale: Observability is critical for agentic systems to track latency, cost,
    and errors; reusable across any distributed or AI pipeline.
  promotion_readiness: high
- id: reconciliation-agentic-merger
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger resolves semantic conflicts in governance artifacts;
    high evidence from implementation.
  rationale: LLM-driven merge resolution addresses a real need in multi-source document/configuration
    management; strategic direction supports global relevance.
  promotion_readiness: medium
- id: git-delta-prompt-fact-projection
  scope: global
  classification: supporting
  evidence_summary: Typed models (PromptFact, RawGitDelta) convert git changes into
    LLM context; high evidence.
  rationale: Grounding prompts in verified facts reduces hallucination and context
    bloat; universal pattern for repository-aware agents.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: supporting
  evidence_summary: Version-controlled file tree used as persistent knowledge/state
    store; multiple implementations.
  rationale: Provides auditable, git-native memory for agents without external DBs;
    applicable to many collaborative agent systems.
  promotion_readiness: high
- id: capability-lineage-anchoring
  scope: global
  classification: supporting
  evidence_summary: Typed capability records with lineage tracking; high evidence
    in steering models.
  rationale: Tracing capability evolution is a general pattern for managing architectural
    knowledge and change impact.
  promotion_readiness: medium
- id: heuristic-to-pattern-promotion-lifecycle
  scope: global
  classification: supporting
  evidence_summary: Templates and architecture docs define promotion workflow; high
    evidence.
  rationale: Institutionalizing a formal path from heuristic to pattern is a governance
    pattern applicable to any learning organization.
  promotion_readiness: medium
project_pattern_candidates:
- id: declarative-agent-command-registry
  scope: project
  rationale: Specific to .agents/commands TOML structure; not yet proven outside this
    project.
  future_promotion_potential: medium
  governance_observation: May become reusable if tooling standardizes on declarative
    command manifests.
- id: ci-driven-steering-projection
  scope: project
  rationale: CI workflow for generating architecture projections; valuable for this
    project but not yet a generalized pattern.
  future_promotion_potential: medium
  governance_observation: Could promote if other projects adopt similar CI-driven
    architecture sync.
- id: deterministic-mock-evaluation-harness
  scope: project
  rationale: Mock client for deterministic testing; closely tied to LLM abstraction
    and may be subsumed by that pattern.
  future_promotion_potential: high
  governance_observation: Consider merging with provider-agnostic LLM facade when
    promoting.
- id: pattern-scope-classification-framework
  scope: project
  rationale: Framework for classifying pattern scopes; meta-pattern still evolving
    within this project.
  future_promotion_potential: low
  governance_observation: Needs broader validation before globalization.
- id: service-facade-orchestration
  scope: project
  rationale: General service facade pattern; too generic and not uniquely evidenced
    across projects.
  future_promotion_potential: low
  governance_observation: Could be considered a standard architectural pattern better
    captured by existing catalogs.
- id: workspace-governance-injection-bootstrap
  scope: project
  rationale: Bootstrap merging governance into AGENTS.md etc.; project-specific adoption
    pattern.
  future_promotion_potential: medium
  governance_observation: May become global if multiple projects adopt this onboarding
    approach.
- id: structural-cicd-policy-validation
  scope: project
  rationale: CI workflow validation checks for this repo; not yet proven as a standalone
    pattern.
  future_promotion_potential: medium
  governance_observation: Generalizable but needs evidence from other repositories.
candidate_patterns_requiring_review:
- id: prompt-fact-extraction
  scope: candidate
  rationale: Low evidence and unclear implementation; concept of extracting prompt
    facts is not sufficiently distinct from git-delta-prompt-fact-projection.
  evidence_gaps: No concrete implementation identified; overlaps with other steering
    fact patterns.
  recommended_next_step: Consolidate with git-delta-prompt-fact-projection or provide
    additional evidence.
- id: externalized-runtime-context
  scope: candidate
  rationale: Storing runtime state in files is common but not enough evidence of a
    distinct pattern.
  evidence_gaps: Lacks specific reusable mechanism beyond file storage.
  recommended_next_step: Determine if it is part of file-backed blackboard or a separate
    pattern.
- id: runtime-evaluation-trace
  scope: candidate
  rationale: Low evidence; traces directory exists but no explicit pattern definition.
  evidence_gaps: No detailed design or cross-project usage.
  recommended_next_step: Collect more evidence from multiple deployments.
- id: pattern-evolution-promotion
  scope: candidate
  rationale: Overlaps with heuristic-to-pattern-promotion-lifecycle; evidence low.
  evidence_gaps: Not enough distinct evidence.
  recommended_next_step: Merge with the more mature promotion lifecycle pattern.
- id: agentic-merge-resolution-loop
  scope: candidate
  rationale: Similar to reconciliation-agentic-merger; insufficient evidence to distinguish.
  evidence_gaps: Duplicates agentic merger pattern.
  recommended_next_step: Consolidate under reconciliation-agentic-merger.
