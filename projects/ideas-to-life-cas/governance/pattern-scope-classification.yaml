global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Multiple proposal variants and concrete implementations (LiteLLMClient,
    MockLLMClient) demonstrate a stable, widely used abstraction across the system.
  rationale: "Provider-agnostic LLM access is foundational for any agentic or AI\u2010\
    intensive system, enabling portability, deterministic testing, and vendor independence\
    \ without business logic coupling."
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine appear in numerous
    proposals and are central to governance action enforcement.
  rationale: "Explicit state\u2011transition control is essential for safe autonomous\
    \ agents, ensuring auditability, preventing illegal actions, and providing a reusable\
    \ governance mechanism."
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Extensive use of Pydantic models in governance and steering modules
    (governance/models.py, steering/models.py) enforces typed contracts across the
    codebase.
  rationale: Strongly typed domain contracts are a foundational practice for reliable,
    maintainable, and interoperable agentic systems, reducing malformed data and enabling
    safe evolution.
  promotion_readiness: high
- id: sequential-flow-pipeline-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner appears as the central execution orchestrator across
    CLI and GitHub workflows, with deterministic stage sequencing.
  rationale: Deterministic, well-ordered pipelines with shared context are core to
    reproducible agent workflows and are broadly applicable in CI/CD and automation
    platforms.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: supporting
  evidence_summary: "The cas-knowledge directory structure and bootstrap functions\
    \ demonstrate a durable, versioned file\u2011based blackboard used across projects."
  rationale: "File\u2011backed knowledge repositories provide transparent, auditable,\
    \ and human\u2011reviewable shared state\u2014valuable for agent collaboration\
    \ and governance without external DB dependencies."
  promotion_readiness: high
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry dependencies and TraceableMetric models show systematic
    instrumentation of agent steps.
  rationale: Observability is critical for managing agentic systems, enabling debugging,
    cost tracking, and governance auditing across distributed runs.
  promotion_readiness: high
- id: declarative-steering-projection
  scope: global
  classification: supporting
  evidence_summary: Steering models convert raw git deltas and capability records
    into structured PromptFacts used in CI and agent context.
  rationale: "Grounding prompts with verified facts reduces hallucination and improves\
    \ steerability\u2014an essential pattern for LLM\u2011based decision support."
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: supporting
  evidence_summary: ComplianceEngine generates structured compliance findings and
    metrics, used in CI validation and governance workflows.
  rationale: "Rule\u2011based compliance checking with typed outputs is broadly reusable\
    \ for governance audit and enforcement in any automated system."
  promotion_readiness: high
- id: health-model-observability-guardrail
  scope: global
  classification: supporting
  evidence_summary: "HealthStatus, calculate_health, and get_health_reasons provide\
    \ deterministic health evaluation with human\u2011readable reasons."
  rationale: Aggregating metrics into clear health indicators with diagnostic reasons
    is a ubiquitous need for observability and automated governance.
  promotion_readiness: high
- id: deterministic-mock-evaluation-harness
  scope: global
  classification: supporting
  evidence_summary: MockLLMClient provides deterministic responses for offline and
    CI testing, complementing the Live client.
  rationale: "Deterministic mock clients are essential for reliable, cost\u2011effective\
    \ testing of agent pipelines without external dependencies."
  promotion_readiness: high
- id: reconciliation-agentic-merger
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger applies LLM reasoning to resolve semantic conflicts
    in governance artifacts, with structured ResolutionResult outputs.
  rationale: "Autonomous conflict resolution is a high\u2011value pattern for multi\u2011\
    agent systems, but its maturity is still emerging; it should be promoted cautiously."
  promotion_readiness: medium
project_pattern_candidates:
- id: bootstrap-governance-block-injection
  scope: project
  rationale: "Workspace initialization and governance block injection are closely\
    \ tied to CAS onboarding flows and file\u2011layout conventions, limiting immediate\
    \ reuse beyond this project."
  future_promotion_potential: medium
- id: capability-lineage-anchoring
  scope: project
  rationale: Capability lineage tracking is specific to architecture knowledge management
    and is currently evidenced only in steering models.
  future_promotion_potential: medium
- id: ci-driven-steering-projection
  scope: project
  rationale: "Automating steering projections through CI is a pattern for this project's\
    \ delivery lifecycle; similar mechanisms may exist elsewhere but lack cross\u2011\
    evidence."
  future_promotion_potential: medium
- id: declarative-agent-command-registry
  scope: project
  rationale: Declarative TOML manifests for agent commands are tied to the specific
    speckit CLI and .agents/ directory conventions.
  future_promotion_potential: low
- id: service-facade-application-boundary
  scope: project
  rationale: The service layer facade is a generic pattern, but here it is tightly
    integrated with governance engines and CLI entry points; it is not sufficiently
    demonstrated as a standalone architectural contribution.
  future_promotion_potential: low
- id: pattern-continuous-governance-loop
  scope: project
  rationale: "Continuous governance via GitHub Actions is a project\u2011level implementation;\
    \ the underlying idea is strategic but still under\u2011evidenced."
  future_promotion_potential: high
- id: structural-cicd-policy-validation
  scope: project
  rationale: "CI workflow validation (YAML syntax, pinning, hardcoding checks) is\
    \ a project\u2011specific enforcement mechanism."
  future_promotion_potential: medium
- id: template-driven-pattern-evolution
  scope: project
  rationale: Markdown templates for knowledge capture are part of the CAS knowledge
    base strategy and not yet proven out of this project.
  future_promotion_potential: medium
- id: externalized-runtime-context
  scope: project
  rationale: Storing runtime context in files is convenient here, but the pattern
    is not sufficiently decoupled from the CAS knowledge layout.
  future_promotion_potential: low
- id: pattern-architecture-intent-completeness
  scope: project
  rationale: Requiring complete AIDs is a governance rule for this project; it is
    not yet proven as a reusable architectural pattern.
  future_promotion_potential: low
- id: multi-agent-instruction-manifests
  scope: project
  rationale: "Providing AGENTS.md, CLAUDE.md, GEMINI.md is a project convention; cross\u2011\
    project reuse is plausible but not yet evidenced."
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: git-delta-prompt-facts
  rationale: Evidence is limited to model definitions and a low confidence from the
    2026-10-07 proposal; the actual transformation logic is not described.
  evidence_gaps: "No concrete implementation or usage examples beyond the model classes;\
    \ no cross\u2011project recurrence."
  recommended_next_step: "Gather more evidence from actual execution of git\u2011\
    delta\u2011to\u2011prompt\u2011fact transformations and document at least two\
    \ distinct use cases."
- id: agentic-merger-artifact-reconciliation
  rationale: The pattern is only represented by the AgenticMerger class with low confidence;
    no detailed behavior or independent verification.
  evidence_gaps: No evidence of successful reconciliation outcomes or integration
    with broader governance flows.
  recommended_next_step: Collect outcome logs and test results from agentic merges,
    then reassess scope and readiness.
- id: prompt-fact-contract
  rationale: PromptFact is a typed model, but the pattern of using it as a contract
    is not sufficiently demonstrated.
  evidence_gaps: No usage beyond model definitions; lack of explicit contract enforcement
    examples.
  recommended_next_step: Document how PromptFact is consumed by agents and show how
    it prevents malformed prompts.
- id: runtime-evaluation-trace
  rationale: The existence of traces/evaluations directories suggests persistence,
    but the pattern is not formalized.
  evidence_gaps: No model or logic for trace persistence; no evidence linking traces
    to evaluations.
  recommended_next_step: "Design a concrete trace\u2011to\u2011evaluation linkage\
    \ and gather feedback from runtime usage."
- id: pattern-evolution-lifecycle
  rationale: "Template\u2011based promotion flow is documented but not fully implemented;\
    \ evidence is low."
  evidence_gaps: Only templates and docs exist; no automated promotion decisions or
    observed transitions.
  recommended_next_step: "Implement a pilot of heuristic\u2011to\u2011pattern promotion\
    \ and collect evidence across multiple projects."
