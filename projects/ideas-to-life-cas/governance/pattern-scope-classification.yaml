candidate_patterns_requiring_review:
- id: prompt-fact-contract
  rationale: Insufficient evidence beyond a model definition; unclear whether it is
    a distinct pattern or a detail of steering fact projection.
  evidence_gaps: No demonstrated usage or behavioural description beyond a Pydantic
    model.
  recommended_next_step: Document concrete usage in a flow and assess if it adds value
    beyond existing fact projection.
- id: git-delta-prompt-facts
  rationale: Emerging, but only model names are available; no clear semantics or enforcement.
  evidence_gaps: Lack of runtime evidence or documentation of transformation logic.
  recommended_next_step: Provide a concrete implementation example and capture recurring
    usage signals.
- id: pattern-evolution-lifecycle
  rationale: Only architectural docs and templates reference it; no concrete operational
    evidence.
  evidence_gaps: No implementation of lifecycle stages or promotion rules in code.
  recommended_next_step: Formalise the lifecycle steps and gather evidence from at
    least one pattern promotion.
- id: runtime-execution-context-store
  rationale: Runtime directory exists but only file names and no explicit pattern
    logic.
  evidence_gaps: No code or workflow that demonstrates use of the store.
  recommended_next_step: Define the read/write interfaces and trace its use in a production
    run.
- id: agentic-merger-artifact-reconciliation
  rationale: AgenticMerger is present but no detailed behaviour or output contract
    is evidenced.
  evidence_gaps: No description of resolution algorithm, error handling, or validation.
  recommended_next_step: Document the merge logic and produce test evidence from a
    real conflict.
- id: distributed-tracing-observability
  rationale: Only dependencies declared, no actual instrumentation spans or trace
    usage.
  evidence_gaps: No code demonstrating OpenTelemetry span creation or trace propagation.
  recommended_next_step: Add tracing instrumentation and record trace data to validate
    the pattern.
- id: flow-runner-sequence
  rationale: FlowRunner exists but the pattern is just the sequential pipeline; no
    unique governance contribution.
  evidence_gaps: No specifics on how sequence is defined or validated.
  recommended_next_step: Determine if it is just a naming variant of sequential-pipeline-flow-runner.
- id: architectural-intent-tracking
  rationale: Only models for deltas and capabilities; no clear tracking mechanism.
  evidence_gaps: No evidence of intent capture or impact analysis.
  recommended_next_step: Define the intent model and demonstrate how it feeds decision-making.
- id: governance-inventory-health
  rationale: Metrics models exist, but no calculation or reporting implementation
    except health model.
  evidence_gaps: Inventory health is not clearly distinct from health-model aggregation.
  recommended_next_step: Clarify the relationship to telemetry-grounded-health-scoring
    and provide use cases.
- id: pattern-governance-lifecycle
  rationale: Governance lifecycle is referenced in docs but not operationalised consistently.
  evidence_gaps: No unified implementation across templates, workflows, and decision
    records.
  recommended_next_step: Implement end-to-end lifecycle enforcement and gather evidence
    from multiple promotions.
