candidate_patterns_requiring_review:
- id: git-delta-prompt-facts
  rationale: Evidence is low and the pattern is only an emerging model layer with
    no demonstrated implementation.
  evidence_gaps: No concrete implementation or usage beyond model definitions; no
    cross-project evidence.
  recommended_next_step: Gather implementation evidence from steering projection flows
    and multiple projects before classifying.
- id: pattern-evolution-lifecycle
  rationale: The lifecycle is documented in templates but no operational data shows
    successful promotions.
  evidence_gaps: No metrics on pattern promotion quality, recurrence, or governance
    outcomes.
  recommended_next_step: Collect evidence from promotion decisions across projects
    and assess stability.
- id: runtime-execution-context-store
  rationale: Only runtime directories and YAML/JSON exist; no clear pattern behavior
    is evidenced.
  evidence_gaps: No code path or interface shows how execution context is stored and
    consumed.
  recommended_next_step: Document the runtime context lifecycle and implement explicit
    read/write contracts.
- id: agentic-merger-artifact-reconciliation
  rationale: Only a class name is present; no concrete implementation or usage is
    shown.
  evidence_gaps: No implementation details, sample outputs, or tests.
  recommended_next_step: Provide actual merge logic, test coverage, and cross-project
    use cases.
- id: distributed-tracing-observability
  rationale: Only dependencies are declared; no integration or usage evidence.
  evidence_gaps: No code spans, exporters, or trace data flow.
  recommended_next_step: Instrument a real flow and persist traces to demonstrate
    the pattern.
- id: prompt-fact-extraction
  rationale: PromptFact is defined but no extraction logic is evidenced.
  evidence_gaps: No implementation of how facts are extracted from prompts.
  recommended_next_step: Show actual extraction pipeline and validation.
- id: human-in-the-loop-governance
  rationale: Mentioned in docs but no explicit workflow or enforcement point is evidenced.
  evidence_gaps: No approval steps, roles, or state transitions defined.
  recommended_next_step: Define human approval gates and record outcomes.
- id: pattern-scope-classification-framework
  rationale: A reference architecture file is the only evidence; no operational usage.
  evidence_gaps: No examples of scope assignments or governance decisions using this
    framework.
  recommended_next_step: Apply the framework to multiple patterns and compare outcomes.
- id: capability-lineage-tracking
  rationale: Model definitions exist but no lineage computation or update logic is
    shown.
  evidence_gaps: No implementation for building or traversing lineage.
  recommended_next_step: Implement lineage creation and use it in steering or impact
    analysis.
- id: governance-inventory-health
  rationale: Models are defined but no calculation or dashboard integration is demonstrated.
  evidence_gaps: No concrete health calculation pipeline.
  recommended_next_step: Connect GovernanceInventory to health scoring and display
    results.
- id: scheduled-agentic-workflows
  rationale: Only workflow file names are available; no evidence of schedule reliability
    or outcomes.
  evidence_gaps: No run logs, success rates, or impact data.
  recommended_next_step: Collect workflow run metrics and demonstrate value across
    projects.
- id: health-dashboard-monitoring
  rationale: Health model exists but monitoring dashboard is not evidenced.
  evidence_gaps: No UI or API exposing health status.
  recommended_next_step: Expose health status through a dashboard and document usage.
- id: steering-context-projection
  rationale: Overlaps with steering fact projection; evidence is mixed and may be
    redundant.
  evidence_gaps: No distinct implementation or use case from the canonical steering
    fact projection.
  recommended_next_step: Merge with steering-fact-projection and validate consolidated
    pattern.
- id: two-tier-compliance-guardrails
  rationale: Conceptual but not implemented distinctly from rule-grounded compliance.
  evidence_gaps: No separate mechanism for two tiers; no performance or safety data.
  recommended_next_step: Clarify tier separation and gather implementation evidence.
- id: state-machine-governance-guardrail
  rationale: Duplicate of finite-state governance engine; requires review to consolidate.
  evidence_gaps: Same implementation basis as canonical pattern.
  recommended_next_step: Merge with canonical state machine pattern.
