global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Multiple proposals and implementations (LiteLLMClient, MockLLMClient)
    across the system demonstrate a unified client abstraction with real and mock
    backends for deterministic testing and provider flexibility.
  rationale: Highly reusable pattern for any system interacting with LLM APIs; decouples
    business logic from providers and supports offline test harnesses.
  promotion_readiness: high
  promotion_rationale: Already implemented in production, evident in multiple modules,
    and foundational to agentic workflows.
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: GovernanceActionEngine and TransitionRegistry enforce legal state
    transitions, protecting artifact lifecycles across agents. Present in multiple
    governance components.
  rationale: General mechanism for any autonomous system requiring auditable, controlled
    state changes.
  promotion_readiness: high
  promotion_rationale: Well-established, critical for governance integrity, and applicable
    to any domain with lifecycle states.
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner orchestrates multi-step processes deterministically,
    passing shared context. Many proposals describe the same pattern.
  rationale: Standard enterprise integration pattern for orchestration; broadly applicable
    to any workflow-based system.
  promotion_readiness: high
  promotion_rationale: Implemented and stable, core to execution control.
- id: steering-fact-projection
  scope: global
  classification: core
  evidence_summary: Models (PromptFact, SteeringRuntimeIndex, ArchitecturalDelta)
    transform raw git deltas and capability records into structured prompt facts,
    grounding agent reasoning.
  rationale: Essential for LLM-based systems that need deterministic, context-limited
    prompting; likely reusable across AI agents.
  promotion_readiness: high
  promotion_rationale: Clear evidence of implementation, directly reduces hallucination,
    and generalizes to any AI-driven decision loop.
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: Cas-knowledge directory hierarchy serves as persistent, versioned,
    human-readable memory for agents, patterns, rules, and decisions.
  rationale: Durable, audit-friendly, and infrastructure-agnostic; applicable to any
    collaborative agent architecture.
  promotion_readiness: high
  promotion_rationale: Widely evidenced, simple to adopt, and provides critical auditability.
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: ComplianceEngine and related models evaluate architectural deltas
    against declarative rules, producing structured findings and metrics.
  rationale: Reusable governance mechanism for enforcing policies in automated environments.
  promotion_readiness: medium
  promotion_rationale: Strong evidence, but relies on project-specific rule contexts;
    still generalizable across domains.
