global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Multiple LLM client implementations (LiteLLMClient, MockLLMClient)
    across the CAS codebase; consistent interface used by all agentic components.
  rationale: Reusable across any AI/agent system that requires LLM provider abstraction
    and deterministic testing. Decouples business logic from vendor-specific APIs,
    a foundational architectural mechanism.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine enforce valid state
    transitions across multiple governance artifacts; repeated throughout governance
    modules.
  rationale: A general pattern for constraining autonomous actions through an explicit
    transition registry. Applicable to any system needing auditable, rule-based state
    management.
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: ComplianceEngine evaluates rules and produces structured findings/metrics;
    used in CI and agent pipelines.
  rationale: Core governance mechanism for validating agent outputs against declarative
    rules. Reusable across domains requiring automated compliance checking.
  promotion_readiness: high
- id: declarative-steering-projection
  scope: global
  classification: core
  evidence_summary: Steering models transform raw git deltas into typed PromptFact
    and ArchitecturalDelta objects; used in multiple CI workflows.
  rationale: Pattern for grounding LLM context in verifiable facts from repository
    changes. Applicable to any agentic system needing to avoid hallucination and context
    bloat.
  promotion_readiness: medium
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: CAS uses a versioned directory hierarchy (cas-knowledge) for decisions,
    patterns, rules, and runtime state; multiple modules read/write this structure.
  rationale: File-based knowledge repository pattern that is portable, git-friendly,
    and auditable. Reusable across projects requiring long-term shared memory without
    a database.
  promotion_readiness: high
- id: telemetry-grounded-health-scoring
  scope: global
  classification: supporting
  evidence_summary: Health model calculates status from compliance findings and traceable
    metrics; used in dashboards and CI gates.
  rationale: Reusable pattern for aggregating heterogeneous governance/operations
    metrics into a health status with explanatory reasons. Complements core governance
    patterns.
  promotion_readiness: medium
- id: skill-packaged-agent-procedures
  scope: global
  classification: supporting
  evidence_summary: Skills defined as reusable directories across .agents and .claude,
    with evaluation suites and CI enforcement.
  rationale: Pattern for packaging agent capabilities as declarative, reusable, and
    versionable skill modules. Applicable to multi-agent environments.
  promotion_readiness: medium
- id: bootstrap-governance-block-injection
  scope: global
  classification: supporting
  evidence_summary: Bootstrap merges governance blocks into agent configuration files
    (AGENTS.md, CLAUDE.md, etc.) idempotently.
  rationale: Reusable pattern for injecting operational policies into agent runtimes
    during onboarding, ensuring consistent governance across tools.
  promotion_readiness: medium
project_pattern_candidates:
- id: declarative-agent-command-registry
  scope: project
  rationale: Command manifest structure is tightly coupled to CAS workflow definitions;
    not yet proven reusable outside this project.
  future_promotion_potential: medium
- id: sequential-pipeline-flow-runner
  scope: project
  rationale: Orchestration pattern is implemented but could be considered general;
    however, evidence is limited to CAS's specific step registry.
  future_promotion_potential: low
- id: schema-enforced-domain-contracts
  scope: project
  rationale: Typed Pydantic models for governance/steering are useful but tightly
    tied to CAS domain vocabulary.
  future_promotion_potential: medium
- id: ci-driven-steering-projection
  scope: project
  rationale: Specific GitHub Actions workflow integration; not an independent reusable
    pattern.
  future_promotion_potential: low
- id: capability-lineage-anchoring
  scope: project
  rationale: Lineage tracking is embedded in CAS knowledge model; may be generalizable
    but lacks cross-project evidence.
  future_promotion_potential: medium
- id: heuristic-to-pattern-promotion-lifecycle
  scope: project
  rationale: Pattern evolution lifecycle is documented and supported by templates,
    but it's specific to architectural knowledge management.
  future_promotion_potential: medium
- id: reconciliation-agentic-merger
  scope: project
  rationale: LLM-based merge resolution is emerging and only evidenced in CAS governance;
    may be generalized later.
  future_promotion_potential: high
- id: deterministic-mock-evaluation-harness
  scope: project
  rationale: Mock LLM client is a test double pattern, but its packaging and usage
    are CAS-specific.
  future_promotion_potential: low
- id: typed-compliance-synthesis-contract
  scope: project
  rationale: Schema-constrained compliance outputs are an implementation detail of
    CAS's compliance engine.
  future_promotion_potential: low
- id: traceable-metric-telemetry-envelope
  scope: project
  rationale: Telemetry integration is useful but currently tied to CAS's governance
    model.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: pattern-proposal-only-steering-projection
  rationale: Proposal-only projection is a valid idea, but evidence is limited to
    one workflow and maturity is low.
  evidence_gaps: No cross-project recurrence; unclear if it generalizes beyond CAS
    CI.
  recommended_next_step: Gather additional evidence from other projects using CAS.
- id: telemetry-grounded-evaluations
  rationale: OpenTelemetry integration is present but implementation details are not
    fully evidenced.
  evidence_gaps: Only dependency declarations and trace directory exist; no clear
    evaluation loop evidence.
  recommended_next_step: Document actual trace usage and metrics collection in CAS
    workflows.
- id: git-delta-prompt-facts
  rationale: Steering models define RawGitDelta and PromptFact, but the extraction
    pipeline is not explicitly verified.
  evidence_gaps: No explicit code path converting git deltas to facts; only model
    definitions.
  recommended_next_step: Map the conversion logic and evaluate its determinism.
- id: pattern-evolution-lifecycle
  rationale: Documented but not fully operationalized; templates exist but no enforcement
    or evidence of actual promotions.
  evidence_gaps: No evidence of successful heuristic-to-pattern promotions.
  recommended_next_step: Track actual promotions and refine criteria.
- id: health-dashboard-projection
  rationale: Health model is implemented but the dashboard integration is not fully
    verified.
  evidence_gaps: Only health_model.py exists; no UI or API proof.
  recommended_next_step: Inspect dashboard routes and data flow.
- id: runtime-execution-context-store
  rationale: Runtime state files exist, but their role in governance is unclear.
  evidence_gaps: No explicit consumption of execution-profile.yaml or rule-context.json
    by agents.
  recommended_next_step: Identify how runtime context influences agent behavior.
