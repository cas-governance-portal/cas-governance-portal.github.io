global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: High evidence from multiple implementations (LiteLLMClient, MockLLMClient)
    across the runner and governance modules. Reusable abstraction for any LLM-based
    system.
  rationale: Encapsulates LLM interactions behind a unified client interface, enabling
    provider portability and deterministic testing. Foundational for agentic systems
    requiring LLM integration.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Implemented via TransitionRegistry and GovernanceActionEngine,
    with strong governance maturity and explicit state machine design.
  rationale: Provides a deterministic, auditable mechanism for controlling state transitions
    in autonomous systems, crucial for governance and compliance.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic/JSON Schema models across governance and steering layers
    enforce strict contracts, validated by compliance engines.
  rationale: Ensures correctness and reliability of agent outputs by enforcing typed
    contracts, applicable to any system with LLM-generated data or inter-component
    communication.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner orchestrates multi-step workflows deterministically,
    with shared context propagation, and is central to the CAS runner.
  rationale: Provides a predictable execution model for agentic and non-agentic pipelines,
    enabling reproducibility and testing. Foundational for any multi-step automation.
  promotion_readiness: high
- id: deterministic-mock-evaluation-harness
  scope: global
  classification: supporting
  evidence_summary: MockLLMClient enables deterministic testing and CI without external
    LLM calls, complementing the provider-agnostic facade.
  rationale: Supports testing and validation of agent workflows, essential for reliable
    CI/CD and offline development. Reusable across any LLM-integrated system.
  promotion_readiness: high
- id: declarative-agent-command-registry
  scope: global
  classification: supporting
  evidence_summary: TOML-based command definitions standardize agent capabilities,
    promoting reuse and configurability.
  rationale: Enables declarative definition of agent skills and workflows, fostering
    portability and consistency across projects and tools.
  promotion_readiness: medium
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry instrumentation provides traceability and performance
    monitoring, with TraceableMetric models.
  rationale: Critical for observability of agentic systems, enabling debugging, cost
    tracking, and auditability. Reusable across any distributed or agent-based architecture.
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: supporting
  evidence_summary: ComplianceEngine applies codified rules to deltas, producing structured
    findings and metrics.
  rationale: Provides a deterministic, rule-based approach to compliance verification,
    applicable to any system requiring governance and audit trails.
  promotion_readiness: medium
- id: agentic-state-reconciliation-merger
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger uses LLMs to reconcile semantic conflicts in structured
    documents, with typed ResolutionResult.
  rationale: Addresses complex merge challenges in distributed knowledge systems,
    relevant beyond the originating project.
  promotion_readiness: medium
- id: prompt-fact-projection
  scope: global
  classification: core
  evidence_summary: Steering models transform git deltas and capabilities into typed
    PromptFacts, grounding LLM prompts in verified data.
  rationale: Prevents hallucination and reduces context bloat by providing structured,
    evidence-based context to agents, a fundamental pattern for LLM-driven systems.
  promotion_readiness: high
- id: capability-lineage-anchoring
  scope: global
  classification: supporting
  evidence_summary: CapabilityLineage and related models track provenance and evolution
    of capabilities.
  rationale: Ensures traceability and impact analysis for evolving system capabilities,
    valuable for governance and system evolution tracking.
  promotion_readiness: medium
- id: file-backed-blackboard-workspace
  scope: global
  classification: supporting
  evidence_summary: Uses version-controlled filesystem for shared state and knowledge,
    providing auditability and simplicity.
  rationale: Offers a pragmatic, git-native approach to shared context and persistence,
    applicable to many collaborative or agentic systems.
  promotion_readiness: medium
- id: ci-driven-steering-projection
  scope: global
  classification: supporting
  evidence_summary: GitHub Actions workflows automate steering projection and governance
    validation, ensuring continuous synchronization.
  rationale: Demonstrates a pattern for embedding architecture governance into CI/CD,
    improving freshness and reducing manual overhead.
  promotion_readiness: high
- id: dedicated-verifier-subagent
  scope: global
  classification: supporting
  evidence_summary: Defines a separate verifier agent to independently check outputs,
    reducing self-confirmation bias.
  rationale: Improves reliability of agent-generated content, applicable to any multi-agent
    or LLM-based workflow.
  promotion_readiness: high
- id: governance-action-state-machine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine enforce legal state
    transitions for governance artifacts.
  rationale: Provides explicit and auditable control over lifecycle transitions, a
    core pattern for any governed system with stateful entities.
  promotion_readiness: high
- id: compliance-gating
  scope: global
  classification: core
  evidence_summary: ComplianceEngine evaluates outputs against rules before persistence,
    acting as a gatekeeper for quality and safety.
  rationale: Essential for ensuring autonomous agents do not introduce non-compliant
    changes; applicable across many domains.
  promotion_readiness: high
- id: evidence-first-knowledge-management
  scope: global
  classification: supporting
  evidence_summary: Templates require evidence for patterns, rules, and signals, grounding
    knowledge in verifiable references.
  rationale: Reduces hallucination and improves trust in agent-generated knowledge,
    a principle applicable to any knowledge-based AI system.
  promotion_readiness: high
- id: pattern-governance-action-framework
  scope: global
  classification: supporting
  evidence_summary: Governance action framework formalizes state transitions (approve,
    reject, defer) with clear workflows.
  rationale: Provides a structured mechanism for managing lifecycle of knowledge artifacts,
    applicable beyond the current project.
  promotion_readiness: medium
- id: pattern-continuous-governance-loop
  scope: global
  classification: supporting
  evidence_summary: Detect-Analyse-Execute loop automates governance, reducing manual
    review bottlenecks.
  rationale: Offers a model for continuous governance that can be adapted to various
    organizations and systems.
  promotion_readiness: medium
project_pattern_candidates:
- id: pattern-architecture-work-registry
  scope: project
  rationale: Specific to the CAS governance artifacts and workflow; requires deep
    project knowledge to apply elsewhere.
  future_promotion_potential: medium
- id: pattern-knowledge-provider-abstraction
  scope: project
  rationale: Although it abstracts storage, its design is tightly coupled to the CAS
    knowledge structure and workflow.
  future_promotion_potential: medium
- id: pattern-flowrunner-orchestration
  scope: project
  rationale: FlowRunner is central to CAS, but its orchestration model may not generalize
    without significant adaptation.
  future_promotion_potential: low
- id: heuristic-to-pattern-promotion-lifecycle
  scope: project
  rationale: Specific to CAS's pattern evolution process; not yet validated outside
    this context.
  future_promotion_potential: medium
- id: knowledge-as-code-blackboard
  scope: project
  rationale: The directory structure and governance model are tailored to CAS; broader
    applicability unproven.
  future_promotion_potential: medium
- id: declarative-compliance-findings-aggregation
  scope: project
  rationale: Tied to CAS's compliance engine and rule formats; may not easily extend
    to other systems.
  future_promotion_potential: medium
- id: pattern-governance-loop
  scope: project
  rationale: Emerging pattern specific to CAS's governance automation; lacks cross-project
    evidence.
  future_promotion_potential: medium
- id: bootstrap-governance-block-injection
  scope: project
  rationale: Workspace bootstrapping is tied to CAS's filesystem layout and configuration.
  future_promotion_potential: low
- id: workspace-bootstrap-merge
  scope: project
  rationale: Specific implementation for CAS workspace setup; not clearly generalizable.
  future_promotion_potential: low
- id: pattern-continuous-governance
  scope: project
  rationale: Continuous governance loop is embodied in CAS workflows; requires broader
    validation.
  future_promotion_potential: medium
- id: pattern-architecture-knowledge-graph
  scope: project
  rationale: Despite strategic importance, implementation is only embryonic within
    CAS; not yet broadly applicable.
  future_promotion_potential: high
- id: pattern-code-intelligence
  scope: project
  rationale: Strategic direction but lacks evidence beyond CAS's forensic extractors;
    needs more data.
  future_promotion_potential: high
- id: pattern-business-intent-integration
  scope: project
  rationale: High-level goal not yet implemented; project-specific requirements unclear.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: git-delta-prompt-fact-projection
  rationale: Conceptually promising but only partially implemented in steering models;
    lacks recurring evidence.
  evidence_gaps: Limited implementation details and no cross-project validation.
  recommended_next_step: Develop a reference implementation and pilot in multiple
    projects.
- id: pattern-continuous-governance-loop
  rationale: Strategic direction with some automation, but evidence of cross-project
    impact is missing.
  evidence_gaps: No evidence of adoption outside CAS; requires validation of governance
    loop benefits.
  recommended_next_step: Instrument and measure governance loop in a second project.
- id: traceable-metric-telemetry-envelope
  rationale: Telemetry is present but the envelope model is not fully implemented
    or validated.
  evidence_gaps: Only models exist; no integration with actual traces or metrics.
  recommended_next_step: Implement trace capture and map to the envelope model.
- id: telemetry-grounded-health-scoring
  rationale: Health scoring exists but lacks full telemetry grounding.
  evidence_gaps: Health model is incomplete; does not yet consume telemetry as specified.
  recommended_next_step: Integrate health scoring with live telemetry and validate
    against real usage.
- id: governance-inventory-health
  rationale: Governance metrics are defined but not yet operationalized.
  evidence_gaps: No evidence of computed inventory health or risk metrics.
  recommended_next_step: Compute historical governance health and risk from existing
    data.
- id: flow-runner-sequence
  rationale: FlowRunner is present but sequence details are unclear; requires more
    documentation.
  evidence_gaps: Sequence and step definitions are not fully documented.
  recommended_next_step: Document the flow runner's step sequence and test for reproducibility.
- id: agentic-merger-pattern
  rationale: AgenticMerger exists but its correctness and general applicability are
    not established.
  evidence_gaps: No evaluation of merge outcomes; no examples from other projects.
  recommended_next_step: Create test scenarios and evaluate merge quality across different
    document types.
- id: template-driven-artifact-evolution
  rationale: Templates exist, but the evolution process is not formalized into a governance
    flow.
  evidence_gaps: Lifecycle promotion thresholds and criteria are not defined.
  recommended_next_step: Define explicit promotion criteria and implement a governance
    workflow.
duplicate_overlapping_patterns:
- patterns:
  - provider-agnostic-llm-facade
  - provider-agnostic-llm-gateway
  - dual-tier-llm-gateway-abstraction
  - llm-provider-abstraction
  - llm-provider-adapter
  - model-agnostic-provider-indirection
  recommended_action: merge
  rationale: 'All describe the same core abstraction: a unified LLM client interface
    with production and mock implementations. Consolidate into a single canonical
    pattern.'
- patterns:
  - finite-state-governance-engine
  - finite-state-governance-action-engine
  - state-machine-governance-guardrail
  - state-machine-constrained-action-engine
  - registry-guarded-governance-state-machine
  recommended_action: merge
  rationale: All represent the same governance state machine pattern using a transition
    registry. Merge into one definitive pattern.
- patterns:
  - sequential-pipeline-flow-runner
  - sequential-pipeline-context-propagation
  - centralized-flow-runner-orchestration
  - flow-runner-pipeline
  - flow-runner-orchestration
  recommended_action: merge
  rationale: All describe FlowRunner as a sequential orchestrator with shared context.
    Consolidate into a single 'Sequential Pipeline Flow Runner' pattern.
- patterns:
  - agentic-state-reconciliation-merger
  - agentic-merge-resolution
  - agentic-merge-resolution-loop
  - agentic-reconciliation-merger
  - agentic-discrepancy-merger
  - agentic-diff-merger
  - agentic-conflict-resolution-merger
  recommended_action: merge
  rationale: All describe using an LLM to resolve semantic conflicts in governance
    artifacts. Merge into one 'Agentic Reconciliation Merger' pattern.
- patterns:
  - schema-enforced-domain-contracts
  - typed-contracts-for-agent-context
  - typed-governance-contracts
  - pydantic-governance-domain-modeling
  - steering-capability-delta-modeling
  recommended_action: merge
  rationale: All focus on using typed models for governance and steering data. Consolidate
    under 'Typed Contracts for Agent Context'.
- patterns:
  - telemetry-observable-agent-steps
  - telemetry-grounded-traceability
  - telemetry-grounded-runtime-tracing
  - traceable-metric-telemetry-envelope
  - distributed-tracing-observability
  recommended_action: merge
  rationale: All involve OpenTelemetry instrumentation and traceable metrics. Merge
    into a single 'Telemetry-Observable Agent Steps' pattern.
- patterns:
  - deterministic-mock-evaluation-harness
  - dual-mode-llm-provider-abstraction
  - dual-backend-llm-abstraction
  - model-agnostic-llm-facade-with-mock-fallback
  recommended_action: merge
  rationale: These patterns focus specifically on the deterministic mock client aspect
    of the LLM abstraction. Consolidate into the main LLM abstraction pattern.
- patterns:
  - declarative-agent-command-registry
  - declarative-steering-projection
  - steering-fact-projection
  - steering-context-projection
  - grounded-prompt-fact-projection
  recommended_action: merge
  rationale: All involve projecting structured facts into agent prompts. Unify under
    'Prompt Fact Projection' as a core pattern.
- patterns:
  - file-backed-blackboard-workspace
  - git-backed-knowledge-blackboard
  - file-backed-agentic-knowledge-repository
  - file-backed-knowledge-repository
  recommended_action: merge
  rationale: All describe using a version-controlled file system as the knowledge
    base. Combine into one 'File-Backed Blackboard Workspace' pattern.
