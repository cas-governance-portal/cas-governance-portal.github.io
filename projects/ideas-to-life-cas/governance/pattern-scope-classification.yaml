candidate_patterns_requiring_review:
- id: reconciliation-agentic-merger
  rationale: Agentic merge/reconciliation is emerging with high evidence but not yet
    stable; scope unclear.
  evidence_gaps: Only one implementation, no observed recurrence across projects.
  recommended_next_step: Gather evidence from additional projects or independent implementations
    before deciding global scope.
- id: agentic-state-reconciliation-merger
  rationale: Agentic merger pattern appears in many proposals but lacks clear independent
    validation.
  evidence_gaps: Overlap with agentic merge patterns; no distinct cross-project evidence.
  recommended_next_step: Consolidate agentic merge proposals and evaluate after recurrence.
- id: agentic-knowledge-reconciler
  rationale: Semantic reconciliation of knowledge artifacts is promising but still
    emerging.
  evidence_gaps: Only one implementation; no demonstrated use outside CAS.
  recommended_next_step: Monitor for repeat occurrences in other projects; consider
    pilot usage.
- id: agentic-reconciliation-merger
  rationale: Same as above; duplicate of agentic merge pattern.
  evidence_gaps: No unique evidence.
  recommended_next_step: Merge with other agentic merge proposals and evaluate.
- id: agentic-merge-resolution
  rationale: Agentic merge resolution is emerging; insufficient evidence of cross-project
    reuse.
  evidence_gaps: Implementation limited to governance block merging.
  recommended_next_step: Seek additional use cases in non-CAS environments.
- id: agentic-merge-resolution-loop
  rationale: Duplicate of agentic merge resolution; lacks distinct evidence.
  evidence_gaps: Overlaps with other merge patterns.
  recommended_next_step: Consolidate and review as single pattern.
- id: agentic-semantic-merge-resolution
  rationale: Semantic merge reasoning is promising but only one implementation.
  evidence_gaps: No recurrence across projects.
  recommended_next_step: Require additional evidence before promotion.
- id: agentic-diff-merger
  rationale: LLM-based diff merging is emerging but evidence is project-specific.
  evidence_gaps: Only seen in agentic_merger.py; no cross-project validation.
  recommended_next_step: Collect evidence from multiple projects.
- id: agentic-merger-pattern
  rationale: Generic agentic merger concept overlaps with multiple proposals.
  evidence_gaps: Conceptual overlap, no unique implementation.
  recommended_next_step: Merge with other agentic merger patterns.
- id: agentic-merger
  rationale: Agentic merger is a common pattern but not yet proven as global.
  evidence_gaps: Evidence limited to one codebase.
  recommended_next_step: Require recurrence or explicit adoption elsewhere.
- id: agentic-conflict-resolution-merger
  rationale: Conflict resolution via LLM is promising but emerging.
  evidence_gaps: Only one implementation, no external validation.
  recommended_next_step: Look for additional implementations in other repositories.
- id: agentic-context-merge
  rationale: Context merge is an implementation detail of agentic merger.
  evidence_gaps: Overlaps with agentic merger.
  recommended_next_step: Fold into broader merge pattern.
- id: agentic-merge
  rationale: Agentic merge is a recurring concept but not sufficiently stable.
  evidence_gaps: Insufficient evidence of cross-project reuse.
  recommended_next_step: Monitor recurrence.
- id: agentic-merger-artifact-reconciliation
  rationale: Artifact reconciliation is too project-specific.
  evidence_gaps: No evidence outside CAS.
  recommended_next_step: Consider as candidate until more evidence.
- id: agentic-governance-merger
  rationale: Agentic governance merger is emerging but scope uncertain.
  evidence_gaps: Limited to governance block merging.
  recommended_next_step: Seek broader applicability.
- id: agentic-configuration-merger
  rationale: Configuration merging via agentic reasoning is emerging.
  evidence_gaps: No cross-project evidence.
  recommended_next_step: Evaluate after additional usage.
- id: agentic-config-merger
  rationale: Config merger is a specific application of agentic merge.
