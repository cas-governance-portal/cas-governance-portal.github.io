candidate_patterns_requiring_review:
- id: git-delta-prompt-facts
  rationale: Model only, no implementation evidence; scope unclear.
  evidence_gaps: No direct code or workflow evidence linking to a concrete implementation.
  recommended_next_step: Observe usage in actual runs and gather cross-project evidence.
- id: pattern-evolution-lifecycle
  rationale: Only documentation and templates; no implemented lifecycle.
  evidence_gaps: Lack of runtime evidence or recurrence.
  recommended_next_step: Monitor usage and collect promotion decisions to validate
    the pattern.
- id: runtime-execution-context-store
  rationale: Low evidence; directories exist but no clear pattern.
  evidence_gaps: No implemented mechanism for storing/retrieving context.
  recommended_next_step: Verify if runtime context is actually persisted and consumed.
- id: agentic-merger-artifact-reconciliation
  rationale: Only class name, no implementation evidence.
  evidence_gaps: No code symbols or usage.
  recommended_next_step: Investigate actual merger implementation and usage.
- id: prompt-fact-contract
  rationale: Only model definitions; no evidence of usage.
  evidence_gaps: No implementation or integration proof.
  recommended_next_step: Track if PromptFact is used in prompt construction.
- id: capability-lineage-tracking
  rationale: Model exists but no observed workflow.
  evidence_gaps: No evidence of lineage being populated or consumed.
  recommended_next_step: Check if capability lineage is actually used in steering
    decisions.
- id: git-delta-as-evidence
  rationale: Models exist but no implementation.
  evidence_gaps: No code showing transformation or use.
  recommended_next_step: Confirm if git deltas are parsed into architectural evidence.
- id: steering-evidence-index
  rationale: Models only, no runtime evidence.
  evidence_gaps: No implementation or usage.
  recommended_next_step: Look for indexer and projector implementations.
- id: traceable-metric-telemetry-envelope
  rationale: Model definitions and dependencies, but no full implementation.
  evidence_gaps: No evidence of telemetry envelope being populated.
  recommended_next_step: Inspect actual metric recording and tracing.
- id: telemetry-grounded-traceability
  rationale: Evidence strength medium; only models and dependencies.
  evidence_gaps: No clear implementation in code.
  recommended_next_step: Check if telemetry is actually emitted and stored.
- id: telemetry-grounded-runtime-tracing
  rationale: Only dependency and model; no usage evidence.
  evidence_gaps: No implementation in runner steps.
  recommended_next_step: Verify OpenTelemetry spans are actually created.
- id: telemetry-grounded-evaluations
  rationale: Only dependencies and directory.
  evidence_gaps: No code to persist traces.
  recommended_next_step: Investigate if traces are written to runtime.
- id: traceable-health-metrics
  rationale: Models only; no evidence of computation.
  evidence_gaps: No code using TraceableMetric.
  recommended_next_step: Check if health status uses trace data.
- id: externalized-runtime-context
  rationale: Files exist but no pattern implementation.
  evidence_gaps: No code to read/write these files.
  recommended_next_step: Confirm if runtime context is consumed by agents.
