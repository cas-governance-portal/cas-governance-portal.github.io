global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Multiple proposals and code evidence (LiteLLMClient, MockLLMClient)
    show a consistent abstraction over LLM providers with a deterministic mock fallback.
  rationale: Provider-agnostic LLM access is a foundational architectural mechanism
    needed across any project using LLM-based agents. It decouples domain logic from
    vendor specifics and enables deterministic testing.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner and related proposals demonstrate a deterministic sequential
    pipeline with shared context, used across governance, steering, and delivery workflows.
  rationale: A central, deterministic execution model for multi-step agentic workflows
    is reusable across domains and projects. It provides predictable ordering, auditability,
    and shared state propagation.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine are repeatedly evidenced
    across governance proposals, enforcing valid state transitions for automated actions.
  rationale: Restricting autonomous actions through an explicit, declarative state
    machine is a fundamental governance guardrail applicable to any agent-driven system.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic/JSON Schema models are used consistently for governance,
    steering, and skill evaluation data, as reflected in typed-contracts proposals
    and code evidence.
  rationale: Typed, validated contracts for agent inputs/outputs are essential for
    reliable multi-component systems. This is a cross-cutting architectural foundation.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: The cas-knowledge directory and related proposals show a file-based,
    git-versioned shared blackboard for decisions, rules, patterns, and runtime state.
  rationale: A persistent, auditable, human-inspectable knowledge store is a reusable
    pattern for agent memory and governance across projects, without external database
    dependencies.
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: supporting
  evidence_summary: ComplianceEngine and related proposals consistently show deterministic
    evaluation of agent outputs against codified rules, producing structured findings.
  rationale: Rule-grounded compliance evaluation is a broadly applicable governance
    pattern for preventing non-compliant artifacts, with strong evidence of reuse.
  promotion_readiness: high
- id: steering-fact-projection
  scope: global
  classification: supporting
  evidence_summary: Multiple proposals and steering models transform raw git deltas
    and repository metadata into typed prompt facts for grounded LLM context.
  rationale: Projecting evidence into structured facts to guide agent reasoning is
    a reusable intelligence pattern, reducing hallucination and context bloat.
  promotion_readiness: high
- id: reconciliation-agentic-merger
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger and related proposals use LLM-assisted reconciliation
    to merge conflicting governance/config artifacts, with structured resolution outputs.
  rationale: Agentic semantic merging is a reusable pattern for handling conflicts
    that standard text-based merges cannot resolve, applicable across projects.
  promotion_readiness: medium
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry integration and traceable metric models are evidenced
    across telemetry and health-scoring proposals.
  rationale: Observability through distributed tracing and traceable metrics is a
    broadly applicable operational pattern for agentic systems.
  promotion_readiness: high
- id: template-driven-knowledge-capture
  scope: global
  classification: supporting
  evidence_summary: Standardized markdown/YAML templates for ADRs, patterns, rules,
    and signals are evidenced across knowledge management proposals.
  rationale: Template-enforced artifact structure is a reusable governance pattern
    ensuring consistency, machine-readability, and reviewability.
  promotion_readiness: high
- id: heuristic-to-pattern-promotion-lifecycle
  scope: global
  classification: supporting
  evidence_summary: Templates and workflow documentation specify an evidence-gated
    lifecycle for promoting heuristics to patterns, with promotion decisions.
  rationale: A governed pattern evolution lifecycle is a reusable governance mechanism
    to balance learning velocity and trust, applicable across AI-assisted architecture
    initiatives.
  promotion_readiness: medium
- id: ci-driven-steering-projection
  scope: global
  classification: supporting
  evidence_summary: GitHub Actions workflows automate steering projection, validation,
    and continuous architecture checks, as evidenced by multiple workflow proposals.
  rationale: Embedding governance and steering tasks in CI/CD is a broadly applicable
    pattern for continuous architecture enforcement.
  promotion_readiness: high
- id: skill-packaged-agent-procedures
  scope: global
  classification: supporting
  evidence_summary: Declarative skill directories and evaluation suites are evidenced
    for multiple agent capabilities, shared across agent frameworks.
  rationale: Encapsulating agent capabilities as portable, versioned skills with evaluation
    suites is a reusable pattern for agent-based development.
  promotion_readiness: medium
project_pattern_candidates:
- id: declarative-agent-command-registry
  scope: project
  rationale: Declarative TOML command manifests are project-specific configuration
    for CAS lifecycle operations, not yet broadly reusable.
  future_promotion_potential: medium
- id: capability-lineage-anchoring
  scope: project
  rationale: Capability lineage tracking is tightly coupled to the CAS knowledge model
    and project-specific capability definitions.
  future_promotion_potential: medium
- id: pattern-proposal-only-steering-projection
  scope: project
  rationale: Proposal-only projection mode is a CAS-specific safety mechanism for
    steering workflows without mutation.
  future_promotion_potential: low
- id: pattern-continuous-governance-loop
  scope: project
  rationale: Continuous governance loop is a strategic direction for this project,
    but implementation and evidence are still emerging.
  future_promotion_potential: high
- id: skill-evaluation-suites
  scope: project
  rationale: Skill evaluation suites are tied to the specific CAS skill framework
    and project workflow, though the general idea is promising.
  future_promotion_potential: medium
- id: human-in-the-loop-governance
  scope: project
  rationale: Human approval flow is important but currently project-specific and insufficiently
    evidenced as a standalone pattern.
  future_promotion_potential: high
- id: multi-agent-instruction-manifests
  scope: project
  rationale: Parallel instruction files for Claude, Gemini, and generic agents are
    pragmatic for this project's multi-tool support.
  future_promotion_potential: low
- id: multi-runtime-config-sync
  scope: project
  rationale: Synchronising agent skill/config directories across runtimes is a project-specific
    operational convenience.
  future_promotion_potential: low
- id: verifier-subagent-delegation
  scope: project
  rationale: Verifier subagent is defined for this repository's agent ecosystem, but
    the concept of independent verification has broader potential.
  future_promotion_potential: medium
- id: rule-context-externalization
  scope: project
  rationale: Externalising rule context in JSON files is a project-specific implementation
    choice for runtime configuration.
  future_promotion_potential: low
- id: architecture-knowledge-graph
  scope: project
  rationale: Knowledge graph is a future strategic direction, but implementation and
    evidence are not yet sufficient for global classification.
  future_promotion_potential: high
- id: business-intent-integration
  scope: project
  rationale: Business intent traceability is strategically important but still a future
    direction without implemented evidence.
  future_promotion_potential: high
- id: code-intelligence-architecture-alignment
  scope: project
  rationale: Code intelligence and drift detection are future directions, not yet
    proven in this project.
  future_promotion_potential: high
- id: operational-intelligence-loop
  scope: project
  rationale: Operational intelligence loop is a strategic vision, but lacks sufficient
    implementation evidence.
  future_promotion_potential: high
- id: external-ecosystem-ingestion
  scope: project
  rationale: External ecosystem integration is a potential future direction but not
    yet implemented.
  future_promotion_potential: medium
