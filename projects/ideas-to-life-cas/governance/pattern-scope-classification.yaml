global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Implemented across src/cas_runner/llm/litellm_client.py (LiteLLMClient)
    and src/cas_runner/llm/mock_client.py (MockLLMClient) with runtime dependency
    litellm>=1.83.14.
  rationale: Foundational abstraction decoupling core orchestration and agent reasoning
    from specific model providers while enabling deterministic offline testability.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/governance_action_engine.py
    (TransitionRegistry, GovernanceActionEngine) and governance_action_service.py.
  rationale: Essential guardrail bounding autonomous agent actions to an explicit
    state transition registry to prevent illegal state mutations.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/runner.py (FlowRunner) and src/cas_runner/cli.py
    (main) driving linear multi-step execution flows.
  rationale: Core execution architecture ensuring deterministic ordering and predictable
    context propagation across agent and governance stages.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Extensively implemented in src/cas_runner/governance/models.py
    and src/cas_runner/skills/models.py using Pydantic v2 schemas.
  rationale: Eliminates unvalidated and hallucinated LLM payloads across subsystem
    boundaries by enforcing strict data validation schemas.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: Established directory hierarchy in cas-knowledge/ with global/,
    projects/, runtime/, and templates/ namespaces referenced across runtime steps.
  rationale: Foundational persistence mechanism providing human-inspectable, git-versioned
    long-term blackboard memory for agents without external database dependencies.
  promotion_readiness: high
- id: compliance-gating
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/compliance_engine.py
    (ComplianceEngine) producing typed ComplianceFinding and ComplianceMetrics models.
  rationale: Foundational safety gate evaluating code and architectural deltas against
    codified rules before changes are committed or promoted.
  promotion_readiness: high
- id: declarative-agent-skill-packaging
  scope: global
  classification: core
  evidence_summary: Implemented across .agents/skills/ and .claude/skills/ directory
    bundles containing standalone procedures for feature modifications, diagrams,
    and audits.
  rationale: Decomposes monolithic agent prompts into portable, reusable, and versioned
    domain capability packages callable across heterogeneous AI harnesses.
  promotion_readiness: high
- id: deterministic-mock-evaluation-harness
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/llm/mock_client.py (MockLLMClient)
    providing canned, deterministic responses across CI and unit test suites.
  rationale: Provides zero-cost, network-independent test doubles to validate multi-step
    agent flows deterministically in automated pipelines.
  promotion_readiness: high
- id: declarative-skill-eval-harness
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/skills/models.py and executed via
    .github/workflows/cas-skill-evals.yml with runtime evaluation reports.
  rationale: Enables automated regression testing of packaged agent skills against
    declarative assertions and test cases.
  promotion_readiness: high
- id: independent-verifier-subagent
  scope: global
  classification: supporting
  evidence_summary: Configured in .agents/subagents/verifier.md and .claude/agents/verifier.md
    acting as a distinct verification role.
  rationale: Separates generation from validation by introducing an adversarial check
    step to prevent agent self-confirmation bias.
  promotion_readiness: medium
- id: multi-adapter-agent-telemetry
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/dashboard/agent_telemetry.py supporting
    Claude Code, Antigravity, and generic coding agents via AgentTelemetrySpan.
  rationale: Normalizes disparate execution traces from diverse external coding assistants
    into standardized spans for cross-agent cost and duration analysis.
  promotion_readiness: medium
- id: deterministic-health-scoring
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/dashboard/health_model.py (calculate_health,
    get_health_reasons, HealthStatus).
  rationale: Pure functional health evaluation mapping quantitative governance metrics
    and findings into discrete operational statuses and human-readable diagnostic
    reasons.
  promotion_readiness: high
- id: workspace-governance-injection-bootstrap
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/bootstrap.py (merge_cas_governance_block,
    init_workspace, _create_symlink_or_copy).
  rationale: Idempotently provisions workspace directories and injects mandatory governance
    steering blocks into developer assistant entrypoints without clobbering user configs.
  promotion_readiness: high
- id: grounded-prompt-fact-projection
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/steering/models.py (PromptFact,
    SteeringRuntimeIndex, ArchitecturalDelta) and .github/workflows/cas-build-steering-projection.yml.
  rationale: Grounds LLM prompts in verified, typed VCS deltas and capability records
    rather than unconstrained raw diff dumps, mitigating hallucination and token bloat.
  promotion_readiness: high
project_pattern_candidates:
- id: pattern-authoritative-architecture-work-registry
  scope: project
  rationale: Specific to CAS workflow orchestration where individual Architecture
    Work files act as backlogs while evolution maps and intent docs are derived views.
  future_promotion_potential: high
- id: pattern-business-intent-traceability-pipeline
  scope: project
  rationale: Binds specific CAS ADR schemas and alignment reports to business drivers;
    remains emerging within this repository's current lifecycle stage.
  future_promotion_potential: medium
- id: pattern-closed-loop-continuous-governance
  scope: project
  rationale: Tightly coupled to the continuous architecture runner loop and GitHub
    Actions CI triggers of ideas-to-life-cas.
  future_promotion_potential: high
- id: pattern-multi-project-architecture-knowledge-graph
  scope: project
  rationale: Strategic direction for multi-project knowledge traversal within the
    ideas-to-life portfolio; requires further multi-repo deployment evidence.
  future_promotion_potential: high
- id: deterministic-workflow-validation
  scope: project
  rationale: Validation script in specs/090-simplify-cicd-workflows/ tailored specifically
    to GitHub Actions workflow constraints in this repository.
  future_promotion_potential: low
- id: docs-as-code-portal-projection
  scope: project
  rationale: Project-specific documentation site rendering and CNAME publishing pipeline
    utilizing MkDocs Material and local preprocessors.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: reconciliation-agentic-merger
  rationale: Applies non-deterministic LLM synthesis to resolve semantic merge conflicts
    in structured markdown and YAML files.
  evidence_gaps: Lacks objective error-rate data, conflict resolution validation suites,
    and rollback safety benchmarks across concurrent agent edits.
  recommended_next_step: Implement evaluation test suites comparing AgenticMerger
    outputs against standard 3-way git merges to measure semantic regression rates.
- id: heuristic-to-pattern-promotion-lifecycle
  rationale: Defines an evolutionary path promoting informal agent heuristics to verified
    architectural patterns using standardized templates.
  evidence_gaps: Insufficient historical instances of completed promotions transitioning
    through heuristic -> pattern -> stable within production projects.
  recommended_next_step: Observe pattern promotion events across at least two external
    projects before standardizing the promotion template as a global model.
- id: capability-lineage-anchoring
  rationale: Tracks fine-grained provenance and functional evolution of architecture
    capabilities via typed lineage models.
  evidence_gaps: Models exist in steering/models.py, but longitudinal validation of
    lineage traversal during complex multi-branch refactoring is limited.
  recommended_next_step: Validate whether capability lineage graphs remain consistent
    and performant after successive automated refactoring cycles.
