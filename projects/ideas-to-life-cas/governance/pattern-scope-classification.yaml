global_pattern_candidates:
- id: pattern-governance-gated-ci-pipeline
  scope: global
  classification: core
  evidence_summary: Discovered across active GitHub Actions workflows (.github/workflows/cas-build-validation.yml)
    and supported by explicit Architecture Work backlog items.
  rationale: Enforces architectural invariants deterministically via automated pipeline
    gates before synthesis or promotion, applicable across all continuous delivery
    architectures.
  promotion_readiness: high
- id: pattern-architecture-work-registry
  scope: global
  classification: core
  evidence_summary: Implemented in continuous architecture workflows with explicit
    separation between authoritative planning artifacts and derived projections.
  rationale: Prevents state loss during automated regeneration cycles by designating
    persistent backlog artifacts as authoritative source-of-truth.
  promotion_readiness: high
- id: governed-action-state-machine
  scope: global
  classification: supporting
  evidence_summary: Implemented in TransitionRegistry and GovernanceActionEngine within
    cas_runner.governance to validate mutations before execution.
  rationale: Protects against LLM nondeterminism and unauthorized domain state transitions
    by enforcing deterministic state machine validation.
  promotion_readiness: high
- id: typed-governance-data-contracts
  scope: global
  classification: supporting
  evidence_summary: Implemented extensively in cas_runner.governance.models via Pydantic
    domain models for metrics, findings, and actions.
  rationale: Guarantees runtime validation and structural consistency across autonomous
    agent inputs, pipelines, and reporting boundaries.
  promotion_readiness: high
- id: dual-client-llm-provider-abstraction
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/llm via LiteLLMClient and MockLLMClient
    test double implementations.
  rationale: Decouples autonomous agent execution from specific commercial LLM vendors
    while guaranteeing deterministic, zero-cost CI offline validation.
  promotion_readiness: high
project_pattern_candidates:
- id: declarative-agent-command-manifests
  scope: project
  rationale: Specific to the .agents/commands/speckit TOML command specification format
    within ideas-to-life-cas.
  future_promotion_potential: high
- id: prompt-fact-steering-projection
  scope: project
  rationale: Closely bound to the CAS-specific steering projection mechanism converting
    raw git deltas into structured facts.
  future_promotion_potential: high
- id: file-backed-knowledge-repository
  scope: project
  rationale: Coupled to the immediate cas-knowledge directory layout and bootstrap
    scaffolding implementation.
  future_promotion_potential: medium
- id: capability-lineage-provenance
  scope: project
  rationale: Currently defined as an internal metadata model for cas_runner steering
    calculations rather than a generic platform standard.
  future_promotion_potential: medium
- id: template-driven-heuristic-evolution
  scope: project
  rationale: Constrained to markdown template structures in cas-knowledge/templates
    without multi-project standardization.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: dummy_string
  rationale: Placeholder proposal containing placeholder strings and lacking technical
    evidence.
  evidence_gaps: No architectural artifacts, code paths, or valid design rationale
    provided.
  recommended_next_step: Reject and purge placeholder artifact from the proposals
    repository.
- id: pattern-architecture-knowledge-graph
  rationale: Identified as strategic direction and future work across multi-project
    intelligence, but not yet implemented.
  evidence_gaps: Lacks production component implementation, runtime execution trace,
    and operational validation.
  recommended_next_step: Defer promotion review until graph ingestion and query interfaces
    are implemented and evaluated.
- id: pattern-business-intent-traceability
  rationale: Conceptual alignment between strategic objectives and code changes without
    standardized machine-readable schema in runner.
  evidence_gaps: No concrete parser or enforcement engine present in active runner
    components.
  recommended_next_step: Gather empirical evidence through pilot Architecture Work
    items before re-evaluating scope.
- id: pattern-automated-detect-analyse-execute-loop
  rationale: Autonomous closed-loop remediation carries high regression risk and lacks
    established rollback safeguards.
  evidence_gaps: Requires multi-cycle telemetry demonstrating automated remediation
    safety on non-trivial drift.
  recommended_next_step: Evaluate closed-loop run outcomes under controlled pull request
    environments.
duplicate_overlapping_patterns:
- patterns:
  - governed-action-state-machine
  - struct-002
  - state-transition-registry-guardrail
  - transition-registry-state-machine
  recommended_action: Consolidate into 'governed-action-state-machine' and deprecate
    redundant variations.
  rationale: All four proposals describe the TransitionRegistry and GovernanceActionEngine
    gating state mutations.
- patterns:
  - dual-client-llm-provider-abstraction
  - struct-004
  - provider-agnostic-llm-adapter
  - pluggable-client-adapter-pattern
  recommended_action: Consolidate under 'dual-client-llm-provider-abstraction'.
  rationale: Identical architecture pattern pairing LiteLLMClient with MockLLMClient
    for offline isolation.
- patterns:
  - typed-governance-data-contracts
  - struct-001
  - pydantic-domain-entity-modeling
  recommended_action: Merge into 'typed-governance-data-contracts'.
  rationale: All proposals describe Pydantic schema validation for governance domain
    entities and metrics in src/cas_runner/governance/models.py.
- patterns:
  - sequential-flow-runner-orchestration
  - sequential-pipeline-runner
  recommended_action: Retain 'sequential-flow-runner-orchestration' as project pattern
    and retire 'sequential-pipeline-runner'.
  rationale: Both describe the linear FlowRunner step execution pipeline in src/cas_runner/runner.py.
- patterns:
  - continuous-compliance-evaluator
  - compliance-first-guardrail-engine
  recommended_action: Merge into 'continuous-compliance-evaluator'.
  rationale: Both cite ComplianceEngine rule verification against repository inventory.
- patterns:
  - composite-health-scoring-heuristic
  - struct-005
  - diagnostic-health-reflection
  - health-status-metric-aggregator
  recommended_action: Consolidate under 'composite-health-scoring-heuristic'.
  rationale: All four represent the calculate_health functional evaluation in src/cas_runner/dashboard/health_model.py.
- patterns:
  - agentic-merge-resolution
  - agentic-knowledge-merger
  recommended_action: Merge into 'agentic-merge-resolution'.
  rationale: Both target AgenticMerger in src/cas_runner/governance/agentic_merger.py.
- patterns:
  - struct-003
  - layered-service-engine-separation
  recommended_action: Consolidate under 'layered-service-engine-separation'.
  rationale: Both describe separating GovernanceActionService orchestration from engine
    computation.
promotion_recommendations:
  immediate_candidates:
