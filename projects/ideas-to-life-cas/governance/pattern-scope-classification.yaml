global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: 'Repeatedly proposed across multiple signals and implementations:
    LiteLLM client and mock client provide a unified interface for LLM invocation.'
  rationale: Fundamental for any system integrating LLMs, decouples business logic
    from provider specifics, enables testing and provider portability.
  promotion_readiness: high
- id: agentic-merge-resolution
  scope: global
  classification: supporting
  evidence_summary: Implemented as AgenticMerger and used in bootstrap and governance
    synchronization; multiple proposals describe semantic merging of architectural
    artifacts.
  rationale: Reusable for reconciling structured knowledge or configuration conflicts
    across systems, not limited to the originating project.
  promotion_readiness: medium
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner appears in many proposals and is the central orchestration
    component; deterministic sequential execution with shared context is a common
    architectural need.
  rationale: Core orchestration pattern for multi-step agent workflows, applicable
    across domains and projects.
  promotion_readiness: high
- id: declarative-action-state-transition-registry
  scope: global
  classification: core
  evidence_summary: Many proposals reference TransitionRegistry and GovernanceActionEngine
    to enforce valid state transitions, with direct implementation evidence.
  rationale: Governance safety and auditability are universal requirements; explicit
    transition registries are a well-established pattern for controlled state changes.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: Multiple proposals describe a version-controlled file hierarchy
    (cas-knowledge) as shared agent memory and governance repository; heavily used
    in the current system.
  rationale: Persistent, auditable, human-readable knowledge storage is a foundational
    pattern for agent-based governance systems.
  promotion_readiness: high
project_pattern_candidates:
- id: deterministic-mock-evaluation-harness
  scope: project
  rationale: Mock client implementation is specific to this system's CI needs; while
    useful, it is a supporting detail rather than a standalone global pattern.
  future_promotion_potential: medium
- id: declarative-agent-command-registry
  scope: project
  rationale: TOML command registry is tailored to this project's agent skill definitions;
    not yet shown to be reusable across other repositories.
  future_promotion_potential: medium
- id: ci-driven-steering-projection
  scope: project
  rationale: CI workflow integration for steering projections is specific to the GitHub
    Actions setup of this project.
  future_promotion_potential: medium
- id: git-delta-prompt-fact-projection
  scope: project
  rationale: Transforming git deltas into prompt facts is a valuable idea but currently
    evidenced only in this project's steering models.
  future_promotion_potential: high
- id: capability-lineage-anchoring
  scope: project
  rationale: Capability lineage models are specific to this project's capability tracking;
    broader applicability not yet demonstrated.
  future_promotion_potential: medium
- id: governance-action-service-facade
  scope: project
  rationale: Service layer for governance actions is a common architectural pattern
    but here deeply coupled to the project's governance domain.
  future_promotion_potential: medium
- id: workspace-governance-injection-bootstrap
  scope: project
  rationale: Injection of governance blocks into agent configs is tailored to this
    project's multi-agent setup.
  future_promotion_potential: medium
- id: health-dashboard-aggregation
  scope: project
  rationale: Health model aggregation is useful but currently designed for this project's
    governance metrics; not generalized.
  future_promotion_potential: medium
- id: skill-evaluation-suite
  scope: project
  rationale: Skill evaluation harness is specific to the project's skill packaging
    and CI workflows.
  future_promotion_potential: low
- id: cross-tool-skill-sync
  scope: project
  rationale: Symlink/copy sharing of skills between .agents and .claude is a project-specific
    convenience.
  future_promotion_potential: low
- id: pattern-scope-classification-framework
  scope: project
  rationale: Classification framework is a governance tool developed for this project's
    pattern lifecycle.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: reconciliation-agentic-merger
  rationale: Agentic merger is emerging and shows promise, but evidence is limited
    to a single implementation and not yet proven across projects.
  evidence_gaps: Lack of multiple project usage or formal validation of merge quality.
  recommended_next_step: Run the merger on multiple diverse repositories and evaluate
    resolution correctness before global promotion.
- id: rule-grounded-compliance-evaluation
  rationale: Compliance evaluation is central but evidence is single-project; needs
    broader validation.
  evidence_gaps: No cross-project usage, unknown rule schema portability.
  recommended_next_step: Explore adoption in another project and compare compliance
    findings quality.
- id: agentic-state-reconciliation-merger
  rationale: Similar to other agentic merger proposals but with a slightly different
    focus; overlapping evidence and scope unclear.
  evidence_gaps: Duplicate of reconciliation-agentic-merger and agentic-merge-resolution;
    need consolidation.
  recommended_next_step: Merge with canonical agentic merger pattern and evaluate
    as a single concept.
- id: telemetry-grounded-traceability
  rationale: Telemetry-based traceability is strategic but evidence is only medium;
    implementation incomplete.
  evidence_gaps: OpenTelemetry integration is present but not shown to be used across
    many projects.
  recommended_next_step: Instrument additional projects and document trace-to-decision
    linkage.
- id: heuristic-to-pattern-promotion-lifecycle
  rationale: Pattern evolution lifecycle is documented but not fully operationalized;
    evidence of actual use is sparse.
  evidence_gaps: No implementation evidence of automatic heuristic promotion.
  recommended_next_step: Implement in the governance engine and collect statistics
    on promotion quality.
- id: lineage-aware-architectural-delta-slicing
  rationale: Lineage-aware delta slicing is novel but only proposed in this project;
    no cross-project validation.
  evidence_gaps: No implementation beyond models; unclear benefit over simpler git
    diff parsing.
  recommended_next_step: Prototype in a second project and measure impact on agent
    reasoning accuracy.
- id: centralized-flow-runner-pipeline
  rationale: Centralized runner is a duplicate of sequential-pipeline-flow-runner;
    distinct ID but same concept.
  evidence_gaps: Redundant with other flow runner patterns; needs consolidation.
  recommended_next_step: Merge into canonical flow runner pattern and classify as
    global if proven across projects.
- id: explicit-governance-transition-registry
  rationale: Explicit transition registry is a duplicate of declarative-action-state-transition-registry;
    evidence is identical.
  evidence_gaps: Duplicate; no added evidence.
  recommended_next_step: Merge with canonical governance state machine pattern.
- id: compliance-finding-guardrail
  rationale: Compliance findings as guardrail is a duplicate of rule-grounded-compliance-evaluation;
    evidence is the same.
  evidence_gaps: Duplicate; lacks independent validation.
  recommended_next_step: Merge into compliance engine pattern.
- id: typed-contracts-for-agent-context
  rationale: Typed contracts are fundamental but already covered by schema-enforced-domain-contracts
    and other patterns; duplication.
  evidence_gaps: Overlaps with multiple model schemas; need consolidation.
  recommended_next_step: Determine canonical pattern for typed domain contracts and
    classify accordingly.
- id: git-delta-prompt-facts
  rationale: Same as git-delta-prompt-fact-projection but with lower confidence evidence.
  evidence_gaps: Low evidence strength; no added detail.
  recommended_next_step: Merge with git-delta-prompt-fact-projection and treat as
    candidate until cross-project evidence exists.
- id: capability-record-lineage
  rationale: Capability lineage is a variation of capability-lineage-anchoring; duplicate.
  evidence_gaps: Duplicate; limited additional evidence.
  recommended_next_step: Merge into capability lineage pattern.
- id: traceable-health-metrics
  rationale: Health metrics traceability is already covered by telemetry-grounded-health-scoring
    and others.
  evidence_gaps: Duplicate; no independent evidence.
  recommended_next_step: Merge into telemetry/health pattern.
- id: externalized-runtime-context
  rationale: Runtime context externalization is a specific implementation detail of
    the knowledge base pattern.
  evidence_gaps: Not clearly distinct from file-backed blackboard.
  recommended_next_step: Consider merging into file-backed blackboard pattern.
- id: knowledge-blackboard-templates
  rationale: Templates for knowledge artifacts are part of the file-backed blackboard
    pattern; not standalone.
  evidence_gaps: No independent evidence.
  recommended_next_step: Merge into file-backed blackboard pattern.
- id: deterministic-workflow-validation
  rationale: CI validation script is specific to workflow hygiene; not a general architectural
