global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Multiple implementations (LiteLLMClient, MockLLMClient) and many
    related proposals indicate a stable, recurring architectural solution for decoupling
    agent logic from LLM providers.
  rationale: 'Represents a foundational pattern for agentic systems: abstracting LLM
    calls to support provider portability, deterministic testing, and cost control.
    High reuse across projects and domains.'
  promotion_readiness: high
  promotion_rationale: High evidence strength, established maturity, and broad applicability.
    Core to enabling reliable and testable agent workflows.
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Multiple proposals and concrete implementations (TransitionRegistry,
    GovernanceActionEngine) across the codebase show a consistent pattern for restricting
    state transitions in governed systems.
  rationale: A fundamental governance mechanism to ensure auditability and prevent
    invalid state changes in autonomous systems. Applicable to any system with managed
    lifecycle states.
  promotion_readiness: high
  promotion_rationale: High evidence, established code, and universal applicability
    for governance and compliance.
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner is the central orchestrator in the codebase and numerous
    proposals describe sequential pipelines with shared context for deterministic
    execution.
  rationale: Core execution pattern for multi-step agent workflows, enabling deterministic
    ordering, traceability, and predictable outcomes. Reusable across any agent-based
    system.
  promotion_readiness: high
  promotion_rationale: High evidence strength, established implementation, and foundational
    for agent orchestration.
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic models and JSON Schema used extensively for domain entities,
    governance actions, and steering facts; many proposals reinforce the need for
    typed contracts.
  rationale: Critical to ensure data integrity and reliability when interfacing with
    LLMs and heterogeneous agents. Applicable to any system that exchanges structured
    data with AI components.
  promotion_readiness: high
  promotion_rationale: High evidence, broad use, and foundational for robust agent-driven
    systems.
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: The cas-knowledge directory structure and multiple proposals describe
    using a filesystem-based, version-controlled knowledge store as shared memory
    for agents.
  rationale: Provides auditable, human-readable, and git-versioned persistence for
    governance and architectural knowledge, a common need for agentic systems that
    require long-term memory and collaboration.
  promotion_readiness: high
  promotion_rationale: High evidence strength, established pattern, and high reuse
    potential across projects.
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry dependencies and multiple health/telemetry models
    indicate a pattern for instrumenting agent executions for observability and traceability.
  rationale: Supporting pattern that provides essential operational visibility, debugging,
    and audit capabilities for agentic systems, complementary to core patterns.
  promotion_readiness: high
  promotion_rationale: High evidence strength and broad applicability, though not
    as foundational as core patterns.
- id: steering-fact-projection
  scope: global
  classification: supporting
  evidence_summary: Multiple proposals and code models (PromptFact, SteeringRuntimeIndex)
    demonstrate a pattern for converting raw repository changes into structured facts
    to ground LLM prompts.
  rationale: Reduces hallucination and context bloat by providing verified, typed
    inputs to agents. Applicable to any agent system needing reliable context from
    volatile sources.
  promotion_readiness: high
  promotion_rationale: High evidence strength, clear need, and reusable across agent
    architectures.
- id: agentic-merge-resolution
  scope: global
  classification: supporting
  evidence_summary: Multiple proposals and AgenticMerger implementation show a pattern
    for using LLMs to resolve semantic merge conflicts in structured artifacts.
  rationale: Addresses a common problem when multiple agents or humans edit shared
    configuration/knowledge concurrently. Reusable in any collaborative or autonomous
    system requiring conflict resolution.
  promotion_readiness: medium
  promotion_rationale: Strong evidence but still emerging; more cross-project validation
    would increase confidence.
project_pattern_candidates:
- id: deterministic-mock-evaluation-harness
  scope: project
  rationale: Highly useful for the current project's CI/CD but may be too specific
    to the current testing infrastructure; the general LLM abstraction pattern already
    covers the mock client concept.
  future_promotion_potential: low
  governance_observation: Overlaps with the global LLM abstraction pattern; likely
    should be merged.
- id: declarative-agent-command-registry
  scope: project
  rationale: Useful for this project's agent skill management, but may be too tied
    to the current TOML-based command structure and not sufficiently abstracted for
    general reuse.
  future_promotion_potential: medium
  governance_observation: Could become a broader pattern for declarative agent configuration
    if extracted generically.
- id: reconciliation-agentic-merger
  scope: project
  rationale: Overlaps with global agentic merge resolution; currently project-specific
    implementation and evidence, but the concept is potentially global.
  future_promotion_potential: high
  governance_observation: Likely to be absorbed into the global agentic merge pattern.
- id: telemetry-grounded-traceability
  scope: project
  rationale: While telemetry is global, this specific pattern of grounding traceability
    in governance decisions may be too project-specific at present.
  future_promotion_potential: medium
  governance_observation: Could be merged into the global telemetry pattern with broader
    applicability.
- id: capability-lineage-anchoring
  scope: project
  rationale: Relevant for tracking capabilities in this project, but similar concepts
    exist in other projects; not yet proven as a reusable cross-project pattern.
  future_promotion_potential: medium
  governance_observation: May evolve into a global capability tracking pattern if
    adopted by multiple projects.
- id: ci-driven-steering-projection
  scope: project
  rationale: Specific to CI/CD workflows in this project; while useful, it is an implementation
    detail of the broader steering fact projection pattern.
  future_promotion_potential: low
  governance_observation: Better integrated into the global steering project pattern.
- id: pattern-proposal-only-steering-projection
  scope: project
  rationale: Provides a safety mechanism for this project's automation, but the concept
    is too specialized and may not generalize.
  future_promotion_potential: low
  governance_observation: Useful project-specific guardrail; not candidate for global.
- id: pattern-continuous-governance-loop
  scope: project
  rationale: Operationalizes governance for this project; similar patterns might exist
    elsewhere but evidence is limited to this project.
  future_promotion_potential: high
  governance_observation: Could become a global pattern for continuous governance
    if abstracted and validated.
- id: heuristic-to-pattern-promotion-lifecycle
  scope: project
  rationale: The project has defined templates and flows for pattern promotion; however,
    this is likely a governance process that is specific to this organization's maturity.
  future_promotion_potential: medium
  governance_observation: May be reusable as a governance pattern if standardized.
- id: bootstrap-governance-injection
  scope: project
  rationale: The mechanism to inject governance blocks into agent configs is project-specific,
    though similar approaches could be reusable.
  future_promotion_potential: medium
  governance_observation: Could generalize into a pattern for standardizing agent
    environment setup.
- id: rule-grounded-compliance-evaluation
  scope: project
  rationale: Compliance engine is used in this project with specific rule sets; while
    the concept is general, current evidence is project-specific.
  future_promotion_potential: high
  governance_observation: Likely to be promoted to global if the compliance engine
    is reused.
- id: skill-packaged-agent-procedures
  scope: project
  rationale: Skills are defined for this project's agent platforms; there are multiple
    skills and cross-tool sync mechanisms, but they are tightly coupled to the project's
    needs.
  future_promotion_potential: medium
  governance_observation: Could become a global pattern for packaging agent skills
    if generalized.
- id: git-delta-prompt-fact-projection
  scope: project
  rationale: This is a specific implementation of the broader steering fact projection
    pattern; too project-specific as is.
  future_promotion_potential: low
  governance_observation: Merge into global steering fact projection.
- id: pattern-evolution-lifecycle
  scope: project
  rationale: The project has defined a lifecycle for pattern evolution with templates;
    similar processes exist elsewhere but this is currently project-specific.
  future_promotion_potential: medium
  governance_observation: Could be standardized as a governance pattern.
- id: ci-workflow-validation
  scope: project
  rationale: The validation script ensures CI workflow quality; this is a project-specific
    practice, though the underlying principles are general.
  future_promotion_potential: low
  governance_observation: Project-specific operational guardrail; not enough abstraction.
- id: human-in-the-loop-governance
  scope: project
  rationale: The project uses human approval gates in governance flows; this is a
    common practice but not yet codified as a reusable pattern beyond the project.
  future_promotion_potential: medium
  governance_observation: Could become a global pattern for balancing automation and
    human oversight.
- id: pattern-auto-governance-loop
  scope: project
  rationale: Emerging idea in this project's architecture work; not yet backed by
    implementation or sufficient evidence.
  future_promotion_potential: high
  governance_observation: Strategic direction but needs more validation before promotion.
- id: pattern-architecture-intelligence-layer
  scope: project
  rationale: Vision-level pattern for architecture intelligence; not yet implemented
    or evidenced beyond strategic signals.
  future_promotion_potential: high
  governance_observation: Future direction; should remain project until concrete implementations
    exist.
- id: pattern-business-intent-traceability
  scope: project
  rationale: Strategic direction for tracing business intent to architecture; not
    yet implemented.
  future_promotion_potential: high
  governance_observation: Future direction; requires evidence.
- id: pattern-code-intelligence-alignment
  scope: project
  rationale: Strategic direction for code-level architecture alignment; not yet implemented.
  future_promotion_potential: high
  governance_observation: Future direction; needs development.
- id: pattern-governance-registry-integrity
  scope: project
  rationale: Emerging need to ensure governance data quality; project-specific findings
    support it.
  future_promotion_potential: medium
  governance_observation: May become a global governance quality pattern.
candidate_patterns_requiring_review:
- id: declarative-compliance-findings-aggregation
  rationale: Overlaps with other compliance patterns; unclear if this is a distinct
    reusable pattern.
  evidence_gaps: Lacks distinct implementation evidence beyond existing compliance
    engine.
  recommended_next_step: Review for merging into a single compliance pattern.
- id: telemetry-grounded-health-scoring
  rationale: Health scoring is useful, but multiple overlapping proposals exist; need
    to determine canonical pattern.
  evidence_gaps: Multiple similar patterns; no clear unique contribution.
  recommended_next_step: Consolidate health scoring patterns into a single global
    or project pattern.
- id: deterministic-health-and-compliance-evaluation
  rationale: Potential overlap with compliance and health patterns.
  evidence_gaps: No unique evidence; likely covered by other patterns.
  recommended_next_step: Merge with compliance/health patterns.
- id: swappable-client-adapter
  rationale: Similar to LLM adapter patterns.
  evidence_gaps: Duplicates provider abstraction concept.
  recommended_next_step: Merge into global LLM abstraction pattern.
- id: layered-governance-service-facade
  rationale: "Service fa\xE7ade pattern is common, but may be too generic; need to\
    \ verify if it adds value over other service patterns."
  evidence_gaps: Not enough specific evidence of unique benefit.
  recommended_next_step: Assess if this is just a standard architectural pattern;
    may not need separate pattern.
- id: service-facade-orchestration
  rationale: "Overlaps with layered service fa\xE7ade and governance service patterns."
  evidence_gaps: Duplicates other service layer patterns.
  recommended_next_step: Merge into a single service facade pattern.
