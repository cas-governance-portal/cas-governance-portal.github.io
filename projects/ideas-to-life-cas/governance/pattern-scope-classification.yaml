global_pattern_candidates:
- id: knowledge-repository-abstraction
  scope: global
  classification: core
  evidence_summary: Implemented via KnowledgeProvider protocol and LocalKnowledgeProvider
    in src/cas_runner/io.py with high confidence.
  rationale: Decouples application logic from physical storage backends, providing
    standard infrastructure persistence abstraction applicable across systems.
  promotion_readiness: high
- id: schema-guided-reasoning
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/orchestration/reasoning.py using
    JSON schemas to validate LLM outputs before pipeline execution.
  rationale: Enforces deterministic contracts on probabilistic LLM outputs, serving
    as a foundational pattern for reliable agentic systems.
  promotion_readiness: high
- id: registry-driven-extensibility
  scope: global
  classification: supporting
  evidence_summary: Implemented via FLOWS and STEPS registries in src/cas_runner/steps/registry.py.
  rationale: Provides flow definition and step resolution decoupled from execution
    runners, applicable across workflow engine domains.
  promotion_readiness: high
- id: evidence-first-initialization
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/runner.py by pre-loading factual
    architectural artefacts into LLM context.
  rationale: Establishes factual grounding in LLM context prior to prompt execution,
    broadly applicable to RAG and governance AI systems.
  promotion_readiness: high
- id: shared-context-blackboard
  scope: global
  classification: supporting
  evidence_summary: Implemented in FlowRunner.context in src/cas_runner/runner.py.
  rationale: Enables state propagation and additive context generation across sequential
    step pipelines.
  promotion_readiness: medium
project_pattern_candidates:
- id: managed-section-governance
  scope: project
  rationale: Protects document sections via structural markers and ManagedSectionValidator.
    Highly effective within CAS document sync but requires cross-project usage evidence
    before global promotion.
  future_promotion_potential: high
- id: artifact-frontmatter-entity
  scope: project
  rationale: Combines Markdown with YAML frontmatter in src/cas_runner/io.py. Represents
    an implementation-level persistence detail specific to current file structure.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: pipe-and-filter-context
  rationale: Overlaps significantly in implementation and concept with 'shared-context-blackboard'.
    Both reference FlowRunner context passing.
  evidence_gaps: Lacks distinct architectural boundary from shared-context-blackboard.
  recommended_next_step: Merge pattern description into 'shared-context-blackboard'
    and archive redundant proposal.
duplicate_overlapping_patterns:
- patterns:
  - shared-context-blackboard
  - pipe-and-filter-context
  recommended_action: Consolidate into shared-context-blackboard.
  rationale: Both proposals describe passing a mutable context object through FlowRunner
    steps in src/cas_runner/runner.py. 'shared-context-blackboard' better aligns with
    agentic state management terminology.
promotion_recommendations:
  immediate_candidates:
  - knowledge-repository-abstraction
  - schema-guided-reasoning
  - registry-driven-extensibility
  - evidence-first-initialization
  deferred_candidates:
  - shared-context-blackboard
  - managed-section-governance
  additional_evidence_required:
  - pipe-and-filter-context
  - artifact-frontmatter-entity
