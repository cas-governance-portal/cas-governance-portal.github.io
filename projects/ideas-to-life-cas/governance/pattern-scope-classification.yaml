global_pattern_candidates:
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Implemented domain entities across src/cas_runner/governance/models.py
    defining strict Pydantic and JSON Schema contracts for state, action payloads,
    and compliance results.
  rationale: Universally applicable pattern essential for decoupling agent and pipeline
    boundaries with deterministic runtime validation, preventing hallucinated or malformed
    payloads across all autonomous systems.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/governance_action_engine.py
    with TransitionRegistry and GovernanceActionEngine enforcing formal precondition
    checks and state mutation gating.
  rationale: Foundational architectural governance pattern necessary for any agentic
    architecture system to prevent unconstrained agent transitions from corrupting
    lifecycle states.
  promotion_readiness: high
- id: pattern-scope-classification-framework
  scope: global
  classification: core
  evidence_summary: Derived from architecture work (aw-ideas-to-life-cas-20260614-1,
    aw-ideas-to-life-cas-2026-05-31-001) and proven in pipeline flow definitions.
  rationale: Provides universal multi-tier scoping (global, project, candidate) and
    staging gates to avoid rule bloating and maintain governance integrity across
    systems.
  promotion_readiness: high
- id: provider-agnostic-llm-facade
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/llm/litellm_client.py (LiteLLMClient)
    providing provider abstraction and standardized invocation mechanics.
  rationale: Highly reusable across generative AI and continuous architecture frameworks
    to prevent vendor lock-in and normalize disparate provider response schemas.
  promotion_readiness: high
- id: pure-functional-health-evaluation
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/dashboard/health_model.py (calculate_health,
    get_health_reasons) as deterministic, side-effect-free status evaluations.
  rationale: Reusable pattern for computing auditable, explainable health diagnostics
    from invariant metrics without environment or I/O side effects.
  promotion_readiness: high
- id: declarative-agent-command-registry
  scope: global
  classification: supporting
  evidence_summary: Implemented in .agents/commands/ (speckit.plan.toml, speckit.analyze.toml)
    defining declarative skill contracts.
  rationale: Decouples agent capabilities from hardcoded CLI logic via repository-managed
    declarative manifests reusable across heterogeneous agent frameworks.
  promotion_readiness: high
- id: pattern-closed-loop-governance
  scope: global
  classification: core
  evidence_summary: Supported by multiple architecture signals and work items (aw-ideas-to-life-cas-2026-06-06-001,
    continuous architecture loop workflow).
  rationale: Defines the strategic Continuous Architecture paradigm where drift detection
    autonomously connects to analysis, remediation, and verification workflows.
  promotion_readiness: medium
project_pattern_candidates:
- id: docs-as-code-portal-projection
  scope: project
  rationale: Tightly bound to repository-specific MkDocs Material toolchain, portal
    preprocessing scripts, and GitHub Pages publishing layout.
  future_promotion_potential: medium
- id: file-system-knowledge-repository
  scope: project
  rationale: Reflects the immediate workspace layout (cas-knowledge/ hierarchy) and
    attachment mechanics specific to the CAS runner implementation.
  future_promotion_potential: medium
- id: capability-lineage-anchoring
  scope: project
  rationale: Addresses internal CAS steering data models (CapabilityRecord, CapabilitySet)
    currently validated only within ideas-to-life-cas.
  future_promotion_potential: high
- id: sequential-pipeline-flow-runner
  scope: project
  rationale: Implemented specifically within cas_runner.runner.FlowRunner to orchestrate
    registered CLI steps in this repo before generalizing to arbitrary workflow engines.
  future_promotion_potential: medium
- id: layered-governance-service-facade
  scope: project
  rationale: Specific architectural boundary orchestrating ComplianceEngine and GovernanceActionEngine
    within the cas_runner application package.
  future_promotion_potential: low
candidate_patterns_requiring_review:
- id: reconciliation-agentic-merger
  rationale: Combines heuristic LLM reasoning to merge structured architectural conflicts,
    which carries significant non-deterministic risk if unverified across complex
    branch topologies.
  evidence_gaps: Requires empirical benchmark data evaluating semantic conflict resolution
    accuracy against git merge drivers across multiple repositories.
  recommended_next_step: Retain as emerging project candidate; conduct controlled
    evaluations on synthetic multi-author merge conflicts.
- id: pattern-architecture-knowledge-graph
  rationale: Strategic direction proposing graph-based lineage across ADRs, patterns,
    and AST entities, but currently lacks reference runtime implementation in codebase.
  evidence_gaps: Lacks production schema implementation, query interfaces, and multi-repo
    cross-validation beyond forward-looking architecture work notes.
  recommended_next_step: Defer promotion; validate graph schema prototypes on project
    AST extraction outputs.
- id: pattern-business-intent-traceability
  rationale: Proposes formal business intent ingestion to guide architectural reasoning,
    but concrete parsing schemas and operational enforcement mechanisms remain unspecified.
  evidence_gaps: No implemented schema models or runtime validators found in src/cas_runner
    for business intent artifacts.
  recommended_next_step: Draft concrete Pydantic schemas for business goals and demonstrate
    automated drift detection against ADRs.
- id: pattern-proposal-code-intelligence-alignment
  rationale: Proposes translating codebase AST into empirical architectural constraints
    compared against architecture intent in CI pipelines.
  evidence_gaps: Forensic extractors exist, but automated gate failure mechanics comparing
    ASTs directly to AID models require end-to-end CI demonstration.
  recommended_next_step: Formalize comparison engine in cas_runner steps and evaluate
    false-positive rate on merge requests.
- id: telemetry-observable-agent-steps
  rationale: Instrumentation dependencies are installed, but comprehensive end-to-end
    distributed tracing across LLM provider spans has partial runtime manifestation.
  evidence_gaps: TraceableMetric schema exists, but OpenTelemetry collector export
    pipeline and span propagation across async calls need explicit validation.
  recommended_next_step: Complete tracer integration across FlowRunner steps and inspect
    span payloads in CI.
duplicate_overlapping_patterns:
- patterns:
  - provider-agnostic-llm-facade
  - dual-tier-llm-gateway-abstraction
  - swappable-client-adapter
  - client-adapter-test-double
  - deterministic-mock-evaluation-harness
  recommended_action: Consolidate into 'provider-agnostic-llm-facade' as global supporting
    pattern with 'deterministic-mock-evaluation-harness' noted as an implementation
    capability.
  rationale: All five proposals describe the identical design pattern in src/cas_runner/llm/
    where LiteLLMClient provides a vendor-neutral facade paired with MockLLMClient
    test doubles.
- patterns:
  - finite-state-governance-engine
  - transition-registry-state-machine
  - finite-state-governance-action-engine
  recommended_action: Merge into 'finite-state-governance-engine' as a single core
    global pattern candidate.
  rationale: Identical architectural construct in src/cas_runner/governance/governance_action_engine.py
    decoupling transition registration from action execution.
- patterns:
  - schema-enforced-domain-contracts
  - pydantic-domain-entity-modeling
  recommended_action: Merge into 'schema-enforced-domain-contracts' as a core global
    pattern candidate.
  rationale: Both describe using Pydantic models in models.py to establish rigid serialization
    boundaries and runtime schema validation.
- patterns:
  - sequential-pipeline-flow-runner
  - sequential-pipeline-context-propagation
  recommended_action: Consolidate under 'sequential-pipeline-flow-runner' as a project-scoped
    pattern.
  rationale: Both describe the execution mechanics of cas_runner.runner.FlowRunner
    sequentially chaining steps and accumulating execution context.
- patterns:
  - reconciliation-agentic-merger
  - agentic-state-reconciliation-merger
  recommended_action: Merge into 'reconciliation-agentic-merger' and maintain in review
    status.
  rationale: Direct duplicate proposals referencing AgenticMerger in src/cas_runner/governance/agentic_merger.py.
- patterns:
  - pure-functional-health-evaluation
  - declarative-health-scoring-pipeline
  recommended_action: Consolidate under 'pure-functional-health-evaluation' as a supporting
    global pattern candidate.
  rationale: Both cite health_model.py deterministic evaluation functions deriving
    health statuses and diagnostic reasons without side effects.
- patterns:
  - layered-governance-service-facade
  - service-facade-orchestration
  recommended_action: Consolidate under 'layered-governance-service-facade' as a project
    pattern candidate.
  rationale: Duplicate proposals for GovernanceActionService orchestrating GovernanceActionEngine
    and ComplianceEngine.
- patterns:
  - ci-driven-steering-projection
  - declarative-steering-projection
  recommended_action: Keep 'declarative-steering-projection' as architectural mechanism
    and treat CI execution as an integration detail.
  rationale: Overlapping concepts where one focuses on the CI workflow trigger and
    the other on prompt-fact compilation from repository deltas.
- patterns:
  - telemetry-observable-agent-steps
  - telemetry-grounded-traceability
  recommended_action: Consolidate under 'telemetry-observable-agent-steps' in the
    review category.
  rationale: Duplicate proposals derived from OpenTelemetry dependencies and TraceableMetric
    domain models.
- patterns:
  - pattern-closed-loop-governance
  - pattern-proposal-automated-closed-loop-governance
  recommended_action: Merge into 'pattern-closed-loop-governance' as a core global
    candidate.
  rationale: Duplicate conceptual signals describing the continuous detect-analyse-execute
    feedback loop.
- patterns:
  - pattern-architecture-knowledge-graph
  - pattern-proposal-architecture-knowledge-graph
  recommended_action: Merge into 'pattern-architecture-knowledge-graph' in candidate
    review.
  rationale: Duplicate future direction proposals detailing multi-hop knowledge graph
    schemas.
- patterns:
  - pattern-business-intent-traceability
  - pattern-proposal-business-intent-traceability
  recommended_action: Merge into 'pattern-business-intent-traceability' in candidate
    review.
  rationale: Duplicate proposals addressing business intent integration with architecture
    models.
