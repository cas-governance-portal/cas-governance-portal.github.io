global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Strong evidence from LiteLLMClient and MockLLMClient, used across
    CAS runner steps, governance modules, and CI workflows. Multiple independent proposals
    converge on the same pattern.
  rationale: Provider-agnostic LLM access with deterministic mock fallback is a foundational
    mechanism for any agentic or AI-integrated system. It decouples business logic
    from model providers and enables deterministic testing, making it reusable across
    domains.
  promotion_readiness: high
  promotion_rationale: High maturity, multiple concrete implementations, and recurring
    strategic value; ready for adoption as a core global pattern.
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner is centrally implemented in runner.py and invoked via
    CLI and all major CI workflows. Numerous proposals consistently describe the same
    shared-context sequential execution model.
  rationale: A deterministic, shared-context sequential pipeline is a universal orchestration
    pattern for multi-step agentic workflows, enabling auditability, reproducibility,
    and controlled execution order across projects.
  promotion_readiness: high
  promotion_rationale: Core execution backbone with extensive evidence and cross-cutting
    applicability; should be a foundational global pattern.
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine enforce legal state
    transitions across governance artifacts. Multiple proposals independently identify
    this as a guardrail mechanism.
  rationale: Explicit state-machine governance is essential for any autonomous or
    AI-driven system that modifies architectural or operational state. It provides
    auditability, safety, and deterministic enforcement beyond a single project.
  promotion_readiness: high
  promotion_rationale: Well-established implementation, high evidence strength, and
    clear cross-project need for controlled governance actions.
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic and JSON Schema models are used pervasively (governance,
    steering, skills) to validate agent inputs and outputs. Multiple proposals highlight
    the same typed-contract mechanism.
  rationale: Strict, schema-enforced domain contracts are a foundational reliability
    pattern for agentic systems, preventing malformed or hallucinated data from polluting
    shared state. Applies to any system integrating LLM outputs.
  promotion_readiness: high
  promotion_rationale: High evidence, broad applicability, and critical role in agent
    correctness; strong global core candidate.
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: ComplianceEngine evaluates deltas and state against codified rules,
    producing typed findings and metrics. Multiple proposals reference this pattern
    under various names.
  rationale: Rule-based, auditable compliance evaluation is a universal requirement
    for governed autonomous systems. It enables early detection of violations and
    provides structured, actionable feedback independent of human review.
  promotion_readiness: high
  promotion_rationale: Established implementation, high evidence strength, and clear
    necessity for autonomous governance; deserves global core status.
