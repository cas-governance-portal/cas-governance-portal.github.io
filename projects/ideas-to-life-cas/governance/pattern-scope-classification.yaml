global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Consistent evidence across LiteLLMClient and MockLLMClient in
    multiple proposal variants; directly supports provider portability, cost control,
    and deterministic CI.
  rationale: Provider abstraction is a foundational architectural mechanism for any
    LLM-integrated system, enabling vendor independence and testability without domain-level
    coupling.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine appear consistently
    in governance modules with high confidence and explicit transition validation.
  rationale: A deterministic transition registry is essential for auditable, safe
    autonomous governance and is reusable across projects that need controlled lifecycle
    state changes.
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: ComplianceEngine and its typed finding/metrics models are evidenced
    across multiple workflows and repeated in proposals.
  rationale: Rule-based compliance evaluation is a general governance mechanism for
    converting policy into measurable, actionable findings in any agentic or automated
    system.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner appears as the central orchestration class across multiple
    proposals, with supported architecture docs and CLI invocation.
  rationale: A deterministic sequential pipeline with shared context is a widely applicable
    orchestration pattern for multi-step autonomous workflows, not project-specific.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic-based models are pervasive across governance, steering,
    and health modules, with repeated evidence of typed contract enforcement.
  rationale: Strongly typed domain contracts are a foundation for safe, maintainable
    agent-driven systems and are applicable beyond this project.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: The cas-knowledge directory hierarchy and bootstrap merge logic
    are evidenced across many proposals and CI workflows.
  rationale: File-backed, version-controlled shared state is a transparent and auditable
    basis for multi-agent collaboration and is reusable in any governance-heavy repository.
  promotion_readiness: high
- id: steering-fact-projection
  scope: global
  classification: core
  evidence_summary: Steering models and projection workflows are repeatedly present;
    they ground agent context in typed, delta-derived facts.
  rationale: Grounded, structured context projection is a critical mechanism for reducing
    hallucination and context bloat in LLM agents, with broad cross-project applicability.
  promotion_readiness: high
- id: reconciliation-agentic-merger
  scope: global
  classification: core
  evidence_summary: AgenticMerger and its ResolutionResult model are evidence-backed
    in multiple proposals, solving semantic merge conflicts.
  rationale: LLM-based semantic reconciliation is a novel but increasingly necessary
    pattern for distributed knowledge and architecture artifacts; the core concept
    is portable.
  promotion_readiness: medium
