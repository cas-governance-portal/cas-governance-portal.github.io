candidate_patterns_requiring_review:
- id: deterministic-mock-evaluation-harness
  rationale: Closely related to LLM provider abstraction, but framed as a separate
    testing harness; may be redundant or could be a distinct pattern for deterministic
    test doubles.
  evidence_gaps: No independent evidence beyond MockLLMClient; unclear if it extends
    beyond provider abstraction.
  recommended_next_step: Evaluate whether this is a distinct pattern or should be
    absorbed into provider abstraction; gather evidence of separate usage.
- id: heuristic-to-pattern-promotion-lifecycle
  rationale: Strategic lifecycle for pattern evolution, but implementation is only
    templates and docs; not yet operationalized in code.
  evidence_gaps: No working implementation of automation for promotion thresholds;
    only template definitions.
  recommended_next_step: Observe usage and gather evidence of promotion decisions
    made via this mechanism before considering global scope.
- id: pattern-proposal-only-steering-projection
  rationale: Interesting pattern to avoid direct mutation, but overlapping with steering
    projection patterns and may be a variant of workflow design.
  evidence_gaps: Limited evidence beyond one workflow file; unclear if it is a generalizable
    pattern or a specific CI strategy.
  recommended_next_step: Review whether it should be merged with git-delta-prompt-fact-projection
    or kept as a separate operational pattern.
- id: explicit-governance-transition-registry
  rationale: Very similar to finite-state-governance-engine; needs assessment to avoid
    duplication.
  evidence_gaps: Reuses same supporting evidence; no unique implementation evidence.
  recommended_next_step: Merge with governance state machine pattern and eliminate
    duplicate entry.
- id: compliance-finding-guardrail
  rationale: Overlaps with rule-grounded-compliance-evaluation; likely same concept.
  evidence_gaps: No additional evidence apart from same ComplianceEngine.
  recommended_next_step: Merge with compliance evaluation pattern.
- id: git-delta-prompt-facts
  rationale: Low evidence strength (low confidence) compared to other steering projection
    patterns; may be an early-stage extraction.
  evidence_gaps: Only steering models mentioned; no implementation evidence.
  recommended_next_step: Gather more evidence from usage in workflow runs; consider
    promoting to steering projection if confirmed.
- id: prompt-fact-contract
  rationale: Very low evidence strength; only a model definition.
  evidence_gaps: No concrete usage evidence.
  recommended_next_step: Require actual usage before considering classification; likely
    merge into steering projection.
- id: runtime-evaluation-trace
  rationale: Only mentions directories for traces/evaluations; not a fully realized
    pattern.
  evidence_gaps: No code or workflow evidence.
  recommended_next_step: Observe if tracing infrastructure matures; then evaluate
    as part of telemetry pattern.
- id: flow-runner-sequence
  rationale: Low confidence; duplicates sequential pipeline pattern.
  evidence_gaps: Minimal evidence beyond FlowRunner mention.
  recommended_next_step: Merge with sequential pipeline orchestration.
