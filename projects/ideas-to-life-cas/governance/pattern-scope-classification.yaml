global_pattern_candidates:
- id: sequential-pipeline-context-propagation
  scope: global
  classification: core
  evidence_summary: FlowRunner in src/cas_runner/runner.py, CLI entry point, and multiple
    declared flows (orchestration-flow, continuous-architecture-loop, pattern-lifecycle-flow)
    execute fixed step sequences with shared context.
  rationale: Deterministic sequential execution with shared mutable context is foundational
    for auditable agentic governance workflows and generalizes to other agent systems
    needing ordered, inspectable execution.
  promotion_readiness: high
- id: finite-state-governance-action-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine in src/cas_runner/governance/governance_action_engine.py,
    GovernanceActionService, GovernanceAction and GovernanceException models, and
    governance lifecycle flows restrict agent actions to declared transitions.
  rationale: An explicit transition registry with an enforcing engine is a stable
    governance control for bounded autonomy and auditable lifecycle mutation, reusable
    across agentic governance systems.
  promotion_readiness: high
- id: declarative-compliance-findings-aggregation
  scope: global
  classification: core
  evidence_summary: ComplianceEngine evaluates rules and emits ComplianceFinding and
    ComplianceMetrics; CI governance validation and health scoring consume these findings.
  rationale: Rule-based compliance evaluation with typed findings is a foundational
    governance guardrail for autonomous agents and applies broadly beyond this project.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic governance models, steering models, skill evaluation
    models, jsonschema dependency, and validation at workflow boundaries.
  rationale: Strict typed contracts for agent inputs, outputs, and governance state
    are foundational to reliable agentic workflows and tool interoperability.
  promotion_readiness: high
- id: signal-pattern-proposal-knowledge-provider-abstraction
  scope: global
  classification: core
  evidence_summary: KnowledgeProvider protocol and LocalKnowledgeProvider in src/cas_runner/io.py;
    current architecture state lists the provider interface and decoupled storage
    responsibilities.
  rationale: A uniform knowledge provider boundary is foundational for decoupling
    orchestration and governance reasoning from filesystem or remote storage implementations.
  promotion_readiness: high
- id: provider-agnostic-llm-client
  scope: global
  classification: supporting
  evidence_summary: LiteLLMClient and MockLLMClient under src/cas_runner/llm; litellm
    dependency; many duplicate proposals describe the same provider abstraction and
    deterministic mock fallback.
  rationale: Provider-agnostic LLM clients with a mock fallback are broadly reusable
    supporting infrastructure, though not core governance semantics.
  promotion_readiness: high
- id: steering-fact-projection
  scope: global
  classification: supporting
  evidence_summary: PromptFact, SteeringRuntimeIndex, ArchitecturalDelta and RawGitDelta
    in steering/models.py; steering projection workflow and prompt-grounding logic
    use structured facts.
  rationale: Projecting bounded, verified facts into agent prompts is reusable for
    agentic architecture governance, but its domain modeling is more specific than
    the core execution and governance patterns.
  promotion_readiness: medium
- id: telemetry-grounded-traceability
  scope: global
  classification: supporting
  evidence_summary: TraceableMetric models, OpenTelemetry API/SDK dependencies, persisted
    runtime traces, and health metrics consume traceable governance data.
  rationale: Traceable metrics and OpenTelemetry spans are broadly reusable observability
    mechanisms for agent audit and operations, but evidence is still strategic and
    medium strength.
  promotion_readiness: medium
project_pattern_candidates:
- id: agentic-merge-resolution
  scope: project
  rationale: Semantic merger for governance conflicts is emerging and currently evidenced
    mainly in AgenticMerger and ResolutionResult; the behavior is reusable but not
    yet stable across systems.
  future_promotion_potential: medium
- id: bootstrap-governance-injection
  scope: project
  rationale: Workspace bootstrap injects governance blocks and agent settings, but
    the implementation is tied to CAS onboarding conventions and multi-harness file
    layouts.
  future_promotion_potential: high
- id: skill-packaged-agent-procedures
  scope: project
  rationale: Skills are packaged as task-specific directories with instructions and
    assets; the packaging convention is reusable, but the current skills are CAS-specific.
  future_promotion_potential: high
- id: skill-evaluation-suites
  scope: project
  rationale: Typed skill evaluation models and a CI workflow exist, but evidence is
    limited to one project and the skill suite semantics are still maturing.
  future_promotion_potential: high
- id: dedicated-verifier-subagent
  scope: project
  rationale: Verifier subagent definitions exist for multiple harnesses, but runtime
    enforcement evidence is limited and the role is not yet a proven reusable governance
    pattern.
  future_promotion_potential: medium
- id: pattern-promotion-lifecycle
  scope: project
  rationale: Heuristic-to-pattern promotion is documented through templates and process
    flows, but implementation evidence and cross-project recurrence are not yet sufficient
    for global classification.
  future_promotion_potential: medium
- id: ci-driven-steering-projection
  scope: project
  rationale: CI workflow generates steering projections, but the workflow paths, repository
    events, and projection artifacts are CAS-specific.
  future_promotion_potential: medium
- id: template-driven-artifact-evolution
  scope: project
  rationale: Markdown templates for ADRs, patterns, rules, and signals provide consistent
    artifact structure, but the convention is tied to the CAS knowledge base.
  future_promotion_potential: high
- id: health-model-observability-guardrail
  scope: project
  rationale: Health scoring aggregates compliance and governance metrics, but the
    status semantics are tied to CAS governance risks and findings.
  future_promotion_potential: medium
- id: runtime-rule-context
  scope: project
  rationale: Runtime rule-context and execution-profile files externalize execution
    constraints, but current evidence is limited to this repository's runtime layout.
  future_promotion_potential: medium
- id: service-facade-orchestration
  scope: project
  rationale: GovernanceActionService provides an application-service facade over engines
    and models; the facade style is reusable, but current evidence is from one governance
    subsystem.
  future_promotion_potential: high
- id: file-backed-blackboard-workspace
  scope: project
  rationale: The file-backed blackboard implementation is core to CAS, but the physical
    directory layout and templates are project-specific; the reusable abstraction
    is covered by the knowledge provider pattern.
  future_promotion_potential: high
- id: declarative-agent-command-registry
  scope: project
  rationale: TOML command and skill manifests externalize agent skills, but the current
    registry format and lifecycle are specific to the CAS agent harness.
  future_promotion_potential: medium
- id: deterministic-workflow-validation
  scope: project
  rationale: Workflow validation scripts enforce repository-specific CI hygiene checks
    and are not yet a general cross-project validation framework.
  future_promotion_potential: medium
- id: capability-lineage-anchoring
  scope: project
  rationale: CapabilityLineage and capability records provide provenance for steering,
    but evidence is mostly model-level and tied to CAS steering semantics.
  future_promotion_potential: medium
- id: signal-pattern-proposal-architecture-work-registry
  scope: project
  rationale: Architecture Work as the authoritative backlog is a governance practice
    specific to CAS knowledge artifacts and current governance flows.
  future_promotion_potential: medium
- id: signal-pattern-proposal-continuous-governance-loop
  scope: project
  rationale: The detect-analyse-execute loop is evidenced through CAS CI workflows
    and governance steps, but broader cross-project adoption is not yet demonstrated.
  future_promotion_potential: medium
- id: human-in-the-loop-governance
  scope: project
  rationale: Human review and approval are indicated by templates and governance services,
    but the implementation evidence is emerging and not yet a stable reusable mechanism.
  future_promotion_potential: medium
- id: scheduled-agentic-workflows
  scope: project
  rationale: Scheduled and event-driven agentic workflows are implemented in CAS GitHub
    Actions, but the scheduling model is tied to repository automation.
  future_promotion_potential: medium
- id: evidence-linked-traceable-reporting
  scope: project
  rationale: Provenance-bearing result types and review templates support traceable
    reporting, but the conventions are still specific to CAS governance artifacts.
  future_promotion_potential: medium
- id: multi-agent-instruction-manifests
  scope: project
  rationale: Separate AGENTS.md, CLAUDE.md, and GEMINI.md manifests and mirrored skills
    support multiple harnesses, but the file conventions are tool-specific and evolving.
  future_promotion_potential: medium
- id: pattern-scope-classification-framework
  scope: project
  rationale: A documented framework classifies pattern reuse scope, but evidence is
    primarily documentation and not yet an implemented enforcement mechanism.
  future_promotion_potential: high
- id: signal-pattern-proposal-architecture-knowledge-graph
  scope: project
  rationale: Knowledge graph modeling is a future-direction proposal with medium evidence
    and no implemented graph layer; it should mature as a project-specific direction
    first.
  future_promotion_potential: low
- id: signal-pattern-proposal-business-intent-traceability
  scope: project
  rationale: Business intent traceability is strategically important but currently
    documented as future direction with medium evidence and no stable schema implementation.
  future_promotion_potential: low
- id: signal-pattern-proposal-code-intelligence-alignment
  scope: project
  rationale: Code intelligence and drift alignment are future-direction concepts with
    medium evidence; implementation evidence is not yet sufficient for global reuse.
  future_promotion_potential: low
candidate_patterns_requiring_review:
- id: git-delta-prompt-facts
  rationale: Low-confidence proposal derived mainly from model names; it overlaps
    the stronger steering-fact-projection pattern and lacks independent usage evidence.
  evidence_gaps: Only RawGitDelta, GitChangeType, PromptFact, and ArchitecturalDelta
    names are cited; no workflow execution, recurrence, or consumer evidence.
  recommended_next_step: Treat as a submechanism of steering-fact-projection and collect
    concrete examples of git-delta fact generation before considering a separate pattern.
- id: pattern-evolution-lifecycle
  rationale: The lifecycle is described through templates and documentation, but there
    is insufficient implementation evidence to support independent scope classification.
  evidence_gaps: Templates and architecture docs exist, but no promoted-pattern decision
    history, enforcement path, or repeated cross-project use is cited.
  recommended_next_step: Merge review with pattern-promotion-lifecycle and gather
    completed promotion decisions and rejected promotions as evidence.
- id: runtime-execution-context-store
  rationale: The proposal is based on runtime directory layout and files, with low
    confidence and unclear consumer behavior.
  evidence_gaps: Only cas-knowledge/runtime files and directories are cited; no code
    path showing loading, mutation, or lifecycle management.
  recommended_next_step: Collect evidence from runtime loaders and consumers; otherwise
    fold into runtime-rule-context as an implementation detail.
- id: agentic-merger-artifact-reconciliation
  rationale: Low-confidence proposal derived from a single class symbol and overlapping
    heavily with stronger agentic merge proposals.
  evidence_gaps: Only AgenticMerger is cited; no resolution outputs, conflict scenarios,
    or downstream validation evidence.
  recommended_next_step: Review under agentic-merge-resolution and require examples
    of reconciled artifacts and ResolutionResult usage.
- id: prompt-fact-extraction
  rationale: Low-confidence proposal focuses on a model name without showing an extraction
    process or runtime usage.
  evidence_gaps: Only PromptFact is cited; no extractor implementation, prompt assembly
    path, or evaluation evidence.
  recommended_next_step: Fold into steering-fact-projection review and require concrete
    extraction and prompt-consumption examples.
- id: independent-verifier-agent
  rationale: Verifier agent definitions exist, but the evidence is low and the operational
    role is not yet demonstrated as an enforced pattern.
  evidence_gaps: Only .agents/subagents/verifier.md and .claude/agents/verifier.md
    are cited; no execution traces, acceptance criteria, or outcome data.
  recommended_next_step: Collect verifier invocation evidence and compare with dedicated-verifier-subagent
    before promoting the concept.
- id: health-observability-feedback
  rationale: Low-confidence proposal based on health model functions without evidence
    of a feedback loop or operational use.
  evidence_gaps: Only health_model.py is cited; no evidence that health signals feed
    remediation, gating, or scheduling.
  recommended_next_step: Merge into health-model-observability-guardrail and gather
    evidence of health signals affecting workflow decisions.
