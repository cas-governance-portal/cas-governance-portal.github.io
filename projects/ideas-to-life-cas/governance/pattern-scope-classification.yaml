global_pattern_candidates:
- id: provider-agnostic-llm-client
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/llm/litellm_client.py (LiteLLMClient)
    and src/cas_runner/llm/mock_client.py (MockLLMClient). High evidence strength
    with 10+ overlapping proposals referencing identical implementation.
  rationale: Foundational abstraction decoupling core AI agent reasoning from model
    provider SDK churn while providing hermetic test doubles for deterministic CI
    execution.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/governance_action_engine.py
    (TransitionRegistry, GovernanceActionEngine) and models.py (GovernanceAction).
    High evidence strength across multiple proposals.
  rationale: Crucial architectural safety pattern that restricts autonomous agent
    operations to permissible state transitions verified against an explicit registry
    before mutating repository state.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/runner.py (FlowRunner) and src/cas_runner/cli.py.
    Validated by GitHub Actions workflows and multiple registry flows.
  rationale: Linear orchestration model that enforces predictable ordering, context
    accumulation, and hard failure gates across agentic and deterministic validation
    stages.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Implemented across src/cas_runner/governance/models.py and src/cas_runner/steering/models.py
    using Pydantic domain models.
  rationale: Essential cross-system pattern ensuring all LLM and agent outputs are
    validated against rigid schemas prior to consumption or persistence, eliminating
    hallucination risks.
  promotion_readiness: high
- id: heuristic-to-pattern-promotion-lifecycle
  scope: global
  classification: core
  evidence_summary: Documented in cas-knowledge/templates/heuristic-to-pattern_template.md,
    promotion_decision.md, and docs/architecture/cas-pattern-evolution-flow.md.
  rationale: Establishes a standardized, evidence-backed knowledge evolution pipeline
    that prevents premature codification of architectural heuristics into unverified
    patterns.
  promotion_readiness: high
- id: pattern-closed-loop-governance-controller
  scope: global
  classification: core
  evidence_summary: Evidenced by continuous governance loop signals, architecture
    work artifacts, and .github/workflows/cas-continuous-architecture.yml.
  rationale: Automates the Detect-Analyze-Plan-Execute-Publish loop in CI/CD pipelines
    to continuously identify drift and propose prescriptive remediation without manual
    overhead.
  promotion_readiness: medium
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: Evidenced by pyproject.toml OpenTelemetry SDK dependencies and
    src/cas_runner/governance/models.py TraceableMetric schema.
  rationale: Instruments multi-step agent pipelines with OpenTelemetry spans and metric
    records to provide latency, token spend, and execution visibility across tool
    invocations.
  promotion_readiness: high
- id: declarative-agent-command-registry
  scope: global
  classification: supporting
  evidence_summary: Evidenced in .agents/commands/speckit.plan.toml and .agents/commands/speckit.analyze.toml
    manifests.
  rationale: Externalizes agent task contracts into declarative repository-tracked
    manifests, enabling shared human and agent invocation semantics across diverse
    workspaces.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: supporting
  evidence_summary: Evidenced in src/cas_runner/bootstrap.py (init_workspace) and
    cas-knowledge/ directory conventions.
  rationale: Provides a serverless, git-native persistence substrate for sharing intermediate
    context and models across pipeline steps without dedicated database infrastructure.
  promotion_readiness: high
- id: docs-as-code-portal-projection
  scope: global
  classification: supporting
  evidence_summary: Evidenced by pyproject.toml MkDocs dependencies, portal/docs/static/js/dashboard.js,
    and .github/workflows/cas-portal-publish.yml.
  rationale: Compiles structured governance findings and architectural views into
    static, navigable documentation sites without requiring dynamic web infrastructure.
  promotion_readiness: high
project_pattern_candidates:
- id: ci-driven-steering-projection
  scope: project
  rationale: Tightly coupled to specific GitHub Actions workflows (.github/workflows/cas-build-steering-projection.yml)
    and repository paths in ideas-to-life-cas.
  future_promotion_potential: high
- id: workspace-bootstrap-template-injection
  scope: project
  rationale: Implementation specifically tailored to initializing the cas-knowledge
    directory structure and merging custom CAS governance blocks.
  future_promotion_potential: medium
- id: service-facade-orchestration
  scope: project
  rationale: Internal structural facade organizing cas_runner CLI entry points to
    domain services; standard application layering rather than a global architecture
    innovation.
  future_promotion_potential: low
- id: pure-functional-health-evaluation
  scope: project
  rationale: Specific calculation formulas and health category enums designed for
    the ideas-to-life-cas dashboard health model in src/cas_runner/dashboard/health_model.py.
  future_promotion_potential: medium
- id: pattern-scope-classification-framework
  scope: project
  rationale: Currently documented as a project reference architecture asset within
    knowledge/projects/ideas-to-life-cas/ before multi-project validation.
  future_promotion_potential: high
candidate_patterns_requiring_review:
- id: reconciliation-agentic-merger
  rationale: Uses LLM reasoning to perform semantic merges on conflicting Markdown/YAML
    architecture artifacts. High risk of subtle governance deletion or hallucinated
    resolutions.
  evidence_gaps: Emerging prototype in src/cas_runner/governance/agentic_merger.py
    without production safety metrics or failure-mode boundary tests.
  recommended_next_step: Conduct automated synthetic merge benchmark evaluations and
    establish AST-verified guardrails before promotion review.
- id: pattern-architecture-knowledge-graph
  rationale: Strategic concept proposing multi-hop relational graph models across
    decisions, signals, and code components.
  evidence_gaps: Marked as future direction without concrete implementation in cas_runner
    code; current state relies on flat filesystem conventions.
  recommended_next_step: Develop prototype graph extraction step and evaluate query
    benefits over filesystem traversal across multiple projects.
- id: pattern-business-intent-traceability
  rationale: Proposes formal business vision schemas ingested directly into architectural
    validation engines.
  evidence_gaps: Schema definitions and parsing engines are not yet implemented in
    codebase; existing models focus on technical compliance.
  recommended_next_step: Draft initial Pydantic business intent schema and demonstrate
    validation against an actual Architecture Work item.
- id: pattern-operational-intelligence-loop
  rationale: Automated feedback loop synthesizing runtime traces into architectural
    signals and work items.
  evidence_gaps: Signal synthesis mechanisms in src/cas_runner/steps/registry.py are
    partially mapped; runtime feedback ingestion needs production trace validation.
  recommended_next_step: Observe automated signal generation across live workflow
    executions to confirm low false-positive rates.
- id: capability-lineage-anchoring
  rationale: Tracks capability provenance and parent-child derivation histories across
    evolving architectures.
  evidence_gaps: Models exist in src/cas_runner/steering/models.py, but cross-repository
    tracking logic and blast-radius analysis remain untested.
  recommended_next_step: Validate lineage traversal against multi-branch repository
    evolutions to confirm robustness.
duplicate_overlapping_patterns:
- patterns:
  - provider-agnostic-llm-facade
  - deterministic-mock-evaluation-harness
  - dual-tier-llm-gateway-abstraction
  - provider-agnostic-llm-client
  - dual-mode-llm-provider-abstraction
  - swappable-client-adapter
  - client-adapter-test-double
  - pluggable-adapter-client
  - swappable-provider-adapter
  - provider-agnostic-llm-gateway
  - polymorphic-client-adapter
  recommended_action: 'Consolidate into canonical pattern: provider-agnostic-llm-client'
  rationale: All 11 proposals describe the exact same LiteLLM client wrapper paired
    with MockLLMClient in src/cas_runner/llm/.
- patterns:
  - finite-state-governance-engine
  - finite-state-governance-action-engine
  - finite-transition-governance-guardrail
  - transition-registry-state-machine
  - declarative-transition-registry
  - state-machine-governance-guardrail
  recommended_action: 'Consolidate into canonical pattern: finite-state-governance-engine'
  rationale: All 6 proposals specify TransitionRegistry and GovernanceActionEngine
    validating state transitions in src/cas_runner/governance/governance_action_engine.py.
- patterns:
  - sequential-pipeline-flow-runner
  - sequential-pipeline-context-propagation
  - centralized-flow-runner-orchestration
  - sequential-pipeline-orchestration
  - sequential-pipeline-orchestrator
  - pattern-cas-decoupled-execution-model
  recommended_action: 'Consolidate into canonical pattern: sequential-pipeline-flow-runner'
  rationale: All 6 proposals describe FlowRunner in src/cas_runner/runner.py orchestrating
    sequential stages with shared context.
- patterns:
  - rule-grounded-compliance-evaluation
  - declarative-compliance-findings-aggregation
  - telemetry-grounded-health-scoring
  - compliance-driven-health-scoring
  - pure-functional-health-evaluation
  - declarative-health-scoring-pipeline
  - deterministic-health-and-compliance-evaluation
  - functional-health-evaluation
  - pure-functional-metric-evaluation
  - health-model-observability-guardrail
  - typed-compliance-synthesis-contract
