global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Multiple implementations (LiteLLMClient, MockLLMClient) demonstrate
    a stable interface for LLM invocation with deterministic test double, evidenced
    across many proposals.
  rationale: Provider abstraction is a foundational architectural pattern for AI-integrated
    systems, enabling portability, testability, and cost control. It is reusable beyond
    the originating project and has high evidence strength.
  promotion_readiness: high
  promotion_rationale: Widespread recurrence, clear implementation, and universal
    applicability to any LLM-based system.
- id: finite-state-governance-action-engine
  scope: global
  classification: core
  evidence_summary: Consistent pattern of transition registry and governance action
    engine appearing in many proposals with strong code evidence.
  rationale: Governance state machine enforces legal transitions and auditability,
    essential for any autonomous agent system with lifecycle governance. Highly reusable
    and stable.
  promotion_readiness: high
  promotion_rationale: Multiple implementations and strong strategic alignment with
    governed autonomy.
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner pattern recurs across many proposals, emphasizing deterministic
    step execution and shared context.
  rationale: Sequential orchestration with shared context is a general architectural
    mechanism for multi-step agent workflows, enabling predictability and debugging
    across domains.
  promotion_readiness: high
  promotion_rationale: Core execution pattern, high evidence, and cross-project applicability.
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Pydantic models and JSON schema enforcement appear widely in governance
    and steering layers, with high evidence strength.
  rationale: Strongly typed contracts are fundamental for LLM output validation and
    system reliability. Generic across any data-heavy or AI-integration system.
  promotion_readiness: high
  promotion_rationale: Widespread adoption, stable principle, and high abstraction
    level.
- id: declarative-steering-projection
  scope: global
  classification: core
  evidence_summary: Multiple proposals describe converting git deltas into structured
    prompt facts to ground LLM context, with strong implementation evidence.
  rationale: Fact projection from repository changes is a key pattern for reducing
    hallucination and improving LLM reasoning. Reusable in any continuous architecture
    or code-analysis workflow.
  promotion_readiness: high
  promotion_rationale: High evidence, clear conceptual value, and strategic alignment
    with intelligence layers.
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: Persistent, version-controlled file-based knowledge store is a
    consistent theme across many proposals, with high evidence.
  rationale: Using Git as a durable blackboard for architectural knowledge is a robust,
    auditable, and portable pattern for agentic systems. Applicable beyond this project.
  promotion_readiness: high
  promotion_rationale: High evidence strength, clear independence, and strong fit
    with governance and transparency requirements.
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: Compliance engine and typed findings appear consistently, with
    strong code and workflow evidence.
  rationale: Rule-based compliance checking with structured findings is a reusable
    governance pattern for any autonomous system, enabling auditability and corrective
    action.
  promotion_readiness: high
  promotion_rationale: High evidence and direct alignment with governance needs.
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry integration and traceable metrics appear in multiple
    proposals with moderate to high evidence.
  rationale: Observability is essential for debugging and auditing agentic pipelines.
    It is a reusable supporting pattern that complements core governance.
  promotion_readiness: high
  promotion_rationale: Clear implementation, strong strategic value, and cross-cutting
    applicability.
- id: agentic-state-reconciliation-merger
  scope: global
  classification: supporting
  evidence_summary: LLM-based merger for reconciling conflicting governance artifacts
    appears in many proposals with consistent design.
  rationale: Agentic reconciliation is a specialized but highly reusable pattern for
    resolving semantic conflicts in structured documents, applicable to any collaborative
    or multi-source system.
  promotion_readiness: medium
  promotion_rationale: Reusable but requiring careful design; strategic direction
    supports global adoption.
project_pattern_candidates:
- id: deterministic-mock-evaluation-harness
  scope: project
  rationale: Specific to testing LLM flows without network dependency; while useful,
    its implementation is tightly coupled to this project's test infrastructure.
  future_promotion_potential: medium
- id: declarative-agent-command-registry
  scope: project
  rationale: Declarative TOML manifests for agent commands are project-specific and
    may not translate directly to other environments.
  future_promotion_potential: low
- id: ci-driven-steering-projection
  scope: project
  rationale: CI workflow triggered steering projection is highly specific to this
    repository's automation stack.
  future_promotion_potential: low
- id: capability-lineage-anchoring
  scope: project
  rationale: Capability lineage tracking is valuable for this project's steering model
    but may not be reused in other contexts without significant adaptation.
  future_promotion_potential: medium
- id: deterministic-governance-injection-bootstrap
  scope: project
  rationale: Workspace bootstrap and governance block injection is tailored to this
    project's onboarding flow.
  future_promotion_potential: medium
- id: pattern-proposal-only-steering-projection
  scope: project
  rationale: Proposal-only projection mechanism is specific to this project's approval
    workflow.
  future_promotion_potential: low
- id: pattern-continuous-governance-loop
  scope: project
  rationale: Continuous governance loop as implemented here is project-specific CI
    configuration.
  future_promotion_potential: low
- id: skill-packaged-agent-procedures
  scope: project
  rationale: Packaging agent procedures as skills is specific to this repository's
    skill directory structure.
  future_promotion_potential: medium
- id: health-model-observability-guardrail
  scope: project
  rationale: Health scoring implementation is closely tied to this project's governance
    metrics and dashboard.
  future_promotion_potential: medium
- id: template-driven-artifact-evolution
  scope: project
  rationale: Template-driven artifact creation is a useful convention but the specific
    templates are project-specific.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: heuristic-to-pattern-promotion-lifecycle
  rationale: Promotion lifecycle concept is strategically important but lacks concrete
    implementation evidence across multiple projects.
  evidence_gaps: No evidence of actual usage beyond documentation; recurrence unclear.
  recommended_next_step: Collect additional signals from multiple projects before
    classifying globally.
- id: traceable-metric-telemetry-envelope
  rationale: Telemetry envelope is a promising pattern but implementation is partial
    and evidence is medium.
  evidence_gaps: Traces and metrics models exist but integration with OpenTelemetry
    is not fully demonstrated.
  recommended_next_step: Complete telemetry integration and gather operational evidence.
- id: pattern-business-intent-integration
  rationale: Strategic direction but no implementation evidence.
  evidence_gaps: Future direction only; no code or recurring signals.
  recommended_next_step: Await architecture work and implementation before classification.
- id: pattern-code-intelligence
  rationale: Strategic direction without concrete implementation.
  evidence_gaps: No code evidence, only vision.
  recommended_next_step: Require further specification and implementation.
- id: pattern-knowledge-graph
  rationale: Graph-based knowledge layer is a strategic vision without implementation.
  evidence_gaps: Only architecture work references, no code or recurring patterns.
  recommended_next_step: Prototype and validate before promotion.
- id: pattern-operational-intelligence-loop
  rationale: Future operational loop, not yet implemented.
  evidence_gaps: No implementation, only vision.
  recommended_next_step: Defer until operational evidence exists.
- id: pattern-external-ecosystem-ingestion
  rationale: External integration framework, lacks evidence.
  evidence_gaps: Strategic direction, no implementation.
  recommended_next_step: Require connector prototypes and adoption.
- id: pattern-interactive-architecture-intelligence
  rationale: Interactive visualization vision, no implementation.
  evidence_gaps: No code evidence.
  recommended_next_step: Await product development.
- id: pattern-decision-provenance
  rationale: Governance provenance pattern identified from alignment findings but
    no independent implementation evidence.
  evidence_gaps: Derived from a single project's alignment findings; recurrence unproven.
  recommended_next_step: Validate across multiple projects with governance metrics.
- id: pattern-aw-consolidation
  rationale: Consolidation of architecture work entries is a governance heuristic,
    not yet a validated pattern.
  evidence_gaps: Only project-specific findings.
  recommended_next_step: Gather more data on duplicate management.
- id: pattern-placeholder-governance
  rationale: Placeholder detection is a good practice but not yet generalised.
  evidence_gaps: Limited evidence beyond alignment findings.
  recommended_next_step: Implement rule engine checks and monitor across projects.
