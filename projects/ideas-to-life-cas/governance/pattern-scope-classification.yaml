global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/llm/litellm_client.py (LiteLLMClient)
    and src/cas_runner/llm/mock_client.py (MockLLMClient). High evidence across all
    architecture scans.
  rationale: Foundational port-and-adapter pattern decoupling agent reasoning from
    specific model providers while enabling zero-cost, deterministic offline testing
    in CI.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/runner.py (FlowRunner) and src/cas_runner/cli.py.
    Core orchestration backbone for automated architecture flows.
  rationale: Essential pipeline coordinator executing ordered multi-step agent and
    governance stages via a shared execution context.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/governance_action_engine.py
    (TransitionRegistry, GovernanceActionEngine) and src/cas_runner/governance/models.py.
  rationale: Critical control plane invariant constraining agent state mutations to
    an explicit, registered finite state machine to prevent unauthorized lifecycle
    jumps.
  promotion_readiness: high
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Extensively verified in src/cas_runner/governance/models.py and
    src/cas_runner/steering/models.py using Pydantic and JSON Schema.
  rationale: Foundational data integrity pattern guaranteeing that probabilistic agent
    outputs strictly conform to typed domain contracts before persisting.
  promotion_readiness: high
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: Persisted under cas-knowledge/ (global, projects, runtime, templates)
    and bootstrapped via src/cas_runner/bootstrap.py.
  rationale: Foundational architectural pattern using version-controlled filesystem
    structures as long-term, inspectable, GitOps-friendly agent memory.
  promotion_readiness: high
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: Implemented in src/cas_runner/governance/compliance_engine.py
    (ComplianceEngine) and models.py (ComplianceFinding, ComplianceMetrics).
  rationale: Core governance mechanism verifying codebase changes and candidate decisions
    against codified rule contexts to generate structured findings.
  promotion_readiness: high
- id: declarative-agent-command-registry
  scope: global
  classification: supporting
  evidence_summary: Defined in .agents/commands/speckit.plan.toml and .agents/commands/speckit.analyze.toml.
  rationale: Externalizes agent task specifications and skills into declarative configuration
    files, enabling multi-agent runtime invocation without hardcoded CLI commands.
  promotion_readiness: high
- id: portable-skill-packaging
  scope: global
  classification: supporting
  evidence_summary: Mirrored structure across .agents/skills/ and .claude/skills/
    with symlink/copy bootstrapping in src/cas_runner/bootstrap.py.
  rationale: Encapsulates task-specific agent capabilities into discrete, discoverable
    markdown and script packages portable across diverse IDE and CLI harnesses.
  promotion_readiness: high
- id: subagent-verification-boundary
  scope: global
  classification: supporting
  evidence_summary: Defined in .agents/subagents/verifier.md and .claude/agents/verifier.md.
  rationale: Separates generation from verification by routing outputs to an independent
    verifier subagent to prevent self-confirmation bias.
  promotion_readiness: high
- id: declarative-skill-eval-harness
  scope: global
  classification: supporting
  evidence_summary: Models in src/cas_runner/skills/models.py and CI pipeline in .github/workflows/cas-skill-evals.yml.
  rationale: Provides a formal evaluation suite with typed assertions and test cases
    to continuously measure and prevent regression in agent skills.
  promotion_readiness: high
- id: heterogeneous-agent-telemetry-normalization
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/dashboard/agent_telemetry.py supporting
    ClaudeCode, Antigravity, and generic CodingAgent spans.
  rationale: Normalizes disparate external agent execution logs and traces into a
    standardized OpenTelemetry-compatible span model with cost calculation.
  promotion_readiness: high
- id: deterministic-health-scoring
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/dashboard/health_model.py (calculate_health,
    get_health_reasons, HealthStatus).
  rationale: Calculates composite health indicators and diagnostic explanations as
    pure, side-effect-free functions over quantitative metrics.
  promotion_readiness: high
- id: idempotent-workspace-bootstrapping
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/bootstrap.py (bootstrap, init_workspace,
    merge_cas_governance_block).
  rationale: Automates project scaffolding and non-destructive configuration block
    injection, ensuring agents operate with active governance rules upon onboarding.
  promotion_readiness: high
- id: delta-driven-prompt-fact-projection
  scope: global
  classification: supporting
  evidence_summary: Defined in src/cas_runner/steering/models.py (PromptFact, SteeringRuntimeIndex,
    ArchitecturalDelta) and projection workflows.
  rationale: Transforms raw Git changes into verified, typed facts to ground downstream
    LLM prompts and eliminate hallucinations.
  promotion_readiness: high
- id: reconciliation-agentic-merger
  scope: global
  classification: supporting
  evidence_summary: Implemented in src/cas_runner/governance/agentic_merger.py returning
    typed ResolutionResult models.
  rationale: Employs an LLM-assisted reconciler to resolve semantic merge conflicts
    in structured architectural documentation where textual 3-way git merges fail.
  promotion_readiness: medium
project_pattern_candidates:
- id: ci-encoded-architecture-guardrails
  scope: project
  rationale: Script specs/090-simplify-cicd-workflows/validate_workflows.py implements
    highly specific checks tailored to the CAS repository workflow structure.
  future_promotion_potential: high
- id: multi-runtime-agent-parity
  scope: project
  rationale: Simultaneous synchronization between AGENTS.md, CLAUDE.md, and GEMINI.md
    is specific to the current heterogeneous tool configuration of ideas-to-life-cas.
  future_promotion_potential: medium
- id: runtime-execution-context-bundle
  scope: project
  rationale: Specific disk bundle convention using cas-knowledge/runtime/execution-profile.yaml
    and rule-context.json reflects local runner storage mechanics.
  future_promotion_potential: medium
- id: human-onboarding-checklist
  scope: project
  rationale: Interactive checklist rendered in CLI bootstrap is tailored to current
    GitHub Actions secret and variable configuration needs of this repository.
  future_promotion_potential: low
- id: pattern-scope-classification-framework
  scope: project
  rationale: Governs the local reference architecture taxonomy within ideas-to-life-cas
    prior to cross-organizational enterprise rollout.
  future_promotion_potential: high
- id: ci-driven-steering-projection
  scope: project
  rationale: Workflow wiring in cas-build-steering-projection.yml and cas-continuous-architecture.yml
    reflects project-specific CI triggers.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: pattern-code-intelligence-drift-alignment
  rationale: Visionary concept for comparing codebase ASTs against declared architectural
    intent to detect architectural drift.
  evidence_gaps: Lacks concrete AST extraction components in current codebase; supported
    only by architectural vision documents.
  recommended_next_step: Defer until AST parsing services and diff engines are implemented
    in cas_runner.
- id: pattern-automated-detect-analyse-execute-loop
  rationale: High-level autonomous closed-loop governance proposal.
  evidence_gaps: Requires clearer operational boundary between autonomous agent execution
    and mandatory human architectural sign-off.
  recommended_next_step: Define human-in-the-loop transition contracts before promoting
    to global candidate.
- id: lineage-aware-architectural-delta-slicing
  rationale: Maps raw VCS changes directly to capability lineage graphs.
  evidence_gaps: Data models exist in steering/models.py, but runtime consumption
    by the FlowRunner is not yet fully exercised.
  recommended_next_step: Gather runtime traces showing capability lineage slice resolution
    across multiple project repositories.
- id: human-in-the-loop-governance
  rationale: Approval gates for high-stakes governance state changes.
  evidence_gaps: Currently modeled via document templates rather than enforced programmatically
    in GovernanceActionEngine.
  recommended_next_step: Implement explicit approval transition checks in TransitionRegistry.
