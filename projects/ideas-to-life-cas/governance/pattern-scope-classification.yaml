candidate_patterns_requiring_review:
- id: ci-workflow-validation-gates
  rationale: CI workflow validation is a quality gate but may be too project-specific;
    evidence is from one repo.
  evidence_gaps: No cross-project evidence of reuse; rules may be coupled to this
    repo's conventions.
  recommended_next_step: Gather examples from other projects before promoting.
- id: agentic-merger
  rationale: Agentic merger is a complex emergent component; evidence is limited to
    this project's governance merging.
  evidence_gaps: Only one implementation, no independent reproduction; semantic merging
    is hard to validate.
  recommended_next_step: Collect more usage cases and test across different document
    types.
- id: capability-lineage-tracking
  rationale: Capability lineage models are defined, but actual usage and evolution
    tracking is still emerging.
  evidence_gaps: Few concrete scenarios of lineage-based decisions.
  recommended_next_step: Document real traceability use cases.
- id: heuristic-to-pattern-promotion-lifecycle
  rationale: Template exists but promotion process is not fully exercised.
  evidence_gaps: No examples of successful promotion yet.
  recommended_next_step: Run a pilot promotion and capture learnings.
