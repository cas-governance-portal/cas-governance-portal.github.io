global_pattern_candidates:
- id: schema-enforced-domain-contracts
  scope: global
  classification: core
  evidence_summary: Strong evidence from governance/models.py and steering/models.py
    where Pydantic/JSON-schema contracts define governance actions, compliance findings,
    traceable metrics, steering facts, and capability records. Recurring across many
    proposals and directly supports agent-output validation.
  rationale: Foundational mechanism for validating LLM/agent output and enforcing
    typed domain contracts. It is independent of project-specific storage and broadly
    reusable across agentic governance systems.
  promotion_readiness: high
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: Implemented in governance_action_engine.py through TransitionRegistry
    and GovernanceActionEngine, with related service and model support. Many duplicate
    proposals describe the same explicit governance state-machine mechanism.
  rationale: A deterministic transition registry for governed lifecycle changes is
    a foundational governance mechanism and is reusable across domains where autonomous
    or semi-autonomous agents must be constrained to valid state transitions.
  promotion_readiness: high
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner in runner.py and CLI entrypoints provide a deterministic
    sequential pipeline with shared execution context. Recurring proposals describe
    the same orchestration model with different names.
  rationale: A predictable, inspectable sequential pipeline with shared context is
    a foundational execution mechanism for multi-step agentic workflows and is not
    inherently tied to CAS-specific business rules.
  promotion_readiness: high
- id: provider-agnostic-llm-facade
  scope: global
  classification: supporting
  evidence_summary: LiteLLMClient and MockLLMClient demonstrate a production-and-mock
    client abstraction over LiteLLM. Many duplicate proposals describe the same provider-agnostic
    LLM facade with deterministic fallback.
  rationale: A reusable integration boundary that decouples agent logic from model
    providers. It is supporting rather than foundational because systems without LLM
    dependencies do not need it, but within LLM-based agentic systems it is highly
    reusable.
  promotion_readiness: high
- id: deterministic-mock-evaluation-harness
  scope: global
  classification: supporting
  evidence_summary: MockLLMClient provides a deterministic test double for LLM interactions.
    This mechanism is repeated across many adapter, mock, and testing proposals.
  rationale: Deterministic mock evaluation is broadly useful for CI, regression testing,
    and offline execution of agent workflows. It is supporting but reusable and well
    evidenced by implementation.
  promotion_readiness: high
- id: telemetry-observable-agent-steps
  scope: global
  classification: supporting
  evidence_summary: OpenTelemetry dependencies, TraceableMetric, runtime traces, and
    health-model proposals show telemetry and traceability around agent steps. Multiple
    proposals duplicate observability and traceability concerns.
  rationale: Instrumenting agent steps with traceable metrics is a reusable observability
    mechanism for multi-step agentic systems. It is supporting because it complements
    rather than defines core workflow behavior.
  promotion_readiness: high
- id: declarative-agent-command-registry
  scope: global
  classification: supporting
  evidence_summary: Declarative command specifications under .agents/commands and
    skills directories externalize task definitions. Several proposals describe declarative
    agent procedures and skill manifests.
  rationale: A declarative registry of agent commands, procedures, or skills is reusable
    across agent platforms and improves inspectability and repeatability. It is supporting
    rather than core because it depends on an execution environment.
  promotion_readiness: high
- id: reconciliation-agentic-merger
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger and ResolutionResult support LLM-assisted semantic
    reconciliation of conflicting governance/configuration artifacts. Multiple proposals
    describe agentic merge, conflict resolution, and context-merging variants.
  rationale: Semantic reconciliation is a reusable pattern for multi-source governance
    and documentation conflicts that textual three-way merge cannot resolve. Evidence
    is strong but maturity is still emerging, so readiness is medium rather than high.
  promotion_readiness: medium
project_pattern_candidates:
- id: file-backed-blackboard-workspace
  scope: project
  rationale: The file-backed blackboard is implemented and valuable for CAS, but evidence
    is from one project and the storage layout is closely tied to CAS knowledge conventions.
    It may become reusable once cross-project evidence exists.
  future_promotion_potential: high
- id: declarative-steering-projection
  scope: project
  rationale: Transforms repository deltas and capability definitions into prompt facts
    for CAS agent steering. The concept is reusable, but current evidence and terminology
    are project-specific and tightly coupled to CAS steering semantics.
  future_promotion_potential: high
- id: ci-driven-steering-projection
  scope: project
  rationale: Depends on CAS-specific GitHub workflows, projections, and governance
    artifacts. The general idea of CI-triggered architecture projection is reusable,
    but current evidence is implementation-specific.
  future_promotion_potential: medium
- id: rule-grounded-compliance-evaluation
  scope: project
  rationale: ComplianceEngine evaluates CAS governance rules and emits findings. The
    pattern is valuable in this project, but global promotion requires evidence of
    rule models and compliance semantics across multiple domains.
  future_promotion_potential: high
- id: capability-lineage-anchoring
  scope: project
  rationale: Capability lineage is well modelled for CAS steering and architecture
    state, but the concrete schema and terminology are project-specific. It may become
    a reusable architecture-intelligence pattern.
  future_promotion_potential: medium
- id: heuristic-to-pattern-promotion-lifecycle
  scope: project
  rationale: The lifecycle is defined through CAS templates and architecture documentation,
    but it is still a project-specific governance process. It is promising but needs
    cross-project validation before global promotion.
  future_promotion_potential: high
- id: deterministic-governance-injection-bootstrap
  scope: project
  rationale: Workspace bootstrap and governance block injection are implemented for
    CAS onboarding. The general mechanism is reusable, but current evidence is heavily
    tied to CAS repository conventions.
  future_promotion_potential: high
- id: pattern-continuous-architecture-governance-loop
  scope: project
  rationale: Strategic architecture work describes automated detect-analyse-execute
    governance loops. It is important for CAS and well evidenced as direction, but
    not yet stable enough for global classification.
  future_promotion_potential: high
- id: compliance-driven-health-scoring
  scope: project
  rationale: Health scoring from compliance metrics is implemented and useful within
    CAS. It should remain project-scoped until the metric model and scoring thresholds
    are validated beyond this project.
  future_promotion_potential: medium
- id: skill-evaluation-harness
  scope: project
  rationale: Skill evaluation models and CI workflows are present, but the skill taxonomy
    and evaluation semantics are still project-specific. Reusable in principle, but
    needs broader adoption evidence.
  future_promotion_potential: medium
- id: multi-agent-instruction-manifests
  scope: project
  rationale: Parallel instruction files for multiple agent ecosystems are tied to
    CAS repository layout and tooling. The underlying concern is reusable, but the
    pattern is not yet generalised.
  future_promotion_potential: medium
- id: cross-tool-skill-sync
  scope: project
  rationale: Symlink/copy synchronisation across agent tool directories is implemented
    but platform- and repository-specific. It may be reusable once other projects
    demonstrate the same need.
  future_promotion_potential: medium
- id: template-driven-artifact-evolution
  scope: project
  rationale: CAS knowledge templates standardise patterns, rules, signals, and ADRs.
    The practice is valuable but the concrete taxonomy is project-specific and should
    remain scoped until broader evidence exists.
  future_promotion_potential: medium
- id: workspace-governance-injection-bootstrap
  scope: project
  rationale: Injects governance context into agent instruction files at workspace
    bootstrap. The mechanism is reusable, but current evidence is tied to CAS agent
    platforms and file names.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: pat-business-intent-integration
  rationale: Strategic future-direction pattern with high importance, but it is not
    implemented and depends on business-intent artifacts that are not yet concretely
    modelled in the current architecture state.
  evidence_gaps: No implemented business-intent model, ingestion workflow, or cross-project
    traceability evidence. Architecture work signals are strategic rather than implementation-backed.
  recommended_next_step: Run a discovery/design spike to define a minimal business-intent
    model and validate traceability through at least one implemented workflow before
    scope classification.
- id: pat-code-intelligence
  rationale: Strategic direction for code-intelligence and drift detection, but current
    evidence is largely architectural intent rather than an implemented code-analysis
    capability.
  evidence_gaps: Missing implementation evidence for repository structure analysis,
    dependency extraction, drift detection, and integration with AID/ADR/pattern governance.
  recommended_next_step: Prototype repository structure and dependency analysis against
    one project and capture evidence before considering global classification.
- id: pat-architecture-knowledge-graph
  rationale: A knowledge graph for architecture intelligence is strategically recurring,
    but the current architecture state is file/document-centric and does not yet demonstrate
    graph normalization or query behavior.
  evidence_gaps: No implemented graph schema, relationship extraction, multi-hop query
    capability, or cross-project lineage evidence.
  recommended_next_step: Create a narrow graph-model prototype for existing ADR/pattern/architecture-work
    relationships and evaluate whether graph semantics add measurable value.
- id: pat-external-ecosystem-integration
  rationale: External ecosystem integration is a plausible strategic direction, but
    concrete connector implementations, provenance rules, and security boundaries
    are not yet evidenced.
  evidence_gaps: No implemented external connectors, synchronization contracts, provenance
    model, or trust/security validation.
  recommended_next_step: Document integration boundary requirements and build one
    governed connector prototype with provenance handling.
- id: pat-governance-action-framework
  rationale: Governance automation is strategically important and partially aligned
    with existing state-machine mechanisms, but the proposal overlaps with already
    implemented transition registry work and lacks evidence for human approval routing.
  evidence_gaps: Insufficient evidence for approval workflows, automated routing,
    audit logs, and backlog progression outcomes. Overlaps with finite-state-governance-engine.
  recommended_next_step: Reconcile with finite-state-governance-engine and collect
    evidence from actual promotion/review workflows before deciding whether a separate
    pattern is needed.
- id: pattern-architecture-intelligence-knowledge-graph
  rationale: Duplicates the architecture knowledge graph strategic direction. It is
    not ready for global or project promotion as a distinct pattern.
  evidence_gaps: Strategic signals only; no implemented graph storage, query layer,
    or normalized relationship schema.
  recommended_next_step: Merge with pat-architecture-knowledge-graph and evaluate
    via a graph-model prototype.
- id: pattern-business-intent-integration
  rationale: Duplicates pat-business-intent-integration. It expresses strategic intent
    but lacks implementation evidence.
  evidence_gaps: No concrete business-intent artifact schema, ingestion path, or traceability
    to decisions/code.
  recommended_next_step: Merge with pat-business-intent-integration and require an
    implementation-backed proof of concept.
- id: runtime-execution-context-store
  rationale: Runtime context files exist, but the proposal overlaps with file-backed
    knowledge storage and lacks evidence of a stable reusable runtime-context contract.
  evidence_gaps: Only directory/file evidence under cas-knowledge/runtime; no cross-project
    model or lifecycle validation.
  recommended_next_step: Clarify relationship to file-backed-blackboard-workspace
    and collect evidence of runtime-context reuse across runs or projects.
- id: runtime-rule-context
  rationale: Runtime rule-context.json exists, but scope is unclear and overlaps with
    compliance and externalized execution configuration proposals.
  evidence_gaps: No evidence of schema stability, update lifecycle, or cross-project
    reuse.
  recommended_next_step: Define rule-context schema and update process, then assess
    as part of compliance or runtime configuration patterns.
- id: self-reported-health-observability
  rationale: Health observability is promising but the proposal is a partial duplicate
    of telemetry and health-scoring patterns and has insufficient cross-project evidence.
  evidence_gaps: Implementation evidence is limited to CAS dashboard health model;
    no validation of thresholds or reuse.
  recommended_next_step: Consolidate with compliance-driven-health-scoring and telemetry-observable-agent-steps,
    then validate scoring model with real runs.
- id: flow-runner-orchestration
  rationale: Low-evidence duplicate of the sequential pipeline pattern. The proposal
    does not add enough distinct semantics to justify separate classification.
  evidence_gaps: Only generic FlowRunner evidence; no additional orchestration mechanics
    beyond shared-context sequential execution.
  recommended_next_step: Merge into sequential-pipeline-flow-runner and discard as
    a separate candidate unless a distinct orchestration model is evidenced.
- id: prompt-fact-extraction
  rationale: Prompt fact extraction is mentioned as a low-evidence concept and overlaps
    with steering fact projection and prompt-fact contract proposals.
  evidence_gaps: No clear implementation surface or evidence that prompt facts are
    extracted as a separate mechanism rather than derived from git deltas and capability
    records.
  recommended_next_step: Merge into steering projection cluster and require concrete
    evidence before further classification.
- id: agentic-merger-artifact-reconciliation
  rationale: Low-evidence duplicate of reconciliation-agentic-merger. It lacks distinct
    evidence to justify a separate pattern.
  evidence_gaps: Only AgenticMerger symbol evidence; no additional artifact-reconciliation
    semantics beyond the global candidate.
  recommended_next_step: Merge into reconciliation-agentic-merger.
- id: git-delta-prompt-facts
  rationale: Low-evidence proposal overlapping with delta-driven prompt fact projection
    and structured fact indexing. Evidence strength is explicitly low.
  evidence_gaps: Model names indicate a plausible flow, but implementation, recurrence,
    and cross-project evidence are insufficient.
  recommended_next_step: Merge into steering projection cluster and validate through
    implemented projection outputs.
- id: pattern-evolution-lifecycle
  rationale: The lifecycle is described through templates and documentation, but implementation
    evidence and cross-project recurrence are low.
  evidence_gaps: No completed lifecycle runs, promotion outcomes, or cross-project
    adoption evidence.
  recommended_next_step: Collect evidence from real promotions and merge with heuristic-to-pattern-promotion-lifecycle
    if sufficient.
