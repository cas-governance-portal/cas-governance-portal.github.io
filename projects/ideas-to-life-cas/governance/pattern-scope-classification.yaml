global_pattern_candidates:
- id: pattern-architecture-work-registry
  scope: global
  classification: core
  evidence_summary: Derived from signals on regenerated artifacts and architecture
    work aw-ideas-to-life-cas-2026-05-31-001; validated by AEM and alignment reports.
  rationale: Separating authoritative planning state from volatile generated projections
    is a universally applicable principle across continuous architecture frameworks.
  promotion_readiness: high
- id: governed-action-state-machine
  scope: global
  classification: core
  evidence_summary: Implemented in TransitionRegistry and GovernanceActionEngine within
    src/cas_runner/governance/governance_action_engine.py.
  rationale: Essential foundational guardrail mechanism restricting autonomous or
    LLM-driven state mutations to verified, deterministic transition paths.
  promotion_readiness: high
- id: dual-client-llm-provider-abstraction
  scope: global
  classification: core
  evidence_summary: Implemented across LiteLLMClient and MockLLMClient in src/cas_runner/llm/.
  rationale: Provides a clean provider-agnostic LLM interface coupled with strict
    offline mock isolation necessary for deterministic CI/CD and cost control across
    any agentic system.
  promotion_readiness: high
- id: typed-governance-data-contracts
  scope: global
  classification: core
  evidence_summary: Extensively implemented in src/cas_runner/governance/models.py
    using Pydantic domain models for all actions, findings, and metrics.
  rationale: Enforcing strongly-typed domain contracts for inputs and outputs avoids
    runtime schema failures across heterogeneous agentic and human modifications.
  promotion_readiness: high
- id: pattern-governance-gated-ci-pipeline
  scope: global
  classification: core
  evidence_summary: Discovered in GitHub Actions workflows cas-build-validation.yml
    and associated architectural state controls.
  rationale: Foundational execution pattern enforcing automated verification gates
    in CI/CD to prevent unvalidated changes and drift from advancing downstream.
  promotion_readiness: high
- id: declarative-agent-command-manifests
  scope: global
  classification: supporting
  evidence_summary: Evidenced by isolated TOML configuration manifests in .agents/commands/
    for speckit tasks.
  rationale: Decouples prompting context and command harnesses into declarative files,
    supporting high reusability across agentic codebases.
  promotion_readiness: high
- id: continuous-compliance-evaluator
  scope: global
  classification: supporting
  evidence_summary: Implemented via ComplianceEngine and standardized models in src/cas_runner/governance/.
  rationale: Stateless evaluation of repository artifacts against invariant policies
    with structured finding output is widely applicable beyond this project.
  promotion_readiness: high
- id: composite-health-scoring-heuristic
  scope: global
  classification: supporting
  evidence_summary: Implemented as pure functional health derivation in src/cas_runner/dashboard/health_model.py.
  rationale: Translates complex multi-dimensional compliance findings into categorical
    health indicators with transparent reason extraction.
  promotion_readiness: high
- id: file-backed-knowledge-repository
  scope: global
  classification: supporting
  evidence_summary: Evidenced by cas-knowledge/templates/ and workspace bootstrapping
    in src/cas_runner/bootstrap.py.
  rationale: Treating architecture artifacts and ADRs as declarative GitOps files
    rather than external database records is a reusable governance standard.
  promotion_readiness: medium
project_pattern_candidates:
- id: steering-projection-injection
  scope: project
  rationale: Specifically synchronizes CAS governance blocks into AGENTS.md, CLAUDE.md,
    and GEMINI.md files via repository-specific CI workflows.
  future_promotion_potential: medium
- id: pattern-operational-governance-surface
  scope: project
  rationale: Tailored to pre-processing CAS markdown structures for MkDocs Material
    portal publication with lateral link normalization.
  future_promotion_potential: medium
- id: agentic-merge-resolution
  scope: project
  rationale: Semantic resolution of conflicting markdown and json artifacts via LLMs
    is currently experimental and specific to cas_runner's agentic merger.
  future_promotion_potential: high
- id: prompt-fact-steering-projection
  scope: project
  rationale: Binds raw git deltas to prompt facts directly reflecting the internal
    steering model of ideas-to-life-cas.
  future_promotion_potential: medium
- id: template-driven-heuristic-evolution
  scope: project
  rationale: Specific operational workflow codifying the progression from signal to
    heuristic to pattern within cas-knowledge directories.
  future_promotion_potential: low
- id: sequential-flow-runner-orchestration
  scope: project
  rationale: Pipeline execution harness coordinating specific FlowRunner stages in
    cas_runner/runner.py.
  future_promotion_potential: low
- id: pattern-closed-loop-continuous-governance
  scope: project
  rationale: Highly tailored CI/CD autonomous loop operating across specific PR events
    and CAS bot commit routines.
  future_promotion_potential: high
candidate_patterns_requiring_review:
- id: dummy_string
  rationale: Placeholder proposal containing placeholder strings and lacking technical
    substance.
  evidence_gaps: No architectural signals, implementation evidence, or valid context
    provided.
  recommended_next_step: Reject and prune placeholder entries from proposal inputs.
- id: pattern-architecture-knowledge-graph
  rationale: Strategic future direction proposal envisioning a cross-project multi-hop
    graph, without concrete production implementation.
  evidence_gaps: No component or container in the current architecture state implements
    graph database or traversal interfaces.
  recommended_next_step: Defer until an Architecture Knowledge Graph implementation
    prototype is deployed and evidenced.
- id: pattern-business-intent-traceability
  rationale: Strategic proposal linking business objectives to AST components; currently
    represented primarily as intent rather than working software.
  evidence_gaps: Lacks evidence of AST parsing and automated alignment rule execution
    against structured business vision schemas.
  recommended_next_step: Collect operational signals once the Alignment Engine implements
    explicit business vision schema verification.
- id: capability-lineage-provenance
  rationale: Models exist in steering/models.py, but cross-run persistence and multi-project
    utility have not been validated.
  evidence_gaps: Lacks longitudinal evidence demonstrating that capability lineage
    artifacts prevent drift in multi-agent environments.
  recommended_next_step: Review after steering projection runs generate empirical
    lineage records across multiple development iterations.
duplicate_overlapping_patterns:
- patterns:
  - dual-client-llm-provider-abstraction
  - provider-agnostic-llm-adapter
  - struct-004
  - pluggable-client-adapter-pattern
  - pluggable-llm-gateway-mock-fallback
  - pluggable-provider-adapter
  recommended_action: Consolidate under 'dual-client-llm-provider-abstraction'
  rationale: All six proposals describe decoupling LLM integrations behind an adapter
    interface paired with an offline test double.
- patterns:
  - governed-action-state-machine
  - state-transition-registry-guardrail
  - struct-002
  - transition-registry-state-machine
  - schema-enforced-governance-engine
  recommended_action: Consolidate under 'governed-action-state-machine'
  rationale: All proposals describe using TransitionRegistry and GovernanceActionEngine
    to validate state mutations before execution.
- patterns:
  - composite-health-scoring-heuristic
  - diagnostic-health-reflection
  - struct-005
  - health-status-metric-aggregator
  - multi-metric-governance-health-evaluator
  - pure-functional-health-evaluation
  recommended_action: Consolidate under 'composite-health-scoring-heuristic'
  rationale: Identical functional implementation in src/cas_runner/dashboard/health_model.py
    computing health classifications and descriptive reasons.
- patterns:
  - sequential-flow-runner-orchestration
  - sequential-pipeline-runner
  - sequential-pipeline-orchestration
  recommended_action: Consolidate under 'sequential-flow-runner-orchestration'
  rationale: All capture FlowRunner's multi-step execution loop passing context across
    sequential pipeline stages.
- patterns:
  - agentic-merge-resolution
  - agentic-knowledge-merger
  - agentic-semantic-merge-reconciliation
  recommended_action: Consolidate under 'agentic-merge-resolution'
  rationale: Each proposal refers to AgenticMerger reconciling divergent documentation
    artifacts via LLM reasoning.
- patterns:
  - typed-governance-data-contracts
  - struct-001
  - pydantic-domain-entity-modeling
  recommended_action: Consolidate under 'typed-governance-data-contracts'
  rationale: Redundant descriptions of using Pydantic models for domain entities and
    governance payloads.
- patterns:
  - struct-003
  - layered-service-engine-separation
  - service-facade-engine-separation
  recommended_action: Consolidate under 'layered-service-engine-separation'
  rationale: Describes the separation between GovernanceActionService coordination
    and domain computational engines.
- patterns:
  - continuous-compliance-evaluator
  - compliance-first-guardrail-engine
  recommended_action: Consolidate under 'continuous-compliance-evaluator'
  rationale: Both describe ComplianceEngine evaluating rules against workspace inventory
    prior to workflow progression.
- patterns:
  - file-backed-knowledge-repository
  - declarative-template-governed-knowledge
  - declarative-file-system-knowledge-repository
  recommended_action: Consolidate under 'file-backed-knowledge-repository'
  rationale: Redundant specifications of version-controlled markdown template structures
    for architecture knowledge.
- patterns:
  - pattern-automated-detect-analyse-execute-loop
  - pattern-closed-loop-continuous-governance
  recommended_action: Consolidate under 'pattern-closed-loop-continuous-governance'
  rationale: Identical scope describing closed-loop continuous governance automation
    across detection, analysis, and PR remediation.
- patterns:
  - pattern-governance-gated-ci-pipeline
  - pattern-ci-governance-guardrail-enforcement
  recommended_action: Consolidate under 'pattern-governance-gated-ci-pipeline'
  rationale: Duplicate proposals representing build validation blocking pull requests
    on contract infractions.
- patterns:
  - capability-lineage-provenance
  - git-delta-capability-lineage
  - delta-based-change-modeling
  recommended_action: Consolidate under 'capability-lineage-provenance'
  rationale: Overlapping models tracing capability evolution and architectural deltas
    from Git commits in steering/models.py.
