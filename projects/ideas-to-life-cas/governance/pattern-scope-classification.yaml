global_pattern_candidates:
- id: provider-agnostic-llm-facade
  scope: global
  classification: core
  evidence_summary: Implemented in LiteLLMClient and MockLLMClient across multiple
    projects and workflows, consistently decoupling agent logic from provider-specific
    APIs.
  rationale: Provider-agnostic LLM abstraction is foundational for any agentic system,
    enabling vendor portability, deterministic offline testing, and cost-effective
    CI runs. Its high reusability, abstraction level, and architectural significance
    qualify it as a core global pattern.
  promotion_readiness: high
  promotion_rationale: Multiple implementations across governance, steering, and testing
    components, with high evidence strength and maturity. No significant gaps identified.
- id: finite-state-governance-engine
  scope: global
  classification: core
  evidence_summary: TransitionRegistry and GovernanceActionEngine are used to validate
    state transitions across lifecycle operations, ensuring auditable and controlled
    governance actions.
  rationale: Governance state machines are critical for maintaining integrity in autonomous
    systems, preventing illegal transitions and enabling auditability. This pattern
    is highly reusable across any domain with lifecycle management and governance
    requirements.
  promotion_readiness: high
  promotion_rationale: Well-established implementation with clear evidence in models
    and engine code. Recurring across many governance artifacts and aligned with architectural
    intent.
- id: rule-grounded-compliance-evaluation
  scope: global
  classification: core
  evidence_summary: ComplianceEngine evaluates architectural deltas against codified
    rules, producing structured findings and metrics across CI and governance workflows.
  rationale: Rule-based compliance evaluation is essential for enforcing enterprise
    standards, providing quantified risk indicators, and enabling automated decision
    gates. It is abstract enough to apply to any regulatory or policy-driven system.
  promotion_readiness: high
  promotion_rationale: Strong evidence from multiple workflow implementations, structured
    findings, and traceability. High maturity and clarity of purpose.
- id: sequential-pipeline-flow-runner
  scope: global
  classification: core
  evidence_summary: FlowRunner orchestrates multi-step agentic workflows with deterministic
    ordering and shared context propagation across CLI and CI pipelines.
  rationale: Sequential pipeline orchestration is a fundamental architectural mechanism
    for any complex autonomous system, ensuring predictable execution, error short-circuiting,
    and context handoff. Its generality and utility across projects make it a core
    global pattern.
  promotion_readiness: high
  promotion_rationale: Implemented in the main runner and documented in orchestration
    flows, with high evidence strength. Recurring pattern across multiple execution
    scenarios.
- id: file-backed-blackboard-workspace
  scope: global
  classification: core
  evidence_summary: cas-knowledge directory structure serves as a version-controlled,
    human-readable repository for global rules, decisions, patterns, and runtime state.
  rationale: File-backed knowledge repositories are highly reusable for maintaining
    auditable, branchable, and transparent governance memory. They avoid database
    complexity and align with version control workflows, making it a core global pattern
    for any knowledge-intensive system.
  promotion_readiness: high
  promotion_rationale: Widely used across global and project scopes, with templates
    and runtime state. Evidenced by robust directory hierarchy and governance tools.
- id: declarative-steering-projection
  scope: global
  classification: supporting
  evidence_summary: PromptFact and SteeringRuntimeIndex models transform raw git deltas
    into structured prompt contexts for agent reasoning.
  rationale: Prompt fact projection is a reusable mechanism for grounding agent inputs
    in verified repository data, reducing hallucinations and context waste. It is
    applicable to any AI system that consumes code changes or architectural facts.
  promotion_readiness: high
  promotion_rationale: Implemented across steering models and CI workflows, with high
    evidence strength. The pattern is mature and architecturally significant.
- id: agentic-state-reconciliation-merger
  scope: global
  classification: supporting
  evidence_summary: AgenticMerger uses LLM reasoning to reconcile conflicting governance
    and architecture documents, producing structured ResolutionResult outputs.
  rationale: Semantic merging of structured documents is a cross-cutting need in distributed
    agent architectures, beyond text-based 3-way merges. This pattern enables safe,
    auditable, and intelligent reconciliation of knowledge artifacts.
  promotion_readiness: medium
  promotion_rationale: High evidence from multiple merger implementations, but still
    evolving in maturity. Recurrence across governance sync validates its usefulness,
    though additional cross-project validation would strengthen promotion readiness.
- id: compliance-driven-health-scoring
  scope: global
  classification: supporting
  evidence_summary: Health models aggregate compliance findings and operational metrics
    into deterministic health statuses with explanatory reasons.
  rationale: Deriving system health from governance metrics is a reusable pattern
    for observability and decision support. It provides a concise, explainable view
    of complex state and is applicable in many operational contexts.
  promotion_readiness: medium
  promotion_rationale: Strong evidence from health model implementations, but the
    specific thresholds and indicator selection may be domain-dependent. Reusable
    concept with good abstraction, yet requires some customization per project.
project_pattern_candidates:
- id: deterministic-mock-evaluation-harness
  scope: project
  rationale: Specific to testing CAS runner workflows without external LLM dependencies;
    while useful, it is tightly coupled to this project's CI/CD and test environment.
  future_promotion_potential: medium
  governance_observation: The concept of deterministic test doubles is part of the
    broader LLM abstraction pattern and may be absorbed into that global pattern.
- id: declarative-agent-command-registry
  scope: project
  rationale: Declarative command manifests are tailored to the speckit agent tooling
    used in this project; not yet proven across other projects.
  future_promotion_potential: low
  governance_observation: Could become an instance of a generic 'declarative agent
    configuration' global pattern but currently lacks cross-project evidence.
- id: telemetry-observable-agent-steps
  scope: project
  rationale: OpenTelemetry instrumentation is currently configured for CAS runner
    performance tracking; no evidence of reuse beyond this project.
  future_promotion_potential: medium
  governance_observation: Observation as a global pattern is promising, but additional
    instances would strengthen its case.
- id: ci-driven-steering-projection
  scope: project
  rationale: Automated steering projection in CI is specific to the ideas-to-life-cas
    repository's workflow needs and GitHub Actions setup.
  future_promotion_potential: medium
  governance_observation: May evolve into a global 'CI-driven knowledge projection'
    pattern if adopted by multiple projects.
- id: capability-lineage-anchoring
  scope: project
  rationale: Capability lineage tracking is implemented within this project's steering
    models; broader applicability is plausible but not evidenced beyond this context.
  future_promotion_potential: medium
  governance_observation: Strong conceptual foundation, but requires more evidence
    across projects to justify global scope.
- id: heuristic-to-pattern-promotion-lifecycle
  scope: project
  rationale: The heuristic-to-pattern lifecycle is documented and templated within
    cas-knowledge, but its governance workflow is only operationalised in this project.
  future_promotion_potential: high
  governance_observation: A strong candidate for global promotion once multiple teams
    adopt the evolution template and criteria.
- id: bootstrap-governance-block-injection
  scope: project
  rationale: Workspace bootstrapping with governance block merging is tuned to the
    CAS runner's onboarding process; not yet generalised to other platforms.
  future_promotion_potential: medium
  governance_observation: Genericizable as a 'workspace initialization with governance
    injection' pattern, but needs external validation.
- id: workspace-governance-injection-bootstrap
  scope: project
  rationale: Similar to bootstrap-governance-block-injection, this is specific to
    the repository's agent instruction file management.
  future_promotion_potential: medium
  governance_observation: Could merge with the above into a single bootstrap pattern.
- id: template-driven-artifact-evolution
  scope: project
  rationale: Markdown templates for ADRs, patterns, and rules are defined in this
    project's cas-knowledge, but the template management is not yet reused elsewhere.
  future_promotion_potential: high
  governance_observation: The underlying concept of template-forced knowledge artifacts
    is highly reusable; promotion readiness depends on cross-project adoption.
- id: ci-architecture-lifecycle
  scope: project
  rationale: CI workflows orchestrating steering projection, validation, and portal
    publishing are tailored to this repository's CI/CD pipeline.
  future_promotion_potential: low
  governance_observation: The pattern of embedding architecture governance into CI
    is strategic, but implementation details are project-specific.
- id: knowledge-repository-abstraction
  scope: project
  rationale: The KnowledgeProvider protocol abstracts file-based storage in this project;
    may not be general enough for broader persistence needs.
  future_promotion_potential: medium
  governance_observation: Could be abstracted further to support multiple backends
    (database, API), making it more globally applicable.
- id: schema-guided-reasoning
  scope: project
  rationale: Strict JSON schema validation on LLM outputs is implemented in orchestration/reasoning;
    not evidenced outside this project.
  future_promotion_potential: medium
  governance_observation: An important supporting pattern for the core LLM abstraction;
    may be folded into that global pattern.
candidate_patterns_requiring_review:
- id: git-delta-prompt-fact-projection
  rationale: The pattern transforms git deltas into prompt facts but lacks concrete
    implementation evidence beyond model definitions.
  evidence_gaps: No direct usage in code or workflows; only structural models present.
  recommended_next_step: Trace actual usages in steering pipeline and document implementation
    to validate.
- id: capability-record-lineage
  rationale: Capability lineage models are defined but not clearly connected to runtime
    processes or cross-project usage.
  evidence_gaps: Evidence limited to model definitions; no workflow or integration
    proof.
  recommended_next_step: Identify and document real usage in capability management
    flows.
- id: externalized-runtime-context
  rationale: Runtime context files are present but the pattern's general applicability
    is uncertain.
  evidence_gaps: Only file presence; no design rationale or reuse evidence.
  recommended_next_step: Assess whether externalized runtime context is a deliberate
    pattern or just a storage choice.
- id: knowledge-blackboard-templates
  rationale: Templates exist but the pattern is not distinctly separated from the
    file-backed repository pattern.
  evidence_gaps: Duplicative with file-backed knowledge; unclear added value.
  recommended_next_step: Determine if templates are simply an implementation detail
    of the knowledge repository; possibly merge.
- id: runtime-execution-context-store
  rationale: Similar to externalized runtime context; low implementation evidence.
  evidence_gaps: No runtime code references or workflows using this store.
  recommended_next_step: Inspect runner and governance modules for actual reads/writes
    to this store.
- id: prompt-fact-contract
  rationale: Structured prompt facts are mentioned but not clearly implemented or
    used.
  evidence_gaps: Only model naming suggests a contract; no usage in prompts or agents.
  recommended_next_step: Search for PromptFact instantiation or serialization in code
    to confirm existence.
- id: governance-action-service-use-case-boundary
  rationale: Service class exists but its role and boundaries are not documented or
    evidenced.
  evidence_gaps: No usage examples or architectural justification.
  recommended_next_step: Review service implementation and document its interaction
    with engines and models.
- id: flow-runner-application-orchestration
  rationale: FlowRunner is central but its application-level orchestration role is
    not explicitly documented as a distinct pattern.
  evidence_gaps: Limited evidence beyond class presence; might be considered an implementation
    of the pipeline pattern.
  recommended_next_step: Compare with sequential pipeline pattern and decide if it
    should be merged or remains separate.
- id: agentic-merger-artifact-reconciliation
  rationale: AgenticMerger exists but its behavior and use cases are not fully evidenced.
  evidence_gaps: Few concrete usage examples; unclear how it differs from other merger
    patterns.
  recommended_next_step: Document specific reconciliation scenarios and integration
    points.
- id: template-driven-knowledge
  rationale: Similar to knowledge-blackboard-templates; lacks independent evidence.
  evidence_gaps: Overlaps with file-backed knowledge and template-driven artifact
    evolution.
  recommended_next_step: Evaluate if it is a duplicate; likely merge with existing
    patterns.
- id: compliance-exception-handling
  rationale: GovernanceException model suggests exception handling but no clear workflow
    or policy evidence.
  evidence_gaps: No use cases or process description for exceptions.
  recommended_next_step: Clarify how exceptions are raised, approved, and tracked.
- id: externalized-execution-configuration
  rationale: Execution-profile.yaml exists but pattern's generality is uncertain.
  evidence_gaps: No explicit configuration load flow; may just be a file.
  recommended_next_step: Trace consumption of execution-profile.yaml in runner to
    confirm pattern.
