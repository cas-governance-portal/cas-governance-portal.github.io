governance_summary:
  immediate_promotion_candidates:
  - provider-agnostic-llm-facade
  - finite-state-governance-engine
  - schema-enforced-domain-contracts
  - sequential-pipeline-flow-runner
  - git-delta-prompt-fact-projection
  deferred_candidates:
  - knowledge-as-code-blackboard
  - heuristic-to-pattern-promotion-lifecycle
  - telemetry-observable-agent-steps
  - agentic-reconciliation-merger
  - skill-packaged-agent-procedures
  - declarative-agent-command-registry
  - ci-driven-steering-projection
  - capability-lineage-anchoring
  - template-driven-knowledge-capture
  - workspace-bootstrap-injection
  - declarative-steering-projection
  - rule-grounded-compliance-evaluation
  - agentic-merge-resolution
  rejected_candidates:
  - ci-embedded-orchestration
  major_governance_risks:
  - Excessive duplication across LLM abstraction, pipeline orchestration, and governance
    state machine patterns poses tracking and consistency risks.
  - Multiple overlapping compliance, health, steering, and bootstrap patterns dilute
    governance clarity and need consolidation before promotion.
  - Premature promotion of project-scoped patterns could lead to unvalidated global
    standards.
  - Evidence for several deferred patterns is concentrated in a single project, risking
    overgeneralization if promoted early.
