promotion_preconditions_not_met:
- pattern_id: reconciliation-agentic-merger
  unmet_preconditions:
  - No critical governance risks exist
  - Sufficient evidence exists
  missing_evidence:
  - Empirical benchmarks comparing automated LLM merges with human architect conflict
    resolution
  - Safety verification ensuring zero schema corruption during conflict resolution
  rationale: Semantic document reconciliation by an LLM poses high risk of silent
    data loss or schema distortion in governed knowledge stores.
  recommended_next_step: Conduct shadow evaluation runs in CI to quantify merge accuracy
    against human decisions.
- pattern_id: pattern-business-intent-traceability
  unmet_preconditions:
  - Sufficient evidence exists
  - Promotion readiness is high or medium
  missing_evidence:
  - Working AST parser linking code components to intent models
  - Pydantic schemas binding business goals to ADRs
  rationale: Strategic proposal with high long-term value, but without runtime code
    presence it cannot be validated.
  recommended_next_step: Implement a pilot prototype in cas_runner to extract and
    bind intent from markdown headers to code AST.
- pattern_id: pattern-architecture-knowledge-graph
  unmet_preconditions:
  - Sufficient evidence exists
  - Promotion readiness is high or medium
  missing_evidence:
  - Production graph database schema or indexer
  - Benchmark of GitOps compatibility vs file-backed workspace
  rationale: Current system state relies completely on file-backed persistence; introducing
    graph-based persistence is premature.
  recommended_next_step: Prototype an in-memory graph indexer querying existing markdown
    frontmatter to prove traversal utility.
- pattern_id: pattern-deterministic-lifecycle-gating
  unmet_preconditions:
  - Sufficient evidence exists
  - Promotion readiness is high or medium
  missing_evidence:
  - Integration test evidence of CI runner blocking PRs missing accepted ADRs
  rationale: Significant functional overlap with Finite State Governance Engine; standalone
    gating rules remain unevidenced in runner steps.
  recommended_next_step: Embed ADR presence checks directly into TransitionRegistry
    rules and verify in build validation tests.
- pattern_id: pattern-continuous-governance-loop
  unmet_preconditions:
  - No critical governance risks exist
  - Sufficient evidence exists
  missing_evidence:
  - Formal boundary definition for autonomous code remediation vs human approval
  rationale: Unattended detect-analyse-execute remediation loops risk unintended production
    mutations without explicit gating.
  recommended_next_step: Restrict closed-loop automation to proposal generation before
    enabling automated mutation workflows.
governance_summary:
  immediate_promotion_candidates:
  - provider-agnostic-llm-facade
  - finite-state-governance-engine
  - schema-enforced-domain-contracts
  - file-backed-blackboard-workspace
  - sequential-pipeline-flow-runner
  - pattern-architecture-work-registry
  deferred_candidates:
  - declarative-steering-projection
  - telemetry-observable-agent-steps
  - rule-grounded-compliance-evaluation
  - pattern-scope-classification-framework
  - reconciliation-agentic-merger
  - pattern-business-intent-traceability
  - pattern-architecture-knowledge-graph
  - pattern-deterministic-lifecycle-gating
  - pattern-continuous-governance-loop
  rejected_candidates:
  - layered-governance-service-facade
  - docs-as-code-portal-projection
  - pattern-proposal-only-steering-projection
  - declarative-agent-command-registry
  major_governance_risks:
  - Premature promotion of strategic concept patterns lacking runtime implementation
    (e.g. Business Intent Traceability, Architecture Knowledge Graph)
  - Unbounded agent authority risk from unvetted semantic merge engines (Reconciliation
    Agentic Merger) modifying governance assets
  - Catalog bloat and fragmentation caused by promoting overlapping variants of core
    client, runner, and FSM patterns
  - Overfitting global patterns to single-project tooling idiosyncrasies (e.g. MkDocs
    portal projection and speckit commands)
