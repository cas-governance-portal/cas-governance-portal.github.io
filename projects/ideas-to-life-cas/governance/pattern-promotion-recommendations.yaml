promotion_preconditions_not_met:
- pattern_id: pattern-business-intent-traceability
  unmet_preconditions:
  - sufficient evidence exists
  - cross-project applicability demonstrated
  missing_evidence:
  - Production schema ingestion implementation
  - Automated strategic drift detection benchmark data from at least two repositories
  rationale: Strategic direction is exceptionally clear, but the ingestion models
    and drift calculators are in conceptual design without working pipeline code.
  recommended_next_step: Implement prototype business intent schema ingestion in cas_runner
    and evaluate across two distinct projects.
- pattern_id: pattern-architecture-knowledge-graph
  unmet_preconditions:
  - sufficient evidence exists
  - concept stability
  missing_evidence:
  - Production graph storage engine or query interface implementation
  - Performance benchmarks comparing multi-hop traversal against filesystem indexing
  rationale: Documented as an aspirational architectural direction; lacks an actual
    graph backend or runtime query engine.
  recommended_next_step: Construct an in-memory graph projection prototype using networkx
    or RDF within the forensic extractor step.
