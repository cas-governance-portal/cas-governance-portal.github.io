promotion_preconditions_not_met:
- pattern_id: git-delta-prompt-fact-projection
  unmet_preconditions:
  - evidence strength
  - consolidated concept
  missing_evidence:
  - No single implementation beyond this project.
  - Overlap with several other prompt-fact projections.
  rationale: Promising concept but evidence is emerging and there are many overlapping
    proposals. Needs consolidation and cross-project validation.
  recommended_next_step: Consolidate overlapping proposals into a single pattern and
    gather evidence from additional projects or use cases.
- pattern_id: deterministic-mock-evaluation-harness
  unmet_preconditions:
  - distinctness
  - promotion readiness
  missing_evidence:
  - Usually used alongside real client; may be part of provider abstraction.
  rationale: Mock client is well-evidenced but not a standalone pattern; duplication
    with provider abstraction.
  recommended_next_step: Decide whether to keep as a separate pattern or subsume under
    provider-agnostic LLM client pattern.
- pattern_id: health-dashboard-projection
  unmet_preconditions:
  - canonical representation
  - evidence strength
  missing_evidence:
  - Inconsistent naming and scope; may be project-specific.
  rationale: Health scoring models are emerging and appear in multiple forms with
    unclear canonical representation.
  recommended_next_step: Merge health-related proposals and evaluate if the health
    calculation logic is domain-agnostic.
- pattern_id: pattern-cas-architecture-knowledge-graph
  unmet_preconditions:
  - implementation
  - evidence strength
  missing_evidence:
  - No concrete implementation or evidence of cross-project benefits.
  rationale: Strategic direction but only expressed in future direction proposals,
    with no implementation yet.
  recommended_next_step: Gather more evidence from architecture work or pilot projects.
- pattern_id: pattern-cas-business-intent-integration
  unmet_preconditions:
  - implementation
  - evidence strength
  missing_evidence:
  - No codebase evidence; only architectural signals.
  rationale: Business intent integration is a future vision with no implemented components.
  recommended_next_step: Review architecture work to determine feasibility and define
    concrete evidence requirements.
governance_summary:
  immediate_promotion_candidates:
  - provider-agnostic-llm-facade
  - sequential-pipeline-flow-runner
  - finite-state-governance-engine
  - schema-enforced-domain-contracts
  deferred_candidates:
  - compliance-engine-guardrail
  - telemetry-observable-agent-steps
  - file-backed-knowledge-blackboard
  - agentic-merger
  rejected_candidates: []
  major_governance_risks:
  - High number of duplicate proposals for core patterns; must consolidate before
    promotion to avoid fragmentation.
  - Several global candidates have medium readiness and need cross-project evidence.
  - Project-specific patterns are well-implemented but lack evidence of general applicability.
  - Future-direction patterns are strategically important but not yet ready for governance
    promotion.
