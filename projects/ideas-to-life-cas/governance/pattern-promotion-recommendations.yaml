deferred_candidates:
- pattern_id: telemetry-observable-agent-steps
  recommendation: defer
  rationale: Runtime dependencies and data models exist, but production-wide deployment
    across multiple project flows remains partial.
  evidence_gaps: Lacks end-to-end tracing telemetry traces collected across disparate
    downstream projects.
  promotion_criteria_missing:
  - governance_maturity
  - recurrence
  recommended_next_step: Expand OpenTelemetry span instrumentation across all step
    implementations and validate collector pipelines.
  scope_alignment: global
  confidence: medium
- pattern_id: docs-as-code-portal-projection
  recommendation: defer
  rationale: Coupled to the specific MkDocs and plugin setup of the originating repository.
  evidence_gaps: Lacks generalized abstraction independent of repository theme and
    directory layout.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Extract generic MkDocs static documentation generator configuration
    into reusable action/module.
  scope_alignment: project
  confidence: high
- pattern_id: workspace-bootstrap-template-injection
  recommendation: defer
  rationale: Assumes specific directory structures and local repository attach semantics
    unique to the current CAS workspace implementation.
  evidence_gaps: Validation in non-standard project folder hierarchies is missing.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Generalize workspace bootstrap mechanics to support configurable
    layout templates.
  scope_alignment: project
  confidence: medium
- pattern_id: declarative-agent-command-registry
  recommendation: defer
  rationale: Directly models Speckit agentic skill TOML manifests in .agents/commands/
    rather than a generalized agent specification format.
  evidence_gaps: Cross-framework agent interoperability tests have not been executed.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Define a vendor-neutral schema for agent commands and skill
    manifests.
  scope_alignment: project
  confidence: medium
- pattern_id: file-system-knowledge-repository
  recommendation: defer
  rationale: Directly bound to file-system conventions of cas-knowledge pending generalized
    multi-backend storage abstractions.
  evidence_gaps: Evidence is confined to single git repository file storage without
    remote or database abstraction support.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Formalize abstract KnowledgeProvider contracts separating
    repository interfaces from local filesystem implementations.
  scope_alignment: project
  confidence: medium
- pattern_id: layered-governance-service-facade
  recommendation: defer
  rationale: Application-level coordinator wrapping GovernanceActionService, ComplianceEngine,
    and FlowRunner specific to CLI commands of ideas-to-life-cas.
  evidence_gaps: Service layer is tightly coupled to specific local CLI runner invocation
    semantics.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Evaluate if domain engine decoupling renders this facade
    specific only to the reference implementation.
  scope_alignment: project
  confidence: high
- pattern_id: reconciliation-agentic-merger
  recommendation: defer
  rationale: Semantic three-way resolution of architectural Markdown/YAML via LLM
    is promising, but currently marked emerging with hallucination risk.
  evidence_gaps: Lacks empirical benchmarks evaluating conflict resolution accuracy
    against real-world merge edge cases across multiple project histories.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Conduct structured testing against synthetic and real merge
    conflicts to determine error boundaries and failure fallbacks.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-business-intent-traceability
  recommendation: defer
  rationale: High strategic value connecting business objectives to technical architecture
    deltas, but currently at future_direction maturity.
  evidence_gaps: No concrete schema contracts or ingestion runtime implementation
    currently exist in the codebase.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Prototype schema models for business intent entities and
    evaluate ingestion within a sample project workflow.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-architecture-knowledge-graph
  recommendation: defer
  rationale: Cross-project impact analysis and multi-hop relationship traversal would
    benefit enterprise portfolios, but relies on future direction signals.
  evidence_gaps: Lacks graph storage, query interface, or implementation artifacts
    in active runner components.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Draft a formal ADR exploring graph database vs in-memory
    index projections from repository metadata.
  scope_alignment: global
  confidence: high
- pattern_id: capability-lineage-anchoring
  recommendation: defer
  rationale: Lineage schemas exist in steering models, but production validation of
    multi-hop capability ancestry across multiple repos is limited.
  evidence_gaps: Evidence is confined to single-project data structures without cross-repository
    verification.
  promotion_criteria_missing:
  - recurrence
  - evidence_quality
  recommended_next_step: Run multi-repository pilot tracking capability ancestry during
    upstream governance propagation.
  scope_alignment: global
  confidence: medium
