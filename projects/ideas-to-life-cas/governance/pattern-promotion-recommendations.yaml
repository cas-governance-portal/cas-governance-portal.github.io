deferred_candidates:
- pattern_id: agentic-state-reconciliation-merger
  recommendation: defer
  rationale: AgenticMerger is an emerging pattern with high evidence of implementation,
    but its correctness and general applicability are not yet established. Needs more
    evidence from other projects and validation of merge quality.
  evidence_gaps: No evaluation of merge outcomes; no examples from other projects.
  promotion_criteria_missing:
  - recurrence
  - cross_project_applicability
  - governance_maturity
  recommended_next_step: Create test scenarios and evaluate merge quality across different
    document types.
  scope_alignment: global
  confidence: medium
- pattern_id: rule-grounded-compliance-evaluation
  recommendation: defer
  rationale: Strategic direction with high architectural significance, but evidence
    of cross-project impact is missing. Needs validation of compliance loop benefits
    in a second project.
  evidence_gaps: No evidence of adoption outside CAS; requires validation of governance
    loop benefits.
  promotion_criteria_missing:
  - recurrence
  - cross_project_applicability
  recommended_next_step: Instrument and measure governance loop in a second project.
  scope_alignment: global
  confidence: medium
- pattern_id: capability-lineage-anchoring
  recommendation: defer
  rationale: Tracking lineage of capabilities is valuable, but the current implementation
    is embedded in models and lacks clear evidence of broader reuse. Needs more architectural
    significance and cross-project validation.
  evidence_gaps: Only models exist; no integration with actual traces or metrics.
  promotion_criteria_missing:
  - recurrence
  - governance_maturity
  - cross_project_applicability
  recommended_next_step: Implement trace capture and map to the envelope model.
  scope_alignment: global
  confidence: medium
- pattern_id: file-backed-blackboard-workspace
  recommendation: defer
  rationale: File-backed blackboard is a promising pattern, but evidence is limited
    to the core CAS implementation. Broader applicability is unproven. Needs more
    evidence of use across projects.
  evidence_gaps: Limited implementation details and no cross-project validation.
  promotion_criteria_missing:
