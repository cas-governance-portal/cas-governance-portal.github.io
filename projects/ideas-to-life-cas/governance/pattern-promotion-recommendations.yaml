deferred_candidates:
- pattern_id: reconciliation-agentic-merger
  recommendation: defer
  rationale: Autonomous conflict resolution is a high-value pattern for multi-agent
    systems, but its maturity is still emerging; it should be promoted cautiously.
  evidence_gaps: Limited evidence of successful reconciliation outcomes; only a single
    implementation (AgenticMerger).
  promotion_criteria_missing:
  - recurrence
  - evidence quality
  - governance maturity
  recommended_next_step: Collect outcome logs and test results from agentic merges
    across multiple projects.
  scope_alignment: global
  confidence: medium
- pattern_id: bootstrap-governance-block-injection
  recommendation: defer
  rationale: Workspace initialization and governance block injection are closely tied
    to CAS onboarding flows and file-layout conventions, limiting immediate reuse
    beyond this project.
  evidence_gaps: Only one project evidence; no cross-project demonstration.
  promotion_criteria_missing:
  - reusability
  - cross-project applicability
  recommended_next_step: Abstract the bootstrap logic into a generic library and adopt
    in another project.
  scope_alignment: project
  confidence: medium
- pattern_id: capability-lineage-anchoring
  recommendation: defer
  rationale: Capability lineage tracking is specific to architecture knowledge management
    and is currently evidenced only in steering models.
  evidence_gaps: Limited recurrence; no independent validation of lineage tracking.
  promotion_criteria_missing:
  - recurrence
  - evidence quality
  recommended_next_step: Implement capability lineage tracking in a second project
    and document benefits.
  scope_alignment: project
  confidence: medium
- pattern_id: ci-driven-steering-projection
  recommendation: defer
  rationale: Automating steering projections through CI is a pattern for this project's
    delivery lifecycle; similar mechanisms may exist elsewhere but lack cross-evidence.
  evidence_gaps: Only one CI workflow example; no cross-project reuse.
  promotion_criteria_missing:
  - reusability
  - recurrence
  recommended_next_step: Create a reusable CI action for steering projection and apply
    to another project.
  scope_alignment: project
  confidence: medium
- pattern_id: declarative-agent-command-registry
  recommendation: defer
  rationale: Declarative TOML manifests for agent commands are tied to the specific
    speckit CLI and .agents/ directory conventions.
  evidence_gaps: No cross-project evidence; specificity to .agents/ structure.
  promotion_criteria_missing:
  - reusability
  - architectural significance
  recommended_next_step: Generalize the registry format and document adoption in a
    separate project.
  scope_alignment: project
  confidence: low
- pattern_id: service-facade-application-boundary
  recommendation: defer
  rationale: The service layer facade is a generic pattern, but here it is tightly
    integrated with governance engines and CLI entry points; it is not sufficiently
    demonstrated as a standalone architectural contribution.
  evidence_gaps: No standalone demonstration; only visible as part of the governance
    action service.
  promotion_criteria_missing:
  - architectural significance
  - reusability
  recommended_next_step: Document the service facade as a reusable pattern with explicit
    interfaces and mock implementations.
  scope_alignment: project
  confidence: low
- pattern_id: pattern-continuous-governance-loop
  recommendation: defer
  rationale: Continuous governance via GitHub Actions is a project-level implementation;
    the underlying idea is strategic but still under-evidenced.
  evidence_gaps: Only one workflow; no cross-project validation of continuous loop.
  promotion_criteria_missing:
  - recurrence
  - evidence quality
  recommended_next_step: Implement the governance loop in a second project and collect
    metrics on drift reduction.
  scope_alignment: project
  confidence: medium
- pattern_id: structural-cicd-policy-validation
  recommendation: defer
  rationale: CI workflow validation (YAML syntax, pinning, hardcoding checks) is a
    project-specific enforcement mechanism.
  evidence_gaps: Only one validation script; no cross-project usage.
  promotion_criteria_missing:
  - reusability
  - recurrence
  recommended_next_step: Package the validation script as a reusable tool and showcase
    in another repository.
  scope_alignment: project
  confidence: medium
- pattern_id: template-driven-pattern-evolution
  recommendation: defer
  rationale: Markdown templates for knowledge capture are part of the CAS knowledge
    base strategy and not yet proven out of this project.
  evidence_gaps: No evidence of adoption outside this project; templates not generalized.
  promotion_criteria_missing:
  - reusability
  - evidence quality
  recommended_next_step: Validate templates with multiple teams and adapt to generic
