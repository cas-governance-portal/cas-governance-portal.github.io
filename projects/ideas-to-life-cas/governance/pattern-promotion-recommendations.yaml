  - provider-agnostic-llm-adapter
  - struct-004
  - pluggable-client-adapter-pattern
  - pluggable-llm-gateway-mock-fallback
  - pluggable-provider-adapter
  recommended_action: Consolidate under 'dual-client-llm-provider-abstraction'
  rationale: 'All six proposals specify the identical architectural mechanism: wrapping
    LLM client routing behind an adapter protocol paired with an offline test double.'
- patterns_involved:
  - governed-action-state-machine
  - state-transition-registry-guardrail
  - struct-002
  - transition-registry-state-machine
  - schema-enforced-governance-engine
  recommended_action: Consolidate under 'governed-action-state-machine'
  rationale: All five proposals describe gating autonomous mutations through TransitionRegistry
    and GovernanceActionEngine.
- patterns_involved:
