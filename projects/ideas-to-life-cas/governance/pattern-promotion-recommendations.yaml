promotion_preconditions_not_met:
- pattern_id: pattern-architecture-knowledge-graph
  unmet_preconditions:
  - sufficient evidence exists
  - promotion readiness is high or medium
  missing_evidence:
  - No graph database or traversal interface implemented in current architectural
    state containers or components.
  - Lacks cross-project multi-hop query traces.
  rationale: Strategic future direction proposal that lacks a concrete production
    implementation in the existing codebase.
  recommended_next_step: Defer until a prototype knowledge graph service is deployed,
    connected to the knowledge provider, and evidenced in CI.
- pattern_id: pattern-business-intent-traceability
  unmet_preconditions:
  - sufficient evidence exists
  - promotion readiness is high or medium
  missing_evidence:
  - AST component parsing linked to structured business vision schemas.
  - Automated alignment engine rules validating business constraint fulfillment.
  rationale: Strategically valuable intent-to-code traceability concept, but currently
    represented primarily as intent without operational implementation evidence.
  recommended_next_step: Collect operational signals once the Alignment Engine implements
    explicit business vision schema verification.
- pattern_id: capability-lineage-provenance
  unmet_preconditions:
  - sufficient evidence exists
  missing_evidence:
  - Multi-run longitudinal persistence evidence.
  - Demonstration that capability lineage artifacts prevent multi-agent drift across
    multiple project iterations.
  rationale: Domain models exist in steering/models.py, but cross-run utility and
    efficacy in preventing multi-agent drift remain unverified.
  recommended_next_step: Review after steering projection runs generate empirical
    lineage records across multiple development iterations.
governance_summary:
  immediate_promotion_candidates:
  - pattern-architecture-work-registry
  - governed-action-state-machine
  - dual-client-llm-provider-abstraction
  - typed-governance-data-contracts
  - pattern-governance-gated-ci-pipeline
  deferred_candidates:
  - declarative-agent-command-manifests
  - continuous-compliance-evaluator
  - composite-health-scoring-heuristic
  - file-backed-knowledge-repository
  - agentic-merge-resolution
  - steering-projection-injection
  - pattern-operational-governance-surface
  - prompt-fact-steering-projection
  - template-driven-heuristic-evolution
  - sequential-flow-runner-orchestration
  - pattern-closed-loop-continuous-governance
  - pattern-architecture-knowledge-graph
  - pattern-business-intent-traceability
  - capability-lineage-provenance
  rejected_candidates:
  - dummy_string
  major_governance_risks:
  - Premature promotion of strategic-direction proposals (knowledge graph, business
    intent traceability) before production implementation exists.
  - Backlog fragmentation resulting from redundant proposals across identical implementation
    mechanisms (12 duplicate clusters identified).
  - Autonomous bot commit loops if closed-loop continuous governance remediation is
    promoted without comprehensive circuit-breaker controls.
  - Schema version drift if typed domain contracts and state machine transitions evolve
    without backwards-compatible migration guarantees.
