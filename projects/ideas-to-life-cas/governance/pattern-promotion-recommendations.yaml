promotion_candidates:
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Provider-agnostic LLM access is foundational for any agentic
    or AI-intensive system, enabling portability, deterministic testing, and vendor
    independence without business logic coupling.
  promotion_evidence:
  - Multiple proposal variants and concrete implementations (LiteLLMClient, MockLLMClient)
  - Current architecture state includes LLM clients and dependencies on litellm
  - Cross-project applicability to any system requiring LLM integration
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Potential overabstraction if not properly constrained
  - Duplication risk with existing patterns
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Explicit state-transition control is essential for safe autonomous
    agents, ensuring auditability, preventing illegal actions, and providing a reusable
    governance mechanism.
  promotion_evidence:
  - TransitionRegistry and GovernanceActionEngine appear in numerous proposals
  - Current architecture state includes governance_action_engine.py and models
  - Recurring in multiple proposals
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - None identified
  - Potential rigidity if transitions are too strict
  confidence: high
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Strongly typed domain contracts are a foundational practice
    for reliable, maintainable, and interoperable agentic systems, reducing malformed
    data and enabling safe evolution.
  promotion_evidence:
  - Extensive use of Pydantic models in governance and steering modules
  - Current architecture state includes pydantic and jsonschema dependencies
  - Cross-project applicability for typed contracts
  promotion_criteria_met:
  - significance
