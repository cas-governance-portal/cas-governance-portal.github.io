promotion_preconditions_not_met:
- pattern_id: reconciliation-agentic-merger
  unmet_preconditions:
  - Promotion readiness must be high or medium
  - Sufficient evidence must exist
  - No critical governance risks
  missing_evidence:
  - Automated regression merge benchmarks across non-trivial multi-branch conflict
    files
  - Empirical conflict resolution accuracy metrics
  rationale: Semantic document merging introduces potential silent corruption or unintentional
    omission of critical governance constraints without verified resolution benchmarks.
  recommended_next_step: Run automated regression test suites comparing 3-way git
    merges against AgenticMerger outputs on complex merge conflicts.
- pattern_id: pattern-business-intent-traceability
  unmet_preconditions:
  - Promotion readiness must be high or medium
  - Sufficient evidence must exist
  missing_evidence:
  - Production runtime schema ingestion implementation
  - Validation parser mapping intent to concrete ADRs and AST findings
  rationale: The pattern remains in strategic proposal status without operational
    runtime code or AST-backed validation.
  recommended_next_step: Validate schema models and build a pilot parser connecting
    strategic intent items to concrete ADRs and AST findings.
- pattern_id: pattern-architecture-knowledge-graph
  unmet_preconditions:
  - Promotion readiness must be high or medium
  - Sufficient evidence must exist
  missing_evidence:
  - Dedicated graph persistence engine or query interface
  - Cross-project multi-hop impact query validation
  rationale: Presently expressed via ad-hoc relationship dictionaries and markdown
    maps; lacks dedicated graph storage or traversal runtime.
  recommended_next_step: Evaluate graph query requirements and develop a proof of
    concept evaluating cross-project impact queries.
- pattern_id: pattern-continuous-architecture-governance-runtime
  unmet_preconditions:
  - No critical governance risks (unbounded architectural scope)
  - Clear architectural boundary definition
  missing_evidence:
  - Boundary decomposition separating orchestration runner from compliance and publishing
    stages
  rationale: Encompasses multiple distinct governance steps into an overly broad conceptual
    pattern that overlaps heavily with sequential pipeline orchestration.
  recommended_next_step: Decompose into distinct lifecycle integration points and
    review boundaries against CI pipeline steps.
- pattern_id: pattern-operational-intelligence-loop
  unmet_preconditions:
  - Promotion readiness must be high or medium
  - Sufficient evidence must exist
  missing_evidence:
  - Closed-loop telemetry degradation trigger translating into automated architecture
    work items
  rationale: Telemetry collection exists, but the automated closed-loop routing directly
    into architecture proposals remains unproven.
  recommended_next_step: Implement pilot feedback triggers in CI workflows and measure
    signal-to-proposal conversion rate.
