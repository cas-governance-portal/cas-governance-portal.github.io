promotion_candidates:
- pattern_id: provider-agnostic-llm-client
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Foundational architectural abstraction implemented across litellm_client.py
    and mock_client.py, providing critical provider independence and deterministic
    evaluation capabilities across agentic workflows.
  promotion_evidence:
  - recurring architecture work
  - current architecture state support
  - cross-project applicability
  - concrete codebase implementation in src/cas_runner/llm/
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - High degree of redundant candidate proposals requiring consolidation under canonical
    pattern definition
  confidence: high
- pattern_id: centralized-flow-runner-orchestration
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Core execution pipeline implemented in FlowRunner providing
    deterministic step ordering, reproducible execution logs, and mutable blackboard
    context propagation.
  promotion_evidence:
  - current architecture state support
  - concrete codebase implementation in src/cas_runner/runner.py and src/cas_runner/cli.py
  - governance model alignment
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Consolidation needed across dozens of overlapping sequential pipeline proposals
  confidence: high
- pattern_id: state-machine-governance-guardrail
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Essential guardrail component enforcing allowable lifecycle
    state transitions through TransitionRegistry and GovernanceActionEngine, preventing
    uncontrolled autonomous side-effects.
  promotion_evidence:
  - concrete codebase implementation in src/cas_runner/governance/governance_action_engine.py
  - governance model alignment
  - cross-project applicability
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Ensuring state machine rules stay synchronized across distributed agent runners
  confidence: high
- pattern_id: schema-grounded-compliance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Deterministic rule-based compliance evaluation engine that
    inspects generative outputs and deltas against strict schemas prior to committing.
  promotion_evidence:
