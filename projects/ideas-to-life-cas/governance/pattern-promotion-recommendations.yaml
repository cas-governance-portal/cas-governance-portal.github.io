- patterns_involved:
  - provider-agnostic-llm-facade
  - dual-tier-llm-gateway-abstraction
  - swappable-client-adapter
  - client-adapter-test-double
  - deterministic-mock-evaluation-harness
  recommended_action: Consolidate into 'provider-agnostic-llm-facade' as global supporting
    pattern with 'deterministic-mock-evaluation-harness' documented as an implementation
    capability.
  rationale: All five proposals describe the identical design pattern in src/cas_runner/llm/
    where LiteLLMClient provides a vendor-neutral facade paired with MockLLMClient
    test doubles.
- patterns_involved:
  - finite-state-governance-engine
  - transition-registry-state-machine
  - finite-state-governance-action-engine
  recommended_action: Merge into 'finite-state-governance-engine' as a single core
    global pattern candidate.
  rationale: Identical architectural construct in src/cas_runner/governance/governance_action_engine.py
    decoupling transition registration from action execution.
- patterns_involved:
  - schema-enforced-domain-contracts
  - pydantic-domain-entity-modeling
  recommended_action: Merge into 'schema-enforced-domain-contracts' as a core global
    pattern candidate.
  rationale: Both describe using Pydantic models in models.py to establish rigid serialization
    boundaries and runtime schema validation.
- patterns_involved:
  - sequential-pipeline-flow-runner
  - sequential-pipeline-context-propagation
  recommended_action: Consolidate under 'sequential-pipeline-flow-runner' as a project-scoped
    pattern.
  rationale: Both describe the execution mechanics of cas_runner.runner.FlowRunner
