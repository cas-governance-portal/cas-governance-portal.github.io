  evidence_gaps: Only one runtime directory; no independent demonstration.
  promotion_criteria_missing:
  - reusability
  - architectural significance
  recommended_next_step: Abstract runtime context storage into a portable component
    and test in a non-CAS environment.
  scope_alignment: project
  confidence: low
- pattern_id: pattern-architecture-intent-completeness
  recommendation: defer
  rationale: Requiring complete AIDs is a governance rule for this project; it is
