deferred_candidates:
- pattern_id: telemetry-observable-agent-steps
  recommendation: defer
  rationale: Instrumentation dependencies exist in pyproject.toml and domain schemas,
    but comprehensive end-to-end tracing and metric collection across all distributed
    steps remain incomplete.
  evidence_gaps: Requires production validation of span context propagation across
    nested LLM steps and dashboard aggregation pipelines.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Complete span propagation integration across runner CLI flows
    and establish latency/token telemetry baselines.
  scope_alignment: global
  confidence: high
- pattern_id: pure-functional-health-evaluation
  recommendation: defer
  rationale: Implemented cleanly in health_model.py, but promotion should be staged
    alongside broader dashboard visualization and reporting standardization.
  evidence_gaps: Lacks empirical evidence of health status sensitivity and false-alarm
    frequency across multiple target repositories.
  promotion_criteria_missing:
  - cross_project_applicability
  - recurrence
  recommended_next_step: Test health scoring thresholds across diverse downstream
    project workspaces to calibrate warning and critical bands.
  scope_alignment: global
  confidence: high
- pattern_id: declarative-agent-command-registry
  recommendation: defer
  rationale: Externalizing commands into TOML manifests is currently utilized in .agents/commands/
    but lacks multi-runtime adapter verification beyond the local speckit toolchain.
  evidence_gaps: Missing specification on how external third-party agent frameworks
    consume declarative skill contracts.
  promotion_criteria_missing:
  - reusability
  - governance_maturity
  recommended_next_step: Standardize command manifest JSON schemas and validate parsing
    across both internal and external agent executors.
  scope_alignment: global
  confidence: medium
- pattern_id: heuristic-to-pattern-promotion-lifecycle
  recommendation: defer
  rationale: The lifecycle process documentation and templates are well articulated,
    but the automated transition engine itself is still evolving.
  evidence_gaps: Requires end-to-end audit validation of an entire artifact progression
    sequence from signal to ADR in live project operations.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Execute full promotion cycle pilot runs on the current set
    of immediate candidates and capture the transition telemetry.
  scope_alignment: global
  confidence: high
- pattern_id: docs-as-code-portal-projection
  recommendation: defer
  rationale: Static MkDocs generation works reliably for ideas-to-life-cas, but projection
    conventions are not yet decoupled from specific portal theme plugins.
  evidence_gaps: Coupled to specific MkDocs extensions (drawio, roamlinks) without
    generic architectural representation abstractions.
  promotion_criteria_missing:
  - reusability
  - governance_maturity
  recommended_next_step: Refactor portal_preprocessor.py into a pluggable documentation
    compiler with clear contract boundaries.
  scope_alignment: global
  confidence: high
- pattern_id: ci-driven-steering-projection
  recommendation: defer
  rationale: Currently specialized to GitHub Action workflows and local projection
    script execution mechanics within the ideas-to-life-cas repository.
  evidence_gaps: Needs testing and verification across non-GitHub CI environments
    (e.g., GitLab CI, Tekton) before enterprise-wide adoption.
  promotion_criteria_missing:
  - reusability
  - cross_project_applicability
  recommended_next_step: Isolate the core projection CLI logic from GitHub Actions
    workflow syntax to verify CI-platform neutrality.
  scope_alignment: project
  confidence: high
- pattern_id: workspace-bootstrap-template-injection
  recommendation: defer
  rationale: Heavily coupled to CAS runner workspace layout scaffolding and local
    steering block markers inside AGENTS.md.
  evidence_gaps: Validation required for target repositories with disparate documentation
    layouts and non-standard agent steering conventions.
  promotion_criteria_missing:
  - reusability
  - cross_project_applicability
  recommended_next_step: Extract configurable template layout definitions and test
    non-destructive injection across diverse monorepos.
  scope_alignment: project
  confidence: high
- pattern_id: pattern-scope-classification-framework
  recommendation: defer
  rationale: Currently codifies bespoke taxonomy rules tailored to the current pipeline
    stage rather than a universally agreed enterprise standard.
  evidence_gaps: Requires empirical review from enterprise architecture steering committees
    across multiple distinct business lines.
  promotion_criteria_missing:
  - governance_maturity
  - cross_project_applicability
  recommended_next_step: Formalize the classification taxonomy into a domain-neutral
    specification and review against enterprise governance bodies.
  scope_alignment: project
  confidence: high
- pattern_id: pattern-authoritative-architecture-work-registry
  recommendation: defer
  rationale: Decoupling planning state from regenerated views is sound, but implementation
    is tightly bound to internal CAS planning ledger conventions.
  evidence_gaps: Lacks integration evidence with enterprise backlog management systems
    (e.g., Jira, ServiceNow, Linear).
  promotion_criteria_missing:
  - reusability
  - governance_maturity
  recommended_next_step: Define external sync contracts allowing the authoritative
    registry to reconcile against enterprise issue trackers.
  scope_alignment: project
  confidence: medium
- pattern_id: capability-lineage-anchoring
  recommendation: defer
  rationale: Coupled to local CapabilityRecord and CapabilityLineage schema definitions
    within src/cas_runner/steering/models.py.
  evidence_gaps: Lineage integrity during concurrent multi-agent branches has not
    been thoroughly stress-tested.
  promotion_criteria_missing:
  - evidence_quality
  - cross_project_applicability
  recommended_next_step: Validate capability provenance retention across multi-repository
    pull requests and merge sequences.
  scope_alignment: project
  confidence: high
- pattern_id: reconciliation-agentic-merger
  recommendation: defer
  rationale: Semantic document merging by LLM is an emerging, high-risk capability
    that can cause silent deletion or subtle corruption of governance policies.
  evidence_gaps: Requires empirical evaluation of conflict resolution accuracy across
    multi-repository merges beyond the prototype stage.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Run automated regression test suites comparing 3-way git
    merges against AgenticMerger outputs on complex merge conflicts.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-business-intent-traceability
  recommendation: defer
  rationale: Strategic objective mapping to code deltas is valuable but currently
    exists primarily as architecture work proposals rather than active runtime code.
  evidence_gaps: Lacks concrete runtime schema ingestion, validator implementation,
    and real-world multi-hop traversal evidence.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Validate schema models and build a pilot parser connecting
    strategic intent items to concrete ADRs and AST findings.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-architecture-knowledge-graph
  recommendation: defer
  rationale: Graph-based multi-hop lineage across isolated repositories represents
    strategic direction but currently relies on flat file relationship maps.
  evidence_gaps: No dedicated graph persistence or query runtime implemented; presently
    expressed via ad-hoc relationship dictionaries.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Evaluate graph query requirements and develop a proof of
    concept evaluating cross-project impact queries.
  scope_alignment: global
  confidence: medium
- pattern_id: pattern-continuous-architecture-governance-runtime
  recommendation: defer
  rationale: Monolithic conceptual pattern encompassing detect, analyze, plan, execute,
    publish, and observe stages, creating significant boundary ambiguity.
  evidence_gaps: Overlaps significantly with sequential-pipeline-orchestration and
    needs decomposition into concrete component patterns.
  promotion_criteria_missing:
  - evidence_quality
  - significance
  recommended_next_step: Decompose into distinct lifecycle integration points and
    review boundaries against CI pipeline steps.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-operational-intelligence-loop
  recommendation: defer
  rationale: Loop capturing operational execution traces back into architecture work
    remains in early experimental design.
  evidence_gaps: Telemetry collection exists, but automated routing from telemetry
    degradation directly into architecture work proposals lacks closed-loop evidence.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Implement pilot feedback triggers in CI workflows and measure
    signal-to-proposal conversion rate.
  scope_alignment: global
  confidence: high
