promotion_candidates:
- pattern_id: provider-agnostic-llm-client
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Foundational abstraction that isolates core agentic reasoning
    workflows from vendor API churn and enables hermetic test doubles across CI/CD
    environments.
  promotion_evidence:
  - 'recurring_implementation_evidence: src/cas_runner/llm/litellm_client.py (LiteLLMClient)
    and src/cas_runner/llm/mock_client.py (MockLLMClient)'
  - 'cross_project_applicability: referenced across 11 overlapping proposals with
    uniform invocation semantics'
  - 'governance_model_alignment: enables deterministic mock verification required
    by CI governance gates'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Vendor-specific features or proprietary prompt capabilities leaking through generalized
    gateway contract
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Critical architectural guardrail constraining autonomous agent
    mutations to validated, legally registered lifecycle state transitions.
  promotion_evidence:
  - 'recurring_implementation_evidence: src/cas_runner/governance/governance_action_engine.py
    (TransitionRegistry, GovernanceActionEngine)'
  - 'current_architecture_state_support: models in src/cas_runner/governance/models.py
    (GovernanceAction)'
  - 'governance_model_alignment: prevents unauthorized promotions and lifecycle bypasses
    during agent execution'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Overly restrictive transition policies impeding emergent experimentation workflows
  confidence: high
- pattern_id: sequential-pipeline-flow-runner
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Enforces deterministic step execution, context propagation,
    and clear failure boundaries across agentic synthesis flows.
  promotion_evidence:
  - 'recurring_implementation_evidence: src/cas_runner/runner.py (FlowRunner) and
    src/cas_runner/cli.py'
  - 'current_architecture_state_support: central execution component comp-flowrunner
    with 10+ declared flows'
  - 'governance_model_alignment: eliminates unbounded recursive agent self-loops and
    uninspected execution states'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Rigid linear gating preventing concurrent or dynamic branching step topologies
  confidence: high
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Protects system boundary and state integrity by strictly validating
    all agent and LLM outputs against rigid Pydantic schemas before persistence.
  promotion_evidence:
  - 'recurring_implementation_evidence: src/cas_runner/governance/models.py and src/cas_runner/steering/models.py'
  - 'governance_model_alignment: eliminates hallucinated attributes and structural
    payload corruption across pipeline stages'
  - 'current_architecture_state_support: validated by build validation workflow gate
    and compliance engine'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Schema schema evolution friction causing backward-incompatibility across versioned
    artifacts
  confidence: high
- pattern_id: heuristic-to-pattern-promotion-lifecycle
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Establishes the canonical knowledge evolution pipeline (Signal
    -> Learnings -> Heuristic -> Pattern) preventing unverified assertions from becoming
    global standards.
  promotion_evidence:
  - 'recurring_architecture_work: documented in cas-knowledge/templates/heuristic-to-pattern_template.md
    and promotion_decision.md'
  - 'strategic_direction_alignment: docs/architecture/cas-pattern-evolution-flow.md'
  - 'governance_model_alignment: enforces evidence-driven gates before elevating architectural
    practices'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Process overhead potentially slowing down the codification of straightforward
    best practices
  confidence: high
- pattern_id: telemetry-observable-agent-steps
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Instruments multi-step agent pipelines with OpenTelemetry spans
    and metric contracts to provide auditable tracing of latency, token spend, and
    errors.
  promotion_evidence:
  - 'recurring_implementation_evidence: pyproject.toml OpenTelemetry SDK dependencies
    and src/cas_runner/governance/models.py (TraceableMetric)'
  - 'current_architecture_state_support: telemetry root persistence conventions in
    LocalKnowledgeProvider'
  - 'cross_project_applicability: standardizes telemetry capture for all CAS runner
    invocations'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Telemetry ingestion volume overhead or sensitive prompt payload leakage into span
    attributes
  confidence: high
- pattern_id: file-backed-blackboard-workspace
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Provides a git-native, serverless persistence medium that enables
    decoupled agents and CI workflows to share state without database infrastructure.
  promotion_evidence:
  - 'recurring_implementation_evidence: src/cas_runner/bootstrap.py (init_workspace)
    and src/cas_runner/io.py (KnowledgeProvider)'
  - 'current_architecture_state_support: cas-knowledge repository directory hierarchy
    and runtime profiles'
  - 'cross_project_applicability: identical workspace conventions utilized across
    repository bootstrapping'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Concurrent write conflicts and file locking issues during parallel CI workflow
    executions
  confidence: high
deferred_candidates:
- pattern_id: pattern-closed-loop-governance-controller
  recommendation: defer
  rationale: Controller architecture is promising but currently undergoing operational
    tuning in CI/CD pipelines before cross-project standardization.
  evidence_gaps: Requires production trace validation demonstrating low false-positive
    automated remediation under diverse drift conditions.
  promotion_criteria_missing:
  - governance_maturity
  - cross_project_recurrence
  recommended_next_step: Complete evaluation across multiple PR cycles in ideas-to-life-cas
    and document failure recovery bounds before global promotion review.
  scope_alignment: global
  confidence: high
- pattern_id: declarative-agent-command-registry
  recommendation: defer
  rationale: Externalizing commands into TOML manifests (.agents/commands/) is effective
    locally, but cross-agent execution semantics require broader verification.
  evidence_gaps: Manifest schemas are currently confined to speckit commands without
    multi-agent execution testing in other repositories.
  promotion_criteria_missing:
  - reusability
  - cross_project_recurrence
  recommended_next_step: Test declarative command manifests across at least one secondary
    repository using non-speckit toolchains.
  scope_alignment: global
  confidence: high
- pattern_id: docs-as-code-portal-projection
  recommendation: defer
  rationale: Static site portal compilation is stable, but current preprocessor scripts
    contain tight coupling to repository filesystem conventions.
  evidence_gaps: PortalPreprocessor script dependencies and MkDocs layout conventions
    require generalization for external workspace attachment.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Decouple portal preprocessing scripts from project-specific
    path structures and validate multi-tenant portal builds.
  scope_alignment: global
  confidence: high
- pattern_id: ci-driven-steering-projection
  recommendation: defer
  rationale: Steering projection is tightly coupled to specific GitHub Actions workflows
    and local directory structures in ideas-to-life-cas.
  evidence_gaps: Lack of portable abstraction across non-GitHub Actions CI/CD systems
    and other project topologies.
  promotion_criteria_missing:
  - reusability
  - governance_maturity
  recommended_next_step: Abstract projection generation logic into a generic runner
    CLI step that can execute portably in any CI runner.
  scope_alignment: project
  confidence: high
- pattern_id: pure-functional-health-evaluation
  recommendation: defer
  rationale: Health calculation metrics, enums, and thresholds are currently tailored
    to the ideas-to-life-cas dashboard domain model.
  evidence_gaps: Health calculation thresholds need generalization into configurable
    rule policies before elevating to global pattern.
  promotion_criteria_missing:
  - reusability
  - significance
  recommended_next_step: Parameterize health weightings and status thresholds via
    declarative governance rule configurations.
  scope_alignment: project
  confidence: high
- pattern_id: workspace-bootstrap-template-injection
  recommendation: defer
  rationale: Currently tailored specifically to scaffolding the cas-knowledge hierarchy
    and merging custom CAS governance blocks.
  evidence_gaps: Template injection mechanics are specific to the current repository
    structure without multi-template support.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Validate bootstrapping mechanism against heterogeneous external
    client repositories.
  scope_alignment: project
  confidence: medium
- pattern_id: pattern-scope-classification-framework
  recommendation: defer
  rationale: Documented as a reference architecture asset but currently undergoing
    initial validation on ideas-to-life-cas.
  evidence_gaps: Cross-project multi-repo classification benchmark results have not
    yet been recorded.
  promotion_criteria_missing:
  - cross_project_recurrence
  - governance_maturity
  recommended_next_step: Evaluate taxonomy classification consistency across multiple
    architectural portfolios.
  scope_alignment: project
  confidence: high
rejected_candidates:
- pattern_id: service-facade-orchestration
  recommendation: reject
  rationale: Represents standard software engineering application layering (wrapping
    domain engines with a service facade for CLI access) rather than a novel continuous
    architecture pattern.
  governance_concern: Polluting the global architecture pattern catalog with conventional,
    commodity OOP/software design practices undermines pattern catalog authority.
  confidence: high
