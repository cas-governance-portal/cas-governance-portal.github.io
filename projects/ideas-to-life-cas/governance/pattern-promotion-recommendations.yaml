promotion_candidates:
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Foundational transport abstraction isolating agent business
    logic from third-party model vendor APIs, supported by deterministic mock clients
    for cost-free offline CI testing.
  promotion_evidence:
  - Implemented in src/cas_runner/llm/litellm_client.py (LiteLLMClient) and mock_client.py
    (MockLLMClient)
  - Recurring across multiple agent workloads and automated flow steps
  - Directly referenced across pyproject.toml runtime dependencies (litellm>=1.83.14)
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Risk of provider feature leakage if client abstraction expands beyond common parameter
    schemas
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Critical guardrail mechanism restricting autonomous agents
    from executing illegal lifecycle mutations or bypassing verification gates via
    an explicit TransitionRegistry.
  promotion_evidence:
  - Implemented in src/cas_runner/governance/governance_action_engine.py with TransitionRegistry
    and GovernanceActionEngine
  - Typed lifecycle contracts enforced via GovernanceAction and GovernanceException
    in models.py
  - Active enforcement in CI validation workflows
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Registry rigidity might require frequent updates as new intermediate lifecycle
    states are introduced
  confidence: high
- pattern_id: sequential-pipeline-flow-runner
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Establishes a predictable, deterministic, and auditable pipeline
    execution model for composite agentic flows, preventing unbounded looping and
    context drift.
  promotion_evidence:
  - Implemented in src/cas_runner/runner.py (FlowRunner) orchestrating multi-stage
    runs
  - Explicit context handoff mechanism via shared mutable execution context
  - Serves as the primary execution backbone across CLI commands and continuous architecture
    workflows
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Shared context mutation requires clear step isolation to prevent accidental side
    effects between disparate stages
  confidence: high
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Guarantees data integrity by validating LLM-generated inputs
    and outputs against strict Pydantic models prior to downstream persistence or
    consumption.
  promotion_evidence:
  - Defined across src/cas_runner/governance/models.py and src/cas_runner/steering/models.py
  - Enforces schema boundaries on entity payloads, findings, and metrics across all
    flow steps
  - Utilized in conjunction with jsonschema and Pydantic validation suites
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Schema evolution must maintain backwards compatibility with existing serialized
    runtime artifacts
  confidence: high
- pattern_id: file-backed-blackboard-workspace
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Provides durable, inspectable, and branchable shared memory
    for human-agent collaboration under Git version control without database operational
    overhead.
  promotion_evidence:
  - Extensively evidenced across cas-knowledge directory tree (global, projects, runtime,
    templates)
  - Integrated into git-native pull request review and merge workflows
  - Runtime execution profiles and rule contexts externalized into version-controlled
    markdown and YAML files
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - High commit frequency or large file counts may cause workspace git tree bloat
    over time
  confidence: high
- pattern_id: template-driven-artifact-evolution
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Enforces consistent structure and required metadata on generated
    architectural assets, enabling automated parsing and progressive promotion from
    heuristics to formal patterns.
  promotion_evidence:
  - Comprehensive template suite in cas-knowledge/templates for ADRs, patterns, rules,
    signals, and promotion decisions
  - Specified in docs/architecture/cas-pattern-evolution-flow.md
  - Enforced during artifact extraction and validation flows
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Overly rigid frontmatter schemas may increase authoring friction for ad-hoc human
    contributions
  confidence: high
deferred_candidates:
- pattern_id: dedicated-verifier-subagent
  recommendation: defer
  rationale: Decoupling verification from artifact generation is sound, but operational
    boundaries and automated enforcement mechanisms require further evaluation across
    varied agent harnesses.
  evidence_gaps: Requires empirical benchmark data evaluating verifier false positive/negative
    rates and latency overhead in pull request workflows.
  promotion_criteria_missing:
  - governance_maturity
  recommended_next_step: Run automated benchmark suites comparing single-agent vs
    verifier-subagent defect catch rates across sample PR deltas.
  scope_alignment: global
  confidence: medium
- pattern_id: pure-functional-health-evaluation
  recommendation: defer
  rationale: Side-effect-free diagnostic evaluation is architecturally mature in local
    models, but integration with external telemetry aggregation pipelines needs stabilization.
  evidence_gaps: Needs end-to-end telemetry ingestion traces from heterogeneous CI
    systems validating health calculation consistency.
  promotion_criteria_missing:
  - cross_environment_stability
  recommended_next_step: Test health model determinism against exported production-grade
    OpenTelemetry spans and multi-project metric payloads.
  scope_alignment: global
  confidence: high
- pattern_id: declarative-agent-skill-packaging
  recommendation: defer
  rationale: Packaging agent capabilities as declarative directory bundles is established
    in the workspace, but cross-runtime compatibility standards are still solidifying.
  evidence_gaps: Evidence of portability is currently limited to Claude Code and generic
    agent harnesses; broader agent runtime support requires testing.
  promotion_criteria_missing:
  - cross_platform_standardization
  recommended_next_step: Validate skill bundle execution across additional tool runtimes
    and evaluate versioning schemas for shared skill packages.
  scope_alignment: global
  confidence: high
- pattern_id: declarative-compliance-findings-aggregation
  recommendation: defer
  rationale: The compliance engine successfully outputs structured findings, but policy
    rule extensibility and severity weighting require multi-project validation before
    enterprise elevation.
  evidence_gaps: Validation in projects outside of ideas-to-life-cas workspace to
    confirm rule generalization.
  promotion_criteria_missing:
  - multi_project_recurrence
  recommended_next_step: Deploy compliance rule context sets across a secondary reference
    repository to verify portable aggregation rules.
  scope_alignment: global
  confidence: high
- pattern_id: bootstrap-governance-block-injection
  recommendation: defer
  rationale: Scope is currently project-bound; scaffolding routines are tightly coupled
    to specific local dotfiles (AGENTS.md, CLAUDE.md, GEMINI.md).
  evidence_gaps: Generalized injection contracts decoupled from IDE-specific agent
    markdown names are not yet implemented.
  promotion_criteria_missing:
  - reusability
  - global_applicability
  recommended_next_step: Extract generic template injection logic into an engine abstraction
    independent of project-specific file names.
  scope_alignment: project
  confidence: high
- pattern_id: ci-driven-steering-projection
  recommendation: defer
  rationale: Implementation represents repository-specific GitHub Actions CI automation
    tied to local branch naming and build sequences.
  evidence_gaps: Portable projection workflow independent of GitHub Actions workflow
    syntax has not been demonstrated.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Decouple steering projection generation from CI step definitions
    into reusable CLI invocations.
  scope_alignment: project
  confidence: medium
- pattern_id: authoritative-architecture-work-backlog
  recommendation: defer
  rationale: Governs the project-specific lifecycle of Architecture Work (AW) records
    within the current repository before broader multi-repo adoption.
  evidence_gaps: Lack of evidence demonstrating inter-project AW record synchronization
    and resolution across independent repositories.
  promotion_criteria_missing:
  - multi_project_recurrence
  recommended_next_step: Validate AW lifecycle transitions and derived AEM projection
    in a secondary repository.
  scope_alignment: project
  confidence: medium
rejected_candidates:
- pattern_id: structural-cicd-policy-validation
  recommendation: reject
  rationale: Represents custom static assertions enforcing repository-specific script
    formatting, dry-run paths, and local retired workflow naming rules.
  governance_concern: Promoting hyper-specific local CI/CD linting checks into global
    architectural patterns would pollute the enterprise pattern catalogue with non-generalizable
    rules.
  confidence: high
- pattern_id: bi-directional-external-review-broker
  recommendation: reject
  rationale: Tightly coupled custom integration bridging the local CAS runner to a
    proprietary external ArchGov REST service for design authority synchronization.
  governance_concern: Proprietary vendor/service bindings lack enterprise-wide generalizability
    and fail core reusability requirements for global architectural patterns.
  confidence: high
