promotion_candidates:
- pattern_id: sequential-pipeline-context-propagation
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Global core execution pattern. FlowRunner, the CLI entry point,
    and multiple declared flows consistently show fixed step sequencing with shared
    mutable context. This is foundational for auditable agentic workflows and is reusable
    beyond CAS.
  promotion_evidence:
  - FlowRunner in src/cas_runner/runner.py
  - CLI entry point in src/cas_runner/cli.py
  - Declared flows in src/cas_runner/steps/registry.py
  - Repeated duplicate proposals confirm recurrence
  promotion_criteria_met:
  - architectural significance
  - cross-project reusability
  - high evidence strength
  - governance maturity
  - strategic alignment
  scope_alignment: global/core per scope classifier; aligns with immediate promotion
    list
  evidence_strength: high
  governance_risks:
  - Risk of overfitting the global pattern to CAS-specific flow definitions
  - Must avoid promoting duplicate variants independently
  confidence: high
- pattern_id: finite-state-governance-action-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Global core governance control. TransitionRegistry, GovernanceActionEngine,
    GovernanceActionService, typed governance models, and lifecycle flows consistently
    demonstrate explicit transition validation before action execution. This is a
    stable bounded-autonomy pattern reusable by other agentic governance systems.
  promotion_evidence:
  - TransitionRegistry and GovernanceActionEngine in src/cas_runner/governance/governance_action_engine.py
  - GovernanceActionService in src/cas_runner/governance/governance_action_service.py
  - GovernanceAction and GovernanceException in src/cas_runner/governance/models.py
  - Governance lifecycle flows consuming validated transitions
  promotion_criteria_met:
  - architectural significance
  - cross-project reusability
  - high evidence strength
  - governance maturity
  - strategic alignment
  scope_alignment: global/core per scope classifier; aligns with immediate promotion
    list
  evidence_strength: high
  governance_risks:
  - Lifecycle semantics can become organization-specific if the global pattern includes
    concrete CAS transitions
  - Transition registry could become a policy repository rather than a generic control
    mechanism
  - Duplicate transition-registry variants must not be promoted separately
  confidence: high
- pattern_id: declarative-compliance-findings-aggregation
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Global core governance guardrail. ComplianceEngine evaluates
    rules and emits typed ComplianceFinding and ComplianceMetrics, which are consumed
    by CI governance validation and health scoring. This is broadly reusable as a
    declarative compliance evaluation pattern.
  promotion_evidence:
  - ComplianceEngine in src/cas_runner/governance/compliance_engine.py
  - ComplianceFinding and ComplianceMetrics in src/cas_runner/governance/models.py
  - CI governance validation in .github/workflows/cas-build-validation.yml
  - Repeated duplicate compliance-engine proposals confirm recurrence
  promotion_criteria_met:
  - architectural significance
  - cross-project reusability
  - high evidence strength
  - governance maturity
  - strategic alignment
  scope_alignment: global/core per scope classifier; aligns with immediate promotion
    list
  evidence_strength: high
  governance_risks:
  - Rule policies are organization-specific and must remain outside the global engine
    contract
  - Findings aggregation can create false confidence if severity semantics are not
    standardized
  - Duplicate compliance-guardrail proposals must not be promoted independently
  confidence: high
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Global core contract pattern. Pydantic governance and steering
    models, jsonschema dependency, and validation at workflow boundaries show typed
    contracts used to constrain agent inputs, outputs, and governance state. This
    is foundational to reliable agentic interoperability.
  promotion_evidence:
  - Pydantic governance models in src/cas_runner/governance/models.py
  - Pydantic steering models in src/cas_runner/steering/models.py
  - jsonschema dependency in pyproject.toml
  - Validation at workflow and governance action boundaries
  promotion_criteria_met:
  - architectural significance
  - cross-project reusability
  - high evidence strength
  - governance maturity
  - strategic alignment
  scope_alignment: global/core per scope classifier; aligns with immediate promotion
    list
  evidence_strength: high
  governance_risks:
  - Schema versioning and migration policy must be defined globally
  - Over-constraining domain contracts can reduce agent flexibility
  - Duplicate typed-contract proposals must be merged into this canonical pattern
  confidence: high
- pattern_id: signal-pattern-proposal-knowledge-provider-abstraction
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Global core storage abstraction. The KnowledgeProvider protocol
    and LocalKnowledgeProvider decouple orchestration and governance reasoning from
    filesystem layout. This is foundational for portable agentic governance workflows
    and is explicitly identified as a core immediate candidate.
  promotion_evidence:
  - KnowledgeProvider protocol in src/cas_runner/io.py
  - LocalKnowledgeProvider in src/cas_runner/io.py
  - Knowledge access used by bootstrap and governance workflows
  - Scope classification marks this as global/core with high readiness
  promotion_criteria_met:
  - architectural significance
  - cross-project reusability
  - high evidence strength
  - governance maturity
  - strategic alignment
  scope_alignment: global/core per scope classifier; aligns with immediate promotion
    list
  evidence_strength: high
  governance_risks:
  - Only a local implementation is evidenced; the global pattern must not overstate
    remote-provider support
  - Concrete filesystem blackboard layout should remain project-scoped rather than
    promoted as part of this abstraction
  - Duplicate knowledge-access proposals must be consolidated
  confidence: high
- pattern_id: provider-agnostic-llm-client
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Global supporting infrastructure. LiteLLMClient and MockLLMClient
    provide a real provider adapter and deterministic fallback behind a consistent
    client boundary. The pattern is well evidenced, widely duplicated in proposals,
    and reusable across agentic systems.
  promotion_evidence:
  - LiteLLMClient in src/cas_runner/llm/litellm_client.py
  - MockLLMClient in src/cas_runner/llm/mock_client.py
  - litellm dependency in pyproject.toml
  - Many duplicate proposals describe the same provider abstraction and mock fallback
  promotion_criteria_met:
  - reusability
  - high evidence strength
  - governance maturity
  - strategic alignment
  - recurrence across proposals
  scope_alignment: global/supporting per scope classifier; aligns with immediate promotion
    list
  evidence_strength: high
  governance_risks:
  - Provider-specific options can leak through a supposedly generic client interface
  - Mock behavior can drift from real provider behavior without contract tests
  - Duplicate LLM-provider abstraction proposals must be merged into this canonical
    pattern
  confidence: high
deferred_candidates:
- pattern_id: steering-fact-projection
  recommendation: defer
  rationale: Strategically important global supporting pattern, but promotion readiness
    is medium. Evidence is strong at the model and workflow level, yet independent
    consumer and cross-project recurrence evidence is still limited.
  evidence_gaps: Strong PromptFact, SteeringRuntimeIndex, ArchitecturalDelta, and
    steering projection workflow evidence exists, but there is limited proof that
    projected facts are consumed across multiple workflows and projects.
  promotion_criteria_missing:
  - independent consumption evidence
  - cross-project recurrence
  - operational outcome evidence
  recommended_next_step: Collect examples of projected PromptFact and SteeringRuntimeIndex
    objects being consumed by downstream agent workflows in at least two projects.
  scope_alignment: global/supporting per scope classifier; not yet an immediate promotion
    candidate
  confidence: medium
- pattern_id: telemetry-grounded-traceability
  recommendation: defer
  rationale: Global supporting observability pattern with strategic value, but promotion
    readiness is medium. Dependencies and traceable metric models exist, but operational
    trace emission, persistence, and consumption are not yet strongly evidenced.
  evidence_gaps: OpenTelemetry dependencies and TraceableMetric models are present,
    but there is limited evidence of emitted spans, persisted trace artifacts, and
    downstream trace consumers.
  promotion_criteria_missing:
  - operational trace evidence
  - cross-project adoption
  - downstream consumer evidence
  recommended_next_step: Capture real trace outputs from FlowRunner and governance
    steps and show how traces are queried or consumed by health and audit workflows.
  scope_alignment: global/supporting per scope classifier; defer until observability
    behavior is demonstrated
  confidence: medium
- pattern_id: agentic-merge-resolution
  recommendation: defer
  rationale: Reusable governance conflict-resolution concept, but still project-scoped
    and evidenced mainly through AgenticMerger and ResolutionResult. Broader stability
    across systems is not yet demonstrated.
  evidence_gaps: Limited evidence of resolution outputs, real conflict scenarios,
    downstream validation of merged artifacts, and cross-project use.
  promotion_criteria_missing:
  - cross-project evidence
  - stable outcome validation
  - recurrence beyond CAS
  recommended_next_step: Collect concrete merge conflict examples and ResolutionResult
    usage across multiple projects before reconsidering global promotion.
  scope_alignment: project-scoped per scope classifier; normally deferred until cross-project
    evidence exists
  confidence: medium
- pattern_id: bootstrap-governance-injection
  recommendation: defer
  rationale: High future potential project pattern. Bootstrap functions merge governance
    blocks into agent instruction files, but implementation is tied to CAS onboarding
    conventions and multi-harness file layouts.
  evidence_gaps: No cross-project evidence that the injection model generalizes beyond
    CAS-managed AGENTS.md, CLAUDE.md, and GEMINI.md layouts.
  promotion_criteria_missing:
  - cross-project reusability
  - generic harness contract
  - repeatable external adoption
  recommended_next_step: Trial governance injection in at least two external project
    layouts and document a harness-agnostic injection contract.
  scope_alignment: project-scoped with high future promotion potential
  confidence: medium
- pattern_id: skill-packaged-agent-procedures
  recommendation: defer
  rationale: Skill directories provide structured agent procedures, but current skills
    and packaging conventions remain CAS-specific.
  evidence_gaps: No cross-project evidence of portable skill packaging or reuse outside
    the CAS skill catalogue.
  promotion_criteria_missing:
  - cross-project reuse
  - portable packaging convention
  - external adoption evidence
  recommended_next_step: Extract a generic skill package schema and validate it in
    another repository or agent harness.
  scope_alignment: project-scoped with high future promotion potential
  confidence: medium
- pattern_id: skill-evaluation-suites
  recommendation: defer
  rationale: Typed evaluation models and a CI workflow exist, but skill evaluation
    semantics are still maturing and are evidenced in one project.
  evidence_gaps: Limited published evaluation results, coverage metrics, and cross-project
    reuse of the evaluation harness.
  promotion_criteria_missing:
  - cross-project recurrence
  - outcome evidence
  - stable evaluation contract
  recommended_next_step: Publish skill evaluation reports and run the harness against
    skills from a second project.
  scope_alignment: project-scoped with high future promotion potential
  confidence: medium
- pattern_id: pattern-promotion-lifecycle
  recommendation: defer
  rationale: The lifecycle is documented through templates and process flows, but
    implementation and cross-project recurrence are not yet sufficient for global
    classification.
  evidence_gaps: Templates and architecture docs exist, but there is little promotion
    decision history, enforcement evidence, or repeated cross-project use.
  promotion_criteria_missing:
  - implementation evidence
  - promotion decision history
  - cross-project recurrence
  recommended_next_step: Gather completed promotion decisions, rejected promotions,
    and applied lifecycle enforcement examples before reconsidering.
  scope_alignment: project-scoped with medium future promotion potential
  confidence: medium
- pattern_id: service-facade-orchestration
  recommendation: defer
  rationale: GovernanceActionService shows a service-facade boundary over engines
    and models, but the evidence is from one governance subsystem.
  evidence_gaps: No evidence of the facade style being reused across other application
    services or projects.
  promotion_criteria_missing:
  - cross-project reusability
  - multiple subsystem evidence
  - stable facade contract
  recommended_next_step: Apply and document the service-facade contract in another
    subsystem and collect external usage evidence.
  scope_alignment: project-scoped with high future promotion potential
  confidence: medium
- pattern_id: template-driven-artifact-evolution
  recommendation: defer
  rationale: Markdown templates provide consistent artifact structure, but the convention
    is tied to the CAS knowledge base.
  evidence_gaps: Templates exist for CAS artifacts, but there is no cross-project
    evidence of template-driven governance evolution.
  promotion_criteria_missing:
  - cross-project adoption
  - generic template contract
  - external artifact lifecycle evidence
  recommended_next_step: Separate the generic template-contract concept from CAS artifact
    types and test it in another knowledge base.
  scope_alignment: project-scoped with high future promotion potential
  confidence: medium
- pattern_id: file-backed-blackboard-workspace
  recommendation: defer
  rationale: The file-backed blackboard is core to CAS, but the physical directory
    layout and templates are project-specific. The reusable abstraction is already
    covered by the knowledge provider pattern.
  evidence_gaps: No evidence that the concrete CAS directory layout is reusable across
    projects without adaptation.
  promotion_criteria_missing:
  - cross-project layout reuse
  - implementation-independent contract
  - alternative backend evidence
  recommended_next_step: Keep the concrete workspace layout project-scoped and collect
    evidence for multiple knowledge-provider backends if abstraction is the goal.
  scope_alignment: project-scoped with high future promotion potential; do not duplicate
    knowledge-provider abstraction
  confidence: medium
- pattern_id: dedicated-verifier-subagent
  recommendation: defer
  rationale: Verifier subagent definitions exist for multiple harnesses, but runtime
    enforcement evidence is limited and the role is not yet a proven reusable governance
    pattern.
  evidence_gaps: No verifier invocation traces, acceptance criteria, or outcome data
    showing independent verification improving governance quality.
  promotion_criteria_missing:
  - runtime evidence
  - outcome data
  - cross-project adoption
  recommended_next_step: Collect verifier invocation traces and compare review outcomes
    with self-review baselines before reconsidering.
  scope_alignment: project-scoped with medium future promotion potential
  confidence: medium
- pattern_id: ci-driven-steering-projection
  recommendation: defer
  rationale: CI workflow generates steering projections, but the workflow paths, repository
    events, and projection artifacts are CAS-specific.
  evidence_gaps: No cross-project evidence that the CI projection model generalizes
    beyond CAS GitHub Actions and artifact paths.
  promotion_criteria_missing:
  - cross-project workflow evidence
  - generic projection contract
  - external CI adoption
  recommended_next_step: Identify the reusable CI projection contract separately from
    CAS workflow implementation details.
  scope_alignment: project-scoped with medium future promotion potential
  confidence: medium
- pattern_id: health-model-observability-guardrail
  recommendation: defer
  rationale: Health scoring aggregates compliance and governance metrics, but status
    semantics are tied to CAS governance risks and findings.
  evidence_gaps: No evidence that health signals feed remediation, gating, or scheduling
    outside CAS-specific dashboards.
  promotion_criteria_missing:
  - cross-project health semantics
  - operational feedback evidence
  - generic guardrail contract
  recommended_next_step: Gather evidence of health signals influencing workflow decisions
    and validate the model in another project.
  scope_alignment: project-scoped with medium future promotion potential
  confidence: medium
- pattern_id: runtime-rule-context
  recommendation: defer
  rationale: Runtime rule-context and execution-profile files externalize execution
    constraints, but current evidence is limited to this repository's runtime layout.
  evidence_gaps: No code path demonstrating loading, mutation, lifecycle management,
    or cross-project reuse of runtime rule context.
  promotion_criteria_missing:
  - consumer evidence
  - cross-project evidence
  - lifecycle management evidence
  recommended_next_step: Trace runtime rule-context loading and consumption by governance
    steps, and collect examples from another project.
  scope_alignment: project-scoped with medium future promotion potential
  confidence: low
- pattern_id: human-in-the-loop-governance
  recommendation: defer
  rationale: Human review and approval are indicated by templates and governance services,
    but implementation evidence is emerging and not yet a stable reusable mechanism.
  evidence_gaps: No concrete approval routing, human decision records, or enforcement
    evidence showing where and how human approval gates actions.
  promotion_criteria_missing:
  - implemented approval flow
  - decision audit evidence
  - cross-project adoption
  recommended_next_step: Collect approval workflow traces and promotion decision records
    demonstrating human gating.
  scope_alignment: project-scoped with medium future promotion potential
  confidence: medium
- pattern_id: continuous-governance-loop
  recommendation: defer
  rationale: The detect-analyse-execute loop is evidenced through CAS CI workflows
    and governance steps, but broader cross-project adoption is not yet demonstrated.
  evidence_gaps: Limited evidence of full loop closure, remediation outcomes, or reuse
    outside CAS repository automation.
  promotion_criteria_missing:
  - cross-project evidence
  - closed-loop outcome evidence
  - stable operating model
  recommended_next_step: Document loop outcomes across multiple projects and demonstrate
    that detection leads to tracked execution and verification.
  scope_alignment: project-scoped with medium future promotion potential
  confidence: medium
- pattern_id: evidence-linked-traceable-reporting
  recommendation: defer
  rationale: Provenance-bearing result types and review templates support traceable
    reporting, but conventions remain specific to CAS governance artifacts.
  evidence_gaps: Limited evidence of actual reports being traced from claim to source
    across projects.
  promotion_criteria_missing:
  - cross-project reporting evidence
  - stable provenance contract
  - external reviewer adoption
  recommended_next_step: Sample multiple governance reports and verify claim-to-source
    traceability before considering global promotion.
  scope_alignment: project-scoped with medium future promotion potential
  confidence: medium
- pattern_id: signal-pattern-proposal-architecture-knowledge-graph
  recommendation: defer
  rationale: Knowledge graph modeling is a future-direction proposal with medium evidence
    and no implemented graph layer. It should mature as a project-specific direction
    first.
  evidence_gaps: No graph schema implementation, no relationship extraction pipeline,
    and no demonstrated multi-hop query or impact analysis.
  promotion_criteria_missing:
  - implementation evidence
  - graph schema
  - cross-project usage
  recommended_next_step: Prototype a project-specific relationship graph and collect
    evidence of decision-pattern-signal traversal.
  scope_alignment: project-scoped with low future promotion potential
  confidence: low
- pattern_id: signal-pattern-proposal-business-intent-traceability
  recommendation: defer
  rationale: Business intent traceability is strategically important but currently
    documented as future direction with medium evidence and no stable schema implementation.
  evidence_gaps: No governed business intent schema, implementation, or end-to-end
    trace from strategic value to code.
  promotion_criteria_missing:
  - intent schema
  - implementation evidence
  - traceability examples
  recommended_next_step: Define a project-specific intent schema and demonstrate traceability
    from business requirement to architecture artifact.
  scope_alignment: project-scoped with low future promotion potential
  confidence: low
- pattern_id: signal-pattern-proposal-code-intelligence-alignment
  recommendation: defer
  rationale: Code intelligence and drift alignment are future-direction concepts with
    medium evidence; implementation evidence is not yet sufficient for global reuse.
  evidence_gaps: No code intelligence implementation, mapping of repository structure
    to architecture intent, or drift detection output.
  promotion_criteria_missing:
  - implementation evidence
  - drift detection outcomes
  - cross-project validation
  recommended_next_step: Build a project-specific code-to-architecture evidence mapper
    and collect drift detection examples before promotion review.
  scope_alignment: project-scoped with low future promotion potential
  confidence: low
rejected_candidates:
- pattern_id: git-delta-prompt-facts
  recommendation: reject
  rationale: Low-confidence proposal derived mainly from model names. It overlaps
    the stronger steering-fact-projection pattern and lacks independent usage evidence.
  governance_concern: Insufficient evidence and duplication risk. It should be treated
    as a submechanism of steering-fact-projection rather than an independent promotion
    candidate.
  confidence: low
- pattern_id: pattern-evolution-lifecycle
  recommendation: reject
  rationale: The lifecycle is described through templates and documentation, but there
    is insufficient implementation evidence to support independent scope classification.
  governance_concern: Duplicate of pattern-promotion-lifecycle and vulnerable to premature
    promotion of documentation-only process concepts.
  confidence: low
- pattern_id: runtime-execution-context-store
  recommendation: reject
  rationale: The proposal is based on runtime directory layout and files, with low
    confidence and unclear consumer behavior.
  governance_concern: Only file paths are cited; there is no code path showing loading,
    mutation, lifecycle management, or downstream consumption.
  confidence: low
- pattern_id: agentic-merger-artifact-reconciliation
  recommendation: reject
  rationale: Low-confidence proposal derived from a single class symbol and overlapping
    heavily with the stronger agentic-merge-resolution proposal.
  governance_concern: Insufficient independent evidence and high duplication risk.
    It should be reviewed under agentic-merge-resolution.
  confidence: low
- pattern_id: prompt-fact-extraction
  recommendation: reject
  rationale: Low-confidence proposal focuses on a model name without showing an extraction
    process or runtime usage.
  governance_concern: Duplicate submechanism of steering-fact-projection with no extractor
    implementation or prompt-consumption evidence.
  confidence: low
- pattern_id: independent-verifier-agent
  recommendation: reject
  rationale: Verifier agent definitions exist, but the evidence is low and the operational
    role is not yet demonstrated as an enforced pattern.
  governance_concern: Overlaps dedicated-verifier-subagent and lacks execution traces,
    acceptance criteria, or outcome data. It should not be promoted independently.
  confidence: low
- pattern_id: health-observability-feedback
  recommendation: reject
  rationale: Low-confidence proposal based on health model functions without evidence
    of a feedback loop or operational use.
  governance_concern: Duplicate of health-model-observability-guardrail and lacks
    evidence that health signals feed remediation, gating, or scheduling.
  confidence: low
