promotion_preconditions_not_met:
- pattern_id: reconciliation-agentic-merger
  unmet_preconditions:
  - Demonstrated empirical reliability in multi-project environments
  - Established error bounds and failure fallbacks for LLM hallucination
  missing_evidence:
  - Empirical conflict resolution accuracy benchmarks across heterogeneous repository
    histories
  rationale: High-risk surface area if automated agentic merging corrupts authoritative
    governance files without verified deterministic fallbacks.
  recommended_next_step: Run structured benchmark test harness with diverse merge
    conflict corpora before promotion review.
- pattern_id: pattern-business-intent-traceability
  unmet_preconditions:
  - Runtime implementation and schema definitions exist in codebase
  - Empirical validation across active delivery workflows
  missing_evidence:
  - Executable Pydantic/JSON Schema contracts
  - Runtime ingestion implementation in cas_runner
  rationale: Concept is strategic direction without implemented evidence in the current
    architectural state.
  recommended_next_step: Implement initial prototype domain contracts and validate
    in pilot workflow.
- pattern_id: pattern-architecture-knowledge-graph
  unmet_preconditions:
  - Concrete graph storage and query abstraction
  - Evidence of traversal performance across multi-repo models
  missing_evidence:
  - Graph component implementation in runner runtime
  - Empirical traversal benchmarks
  rationale: Requires formal architectural decision record (ADR) comparing persistence
    backends before standardizing as a pattern.
  recommended_next_step: Author ADR exploring graph query interfaces versus structured
    index projections.
- pattern_id: capability-lineage-anchoring
  unmet_preconditions:
  - Cross-repository multi-hop validation
  missing_evidence:
  - Multi-repo pilot telemetry tracking ancestry evolution
  rationale: Models exist in steering domain, but lack verification outside single-repository
    scope.
  recommended_next_step: Execute multi-repository pilot validating lineage propagation.
