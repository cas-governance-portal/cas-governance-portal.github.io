  recommended_action: Merge into 'pattern-closed-loop-governance' as a core global
    candidate.
  rationale: Duplicate conceptual signals describing the continuous detect-analyse-execute
    feedback loop.
- patterns_involved:
  - pattern-architecture-knowledge-graph
  - pattern-proposal-architecture-knowledge-graph
  recommended_action: Merge into 'pattern-architecture-knowledge-graph' in candidate
    review.
  rationale: Duplicate future direction proposals detailing multi-hop knowledge graph
    schemas.
- patterns_involved:
  - pattern-business-intent-traceability
  - pattern-proposal-business-intent-traceability
  recommended_action: Merge into 'pattern-business-intent-traceability' in candidate
    review.
  rationale: Duplicate proposals addressing business intent integration with architecture
    models.
- patterns_involved:
  - telemetry-observable-agent-steps
  - telemetry-grounded-traceability
  recommended_action: Consolidate under 'telemetry-observable-agent-steps' in the
    review category.
  rationale: Duplicate proposals derived from OpenTelemetry dependencies and TraceableMetric
    domain models.
- patterns_involved:
  - reconciliation-agentic-merger
  - agentic-state-reconciliation-merger
  recommended_action: Merge into 'reconciliation-agentic-merger' and maintain in review
    status.
  rationale: Direct duplicate proposals referencing AgenticMerger in src/cas_runner/governance/agentic_merger.py.
promotion_preconditions_not_met:
- pattern_id: pattern-closed-loop-governance
  unmet_preconditions:
  - promotion_readiness must be high for immediate promotion
  - automated remediation safeguards must be fully verified
  missing_evidence:
  - End-to-end non-breaking automated remediation runs in continuous architecture
    loop workflows
  - Empirical false-positive impact data on production codebases
  rationale: While strategically vital, autonomous remediation cycles carry high architectural
    risk without validated gating controls.
  recommended_next_step: Deploy closed-loop engine in dry-run/advisory mode to gather
    operational accuracy logs.
- pattern_id: reconciliation-agentic-merger
  unmet_preconditions:
  - concept stability
  - empirical benchmark verification
  missing_evidence:
  - Benchmark evaluating semantic merge accuracy versus conventional git three-way
    merges
  - Regression tests on AST conflict resolution
  rationale: Agentic reconciliation involves non-deterministic heuristic resolution
    that can introduce silent regressions into architecture state.
  recommended_next_step: Conduct controlled evaluation harness across synthetic merge
    conflict testbeds.
- pattern_id: pattern-architecture-knowledge-graph
  unmet_preconditions:
  - reference implementation in codebase
  - operational schema validation
  missing_evidence:
  - Production graph persistence and query code in src/cas_runner
  - Graph traversal benchmarks across multi-repository workspaces
  rationale: Pattern remains in the strategic direction stage without working software
    implementation backing its claims.
  recommended_next_step: Implement prototype graph adapter extracting nodes from AST
    and ADR assets.
- pattern_id: pattern-business-intent-traceability
  unmet_preconditions:
  - formal schema models in codebase
  - automated enforcement mechanism
  missing_evidence:
  - Pydantic contracts for strategic business intent models
  - Validation rules comparing business metrics to architecture drift
  rationale: Strategic alignment concept lacks concrete code contracts and pipeline
    enforcement hooks.
  recommended_next_step: Model BusinessIntent schema in models.py and add intent validation
    checks into FlowRunner.
- pattern_id: pattern-proposal-code-intelligence-alignment
  unmet_preconditions:
  - production CI gate integration
  - demonstrated low false-positive rate
  missing_evidence:
  - End-to-end CI failure demonstration blocking PRs on AST boundary violations
  - Automated comparison engine between AID and AST models
  rationale: AST extractors exist, but closed-loop CI gate enforcement is not yet
    functionally operational.
  recommended_next_step: Implement AST vs AID comparator step in cas_runner build
    validation flow.
governance_summary:
  immediate_promotion_candidates:
