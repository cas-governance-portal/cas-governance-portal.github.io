promotion_candidates:
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Decouples application orchestration and agent reasoning from
    proprietary model provider APIs while supplying an interchangeable deterministic
    mock double for zero-cost testing. Implemented in production code and universally
    applicable across agentic systems.
  promotion_evidence:
  - recurring signals in src/cas_runner/llm/litellm_client.py and mock_client.py
  - current architecture state verification across core test harness
  - cross-project applicability for vendor decoupling
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Multiple redundant proposal aliases exist requiring formal consolidation before
    ADR recording
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Enforces strict finite-state machine boundaries for autonomous
    agent mutations via a validated transition registry, preventing unauthorized or
    out-of-order architectural state shifts.
  promotion_evidence:
  - implemented in src/cas_runner/governance/governance_action_engine.py and models.py
  - critical guardrail pattern supporting enterprise AI compliance
  - governance model alignment with declared workflow controls
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Registry rules must remain synchronized with evolving enterprise lifecycle stages
  confidence: high
- pattern_id: sequential-pipeline-flow-runner
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Enforces ordered, step-wise workflow execution with structured
    context propagation, preventing uncontrolled agent looping and supporting deterministic
    CI/CD stage auditing.
  promotion_evidence:
  - implemented in src/cas_runner/runner.py (FlowRunner) and src/cas_runner/cli.py
  - current architecture state supports central orchestration across multiple discovered
    flows
  - cross-project execution backbone utility
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Tight coupling to step registry execution contracts requires clear interface versioning
  confidence: high
- pattern_id: file-backed-blackboard-workspace
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Utilizes structured, version-controlled filesystem directories
    as an immutable and branchable shared blackboard for agent memory, templates,
    and execution state without external database overhead.
  promotion_evidence:
  - implemented in src/cas_runner/bootstrap.py and src/cas_runner/io.py (KnowledgeProvider
    protocol)
  - current architecture state reflects deep dependency on LocalKnowledgeProvider
  - reproducible audit trail preserved via standard Git workflows
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Concurrent multi-agent writes require external Git merge conflict handling
  confidence: high
- pattern_id: heuristic-to-pattern-promotion-lifecycle
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Establishes a standardized progression lifecycle from empirical
    signals and heuristics to formal architectural patterns, preventing hallucinated
    or premature standardization across projects.
  promotion_evidence:
  - documented in cas-knowledge/templates/heuristic-to-pattern_template.md and promotion_decision.md
  - governance model alignment with declared continuous architecture lifecycle
  - broad portfolio applicability across emerging agentic engineering initiatives
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Process bottleneck if automated promotion recommendation tooling is not coupled
    with active architect review
  confidence: high
deferred_candidates:
- pattern_id: schema-enforced-domain-contracts
  recommendation: defer
  rationale: While highly functional in the cas_runner codebase, the contract models
    are currently tailored to internal governance entities rather than abstracted
    into a reusable cross-project specification framework.
  evidence_gaps: Requires multi-repository contract reuse demonstration beyond the
    current cas_runner boundaries.
  promotion_criteria_missing:
  - reusability
  - cross-project applicability
  recommended_next_step: Extract domain contract abstractions into a standalone schema
    package and validate adoption in a secondary consumer repository.
  scope_alignment: global
  confidence: high
- pattern_id: telemetry-observable-agent-steps
  recommendation: defer
  rationale: OpenTelemetry dependencies and initial data models are present, but comprehensive
    end-to-end tracing across distributed agent steps lacks mature runtime telemetry
    verification.
  evidence_gaps: Missing full runtime trace capture logs and span validation across
    multi-turn LLM reasoning loops in production CI.
  promotion_criteria_missing:
  - governance maturity
  - evidence quality
  recommended_next_step: Complete the implementation of OpenTelemetry tracer export
    pipelines and produce reference trace benchmarks.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-continuous-governance-loop
  recommendation: defer
  rationale: The automated continuous detect-analyse-execute architecture workflow
    is active in GitHub Actions, but requires deeper operational evidence of closed-loop
    automated drift remediation.
  evidence_gaps: Empirical evidence of automated remediation PR merges and end-to-end
    drift reconciliation across multiple repos.
  promotion_criteria_missing:
  - recurrence
  - evidence quality
  recommended_next_step: Document repeated successful closed-loop reconciliation runs
    in multi-branch staging environments.
  scope_alignment: global
  confidence: medium
- pattern_id: pattern-authoritative-architecture-work-registry
  recommendation: defer
  rationale: The separation of persistent planning state from derived projections
    is well-articulated, but the synchronization protocol between AW backlogs and
    live codebases is still stabilizing.
  evidence_gaps: Lacks cross-project verification showing consistent backlog-to-dashboard
    regeneration without state divergence.
  promotion_criteria_missing:
  - governance maturity
  - recurrence
  recommended_next_step: Audit Architecture Work lifecycle edge transitions across
    consecutive project quarters.
  scope_alignment: global
  confidence: medium
- pattern_id: reconciliation-agentic-merger
  recommendation: defer
  rationale: The agentic merger resolves semantic markdown and YAML conflicts effectively,
    but is tightly coupled to current CAS markdown block formatting conventions.
  evidence_gaps: Requires generalized conflict resolution benchmarks across varied
    document formats and AST structures.
  promotion_criteria_missing:
  - reusability
  - governance maturity
  recommended_next_step: Decouple AST parsing logic from CAS markdown conventions
    to enable broader project adoption.
  scope_alignment: project
  confidence: high
- pattern_id: declarative-agent-command-registry
  recommendation: defer
  rationale: Externalizes CLI commands and speckit specifications via TOML manifests
    specific to ideas-to-life-cas workflow execution environment.
  evidence_gaps: Demonstrated only in project-specific speckit command definitions.
  promotion_criteria_missing:
  - reusability
  - cross-project applicability
  recommended_next_step: Evaluate whether command manifest formats can be standardized
    across additional agent platforms.
  scope_alignment: project
  confidence: high
- pattern_id: declarative-steering-projection
  recommendation: defer
  rationale: Compiles Git deltas and capability lineage into prompt facts, but remains
    tuned specifically to the CAS steering projection engine.
  evidence_gaps: Lacks extraction as an agnostic prompt-fact compiler for non-CAS
    agent frameworks.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Generalize prompt-fact extraction interfaces away from internal
    CAS model structures.
  scope_alignment: project
  confidence: high
- pattern_id: pat-prop-empirical-ast-forensic-extraction
  recommendation: defer
  rationale: Forensic code parser extracting AST structures within isolated project
    container boundaries is currently tightly bound to Python project architectures.
  evidence_gaps: Language-agnostic extraction and cross-language runtime validation
    are pending.
  promotion_criteria_missing:
  - reusability
  - governance maturity
  recommended_next_step: Expand forensic AST extraction capabilities beyond Python
    to validate broader architectural applicability.
  scope_alignment: project
  confidence: high
rejected_candidates:
- pattern_id: docs-as-code-portal-projection
  recommendation: reject
  rationale: Compiles MkDocs documentation and client-side metric dashboards specifically
    for GitHub Pages deployment. This represents an operational implementation detail
    rather than an architectural governance pattern.
  governance_concern: Promoting standard static site compilation scripts into the
    global architectural pattern catalog dilutes governance standards and creates
    maintenance noise.
  confidence: high
