promotion_preconditions_not_met:
- pattern_id: pattern-proposal-business-intent-traceability
  unmet_preconditions:
  - implementation in active codebase
  - empirical evidence of schema-driven gating
  missing_evidence:
  - parser implementation in cas_runner
  - demonstration of automated drift prevention based on business intent
  rationale: Strategically critical concept for tying code back to business vision,
    but currently exists only as forward-looking signals and architecture work manifests
    without runtime enforcement.
  recommended_next_step: Implement AST and schema parser mapping business intent specs
    directly to validation gates.
- pattern_id: pattern-proposal-architecture-knowledge-graph
  unmet_preconditions:
  - underlying graph data structure
  - queryable multi-hop relationship implementation
  missing_evidence:
  - graph database or indexer prototype
  - multi-hop dependency analysis benchmark
  rationale: Provides significant long-term value for enterprise architecture visibility,
    but runtime substrate remains purely file-based Markdown/YAML.
  recommended_next_step: Create experimental spike demonstrating graph query utility
    over flat Markdown/YAML files.
- pattern_id: pattern-proposal-code-intelligence-alignment
  unmet_preconditions:
  - bidirectional diff engine
  - automated enforcement gate in build validation
  missing_evidence:
  - formal intent-to-AST diff algorithm
  - CI gate blocking merges on AST intent divergence
  rationale: High architectural significance for empirical verification, but current
    extraction is unidirectional and diagnostic only.
  recommended_next_step: Formalize AST extraction schemas and integrate into cas-build-validation
    CI flow.
- pattern_id: pattern-proposal-automated-closed-loop-governance
  unmet_preconditions:
  - autonomous safety boundary specification
  - proven human-out-of-the-loop drift remediation
  missing_evidence:
  - blast radius boundary definition for non-breaking changes
  - audit trail of successful autonomous remediation runs
  rationale: Closed-loop automation without PR review presents severe risk of unintended
    state mutation until safe blast-radius boundaries are proven.
  recommended_next_step: Conduct safety boundary audit defining exact criteria for
    non-breaking autonomous remediation.
- pattern_id: reconciliation-agentic-merger
  unmet_preconditions:
  - deterministic merge boundary validation
  - comparative performance benchmarks against git 3-way merge
  missing_evidence:
  - benchmark test suite evaluating semantic resolution accuracy across conflicting
    schema models
  rationale: Semantic reconciliation with LLM assistance carries risk of silent state
    distortion if deterministic validation boundaries are not established.
  recommended_next_step: Run controlled comparative benchmark against git merge strategies
    on sample architectural drifts.
