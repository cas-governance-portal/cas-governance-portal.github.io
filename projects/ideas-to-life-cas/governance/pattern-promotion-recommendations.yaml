promotion_preconditions_not_met:
- pattern_id: reconciliation-agentic-merger
  unmet_preconditions:
  - sufficient evidence exists
  - no critical governance risks exist
  missing_evidence:
  - Empirical conflict resolution benchmark data against standard 3-way git merges
  - Quantified semantic regression rates on structured YAML/markdown metadata
  - Deterministic rollback and safety guardrails under concurrent multi-agent write
    conflicts
  rationale: Applying non-deterministic LLM synthesis to structural merge conflicts
    presents critical governance risks of silent policy corruption without verifiable
    rollback safety.
  recommended_next_step: Implement an automated evaluation benchmark comparing agentic
    merger outputs against 3-way git merges across test repositories.
- pattern_id: heuristic-to-pattern-promotion-lifecycle
  unmet_preconditions:
  - sufficient evidence exists
  missing_evidence:
  - Production instances of heuristics completing the full promotion path to stable
    global patterns
  - Longitudinal evidence of template adoption across independent project workspaces
  rationale: The lifecycle model is codified in templates but lacks sufficient historical
    promotion records in production workloads to prove global governance viability.
  recommended_next_step: Track and record pattern evolution events across at least
    two active projects using the promotion decision template.
- pattern_id: capability-lineage-anchoring
  unmet_preconditions:
  - sufficient evidence exists
  missing_evidence:
  - Longitudinal lineage traversal benchmarks during complex multi-branch refactoring
  - Performance validation of capability graph query resolution in large repository
    histories
  rationale: Data models are implemented in steering/models.py, but longitudinal evidence
    demonstrating lineage consistency across branching cycles remains incomplete.
  recommended_next_step: Execute multi-branch refactoring test cases to evaluate capability
    lineage graph consistency and traversal performance.
- pattern_id: pattern-multi-project-architecture-knowledge-graph
  unmet_preconditions:
  - scope classification is global
  - sufficient evidence exists
  missing_evidence:
  - Cross-repository deployment evidence outside the ideas-to-life portfolio
  - Standardized multi-tenant graph query engine benchmarks
  rationale: Currently scoped to project-level strategic direction; requires empirical
    validation across distributed repositories before global promotion.
  recommended_next_step: Construct a multi-repo proof of concept indexing multiple
    distinct repositories to benchmark cross-project traversal.
- pattern_id: pattern-closed-loop-continuous-governance
  unmet_preconditions:
  - scope classification is global
  missing_evidence:
  - Evidence of automated drift remediation functioning across heterogeneous CI/CD
    engines
  rationale: Engine loop is tightly coupled to this repository's GitHub Actions workflow
    definitions and requires decoupling prior to global promotion.
  recommended_next_step: Decouple orchestration step invocations from GitHub Actions
    workflows to enable generic CLI and pipeline execution.
