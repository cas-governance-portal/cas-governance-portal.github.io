promotion_candidates:
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: High maturity with multiple concrete implementations, strong
    recurring evidence, and clear cross-project applicability. Provides a foundational
    abstraction for LLM integration with deterministic mock fallback, enabling consistent
    testing and provider portability.
  promotion_evidence:
  - recurring signals from multiple proposals
  - implementation in LiteLLMClient and MockLLMClient used across CAS runner and CI
    workflows
  - Current architecture state includes these components as active
  - Cross-project applicability for any AI-integrated system
  promotion_criteria_met:
  - architectural significance
  - reusability
  - evidence quality
  - governance maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - duplicate patterns require consolidation
  - potential over-abstraction if mock loses parity
  confidence: high
- pattern_id: sequential-pipeline-flow-runner
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Central execution backbone with extensive evidence and cross-cutting
    applicability. FlowRunner is consistently referenced as the deterministic orchestration
    mechanism for multi-step agent workflows, providing auditability and controlled
    order.
  promotion_evidence:
  - implementation in FlowRunner and CLI
  - recurring signals from multiple proposals
  - Current architecture state includes FlowRunner as core component
  - Cross-project applicability for any structured pipeline execution
  promotion_criteria_met:
  - architectural significance
  - reusability
  - evidence quality
  - governance maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - duplicate orchestration patterns
  - risk of over-centralization if parallel execution needed
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Well-established implementation and high evidence strength.
    TransitionRegistry and GovernanceActionEngine provide a deterministic governance
    guardrail essential for autonomous systems that modify state. Clearly reusable
    across projects needing auditable state transitions.
  promotion_evidence:
  - implementation in governance_action_engine.py
  - recurring signals from multiple proposals
  - Current architecture state includes governance engine components
  - Cross-project applicability for governance and compliance
  promotion_criteria_met:
  - architectural significance
  - reusability
  - evidence quality
  - governance maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - duplicate state machine patterns
  - risk of over-constraining autonomous actions
  confidence: high
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: High evidence and broad applicability. Pydantic and JSON Schema
    models are used pervasively to validate agent inputs and outputs, ensuring correctness
    in any LLM-integrated system. Essential for preventing malformed data.
  promotion_evidence:
  - implementation in governance and steering models
  - recurring signals from multiple proposals
  - Current architecture state includes typed models
  - Cross-project applicability for agentic data contracts
  promotion_criteria_met:
  - architectural significance
  - reusability
  - evidence quality
  - governance maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - duplicate typed contract patterns
  - risk of schema rigidity reducing flexibility
  confidence: high
- pattern_id: rule-grounded-compliance-evaluation
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Established implementation and high evidence strength. ComplianceEngine
    evaluates deltas against codified rules, producing structured findings. Clear
    necessity for autonomous governance and early violation detection across any governed
    system.
  promotion_evidence:
  - implementation in compliance_engine.py
  - recurring signals from multiple proposals
  - Current architecture state includes compliance engine
  - Cross-project applicability for rule-based governance
  promotion_criteria_met:
  - architectural significance
  - reusability
  - evidence quality
  - governance maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - duplicate compliance evaluation patterns
  - risk of rule over-engineering
  confidence: high
