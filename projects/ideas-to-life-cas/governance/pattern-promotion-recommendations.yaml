promotion_preconditions_not_met:
- pattern_id: reconciliation-agentic-merger
  unmet_preconditions:
  - sufficient evidence exists
  - no critical governance risks exist
  missing_evidence:
  - Empirical conflict resolution accuracy benchmarks against git 3-way merges
  - Formal boundary rules preventing silent deletion of mandatory policy statements
  rationale: Strategic direction is promising, but relying on LLMs for semantic reconciliations
    poses silent schema and policy degradation risks.
  recommended_next_step: Define a benchmark merge test suite and evaluate determinism
    against standard merge tools in dry-run mode.
- pattern_id: multi-project-architecture-knowledge-graph
  unmet_preconditions:
  - promotion readiness is high or medium
  - sufficient evidence exists
  missing_evidence:
  - Deployed graph database or query engine implementation
  - Cross-repository traversal performance metrics
  rationale: Conceptual architecture exists only in strategic direction notes and
    frontmatter links without a container or component implementation.
  recommended_next_step: Prototype graph extraction on real repository networks and
    benchmark multi-hop traversal query performance.
- pattern_id: business-intent-traceability-bridge
  unmet_preconditions:
  - sufficient evidence exists
  missing_evidence:
  - Concrete AST parsing instrumentation connecting business capabilities to code
    symbols
  rationale: Strategic capability is highly desirable but currently lacks implementation
    evidence linking capability IDs to AST nodes.
  recommended_next_step: Develop an automated attribution schema connecting AST symbol
    nodes to capability lineage identifiers.
- pattern_id: closed-loop-continuous-governance
  unmet_preconditions:
  - no critical governance risks exist
  - governance maturity is established
  missing_evidence:
  - Formal safety boundaries validating non-breaking automated fixes vs mandatory
    human approval gates
  rationale: Automated Detect-Analyse-Plan-Execute-Publish loops risk uncontrolled
    commits if automated remediation acts on non-trivial drift.
  recommended_next_step: Test advisory-only remediation in PR workflows before authorizing
    autonomous repository commits.
governance_summary:
  immediate_promotion_candidates:
  - provider-agnostic-llm-facade
  - finite-state-governance-engine
  - sequential-pipeline-flow-runner
  - schema-enforced-domain-contracts
  - file-backed-blackboard-workspace
  - template-driven-artifact-evolution
  deferred_candidates:
  - dedicated-verifier-subagent
  - pure-functional-health-evaluation
  - declarative-agent-skill-packaging
  - declarative-compliance-findings-aggregation
  - bootstrap-governance-block-injection
  - ci-driven-steering-projection
  - authoritative-architecture-work-backlog
  rejected_candidates:
  - structural-cicd-policy-validation
  - bi-directional-external-review-broker
  major_governance_risks:
  - Uncontrolled autonomous remediation in closed-loop loops causing repository corruption
  - Silent schema and policy degradation during unconstrained agentic merge operations
  - Premature promotion of project-scoped automation rules into global architectural
    invariants
  - Proliferation of redundant pattern synonyms in organizational memory without strict
    deduplication gating
