deferred_candidates:
- pattern_id: independent-verifier-subagent
  recommendation: defer
  rationale: Role separation between producer and verifier is established in harness
    definitions, but quantitative performance metrics and double-agent evaluation
    benchmarks across diverse repositories are still accumulating.
  evidence_gaps: Requires comparative validation showing reduced error leakage into
    trunk compared to single-agent runs with deterministic linters.
  promotion_criteria_missing:
  - governance maturity
  recommended_next_step: Run multi-project eval benchmarks comparing verifier subagent
    finding rates against deterministic compliance gates.
  scope_alignment: global
  confidence: medium
- pattern_id: multi-adapter-agent-telemetry
  recommendation: defer
  rationale: Telemetry normalization for Claude Code and Antigravity is implemented
    in dashboard/agent_telemetry.py, but cross-harness cost and duration normalization
    needs validation across external enterprise telemetry backends.
  evidence_gaps: Lacks longitudinal production data verifying cost estimation accuracy
    across rapid upstream model token pricing revisions.
  promotion_criteria_missing:
  - governance maturity
  recommended_next_step: Validate cost estimation formulas against actual vendor billing
    records across a 30-day continuous cycle.
  scope_alignment: global
  confidence: medium
- pattern_id: pattern-authoritative-architecture-work-registry
  recommendation: defer
  rationale: Pattern is tightly bound to current CAS backlog orchestration mechanics
    and needs validation across alternative project repository structures.
  evidence_gaps: Lack of deployment evidence in external consumer repositories where
    backlog tracking is managed outside CAS file schemas.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Pilot Architecture Work registry in at least one downstream
    consumer project and assess backlog synchronization overhead.
  scope_alignment: project
  confidence: high
- pattern_id: pattern-closed-loop-continuous-governance
  recommendation: defer
  rationale: Coupled to the continuous architecture runner loop and GitHub Actions
    CI triggers of ideas-to-life-cas, requiring evaluation in heterogeneous CI environments.
  evidence_gaps: Absence of empirical data on self-healing automated drift remediation
    in large-scale multi-branch topologies.
  promotion_criteria_missing:
  - reusability
  - governance maturity
  recommended_next_step: Decouple workflow triggers from specific GitHub Actions events
    to allow GitLab CI and Jenkins execution before global promotion.
  scope_alignment: project
  confidence: high
- pattern_id: pattern-multi-project-architecture-knowledge-graph
  recommendation: defer
  rationale: Strategic direction for multi-project knowledge traversal that requires
    multi-repo deployment evidence and graph query scaling proofs.
  evidence_gaps: Requires reference graph index schema and cross-repo federation benchmarks
    beyond single-workspace frontmatter linking.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Construct a multi-repo proof of concept indexing at least
    three connected repositories to benchmark graph resolution latency.
  scope_alignment: project
  confidence: high
- pattern_id: reconciliation-agentic-merger
  recommendation: defer
  rationale: Applies non-deterministic LLM synthesis to resolve semantic merge conflicts
    in structured markdown and YAML files without robust rollback guarantees.
  evidence_gaps: Lacks objective error-rate data, conflict resolution validation suites,
    and rollback safety benchmarks across concurrent agent edits.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Implement evaluation test suites comparing AgenticMerger
    outputs against standard 3-way git merges to measure semantic regression rates.
  scope_alignment: global
  confidence: high
- pattern_id: heuristic-to-pattern-promotion-lifecycle
  recommendation: defer
  rationale: Defines an evolutionary path promoting informal agent heuristics to verified
    architectural patterns, but template usage has limited production history.
  evidence_gaps: Insufficient historical instances of completed promotions transitioning
    through heuristic -> pattern -> stable within production projects.
  promotion_criteria_missing:
  - recurrence
  - governance maturity
  recommended_next_step: Observe pattern promotion events across at least two external
    projects before standardizing the promotion template as a global model.
  scope_alignment: global
  confidence: high
- pattern_id: capability-lineage-anchoring
  recommendation: defer
  rationale: Tracks fine-grained provenance and functional evolution of architecture
    capabilities via typed lineage models, but longitudinal traversal under complex
    branching is nascent.
  evidence_gaps: Models exist in steering/models.py, but longitudinal validation of
    lineage traversal during complex multi-branch refactoring is limited.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Validate whether capability lineage graphs remain consistent
    and performant after successive automated refactoring cycles.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-business-intent-traceability-pipeline
  recommendation: defer
  rationale: Binds specific CAS ADR schemas and alignment reports to business drivers;
    remains emerging within current project lifecycle stage.
  evidence_gaps: Lack of structured evidence showing automated detection of business
    drift from code modifications in production pipelines.
  promotion_criteria_missing:
  - evidence quality
  - recurrence
  recommended_next_step: Formalize business intent schema and test automated drift
    detection across milestone releases.
  scope_alignment: project
  confidence: high
- pattern_id: docs-as-code-portal-projection
  recommendation: defer
  rationale: Project-specific documentation site rendering and CNAME publishing pipeline
    utilizing MkDocs Material and local preprocessors.
  evidence_gaps: Tight coupling to MkDocs Material and local repo file layout; needs
    abstraction for alternate documentation site generators.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Package portal preprocessor as a standalone plugin or CLI
    subcommand independent of specific MkDocs templates.
  scope_alignment: project
  confidence: high
rejected_candidates:
- pattern_id: deterministic-workflow-validation
  recommendation: reject
  rationale: Validation script in specs/090-simplify-cicd-workflows/ is tailored strictly
    to repository-specific CI/CD workflow constraints and unpinned installer rules.
  governance_concern: Over-fitting project-specific workflow scripts as universal
    patterns introduces brittle anti-patterns into organizational memory.
  confidence: high
