  confidence: high
- pattern_id: evidence-first-initialization
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Grounds LLM reasoning by pre-loading factual architectural
    artifacts into context prior to prompt execution, preventing hallucinations.
  promotion_evidence:
  - Implementation in src/cas_runner/runner.py
  - Grounding requirement signals
  - Integration with knowledge base loading
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Increased token usage and context window pressure
  - Outdated evidence leading to stale reasoning
  confidence: high
deferred_candidates:
- pattern_id: shared-context-blackboard
  recommendation: defer
  rationale: Overlaps with pipe-and-filter-context concept and requires consolidation
    of pipeline state propagation semantics before global promotion.
  evidence_gaps: Requires formal consolidation with pipe-and-filter-context and clearer
    boundary definition for state pollution mitigation.
  promotion_criteria_missing:
  - governance maturity
  - concept stability
  recommended_next_step: Consolidate implementation details with pipe-and-filter-context
    proposal and define state mutation boundaries.
  scope_alignment: global
  confidence: high
- pattern_id: managed-section-governance
  recommendation: defer
  rationale: Classified with project scope; requires cross-project usage evidence
    before global promotion.
  evidence_gaps: Lacks validation across external projects outside CAS document synchronization.
  promotion_criteria_missing:
  - cross-project recurrence
  - reusability validation
  recommended_next_step: Trial pattern in additional target projects to establish
    cross-project applicability.
  scope_alignment: project
  confidence: high
rejected_candidates:
- pattern_id: pipe-and-filter-context
  recommendation: reject
  rationale: Redundant proposal overlapping directly with shared-context-blackboard
    in implementation (FlowRunner context passing in src/cas_runner/runner.py).
  governance_concern: Duplicate pattern proposal creation leading to taxonomy fragmentation.
  confidence: high
duplicate_overlapping_promotion_candidates:
- patterns_involved:
  - shared-context-blackboard
  - pipe-and-filter-context
  recommended_action: Consolidate into shared-context-blackboard and archive pipe-and-filter-context.
  rationale: Both proposals describe passing a mutable context object through FlowRunner
    steps in src/cas_runner/runner.py. 'shared-context-blackboard' better aligns with
    agentic state management terminology.
promotion_preconditions_not_met:
- pattern_id: artifact-frontmatter-entity
  unmet_preconditions:
  - global_scope_classification
  - architectural_significance
  missing_evidence:
  - Cross-project usage evidence
  - Proof of architectural significance beyond file format persistence detail
  rationale: Represents an implementation detail (Markdown + YAML parsing in src/cas_runner/io.py)
    rather than a system-level architectural or governance pattern.
  recommended_next_step: Maintain as a project-specific implementation heuristic rather
    than submitting for global pattern promotion.
governance_summary:
  immediate_promotion_candidates:
