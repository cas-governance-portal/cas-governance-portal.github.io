promotion_preconditions_not_met:
- pattern_id: git-delta-prompt-facts
  unmet_preconditions:
  - sufficient evidence
  - architectural significance
  - promotion readiness high or medium
  missing_evidence:
  - No concrete implementation or usage examples beyond the model classes
  - No cross-project recurrence
  rationale: Evidence is limited to model definitions and a low confidence from the
    2026-10-07 proposal; the actual transformation logic is not described.
  recommended_next_step: Gather more evidence from actual execution of git-delta-to-prompt-fact
    transformations and document at least two distinct use cases.
- pattern_id: agentic-merger-artifact-reconciliation
  unmet_preconditions:
  - sufficient evidence
  - promotion readiness high or medium
  - architectural significance
  missing_evidence:
  - No evidence of successful reconciliation outcomes
  - No integration with broader governance flows
  rationale: The pattern is only represented by the AgenticMerger class with low confidence;
    no detailed behavior or independent verification.
  recommended_next_step: Collect outcome logs and test results from agentic merges,
    then reassess scope and readiness.
- pattern_id: prompt-fact-contract
  unmet_preconditions:
  - sufficient evidence
  - architectural significance
  - promotion readiness high or medium
  missing_evidence:
  - No usage beyond model definitions
  - Lack of explicit contract enforcement examples
  rationale: PromptFact is a typed model, but the pattern of using it as a contract
    is not sufficiently demonstrated.
  recommended_next_step: Document how PromptFact is consumed by agents and show how
    it prevents malformed prompts.
- pattern_id: runtime-evaluation-trace
  unmet_preconditions:
  - sufficient evidence
  - architectural significance
  - promotion readiness high or medium
  missing_evidence:
  - No model or logic for trace persistence
  - No evidence linking traces to evaluations
  rationale: The existence of traces/evaluations directories suggests persistence,
    but the pattern is not formalized.
  recommended_next_step: Design a concrete trace-to-evaluation linkage and gather
    feedback from runtime usage.
- pattern_id: pattern-evolution-lifecycle
  unmet_preconditions:
  - sufficient evidence
  - promotion readiness high or medium
  - architectural significance
  missing_evidence:
  - Only templates and docs exist; no automated promotion decisions or observed transitions
  - No cross-project validation
  rationale: Template-based promotion flow is documented but not fully implemented;
    evidence is low.
  recommended_next_step: Implement a pilot of heuristic-to-pattern promotion and collect
    evidence across multiple projects.
governance_summary:
  immediate_promotion_candidates:
  - provider-agnostic-llm-facade
  - finite-state-governance-engine
  - schema-enforced-domain-contracts
  - sequential-flow-pipeline-runner
  - file-backed-blackboard-workspace
  - telemetry-observable-agent-steps
  - declarative-steering-projection
  - rule-grounded-compliance-evaluation
  - health-model-observability-guardrail
  - deterministic-mock-evaluation-harness
  deferred_candidates:
  - reconciliation-agentic-merger
  - bootstrap-governance-block-injection
  - capability-lineage-anchoring
  - ci-driven-steering-projection
  - declarative-agent-command-registry
  - service-facade-application-boundary
  - pattern-continuous-governance-loop
  - structural-cicd-policy-validation
  - template-driven-pattern-evolution
  - externalized-runtime-context
  - pattern-architecture-intent-completeness
  - multi-agent-instruction-manifests
  rejected_candidates: []
  major_governance_risks:
  - Duplication risk among LLM facade variants could fragment governance and create
    ambiguity.
  - Premature promotion of emerging agentic merger without robust evidence may result
    in unstable governance patterns.
  - Insufficient evidence for candidate patterns (e.g., git-delta-prompt-facts, prompt-fact-contract)
    leads to uncertainty in promotion decisions.
  - Project-level patterns may lose visibility if deferred indefinitely, risking architectural
    drift.
  - Overlapping patterns across steering projection and compliance evaluation require
    careful consolidation to avoid redundancy.
