- pattern_id: file-system-knowledge-repository
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Leverages git versioning and transparent formats (Markdown,
    YAML, JSON) as primary persistence for transparent architecture review without
    external database dependencies.
  promotion_evidence:
  - cas-knowledge hierarchical layout spanning global, project, and runtime scopes
  - KnowledgeProvider and LocalKnowledgeProvider AST symbols in src/cas_runner/io.py
  - bootstrap synchronization engine in src/cas_runner/bootstrap.py
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Concurrent branch merge conflicts on shared markdown knowledge headers
  confidence: high
deferred_candidates:
- pattern_id: reconciliation-agentic-merger
  recommendation: defer
  rationale: Strategic direction component for LLM-assisted merge conflict resolution
    carrying non-deterministic state divergence risks.
  evidence_gaps: Lacks empirical comparative evaluation against standard three-way
    git merges and boundary validation across high-variance conflicts.
  promotion_criteria_missing:
  - governance maturity
  - evidence quality
  - risk mitigation validation
  recommended_next_step: Run controlled comparative benchmark against git merge strategies
    on sample architectural drifts.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-proposal-automated-closed-loop-governance
  recommendation: defer
  rationale: High operational blast radius; autonomous detect-analyze-plan-execute
    cycles without PR approval require strict safety boundary definitions.
  evidence_gaps: Current continuous architecture workflows still mandate explicit
    PR approval before merging managed changes.
  promotion_criteria_missing:
  - governance maturity
  - evidence quality
  recommended_next_step: Conduct safety boundary audit defining exact criteria for
    non-breaking autonomous remediation.
  scope_alignment: global
  confidence: high
- pattern_id: declarative-steering-projection
  recommendation: defer
  rationale: Extracts structured prompt facts from git changes to steer downstream
    agent steps, but token optimization performance needs profiling across larger
    diffs.
  evidence_gaps: Validation needed across larger multi-file commits to assess prompt
    sizing and relevance filtering efficiency.
  promotion_criteria_missing:
  - recurrence
  - evidence quality
  recommended_next_step: Profile prompt fact extraction against high-variance commit
    histories.
  scope_alignment: global
  confidence: high
- pattern_id: capability-lineage-anchoring
  recommendation: defer
  rationale: Currently scoped as project-specific capability lineage tracking within
    ideas-to-life-cas runtime context.
  evidence_gaps: Requires validation across multiple independent project repositories
    to verify global reusability.
  promotion_criteria_missing:
  - reusability
  - recurrence
  recommended_next_step: Test lineage schema ingestion across external project repositories
    enrolled in CAS.
  scope_alignment: project
  confidence: high
- pattern_id: telemetry-observable-agent-steps
  recommendation: defer
  rationale: Foundational SDK dependencies exist, but runtime span instrumentation
    across distributed LLM steps is still emerging.
  evidence_gaps: End-to-end distributed trace spans and cost profiling not consistently
    emitted across all runner steps.
  promotion_criteria_missing:
  - governance maturity
  - evidence quality
  recommended_next_step: Implement end-to-end span instrumentation across FlowRunner
    step dispatches and verify dashboard telemetry consumption.
  scope_alignment: global
  confidence: medium
- pattern_id: pattern-proposal-business-intent-traceability
  recommendation: defer
  rationale: High strategic importance connecting business intent to ADRs and code,
    but formal ingestion and parser contract in runner codebase is nascent.
  evidence_gaps: Only referenced in forward-looking signals and alignment reports;
    lacks functional parser implementation in runner codebase.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Implement AST and schema parser mapping business intent specs
    directly to validation gates.
  scope_alignment: candidate
  confidence: high
- pattern_id: pattern-proposal-architecture-knowledge-graph
  recommendation: defer
  rationale: Advanced concept for graph-based traversal of architecture decisions,
    AST relationships, and cross-project lineage without underlying graph substrate.
  evidence_gaps: Knowledge substrate is currently a flat file-system repository; no
    graph database or indexing engine is implemented.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Create experimental spike demonstrating graph query utility
