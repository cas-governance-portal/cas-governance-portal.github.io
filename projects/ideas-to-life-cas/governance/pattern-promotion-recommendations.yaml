promotion_candidates:
- pattern_id: sequential-pipeline-flow-runner
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Core architectural mechanism for deterministic multi-step agent
    workflows, evidenced across dozens of proposals and implemented in FlowRunner.
    Reusable across any automated governance, analysis, or generation pipeline.
  promotion_evidence:
  - Recurring signals and architecture work in dozens of proposals
  - Current architecture state confirms FlowRunner as central orchestrator
  - Implemented with high evidence strength in src/cas_runner/runner.py
  promotion_criteria_met:
  - Global scope
  - Architectural significance
  - Reusability
  - Evidence strength high
  - Governance maturity high
  scope_alignment: Global
  evidence_strength: high
  governance_risks:
  - Duplicate promotion risk due to many overlapping proposals
  - Need to consolidate variants before final promotion
  confidence: high
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Typed, validated contracts are foundational for agentic systems
    where LLM outputs must be bounded and inspectable. Reusable across governance,
    steering, compliance, and agent I/O.
  promotion_evidence:
  - Recurrence across governance, steering, compliance, and agent I/O proposals
  - Pydantic/JSON Schema models implemented in multiple modules with high evidence
  - Current architecture state supports typed contracts for state and actions
  promotion_criteria_met:
  - Global scope
  - Architectural significance
  - Reusability
  - Evidence strength high
  - Promotion readiness high
  scope_alignment: Global
  evidence_strength: high
  governance_risks:
  - Potential over-standardization if applied too broadly
  - Need to ensure consistent adoption across all domains
  confidence: high
- pattern_id: finite-state-governance-action-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Explicit state machine governance is a core control mechanism
    for agent autonomy, preventing invalid lifecycle transitions and applicable to
    any governed entity.
  promotion_evidence:
  - TransitionRegistry and GovernanceActionEngine appear in many proposals
  - Implemented with high evidence strength in governance_action_engine.py
  - Current architecture state confirms state machine enforcement for governance actions
  promotion_criteria_met:
  - Global scope
  - Architectural significance
  - Reusability
  - Evidence strength high
  - Governance maturity high
  scope_alignment: Global
  evidence_strength: high
  governance_risks:
  - Duplicate promotion risk due to various state machine proposals
  - Need to consolidate into single pattern to avoid fragmentation
  confidence: high
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Decoupling agent logic from LLM providers is a foundational
    requirement for any AI-driven platform. The dual production/mock client pattern
    ensures testability, cost control, and provider portability.
  promotion_evidence:
  - LiteLLMClient and MockLLMClient referenced across codebase and many proposals
  - High evidence strength in llm module
  - Current architecture state shows consistent client abstraction
  promotion_criteria_met:
  - Global scope
  - Architectural significance
  - Reusability
  - Evidence strength high
  - Promotion readiness high
  scope_alignment: Global
  evidence_strength: high
  governance_risks:
  - Duplicate promotion risk from numerous LLM abstraction variants
  - Must consolidate all variants before promotion
  confidence: high
- pattern_id: file-backed-blackboard-workspace
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: A persistent, auditable, human-readable knowledge store is
    foundational for multi-agent governance. Git-backed file structure is reusable
    across projects and provides traceability and reviewability.
  promotion_evidence:
  - cas-knowledge as version-controlled knowledge blackboard appears in many proposals
  - High evidence strength in bootstrap and knowledge layout
  - Current architecture state confirms file-based knowledge repository
  promotion_criteria_met:
  - Global scope
  - Architectural significance
  - Reusability
  - Evidence strength high
  - Governance maturity high
  scope_alignment: Global
  evidence_strength: high
  governance_risks:
  - Potential for overstructuring or schema tightness if not flexible
  - Need to ensure cross-project applicability without excessive overhead
  confidence: high
deferred_candidates:
- pattern_id: steering-fact-projection
  recommendation: defer
  rationale: Classified as global but is a supporting pattern with strategic_direction
    maturity. Needs cross-project evidence to confirm stability and avoid premature
    promotion.
  evidence_gaps: No operational data from multiple independent projects; implementation
    primarily in steering models and CI workflows.
  promotion_criteria_missing:
  - Cross-project applicability evidence
  - Stability across diverse environments
  recommended_next_step: Gather evidence from at least two independent projects using
    steering fact projection before reconsidering promotion.
  scope_alignment: Global
  confidence: medium
- pattern_id: reconciliation-agentic-merger
  recommendation: defer
  rationale: Agentic merge is still strategic_direction and many proposals are not
    yet stable across implementations. Premature promotion could force a pattern that
    is not yet proven.
  evidence_gaps: Several merge variants exist; only one implementation in agentic_merger.py;
    no cross-project validation.
  promotion_criteria_missing:
  - Consolidated implementation evidence
  - Cross-project applicability
  - Stability
  recommended_next_step: Consolidate duplicate merge proposals and validate across
    at least two independent projects before promotion.
  scope_alignment: Global
  confidence: medium
- pattern_id: telemetry-observable-agent-steps
  recommendation: defer
  rationale: Telemetry pattern requires operational evidence. Current evidence mainly
    comprises dependencies and models, not actual trace data or dashboards.
  evidence_gaps: No trace artifacts or dashboard outputs; only OpenTelemetry dependencies
    and TraceableMetric model.
  promotion_criteria_missing:
  - Operational trace evidence
  - Cross-project telemetry usage
  recommended_next_step: Instrument at least two production flows and persist traces
    to demonstrate the pattern before promotion.
  scope_alignment: Global
  confidence: medium
- pattern_id: rule-grounded-compliance-evaluation
  recommendation: defer
  rationale: Compliance evaluation is established, but the pattern is strategic_direction.
    Need to consolidate duplicate compliance engines and gather evidence from multiple
    projects.
  evidence_gaps: Multiple compliance engine variants; no cross-project evidence beyond
    this repository.
  promotion_criteria_missing:
  - Consolidated implementation
  - Cross-project applicability
  recommended_next_step: Unify compliance engine proposals and validate across multiple
    projects before promotion.
  scope_alignment: Global
  confidence: medium
- pattern_id: capability-lineage-anchoring
  recommendation: defer
  rationale: Capability lineage is a supporting pattern with high evidence but limited
    to model definitions. Need to demonstrate lineage computation and usage.
  evidence_gaps: No implementation for building or traversing lineage; only model
    definitions exist.
  promotion_criteria_missing:
  - Lineage computation logic
  - Cross-project use cases
  recommended_next_step: Implement lineage creation and use it in steering or impact
    analysis before promotion.
  scope_alignment: Global
  confidence: medium
- pattern_id: heuristic-to-pattern-promotion-lifecycle
  recommendation: defer
  rationale: Lifecycle defined in templates but no operational data shows successful
    promotions. Needs evidence of effectiveness across projects.
  evidence_gaps: No metrics on pattern promotion quality or recurrence; only documentation.
  promotion_criteria_missing:
  - Operational evidence of lifecycle success
  - Cross-project validation
  recommended_next_step: Collect evidence from promotion decisions across projects
    and assess stability.
  scope_alignment: Project
  confidence: medium
- pattern_id: ci-driven-steering-projection
  recommendation: defer
  rationale: CI-triggered steering projection is tightly coupled to this repository's
    GitHub Actions and knowledge layout. Needs cross-project evidence.
  evidence_gaps: No independent project usage; workflow-specific implementation.
  promotion_criteria_missing:
  - Cross-project applicability
  - Portability beyond current CI setup
  recommended_next_step: Extract into portable, configurable components and validate
    in another project.
  scope_alignment: Project
  confidence: medium
- pattern_id: skill-packaged-agent-procedures
  recommendation: defer
  rationale: Packaging agent skills in directories is promising but evidence is limited
