  - Maintenance overhead for schema files
  confidence: high
- pattern_id: registry-driven-extensibility
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Decouples flow definition and step resolution from execution
    runner using centralized registry mappings.
  promotion_evidence:
  - Implementation in src/cas_runner/steps/registry.py
  - Decoupling configuration signals
  - Multiple workflow executions using registry
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
