deferred_candidates:
- pattern_id: pattern-closed-loop-governance
  recommendation: defer
  rationale: Concept is foundational but operational metrics and closed-loop automated
    execution feedback loops require further maturation in production CI runs.
  evidence_gaps: Requires production validation demonstrating autonomous remediation
    execution without human intervention.
  promotion_criteria_missing:
  - governance maturity
  - recurrence
  recommended_next_step: Validate automated drift-remediation cycles across multiple
    CI workflows before promoting to global catalog.
  scope_alignment: global
  confidence: high
- pattern_id: sequential-pipeline-flow-runner
  recommendation: defer
  rationale: Highly functional within the CAS runner implementation, but core abstraction
    is currently undergoing stabilization for cross-project multi-agent execution.
  evidence_gaps: Cross-project extraction and external agent pipeline interop evidence
    is incomplete.
  promotion_criteria_missing:
  - cross-project applicability
  recommended_next_step: Extract flow execution primitives into reusable harness and
    observe behavior across second project.
  scope_alignment: global
  confidence: high
- pattern_id: telemetry-observable-agent-steps
  recommendation: defer
  rationale: Telemetry dependencies and models exist, but standardized tracing spans
    and unified metric exports across distributed agent executions are not yet stabilized.
  evidence_gaps: Lack of standardized span naming conventions and distributed context
    propagation across multi-agent steps.
  promotion_criteria_missing:
  - governance maturity
  recommended_next_step: Formalize OpenTelemetry span taxonomy and collector integration
    guidelines.
  scope_alignment: global
  confidence: medium
- pattern_id: declarative-agent-command-registry
  recommendation: defer
  rationale: Manifest specifications in .agents/commands/ demonstrate viability, but
    cross-repo registry resolution schema is still evolving.
  evidence_gaps: Formal schema validation for TOML command specifications across varying
    agent runtimes.
  promotion_criteria_missing:
  - governance maturity
  - reusability
  recommended_next_step: Define a canonical JSON Schema for agent command manifests
    and test compatibility across multiple repos.
  scope_alignment: global
  confidence: medium
- pattern_id: docs-as-code-portal-projection
  recommendation: defer
  rationale: Current implementation is tightly integrated with MkDocs and specific
    portal preprocessing scripts.
  evidence_gaps: Generalization beyond MkDocs-material to arbitrary documentation
    engines is not demonstrated.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Evaluate whether projection format should be engine-agnostic
    markdown/JSON before global promotion.
  scope_alignment: global
  confidence: medium
- pattern_id: pattern-scope-classification-framework
  recommendation: defer
  rationale: Framework establishes the governance rules currently in trial execution;
    premature self-promotion risks cementing untested lifecycle stages.
  evidence_gaps: Longitudinal evidence assessing false-positive and false-negative
    promotion rates across multiple cycles.
  promotion_criteria_missing:
  - governance maturity
  recommended_next_step: Operate the scoping framework over two subsequent governance
    cycles to validate stability.
  scope_alignment: global
  confidence: high
- pattern_id: ci-driven-steering-projection
  recommendation: defer
  rationale: Pattern is scoped to ideas-to-life-cas and coupled to specific GitHub
    Actions workflows and local markdown files.
  evidence_gaps: Decoupling from GitHub Actions to generic CI providers and arbitrary
    repository structures.
  promotion_criteria_missing:
  - reusability
  - cross-project applicability
  recommended_next_step: Maintain as project pattern until abstract projection runner
    is extracted.
  scope_alignment: project
  confidence: high
- pattern_id: pure-functional-health-evaluation
  recommendation: defer
  rationale: Currently coupled to project dashboard entities and CAS metric scoring
    thresholds.
  evidence_gaps: Universal health calculation taxonomy independent of CAS metric keys.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Maintain within project scope; extract generic metric evaluation
    interfaces when additional projects onboard.
  scope_alignment: project
  confidence: high
- pattern_id: layered-governance-service-facade
  recommendation: defer
  rationale: Orchestrates project-specific domain engines tailored directly to ideas-to-life-cas
    runtime.
  evidence_gaps: Abstract service interface demonstrating portability across distinct
    domain engine implementations.
  promotion_criteria_missing:
  - reusability
  - cross-project applicability
  recommended_next_step: Retain at project scope until standardized governance action
    interfaces are formalized.
  scope_alignment: project
  confidence: high
rejected_candidates:
- pattern_id: pydantic-domain-entity-modeling
  recommendation: reject
  rationale: Directly duplicates the abstraction established by schema-enforced-domain-contracts
    while introducing unnecessary coupling to a specific third-party library.
  governance_concern: Global catalog pollution with library-specific design conventions
    rather than vendor-neutral architectural patterns.
  confidence: high
- pattern_id: transition-registry-state-machine
  recommendation: reject
  rationale: Subsumed completely as an internal implementation component of finite-state-governance-engine.
  governance_concern: Fragmenting composite patterns into micro-implementation patterns
    degrades architectural clarity.
  confidence: high
- pattern_id: swappable-client-adapter
  recommendation: reject
  rationale: Overly generic Gang-of-Four software design pattern lacking distinct
    domain or intelligence architecture specificity.
  governance_concern: Promoting standard programming idioms dilutes the focus of architectural
    and intelligence pattern repositories.
  confidence: high
duplicate_overlapping_promotion_candidates:
- patterns_involved:
  - schema-enforced-domain-contracts
  - pydantic-domain-entity-modeling
  recommended_action: Consolidate into schema-enforced-domain-contracts and reject
    pydantic-domain-entity-modeling
  rationale: schema-enforced-domain-contracts captures the vendor-neutral architectural
    requirement for strong contract boundaries without coupling to Pydantic.
- patterns_involved:
  - finite-state-governance-engine
  - transition-registry-state-machine
  recommended_action: Consolidate into finite-state-governance-engine
  rationale: TransitionRegistry is an integral component of the finite-state governance
    engine rather than an independent global architectural pattern.
- patterns_involved:
  - provider-agnostic-llm-facade
  - swappable-client-adapter
  - deterministic-mock-evaluation-harness
  recommended_action: Promote domain-specific facade and mock harness independently,
    reject generic swappable-client-adapter
  rationale: Specialized intelligence facades address LLM-specific operational forces
    that generic Gang-of-Four adapter patterns fail to capture.
promotion_preconditions_not_met:
- pattern_id: pattern-architecture-knowledge-graph
  unmet_preconditions:
  - sufficient evidence exists
  - verified runtime code implementation
  - promotion readiness is high or medium
  missing_evidence:
  - Runtime AST symbols for graph database client
  - Lineage traversal component implementation
  - Graph persistence schema
  rationale: Strategic vision pattern with strong directional value, but currently
    unevidenced by runtime code in the active repository state.
  recommended_next_step: Retain in candidate status until graph storage, node schemas,
    and traversal components are implemented.
- pattern_id: pattern-business-intent-traceability
  unmet_preconditions:
  - sufficient evidence exists
  - verified runtime code implementation
  - promotion readiness is high or medium
  missing_evidence:
  - Formal business intent ingestion schema
  - AST symbols mapping intent models to ADRs or code symbols
  rationale: Strategic direction proposal with conceptual support in alignment reports
    but lacking executable verification engines.
  recommended_next_step: Author formal intent schema contracts and validate bidirectional
    traceability before requesting promotion evaluation.
- pattern_id: reconciliation-agentic-merger
  unmet_preconditions:
  - scope classification is global
  - governance maturity demonstrated across multiple projects
  missing_evidence:
  - Evidence of conflict resolution across external non-CAS repository formats
  - Stability and error-rate benchmarks for semantic AST merging
  rationale: Emerging experimental capability currently scoped to project boundaries;
    risk of non-deterministic automated merge corruption in general use.
  recommended_next_step: Evaluate semantic merge accuracy and failure isolation in
    project environment before generalizing to global promotion.
governance_summary:
  immediate_promotion_candidates:
  - schema-enforced-domain-contracts
  - finite-state-governance-engine
  - provider-agnostic-llm-facade
  - deterministic-mock-evaluation-harness
  deferred_candidates:
  - pattern-closed-loop-governance
  - sequential-pipeline-flow-runner
  - telemetry-observable-agent-steps
  - declarative-agent-command-registry
  - docs-as-code-portal-projection
  - pattern-scope-classification-framework
  - ci-driven-steering-projection
  - pure-functional-health-evaluation
  - layered-governance-service-facade
  rejected_candidates:
  - pydantic-domain-entity-modeling
  - transition-registry-state-machine
  - swappable-client-adapter
  major_governance_risks:
  - Premature promotion of strategic vision patterns lacking concrete AST or runtime
    code implementations
  - Catalog bloat caused by promoting generic Gang-of-Four idioms or library-specific
    domain wrappers
