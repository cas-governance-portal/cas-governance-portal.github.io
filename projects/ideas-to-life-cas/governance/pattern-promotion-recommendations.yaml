    lifecycle transitions, flow definitions, and provider configuration
  - Project-scoped patterns may be promoted prematurely despite insufficient cross-project
    evidence
  - Documentation-only or model-name-only proposals create false maturity signals
  - Telemetry and health-scoring concepts risk scope ambiguity if tracing and governance
    health are conflated
  - Knowledge-provider and file-backed blackboard patterns must remain separate to
    avoid promoting a concrete filesystem layout as a global abstraction
