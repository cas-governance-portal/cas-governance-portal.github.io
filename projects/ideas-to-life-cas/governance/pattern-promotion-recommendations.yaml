promotion_candidates:
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Provides foundational runtime integrity and schema enforcement
    across system boundaries, preventing hallucinated and malformed payloads in agentic
    execution.
  promotion_evidence:
  - Implemented domain entities across src/cas_runner/governance/models.py defining
    strict Pydantic and JSON Schema contracts.
  - Validated across build validation workflows and test suites.
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: Aligned with global core classification; universally applicable
    across all autonomous and agentic pipelines.
  evidence_strength: high
  governance_risks:
  - Schema rigidity could slow early iterative prototyping if migration paths are
    undefined.
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Essential state machine pattern that gates state mutations
    and enforces precondition rules, preventing premature lifecycle transitions by
    autonomous agents.
  promotion_evidence:
  - Implemented in src/cas_runner/governance/governance_action_engine.py with TransitionRegistry
    and GovernanceActionEngine.
  - Demonstrated in automated continuous governance workflows.
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: Global core pattern candidate essential for multi-project architectural
    integrity.
  evidence_strength: high
  governance_risks:
  - Registry misconfiguration may block valid emergency state remediation.
  confidence: high
- pattern_id: pattern-scope-classification-framework
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Establishes multi-tier scoping (global, project, candidate)
    and staging gates to prevent rule bloat and premature rule promotion across repositories.
  promotion_evidence:
  - Proven in pipeline flow definitions and multiple architecture work items (aw-ideas-to-life-cas-20260614-1,
    aw-ideas-to-life-cas-2026-05-31-001).
  - Embedded into continuous architecture evaluation cycles.
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - governance maturity
  - strategic alignment
  scope_alignment: Global core governance framework applicable across all managed
    software portfolios.
  evidence_strength: high
  governance_risks:
  - Overly strict staging gates may delay adoption of emerging project patterns.
  confidence: high
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Isolates model provider APIs and standardizes invocation semantics,
    eliminating vendor lock-in and enabling deterministic testing via symmetric test
    doubles.
  promotion_evidence:
  - Implemented in src/cas_runner/llm/litellm_client.py (LiteLLMClient) and src/cas_runner/llm/mock_client.py
    (MockLLMClient).
  - Active in CI/CD pipeline runs without network flakiness.
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - governance maturity
  scope_alignment: Global supporting pattern providing shared infrastructure capabilities
    for all LLM-driven services.
  evidence_strength: high
  governance_risks:
  - Facade abstraction leakage if provider-specific parameters (e.g. extended thinking
    tokens) become necessary.
  confidence: high
- pattern_id: pure-functional-health-evaluation
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Ensures side-effect-free, deterministic health diagnostics
    and human-readable diagnostic reasoning from state metrics without environment
    dependencies.
  promotion_evidence:
  - Implemented in src/cas_runner/dashboard/health_model.py (calculate_health, get_health_reasons).
  - Verified through deterministic test suites and portal compilation workflows.
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - governance maturity
  scope_alignment: Global supporting pattern reusable across diagnostic dashboards
    and automated gates.
  evidence_strength: high
  governance_risks:
  - Threshold changes in health calculators can shift baseline metrics across systems
    unexpectedly.
  confidence: high
- pattern_id: declarative-agent-command-registry
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Decouples agent skill contracts from hardcoded procedural code
    via version-controlled declarative manifests, unifying agent and human capability
    invocation.
  promotion_evidence:
  - Implemented in .agents/commands/ (speckit.plan.toml, speckit.analyze.toml).
  - Integrated with CLI execution flows.
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - strategic alignment
  scope_alignment: Global supporting pattern enabling interoperability across diverse
    agent tools and workflows.
  evidence_strength: high
  governance_risks:
  - Schema evolution of declarative manifests must remain backward-compatible with
    older agents.
  confidence: high
deferred_candidates:
- pattern_id: pattern-closed-loop-governance
  recommendation: defer
  rationale: Highly significant continuous architecture vision connecting drift detection
    to remediation, but currently at medium readiness and requires further automated
    verification in production pipelines.
  evidence_gaps: Requires operational validation of automated non-breaking remediations
    without human-in-the-loop intervention.
  promotion_criteria_missing:
  - governance maturity
  - empirical production evidence
  recommended_next_step: Exercise closed-loop dry-run cycles in CI to demonstrate
    safe convergence on non-trivial architectural deltas.
  scope_alignment: Classified as global core; deferred strictly for evidence and governance
    maturity reinforcement.
  confidence: high
- pattern_id: sequential-pipeline-flow-runner
  recommendation: defer
  rationale: Implementation is currently tied directly to cas_runner.runner.FlowRunner
    step sequence abstractions within the local workspace.
  evidence_gaps: Lacks cross-project generalized execution engine abstractions.
  promotion_criteria_missing:
  - cross-project reusability
  - framework independence
  recommended_next_step: Retain as project-scoped pattern; evaluate extraction into
    a reusable workflow engine package when multiple consumers emerge.
  scope_alignment: Project scope candidate.
  confidence: high
- pattern_id: capability-lineage-anchoring
  recommendation: defer
  rationale: Anchored to internal data structures (CapabilityRecord, CapabilitySet)
    currently operating exclusively inside the ideas-to-life-cas runtime.
  evidence_gaps: Empirical evidence of multi-repo capability propagation and provenance
    tracking is pending.
  promotion_criteria_missing:
  - cross-project recurrence
  - governance maturity
  recommended_next_step: Test lineage validation across at least two downstream workspaces
    before promoting to global steering pattern.
  scope_alignment: Project scope candidate with high future promotion potential.
  confidence: high
- pattern_id: docs-as-code-portal-projection
  recommendation: defer
  rationale: Strongly coupled to the repository's MkDocs Material layout, custom static
    javascript, and GitHub Pages deployment configuration.
  evidence_gaps: Lacks template generalization for arbitrary documentation frameworks
    or alternative portal backends.
  promotion_criteria_missing:
  - framework reusability
  recommended_next_step: Maintain as project pattern; package preprocessing routines
    as a reusable MkDocs plugin if shared.
  scope_alignment: Project scope candidate.
  confidence: high
- pattern_id: file-system-knowledge-repository
  recommendation: defer
  rationale: Reflects the immediate workspace layout (cas-knowledge/ hierarchy) and
    attachment mechanics specific to the CAS runner implementation.
  evidence_gaps: Needs evaluation against distributed or database-backed knowledge
    substrates across larger deployments.
  promotion_criteria_missing:
  - cross-project reusability
  recommended_next_step: Keep as project-specific convention for local repository
    knowledge mounting.
  scope_alignment: Project scope candidate.
  confidence: high
- pattern_id: layered-governance-service-facade
  recommendation: defer
  rationale: Specific architectural boundary orchestrating ComplianceEngine and GovernanceActionEngine
    within the internal cas_runner application package.
  evidence_gaps: Internal modular boundary rather than an enterprise-wide architectural
    governance pattern.
  promotion_criteria_missing:
  - cross-project significance
  - broad reusability
  recommended_next_step: Retain within application architecture as internal design
    pattern; do not promote to global governance.
  scope_alignment: Project scope candidate.
  confidence: high
- pattern_id: reconciliation-agentic-merger
  recommendation: defer
  rationale: Carries non-deterministic risk when resolving conflicting architectural
    specifications using LLM heuristics without formal merge invariant checking.
  evidence_gaps: Requires empirical benchmark data evaluating semantic conflict resolution
    accuracy against git merge drivers across multiple repositories.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  - safety verification
  recommended_next_step: Retain as emerging project candidate; conduct controlled
    evaluations on synthetic multi-author merge conflicts.
  scope_alignment: Candidate scope requiring review.
  confidence: high
- pattern_id: pattern-architecture-knowledge-graph
  recommendation: defer
  rationale: Strategic direction proposing graph-based lineage across ADRs, patterns,
    and AST entities, but currently lacks reference runtime implementation in the
    codebase.
  evidence_gaps: Lacks production schema implementation, query interfaces, and multi-repo
    cross-validation beyond forward-looking architecture work notes.
  promotion_criteria_missing:
  - evidence quality
  - implementation maturity
  recommended_next_step: Defer promotion; validate graph schema prototypes on project
    AST extraction outputs.
  scope_alignment: Candidate scope requiring review.
  confidence: high
- pattern_id: pattern-business-intent-traceability
  recommendation: defer
  rationale: Proposes formal business intent ingestion to guide architectural reasoning,
    but concrete parsing schemas and operational enforcement mechanisms remain unspecified.
  evidence_gaps: No implemented schema models or runtime validators found in src/cas_runner
    for business intent artifacts.
  promotion_criteria_missing:
  - implementation maturity
  - evidence quality
  recommended_next_step: Draft concrete Pydantic schemas for business goals and demonstrate
    automated drift detection against ADRs.
  scope_alignment: Candidate scope requiring review.
  confidence: high
- pattern_id: pattern-proposal-code-intelligence-alignment
  recommendation: defer
  rationale: Proposes translating codebase AST into empirical architectural constraints
    compared against architecture intent in CI pipelines.
  evidence_gaps: Forensic extractors exist, but automated gate failure mechanics comparing
    ASTs directly to AID models require end-to-end CI demonstration.
  promotion_criteria_missing:
  - evidence quality
  - operational integration
  recommended_next_step: Formalize comparison engine in cas_runner steps and evaluate
    false-positive rate on merge requests.
  scope_alignment: Candidate scope requiring review.
  confidence: high
- pattern_id: telemetry-observable-agent-steps
  recommendation: defer
  rationale: OpenTelemetry dependencies and TraceableMetric data structures exist,
    but full distributed tracing across LLM provider spans and FlowRunner stages is
    incomplete.
  evidence_gaps: OpenTelemetry collector export pipeline and span propagation across
    async calls need explicit validation.
  promotion_criteria_missing:
  - evidence quality
  - end-to-end implementation
  recommended_next_step: Complete tracer integration across FlowRunner steps and verify
    span ingestion in test environments.
  scope_alignment: Candidate scope requiring review.
  confidence: high
rejected_candidates:
- pattern_id: ci-driven-steering-projection
  recommendation: reject
  rationale: CI workflow triggering is an operational integration mechanism rather
    than an independent global architectural pattern. The core architecture is already
    captured by 'declarative-steering-projection'.
  governance_concern: Promoting execution mechanics alongside core patterns causes
    rule bloat and blurs the boundary between architecture definitions and CI script
    orchestration.
  confidence: high
