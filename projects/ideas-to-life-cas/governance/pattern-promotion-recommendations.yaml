promotion_preconditions_not_met:
- pattern_id: pattern-business-intent-traceability-contract
  unmet_preconditions:
  - sufficient evidence exists
  - promotion readiness is high or medium
  missing_evidence:
  - Concrete Pydantic schema for BusinessIntent in models.py
  - Runtime ingestion traces and integration test execution in cas_runner
  rationale: Strategic proposal linking business objectives to architecture decisions
    lacks concrete runtime schema definitions and empirical implementation traces
    in cas_runner beyond alignment finding citations.
  recommended_next_step: Define a concrete Pydantic schema for BusinessIntent in models.py
    and validate end-to-end ingestion in an integration test.
- pattern_id: pattern-architecture-knowledge-graph-lineage
  unmet_preconditions:
  - sufficient evidence exists
  - promotion readiness is high or medium
  missing_evidence:
  - Graph data model implementation
  - Network traversal engine or graph database integration
  rationale: Proposes cross-project knowledge graph for recursive architectural dependency
    queries, but storage is currently flat files and directory trees; graph traversal
    engine is not yet implemented.
  recommended_next_step: Conduct an architectural spike prototyping graph serialization
    from existing LocalKnowledgeProvider artifacts.
governance_summary:
  immediate_promotion_candidates:
  - provider-agnostic-llm-facade
  - finite-state-governance-engine
  - sequential-pipeline-flow-runner
  - file-backed-blackboard-workspace
  - heuristic-to-pattern-promotion-lifecycle
  deferred_candidates:
  - schema-enforced-domain-contracts
  - telemetry-observable-agent-steps
  - pattern-continuous-governance-loop
  - pattern-authoritative-architecture-work-registry
  - reconciliation-agentic-merger
  - declarative-agent-command-registry
  - declarative-steering-projection
  - pat-prop-empirical-ast-forensic-extraction
  rejected_candidates:
  - docs-as-code-portal-projection
  major_governance_risks:
  - Proliferation of redundant proposal variants causing pattern fragmentation across
    catalog iterations
  - Premature promotion of aspirational proposals (e.g. Business Intent Contract,
    Architecture Knowledge Graph) before empirical runtime schemas are implemented
  - Risk of promoting project-specific presentation details (e.g. MkDocs portal deployment)
    into the global architectural standard
