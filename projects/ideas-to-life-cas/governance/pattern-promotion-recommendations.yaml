  - portable multi-harness injection contract
  rationale: Strategically valuable but project-scoped, and the current implementation
    is tied to CAS onboarding and file layouts.
  recommended_next_step: Trial bootstrap injection in another project and document
    a harness-agnostic governance block contract.
