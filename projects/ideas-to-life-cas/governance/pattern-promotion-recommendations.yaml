promotion_candidates:
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Established, implemented in multiple components, and clearly
    foundational for any LLM-based agentic architecture. Cross-project applicability
    is immediate and no further evidence is needed.
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Duplicate proposals exist; must merge into canonical pattern to avoid confusion.
  - Potential over-abstraction if not governed carefully.
  confidence: high
  promotion_evidence:
  - recurring signals
  - multiple proposals across the codebase
  - consistent interfaces (LiteLLMClient, MockLLMClient)
  - used in all agentic flows including runners and mergers
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
- pattern_id: sequential-pipeline-flow-runner
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Well-implemented, used as the primary execution engine, and
    conceptually stable. It is a core architectural backbone for any multi-step automation
    system.
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Overlap with many flow-runner proposals; merge required.
  - Potential for project-specific coupling in implementation details.
  confidence: high
  promotion_evidence:
  - recurring signals
  - multiple proposals (FlowRunner patterns)
  - consistent shared-context execution
  - primary execution engine
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Established, central to governance, and clearly broadly applicable.
    The registry-based design is generic and can be adapted to multiple domains.
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Many duplicate proposals; canonical merge needed.
  - Transition registry may become complex if not kept simple.
  confidence: high
  promotion_evidence:
  - recurring signals
  - explicit transition registry
  - used to enforce state changes
  - auditable control layer
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance alignment
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Widely implemented and indispensable for data integrity. Applies
    to any project using LLM-driven data processing.
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - May be too generic if not scoped appropriately.
  - Overlapping with other schema proposals.
  confidence: high
  promotion_evidence:
  - Pydantic models and JSON schema validation
  - pervasive across governance models, steering models, skills models
  - multiple proposals highlight this
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance alignment
deferred_candidates:
- pattern_id: compliance-engine-guardrail
  recommendation: defer
  rationale: Well-evidenced but governance rules are often domain-specific; the engine
    pattern itself is reusable but requires adaptation of rules.
  evidence_gaps: Lack of cross-project implementations to validate rule-agnostic engine
    design.
  promotion_criteria_missing:
  - governance maturity
  - cross-project applicability
  recommended_next_step: Adapt the compliance engine to a second project to gather
    evidence of genericity.
  scope_alignment: global
  confidence: medium
- pattern_id: telemetry-observable-agent-steps
  recommendation: defer
  rationale: Implementation is widespread but the exact telemetry schemas and storage
    may vary. Pattern concept is global but needs standardization.
  evidence_gaps: No consistent telemetry data model across proposals.
  promotion_criteria_missing:
  - governance maturity
  - evidence quality
  recommended_next_step: Define a canonical telemetry schema and gather evidence from
    multiple deployments.
  scope_alignment: global
  confidence: medium
- pattern_id: file-backed-knowledge-blackboard
  recommendation: defer
  rationale: The pattern is implementable in any repository and provides clear benefits;
    however, directory conventions may be organization-specific.
  evidence_gaps: No cross-project validation of folder structure genericity.
  promotion_criteria_missing:
  - cross-project applicability
  recommended_next_step: Apply the blackboard structure to a different project to
    confirm generic applicability.
  scope_alignment: global
  confidence: medium
- pattern_id: agentic-merger
  recommendation: defer
  rationale: Widely evidenced and conceptually reusable, but depends on LLM capabilities
    and may require adaptation to different document schemas.
  evidence_gaps: No evidence of successful deployment outside the originating project.
  promotion_criteria_missing:
  - cross-project applicability
  - governance maturity
  recommended_next_step: Pilot agentic merger on another project with different document
    formats.
  scope_alignment: global
  confidence: medium
- pattern_id: declarative-agent-command-registry
  recommendation: defer
  rationale: Pattern is well-implemented but tied to project-specific command set
    and naming conventions.
  evidence_gaps: No cross-project reuse evidence.
  promotion_criteria_missing:
  - cross-project applicability
  recommended_next_step: Extract a generic command registry framework and validate
    with a second project.
  scope_alignment: project
  confidence: medium
- pattern_id: ci-driven-steering-projection
  recommendation: defer
  rationale: CI workflows are tightly coupled to GitHub Actions and project-specific
    flow definitions.
  evidence_gaps: No evidence of portability to other CI systems or projects.
  promotion_criteria_missing:
  - cross-project applicability
  - recurrence
  recommended_next_step: Create a reusable CI action and test on a different repository.
  scope_alignment: project
  confidence: low
- pattern_id: heuristic-to-pattern-promotion-lifecycle
  recommendation: defer
  rationale: High future potential but currently shaped by project's governance conventions;
    needs evidence from other projects.
  evidence_gaps: No cross-project implementations of the lifecycle.
  promotion_criteria_missing:
  - cross-project applicability
  - governance maturity
  recommended_next_step: Adopt the lifecycle in another knowledge management context
    and collect evidence.
  scope_alignment: project
  confidence: medium
- pattern_id: declarative-steering-projection
  recommendation: defer
  rationale: Core idea of grounding prompts in structured facts is general, but the
    current models are project-coupled.
  evidence_gaps: No evidence of generic applicability beyond this project's schemas.
  promotion_criteria_missing:
  - cross-project applicability
  recommended_next_step: Refactor to use generic fact model and pilot in another project.
  scope_alignment: project
  confidence: medium
- pattern_id: capability-lineage-anchoring
  recommendation: defer
  rationale: Could become a generic pattern for tracking provenance but needs broader
    implementation.
  evidence_gaps: Only seen in this project.
  promotion_criteria_missing:
  - recurrence
  - cross-project applicability
  recommended_next_step: Apply capability lineage to another knowledge base to validate
    generality.
  scope_alignment: project
  confidence: medium
- pattern_id: telemetry-grounded-health-scoring
  recommendation: defer
  rationale: Algorithmic approach may be general, but metric definitions and thresholds
    are project-specific.
  evidence_gaps: No evidence of reuse with different metrics.
  promotion_criteria_missing:
  - cross-project applicability
  recommended_next_step: Define a configurable health model and test with alternative
    metrics.
  scope_alignment: project
  confidence: medium
- pattern_id: bootstrap-governance-block-injection
  recommendation: defer
  rationale: May be generalized to a pattern for injecting governance into any agent
    config, but currently tied to this project's file set.
  evidence_gaps: No evidence of adoption outside this repository.
  promotion_criteria_missing:
  - cross-project applicability
  recommended_next_step: Extract a generic governance injection mechanism and test
    on another project.
  scope_alignment: project
  confidence: low
- pattern_id: skill-packaged-agent-procedures
  recommendation: defer
  rationale: Packaging concept is generic but the content is project-specific.
  evidence_gaps: No evidence of skill packages being reused outside this project.
  promotion_criteria_missing:
  - cross-project applicability
  recommended_next_step: Create a framework-agnostic skill pack template and validate
    with a different domain.
  scope_alignment: project
  confidence: medium
- pattern_id: rule-context-snapshot
  recommendation: defer
  rationale: Very project-specific.
  evidence_gaps: No evidence of general applicability.
  promotion_criteria_missing:
  - cross-project applicability
  - significance
  recommended_next_step: Observe if similar snapshots are needed in other projects.
  scope_alignment: project
  confidence: low
- pattern_id: pattern-cas-continuous-governance-loop
  recommendation: defer
  rationale: Architecturally significant but requires more evidence and a more generic
    implementation.
  evidence_gaps: Implementation is partially CI-specific and not yet mature.
  promotion_criteria_missing:
  - governance maturity
  - cross-project applicability
  recommended_next_step: Develop a formal specification and pilot in another governance
    context.
  scope_alignment: project
  confidence: medium
