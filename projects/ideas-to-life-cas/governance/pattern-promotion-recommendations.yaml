    automated architecture governance (detect-analyse-plan-execute-observe) applicable
    to continuous software delivery organizations.
  promotion_evidence:
  - Active GitHub Actions workflows (cas-continuous-architecture.yml, cas-build-validation.yml)
  - Architecture state models and execution traces across milestones
  - Supporting evidence in cas-arch-state-ideas-to-life-cas-2026-09-20 and alignment
