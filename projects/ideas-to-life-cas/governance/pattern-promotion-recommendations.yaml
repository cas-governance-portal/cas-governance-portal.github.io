deferred_candidates:
- pattern_id: independent-verifier-subagent
  recommendation: defer
  rationale: The verifier role is clearly articulated in markdown definitions but
    lacks deep runtime evaluation metrics across diverse failure modes.
  evidence_gaps: Requires empirical evaluation data verifying that the subagent effectively
    reduces confirmation bias and catches faulty primary agent code in real CI/CD
    runs.
  promotion_criteria_missing:
  - recurrence
  - evidence quality
  recommended_next_step: Run multi-model benchmark evaluation suites testing the verifier's
    ability to catch deliberate architectural regressions.
  scope_alignment: global
  confidence: high
- pattern_id: heuristic-to-pattern-promotion-lifecycle
  recommendation: defer
  rationale: Process is codified in templates and flow documentation, but needs end-to-end
    multi-cycle operational validation before being standardized globally.
  evidence_gaps: Missing empirical evidence of recurring automated transitions from
    candidate heuristic to promoted pattern across multiple iterations.
  promotion_criteria_missing:
  - recurrence
  - governance maturity
  recommended_next_step: Observe and record pattern promotion cycles through multiple
    real-world governance reviews before formal promotion.
  scope_alignment: global
  confidence: medium
- pattern_id: deterministic-workflow-validation
  recommendation: defer
  rationale: Current implementation in specs/090-simplify-cicd-workflows/validate_workflows.py
    is tightly coupled to specific CAS GitHub Actions conventions.
  evidence_gaps: Generalization beyond CAS-specific CI directory structures and workflow
    script layout.
  promotion_criteria_missing:
  - reusability
  - cross-project applicability
  recommended_next_step: Refactor workflow validation rules into a reusable, parameterizable
    CI linting module for other repositories.
  scope_alignment: project
  confidence: high
- pattern_id: idempotent-symlink-scaffolding-bootstrap
  recommendation: defer
  rationale: Filesystem symlink and copy heuristics are customized for local dual
    .agents/.claude scaffolding in the current repository.
  evidence_gaps: Evidence of portability across diverse cross-platform OS environments
    (especially Windows file systems without native symlink permissions).
  promotion_criteria_missing:
  - reusability
  - cross-project applicability
  recommended_next_step: Test scaffolding fallbacks across Windows, Linux, and macOS
    CI runners and standardize non-symlink environments.
  scope_alignment: project
  confidence: high
- pattern_id: agentic-state-reconciliation-merger
  recommendation: defer
  rationale: Provides promising LLM-assisted state reconciliation in agentic_merger.py,
    but remains experimental and tied to local schema formats.
  evidence_gaps: Verification of deterministic merge safety and validation against
    hallucinated configuration corruption on large conflicts.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Benchmark reconciliation accuracy with synthetic merge conflict
    test fixtures before elevating to global pattern.
  scope_alignment: project
  confidence: high
- pattern_id: pattern-business-intent-traceability
  recommendation: defer
  rationale: Strategic proposal linking business drivers to runtime behavior, currently
    documented only in vision and architectural work artifacts.
  evidence_gaps: Concrete runtime code execution linking high-level ADR intent to
    automated code compliance tests.
  promotion_criteria_missing:
  - evidence quality
  - recurrence
  recommended_next_step: Validate with multi-project case studies demonstrating automated
    business intent verification.
  scope_alignment: candidate_requiring_review
  confidence: high
- pattern_id: pattern-architecture-knowledge-graph
  recommendation: defer
  rationale: Proposes a graph database representation for architectural lineage, but
    current runtime relies entirely on Git-backed flat files.
  evidence_gaps: No graph storage dependencies, schema definitions, or traversal engines
    exist in the current runtime.
  promotion_criteria_missing:
  - evidence quality
  - recurrence
  recommended_next_step: Hold in candidate state until concrete graph extraction services
    are implemented and tested.
  scope_alignment: candidate_requiring_review
  confidence: high
- pattern_id: closed-loop-detect-analyse-execute-governance
  recommendation: defer
  rationale: Autonomous architectural drift remediation introduces severe governance
    risks without automated rollback boundaries and proven containment controls.
  evidence_gaps: Safety constraints, rollback mechanics, and human-in-the-loop exception
    gates are unproven in production workloads.
  promotion_criteria_missing:
  - governance maturity
  - evidence quality
  recommended_next_step: Gather safety metrics and error boundary data from semi-automated
    proposal-only runs before enabling autonomous writes.
  scope_alignment: candidate_requiring_review
  confidence: high
- pattern_id: git-delta-prompt-fact-projection
  recommendation: defer
  rationale: Models git deltas as typed PromptFacts but lacks benchmarking against
    standard diff ingestion on large pull requests.
  evidence_gaps: Token efficiency benchmarks and hallucination reduction measurements
    compared to direct diff ingestion.
  promotion_criteria_missing:
  - evidence quality
  - recurrence
  recommended_next_step: Evaluate in CI pipelines against large feature pull requests
    to measure impact on agent precision.
  scope_alignment: candidate_requiring_review
  confidence: high
rejected_candidates:
- pattern_id: docs-as-code-portal-projection
  recommendation: reject
  rationale: Tightly bound to local MkDocs configuration, custom dashboard scripts
    (portal/docs/static/js/dashboard.js), and repository-specific static hosting scripts
    with low future promotion potential.
  governance_concern: Promoting site-specific documentation rendering pipelines into
    global patterns creates rigid framework lock-in and pollutes global governance
    with project implementation details.
  confidence: high
