  recommended_action: Split into rule compliance engine (rule-grounded-compliance-evaluation)
    and dashboard health derivation (pure-functional-health-evaluation)
  rationale: Proposals conflate domain rule compliance checks (ComplianceEngine) with
    presentation health status calculation (health_model.py).
promotion_preconditions_not_met:
- pattern_id: reconciliation-agentic-merger
  unmet_preconditions:
  - production safety validation not established
  - unbounded risk of governance constraint deletion
  missing_evidence:
  - synthetic merge benchmark datasets
  - failure-mode boundary test results
  - AST-verified structural diff guardrails
  rationale: Using LLMs to reconcile conflicting YAML and Markdown architecture specifications
    presents a high risk of hallucinated or dropped governance constraints without
    deterministically verified AST guardrails.
  recommended_next_step: Implement synthetic conflict evaluation suites and hard AST
    guardrails in src/cas_runner/governance/agentic_merger.py before promotion reconsideration.
- pattern_id: pattern-architecture-knowledge-graph
  unmet_preconditions:
  - concrete codebase implementation not present
  - sufficient operational evidence not available
  missing_evidence:
  - graph extraction implementation in cas_runner
  - multi-hop query latency and correctness benchmarks
  - cross-project lineage demonstration
  rationale: Strategic direction concept proposing multi-hop relational graph models,
    but currently lacks concrete implementation in cas_runner, which relies on flat
    filesystem conventions.
  recommended_next_step: Build prototype graph extraction step and evaluate semantic
    query improvements over filesystem traversal across multiple projects.
- pattern_id: pattern-business-intent-traceability
  unmet_preconditions:
  - schema implementation and parser missing from codebase
  - demonstrated end-to-end integration lacking
  missing_evidence:
  - Pydantic business intent schema definitions
  - validation engine execution logs against live Architecture Work items
  rationale: Proposes formal business vision schemas ingested directly into architectural
    validation engines, but schemas and ingestion logic are not yet implemented.
  recommended_next_step: Draft initial Pydantic business intent model and demonstrate
    automated validation against an active Architecture Work item.
- pattern_id: pattern-operational-intelligence-loop
  unmet_preconditions:
  - runtime feedback ingestion partially mapped
  - low false-positive signal synthesis unverified
  missing_evidence:
  - production trace synthesis validation
  - quantified false-positive drift rates across live runs
  rationale: Continuous capture and synthesis of operational traces into architectural
    signals is only partially implemented in src/cas_runner/steps/registry.py.
  recommended_next_step: Observe automated signal generation across live workflow
    executions to confirm low false-positive signal synthesis rates.
- pattern_id: capability-lineage-anchoring
  unmet_preconditions:
  - cross-repository derivation histories unverified
  - blast-radius analysis engine not tested
  missing_evidence:
  - multi-branch repository evolution tests
  - blast-radius query validation across diverging capabilities
  rationale: Models exist in src/cas_runner/steering/models.py, but cross-repository
    lineage tracking logic and blast-radius assessment remain untested in active workflows.
  recommended_next_step: Validate lineage traversal against multi-branch repository
    evolutions to confirm robustness.
