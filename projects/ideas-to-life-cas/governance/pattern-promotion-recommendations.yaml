promotion_candidates:
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Provider-agnostic LLM facade is a foundational architectural
    mechanism, implemented across multiple clients with high evidence, and aligns
    with global reuse.
  promotion_evidence:
  - recurring signal in multiple LLM client proposals
  - implemented in src/cas_runner/llm/litellm_client.py and mock_client.py
  - current architecture state includes LLM provider abstraction
  - cross-project applicability for any LLM-driven system
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - duplication risk due to many overlapping LLM abstraction proposals
  - naming fragmentation needs consolidation before promotion
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Finite-state governance engine provides deterministic control
    over agent actions via transition registry, with high evidence and clear global
    applicability.
  promotion_evidence:
  - implemented in governance_action_engine.py (TransitionRegistry, GovernanceActionEngine)
  - current architecture state shows governance action engine usage
  - recurring in governance flows and compliance checks
  - cross-project applicability for autonomous agent governance
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - duplicate proposals for state machine governance
  - need to ensure unique naming and avoid proliferation
  confidence: high
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Schema-enforced domain contracts ensure typed, validated data
    across agent pipelines, with strong evidence from pydantic models and governance
    services.
  promotion_evidence:
  - pydantic models in governance/models.py and steering/models.py
  - current architecture state uses typed contracts
  - recurring across governance, steering, skills
  - cross-project applicability for safe agent integration
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - risk of over-engineering if not uniformly adopted
  - duplicate contract definitions across modules
  confidence: high
- pattern_id: sequential-pipeline-flow-runner
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Sequential pipeline flow runner is a core orchestration pattern
    that provides deterministic step sequencing and shared context propagation, with
    high implementation evidence.
  promotion_evidence:
  - FlowRunner implementation in src/cas_runner/runner.py
  - current architecture state uses FlowRunner as central orchestrator
  - recurring across multiple CI/CD workflows and CLI commands
  - cross-project applicability for any agentic workflow that requires predictable
    sequencing
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - duplicate proposals for sequential pipeline orchestration
  - risk of conflating with simpler step-loop patterns
  confidence: high
- pattern_id: git-delta-prompt-fact-projection
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Git-delta prompt fact projection is a critical mechanism for
    grounding LLM context in verified repository changes, with strong evidence from
    steering models and CI workflows.
  promotion_evidence:
  - steering/models.py defines RawGitDelta, PromptFact, SteeringRuntimeIndex
  - current architecture state includes steering projection workflows
  - recurring in CI-based steering and architecture analysis
  - cross-project applicability for code-aware agent systems
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - duplicate overlapping proposals for steering projection
  - risk of coupling too tightly to git structure
  confidence: high
