promotion_preconditions_not_met:
- pattern_id: git-delta-prompt-facts
  unmet_preconditions:
  - sufficient evidence
  - recurrence
  - implementation evidence
  missing_evidence:
  - No code execution evidence
  - No cross-project validation
  - No clear output from fact projection
  rationale: Evidence is limited to model names; no operational proof that git deltas
    are transformed into prompt facts.
  recommended_next_step: Gather evidence from running steering projection and validate
    prompt fact quality across at least two projects.
- pattern_id: capability-record-lineage
  unmet_preconditions:
  - sufficient evidence
  - recurrence
  - implementation evidence
  missing_evidence:
  - No persistence or usage examples
  - No evidence of lineage accuracy
  rationale: Only model symbols indicate capability lineage; no operational tracking
    demonstrated.
  recommended_next_step: Instrument a pilot demonstrating lineage updates and verify
    provenance retrieval across multiple runs.
- pattern_id: runtime-execution-context-store
  unmet_preconditions:
  - sufficient evidence
  - implementation evidence
  missing_evidence:
  - No API, no write/read implementation
  - No evidence of how runtime state is loaded or persisted
  rationale: Runtime directory exists but no code path confirms active use as a context
    store.
  recommended_next_step: Map the runtime directory usage in runner and determine whether
    it is a real pattern.
- pattern_id: agentic-merger-artifact-reconciliation
  unmet_preconditions:
  - sufficient evidence
  - recurrence
  - architectural significance
  missing_evidence:
  - No test coverage
  - No examples of semantic merge outcomes
  rationale: AgenticMerger class exists, but no reconciliation logic or success evidence.
  recommended_next_step: Create a test suite with conflicting governance artifacts
    and document resolution results.
- pattern_id: flow-runner-application-orchestration
  unmet_preconditions:
  - sufficient evidence
  - recurrence
  missing_evidence:
  - No execution log or sequence diagram showing shared context flow
  rationale: FlowRunner exists but evidence is mostly inferred from class names and
    docs.
  recommended_next_step: Publish a concrete execution trace from a real CAS run and
    identify state propagation issues.
- pattern_id: prompt-fact-extraction
  unmet_preconditions:
  - sufficient evidence
  - implementation evidence
  missing_evidence:
  - No examples of fact extraction from prompts
  - No schema validation outcomes
  rationale: PromptFact is defined, but no extraction logic or prompt flow is evidenced.
  recommended_next_step: Implement and test a prompt-to-fact extraction module with
    structured output validation.
- pattern_id: pattern-evolution-promotion
  unmet_preconditions:
  - sufficient evidence
  - recurrence
  missing_evidence:
  - No promotion decision records
  - No signal-to-pattern conversion examples
  rationale: Only references to docs and templates; no actual promotion event is recorded.
  recommended_next_step: Capture a real promotion decision from the CAS pattern lifecycle
    and use it as evidence.
- pattern_id: architectural-intent-tracking
  unmet_preconditions:
  - sufficient evidence
  - recurrence
  missing_evidence:
  - No delta analysis over time
  - No evaluation of intent drift
  rationale: Steering models exist, but no evidence of measuring architectural intent
    against implementation.
  recommended_next_step: Generate an architectural intent report from a known code
    change and compare expected vs actual capabilities.
- pattern_id: distributed-tracing-observability
  unmet_preconditions:
  - sufficient evidence
  - recurrence
  missing_evidence:
  - No trace files
  - No span examples
  - No dashboard integration proof
  rationale: OpenTelemetry dependencies exist, but no evidence of actual spans being
    recorded or consumed.
  recommended_next_step: Instrument a flow and export traces to confirm span creation
    and correlation with health metrics.
