promotion_preconditions_not_met:
- pattern_id: git-delta-prompt-facts
  unmet_preconditions:
  - scope classification is global
  - promotion readiness is high or medium
  missing_evidence:
  - Only a single model module reference; no observed multiple systems or repeated
    signals.
  rationale: Low evidence strength and overlapping with git-delta-prompt-fact-projection;
    scope unclear without recurrence.
  recommended_next_step: Collect further evidence from other projects or signals before
    deciding scope.
- pattern_id: capability-record-lineage
  unmet_preconditions:
  - promotion readiness is high or medium
  - sufficient evidence exists
  missing_evidence:
  - Lacks concrete operational evidence and cross-project validation.
  rationale: Medium evidence, but only model definitions; no clear governance usage.
  recommended_next_step: Analyze capability lineage usage in more than one project.
- pattern_id: runtime-rule-context
  unmet_preconditions:
  - promotion readiness is high or medium
  missing_evidence:
  - No clear indication of how rule-context.json is read and used consistently.
  rationale: Low evidence; runtime files are present but consumption is not fully
    evidenced.
  recommended_next_step: Verify runtime context is actually used by governance components.
- pattern_id: externalized-runtime-context
  unmet_preconditions:
  - promotion readiness is high or medium
  - cross-project applicability
  missing_evidence:
  - No strong signal of repeatable benefit across projects.
  rationale: Medium evidence; execution-profile and rule-context exist, but pattern
    is not proven.
  recommended_next_step: Assess whether externalized runtime state improves governance
