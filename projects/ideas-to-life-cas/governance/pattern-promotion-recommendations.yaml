promotion_candidates:
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Decouples orchestration and agent logic from concrete model
    providers using symmetric production adapter (LiteLLMClient) and deterministic
    CI mock client (MockLLMClient). Universally applicable across multi-agent architectures.
  promotion_evidence:
  - 'recurring_signals: 19 separate proposal variants collapsed into single canonical
    implementation'
  - 'current_architecture_state_support: Verified in litellm_client.py, mock_client.py,
    base.py, and structured.py'
  - 'cross_project_applicability: Critical foundation for offline deterministic CI
    testing and multi-cloud LLM routing'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - High volume of overlapping redundant proposal variants requires immediate pruning
    and deprecation in registries.
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Enforces formal transition registries and state machines over
    autonomous agent actions and artifact lifecycles, preventing state corruption
    and illegal out-of-order promotions across governed platforms.
  promotion_evidence:
  - 'recurring_signals: 9 duplicate proposals consolidated'
  - 'current_architecture_state_support: Implemented in governance_action_engine.py
    (TransitionRegistry, GovernanceActionEngine) and models.py'
  - 'governance_model_alignment: Directly enforces lifecycle gates from PROPOSED to
    ACTIVE/RATIFIED'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - governance_maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Over-constraining dynamic reasoning if transition rules become overly monolithic.
  confidence: high
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Mandates strict Pydantic and JSON Schema validations on non-deterministic
    LLM inputs and outputs before persisting state or executing actions, eliminating
    malformed payloads and hallucinated attributes.
  promotion_evidence:
  - 'recurring_signals: 16 proposals overlapping across typed compliance models, schema
    enforcement, and health scoring'
  - 'current_architecture_state_support: Pydantic schemas in src/cas_runner/governance/models.py,
    io.py, and reasoning.py'
  - 'cross_project_applicability: Universally required contract validation pattern
    for agentic pipelines'
  promotion_criteria_met:
  - significance
  - reusability
  - evidence_quality
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Schema evolution friction when upstream external LLM capabilities change rapidly.
  confidence: high
- pattern_id: pattern-continuous-governance-loop
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Operationalizes automated closed-loop continuous architecture
    steering (detect-analyse-remediate) integrated into CI/CD delivery pipelines,
    mitigating silent architectural drift across distributed teams.
  promotion_evidence:
  - 'recurring_architecture_work: aw-ideas-to-life-cas-2026-06-06-001, aw-ideas-to-life-cas-20260605-07,
    aw-ideas-to-life-cas-20260614-1'
  - 'current_architecture_state_support: Verified CI workflow in .github/workflows/cas-continuous-architecture.yml
    and governance_validator.py'
  - 'strategic_direction_alignment: Direct remedy for 15:1 governance review velocity
    bottlenecks'
  promotion_criteria_met:
  - significance
  - reusability
  - evidence_quality
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Risk of automated commit loops in CI/CD if detection thresholds are poorly calibrated.
  confidence: high
- pattern_id: pattern-architecture-work-registry
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Designates Architecture Work artifacts as the authoritative,
    immutable source of planning intent and change history while treating generated
    visualizations (AEM, AID) as ephemeral derived views, preventing state overwrite
    hazards.
  promotion_evidence:
  - 'recurring_architecture_work: aw-ideas-to-life-cas-2026-05-31-001, aw-ideas-to-life-cas-20260614-1'
  - 'current_architecture_state_support: Active flows orchestration-flow and discovery-to-aw
    transforming input sources to aw-* records'
  - 'governance_model_alignment: Enforces separation between persistent state intent
    and projected dashboards'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - governance_maturity
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Unbounded growth of work records without automated archiving policies.
  confidence: high
- pattern_id: file-backed-blackboard-workspace
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Utilizes a version-controlled directory hierarchy on disk as
    transparent, git-auditable blackboard memory for agent communication, templates,
    and runtime context without requiring external databases.
  promotion_evidence:
  - 'recurring_signals: 13 duplicate proposals consolidating file-backed knowledge
    layout'
  - 'current_architecture_state_support: Implemented across cas-knowledge filesystem,
    bootstrap.py, and LocalKnowledgeProvider in io.py'
  - 'cross_project_applicability: Easily adapted to any git repository without infrastructure
    dependencies'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Filesystem concurrent write race conditions in highly parallel multi-agent runner
    environments.
  confidence: high
- pattern_id: pattern-proposal-only-steering-projection
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Decouples automated architecture evaluation from direct repository mutation by emitting immutable proposal projections reconciled via pull requests.
  promotion_evidence:
  - 'current_architecture_state_support: Implemented in .github/workflows/cas-build-steering-projection.yml and steering/models.py'
  - 'governance_model_alignment: Explicit proposal-only enforcement gate prevents direct branch mutation'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks: []
  confidence: high
- pattern_id: ci-driven-steering-projection
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Compiles verified architectural facts from Git deltas into
    structured prompt facts and proposal-only steering projections during CI, ensuring
    safe, non-destructive synchronization for local developer agents.
  promotion_evidence:
  - 'recurring_signals: 10 duplicate proposals consolidated around delta-fact prompt
    projection'
  - 'current_architecture_state_support: Implemented in .github/workflows/cas-build-steering-projection.yml
    and steering/models.py'
  - 'governance_model_alignment: Explicit proposal-only enforcement gate prevents
    direct branch mutation'
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence_quality
  - strategic_alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Developer prompt fatigue if steering projections generate overly verbose markdown
    additions.
  confidence: high
- pattern_id: pattern-scope-classification-framework
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Establishes a formal taxonomy and evaluation process for partitioning
    emerging architectural knowledge into explicit governance scopes (global, domain,
    project, local), preventing premature global policy codification.
  promotion_evidence:
  - 'recurring_signals: Standardized reference architecture specification reference-architecture-pattern-scope-classification-framework.md'
  - 'current_architecture_state_support: Implemented pipeline step pattern-scope-classifier
    in src/cas_runner/steps/pattern_scope_classifier.py'
  - 'governance_model_alignment: Foundational prerequisite for all cross-project pattern
    promotion pipelines'
  promotion_criteria_met:
  - significance
  - reusability
  - evidence_quality
  - governance_maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Potential classification deadlocks when candidate patterns exhibit mixed project
    and enterprise attributes.
  confidence: high
deferred_candidates:
- pattern_id: telemetry-observable-agent-steps
  recommendation: defer
  rationale: Foundational tracing models (TraceableMetric) and OpenTelemetry SDK dependencies
    exist, but runtime end-to-end trace correlation and diagnostic dashboards across
    multi-repo runs require empirical validation.
  evidence_gaps: Lacks production operational metrics demonstrating cost, duration,
    and error tracing across multi-agent step iterations.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Complete implementation of trace emitter hooks across FlowRunner
    steps and validate telemetry aggregation in cas-knowledge/runtime/traces/.
  scope_alignment: global
  confidence: high
- pattern_id: heuristic-to-pattern-promotion-lifecycle
  recommendation: defer
  rationale: Promotion templates and progression specifications exist, but the automated
    transition hooks and multi-project promotion validations have not matured past
    preliminary workflows.
  evidence_gaps: Requires empirical demonstration of at least two heuristics successfully
    graduating to verified global patterns via this lifecycle.
  promotion_criteria_missing:
  - recurrence
  - governance_maturity
  recommended_next_step: Execute heuristic graduation flow on candidate heuristics
    in ideas-to-life-cas and document promotion decision records.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-lifecycle-promotion-gate
  recommendation: defer
  rationale: Functionally overlaps with finite-state-governance-engine. Must evaluate
    whether this represents an independent architectural pattern or a specific state-machine
    rule configuration.
  evidence_gaps: Formal architectural definition separating ADR gating from general
    finite-state transition registry constraints.
  promotion_criteria_missing:
  - significance
  - governance_maturity
  recommended_next_step: Review TransitionRegistry rule definitions to assess whether
    deterministic ADR ratification gating can be subsumed as a configuration profile.
  scope_alignment: global
  confidence: high
- pattern_id: reconciliation-agentic-merger
  recommendation: defer
  rationale: Heuristic and LLM reconciliation logic is currently tightly coupled to
    CAS-specific frontmatter formatting and markdown blocks in bootstrap.py and agentic_merger.py.
  evidence_gaps: Generalization beyond CAS-specific markdown formats into a universal
    document reconciliation contract.
  promotion_criteria_missing:
  - reusability
  - evidence_quality
  recommended_next_step: Extract generic markdown AST merger interfaces and test against
    multi-branch conflict resolution outside CAS repository templates.
  scope_alignment: project
  confidence: high
- pattern_id: declarative-agent-command-registry
  recommendation: defer
  rationale: Scoped exclusively to speckit TOML manifests (.agents/commands/) in the
    current project codebase rather than a cross-platform command specification standard.
  evidence_gaps: Cross-platform schema definitions and evaluation outside speckit
    tooling.
  promotion_criteria_missing:
  - reusability
  - governance_maturity
  recommended_next_step: Maintain as a project-scoped pattern until adoption is requested
    across secondary repositories.
  scope_alignment: project
  confidence: high
- pattern_id: deterministic-governance-injection-bootstrap
  recommendation: defer
  rationale: Tailored to injecting concrete markdown blocks (CLAUDE.md, AGENTS.md,
    GEMINI.md) conforming specifically to CAS project conventions.
  evidence_gaps: Multi-project reusability without hardcoded CAS governance conventions.
  promotion_criteria_missing:
  - reusability
  recommended_next_step: Keep localized to project onboarding scripts within src/cas_runner/bootstrap.py.
  scope_alignment: project
  confidence: high
- pattern_id: docs-as-code-portal-projection
  recommendation: defer
  rationale: Directly bound to the specific MkDocs Material, DrawIO, and GitHub Pages
    deployment configuration in this repository.
  evidence_gaps: Decoupling from specific static site generator tooling dependencies.
  promotion_criteria_missing:
  - significance
  - reusability
  recommended_next_step: Retain as project-level implementation documentation.
  scope_alignment: project
  confidence: high
- pattern_id: pattern-cas-decoupled-execution-model
  recommendation: defer
  rationale: Internal procedural design separating FlowRunner, step registry, and
    IO abstractions within the cas_runner codebase.
  evidence_gaps: Demonstrated applicability as an enterprise-wide pattern beyond internal
    modularization.
  promotion_criteria_missing:
  - reusability
  - significance
  recommended_next_step: Document as internal module design guidelines rather than
    enterprise architectural pattern.
  scope_alignment: project
  confidence: high
- pattern_id: pattern-business-intent-traceability
  recommendation: defer
  rationale: Strategically high-value concept connecting high-level business drivers
    to AST-extracted code components, but concrete ingestion contracts and automated
    strategic drift calculation remain unproven.
  evidence_gaps: Lacks empirical demonstration of automated strategic drift detection
    in CI and schema ingestion across distinct projects.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Implement prototype business intent schema ingestion in cas_runner
    and evaluate across two distinct projects.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-architecture-knowledge-graph
  recommendation: defer
  rationale: Presents strong strategic direction for cross-project dependency traversal
    and multi-hop lineage reasoning, but currently exists only as aspirational architecture
    documentation without an implementation engine.
  evidence_gaps: Lacks working storage engine, query interface, or runtime integration
    prototype.
  promotion_criteria_missing:
  - evidence_quality
  - governance_maturity
  recommended_next_step: Construct an in-memory graph projection prototype using networkx
    or RDF within the forensic extractor step.
  scope_alignment: global
  confidence: high
rejected_candidates:
- pattern_id: sequential-pipeline-flow-runner
  recommendation: reject
  rationale: Consists of standard sequential stage execution with context passing
    in FlowRunner. Represents basic software engineering pipelining rather than a
    novel multi-system pattern.
  governance_concern: Promoting standard object-oriented pipelining as distinct enterprise
    patterns causes architectural catalog dilution.
  confidence: high
- pattern_id: layered-governance-service-facade
  recommendation: reject
  rationale: Describes traditional three-tier service-layer facade patterns wrapping
    domain engines in GovernanceActionService. Lacks novel governance mechanics.
  governance_concern: Codifying standard layered service design as distinct governance
    patterns bloats enterprise pattern registers.
  confidence: high
