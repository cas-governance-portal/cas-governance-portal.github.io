promotion_candidates:
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Contract validation is foundational for deterministic agent
    outputs and zero-tolerance runtime corruption across autonomous agent architectures.
  promotion_evidence:
  - current architecture state support
  - recurring signals
  - cross-project applicability
  - implemented AST symbols in src/cas_runner/governance/models.py
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Vendor lock-in if concrete validator semantics leak into abstract contracts
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Essential mechanism for enforcing invariant preconditions before
    automated systems or agents alter architectural state.
  promotion_evidence:
  - current architecture state support
  - recurring signals
  - governance model alignment
  - implemented AST symbols in src/cas_runner/governance/governance_action_engine.py
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Excessively rigid transition gating impeding exploratory or prototype workflows
  confidence: high
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Standardizes invocation mechanics and provides portability
    across multi-vendor LLM backends without leaking provider schemas.
  promotion_evidence:
  - current architecture state support
  - recurring signals
  - cross-project applicability
  - implemented AST symbols in src/cas_runner/llm/litellm_client.py
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Abstraction leaks when provider-specific features or prompt formatting nuances
    are required
  confidence: high
- pattern_id: deterministic-mock-evaluation-harness
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Enables zero-cost, reproducible offline CI/CD pipeline verification
    by abstracting live LLM nondeterminism.
  promotion_evidence:
  - current architecture state support
  - recurring signals
  - cross-project applicability
  - implemented AST symbols in src/cas_runner/llm/mock_client.py
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - governance maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Mock divergence from real-world provider response distributions leading to false
