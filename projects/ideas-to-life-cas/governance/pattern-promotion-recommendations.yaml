  major_governance_risks:
  - 'Duplication fragmentation: Excessive overlapping proposals (e.g. 9 LLM facade
    variants, 5 state engine variants) require authoritative consolidation prior to
    pattern store commits.'
  - 'Premature promotion of emerging agentic capabilities: Uncalibrated promotion
    of agentic merger or ungrounded knowledge graphs risks introducing nondeterministic
    failures into core governance.'
  - 'Project-scope leakage: Project-specific scaffolding, portals, and service facades
    must remain deferred until cleanly abstracted from ideas-to-life-cas conventions.'
