promotion_candidates:
- pattern_id: pattern-architecture-work-registry
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Separates authoritative planning state from volatile generated
    projections; universally applicable across continuous architecture governance
    frameworks with verified production evidence.
  promotion_evidence:
  - recurring signals (Regenerated Artifacts Should Not Own Planning State, Governance
    Artifacts Prefer Derived State)
  - recurring architecture work (aw-ideas-to-life-cas-2026-05-31-001)
  - cross-project applicability validated in AEM and alignment reports
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Risk of divergence between derived projection engines and the core work registry
    if schemas mutate without migration tests.
  confidence: high
- pattern_id: governed-action-state-machine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Foundational architectural guardrail that enforces deterministic
    state transitions for autonomous or agentic mutations via TransitionRegistry and
    GovernanceActionEngine.
  promotion_evidence:
  - current architecture state support in src/cas_runner/governance/governance_action_engine.py
  - service boundary integration in src/cas_runner/governance/governance_action_service.py
  - recurring governance enforcement signals across multiple lifecycle phases
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Overly rigid transition paths could cause pipeline deadlocks if exception recovery
    transitions are omitted.
  confidence: high
- pattern_id: dual-client-llm-provider-abstraction
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Provides a clean provider-agnostic LLM interface coupled with
    offline mock isolation, ensuring deterministic CI/CD and cost control across agentic
    systems.
  promotion_evidence:
  - current architecture state support in src/cas_runner/llm/litellm_client.py and
    mock_client.py
  - manifest dependency litellm>=1.83.14 in pyproject.toml
  - cross-project applicability for zero-cost offline CI execution
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Mock fixtures drifting from changing upstream model schemas if not refreshed continuously.
  confidence: high
- pattern_id: typed-governance-data-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Enforces strongly typed Pydantic domain models for all actions,
    findings, metrics, and state representations, eliminating runtime schema failures
    across heterogeneous agents.
  promotion_evidence:
  - current architecture state support in src/cas_runner/governance/models.py
  - manifest dependency pydantic>=2.12.5 in pyproject.toml
  - governance model alignment with comprehensive typed domain schemas
  promotion_criteria_met:
  - significance
  - reusability
  - evidence quality
  - governance maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Tight schema validation may break backward compatibility across legacy serialized
    knowledge files without version negotiation.
  confidence: high
- pattern_id: pattern-governance-gated-ci-pipeline
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Enforces automated build, contract, and governance validation
    gates within CI/CD pipelines to deterministically prevent unvalidated changes
    from progressing downstream.
  promotion_evidence:
  - current architecture state support in .github/workflows/cas-build-validation.yml
  - implemented control ctrl-cas-build-validation
  - recurring architecture work (aw-ideas-to-life-cas-2026-05-31-005, aw-discovery-ideas-to-life-cas-4)
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Risk of gate fatigue if validation checks are flaky or non-deterministic in CI
    environments.
  confidence: high
deferred_candidates:
- pattern_id: declarative-agent-command-manifests
  recommendation: defer
  rationale: Pattern is classified as supporting and represents configuration-level
    ergonomics rather than core global architectural foundation.
  evidence_gaps: Requires multi-repository adoption evidence beyond localized .agents/commands/
    TOML declarations.
  promotion_criteria_missing:
  - recurrence across multiple projects
  - proven governance impact beyond agent harness ergonomics
  recommended_next_step: Observe pattern reuse across additional agent repositories
    before promoting to global library.
  scope_alignment: global
  confidence: high
- pattern_id: continuous-compliance-evaluator
  recommendation: defer
  rationale: Closely coupled to the specific rule evaluation loop and requires further
    decoupling from local runner implementations.
  evidence_gaps: Lacks cross-framework validation demonstrating that rule containers
    operate independently of the cas_runner runtime.
  promotion_criteria_missing:
  - cross-project governance maturity
  - generalization of invariant rule language
  recommended_next_step: Validate invariant rule specification format across an independent
    secondary project.
  scope_alignment: global
  confidence: high
- pattern_id: composite-health-scoring-heuristic
  recommendation: defer
  rationale: While functionally pure in implementation, the scoring weightings and
    health thresholds are tuned to the ideas-to-life-cas dashboard metrics.
  evidence_gaps: Empirical evidence demonstrating that the weighting heuristic generalizes
    to different governance rule distributions.
  promotion_criteria_missing:
  - cross-project applicability of weighting constants
  - standardized risk taxonomy alignment
  recommended_next_step: Extract configurable weighting policy schema from health_model.py
    before global promotion.
  scope_alignment: global
  confidence: high
- pattern_id: file-backed-knowledge-repository
  recommendation: defer
  rationale: Promotion readiness is medium; template formats and workspace bootstrapping
    conventions are actively evolving.
  evidence_gaps: Validation of GitOps branch-merge performance and concurrency locking
    under multi-agent writing loads.
  promotion_criteria_missing:
  - concurrency safety evidence
  - governance maturity under multi-agent writes
  recommended_next_step: Monitor filesystem synchronization stability in multi-agent
    continuous architecture loops.
  scope_alignment: global
  confidence: medium
- pattern_id: agentic-merge-resolution
  recommendation: defer
  rationale: Scope is currently project-scoped and semantic merge via LLMs remains
    experimental with non-deterministic failure risks.
  evidence_gaps: Lacks benchmarked failure and hallucination rates during complex
    conflict reconciliation.
  promotion_criteria_missing:
  - governance maturity
  - deterministic verification guarantees
  recommended_next_step: Implement regression test suite validating resolution deterministic
    outcomes across semantic conflict fixtures.
  scope_alignment: project
  confidence: high
- pattern_id: steering-projection-injection
  recommendation: defer
  rationale: Classified as project scope; directly tied to specific repository-level
    markdown files (AGENTS.md, CLAUDE.md, GEMINI.md).
  evidence_gaps: Generalized injection engine decoupled from specific platform instruction
    markdown formats.
  promotion_criteria_missing:
  - scope alignment (currently project)
  - reusability across non-markdown agent environments
  recommended_next_step: Retain within project governance until multi-harness instruction
    injection is abstracted.
  scope_alignment: project
  confidence: high
- pattern_id: pattern-operational-governance-surface
  recommendation: defer
  rationale: Classified as project scope; tightly coupled to portal_preprocessor.py
    and MkDocs Material site building scripts.
  evidence_gaps: Framework-independent operational visualization contracts.
  promotion_criteria_missing:
  - scope alignment (currently project)
  - cross-platform portal rendering evidence
  recommended_next_step: Maintain as local project pattern; evaluate global utility
    if additional repos require preprocessed static portals.
  scope_alignment: project
  confidence: high
- pattern_id: prompt-fact-steering-projection
  recommendation: defer
  rationale: Classified as project scope; tightly reflects the internal prompt fact
    structures of ideas-to-life-cas.
  evidence_gaps: Evidence of cross-project adaptability for non-git VCS deltas or
    alternate diff granularities.
  promotion_criteria_missing:
  - scope alignment (currently project)
  - reusability across diverse codebases
  recommended_next_step: Assess whether PromptFact data structures can be applied
    generically to external repositories.
  scope_alignment: project
  confidence: high
- pattern_id: template-driven-heuristic-evolution
  recommendation: defer
  rationale: Project-scoped operational workflow with low future promotion potential;
    specific to cas-knowledge folder progression.
  evidence_gaps: Adoption metrics demonstrating systematic promotion of heuristics
    to validated global patterns.
  promotion_criteria_missing:
  - scope alignment (currently project)
  - governance maturity
  recommended_next_step: Keep as project-level guidance within cas-knowledge workspace.
  scope_alignment: project
  confidence: high
- pattern_id: sequential-flow-runner-orchestration
  recommendation: defer
  rationale: Project-scoped execution harness for FlowRunner stages in cas_runner/runner.py.
  evidence_gaps: Cross-framework workflow execution capabilities (e.g. DAG orchestration,
    distributed execution).
  promotion_criteria_missing:
  - scope alignment (currently project)
  - reusability beyond cas_runner CLI
  recommended_next_step: Retain within internal cas_runner component architecture.
  scope_alignment: project
  confidence: high
- pattern_id: pattern-closed-loop-continuous-governance
  recommendation: defer
  rationale: High future potential but currently bound to ideas-to-life-cas GitHub
    Actions triggers and bot commit routines.
  evidence_gaps: Longitudinal operational telemetry proving self-remediation without
    human supervisor intervention.
  promotion_criteria_missing:
  - governance risk mitigation (risk of bot commit loops)
  - production stability evidence across multiple releases
  recommended_next_step: Collect operational reliability metrics over extended continuous
    PR runs before promoting to global governance pattern.
  scope_alignment: project
  confidence: high
rejected_candidates:
- pattern_id: dummy_string
  recommendation: reject
  rationale: Proposal contains meaningless placeholder strings with no technical substance,
    signals, or operational context.
  governance_concern: Pollution of pattern backlog with unvalidated placeholder artifacts.
  confidence: high
