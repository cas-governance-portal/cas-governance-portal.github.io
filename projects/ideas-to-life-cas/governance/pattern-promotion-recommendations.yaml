promotion_candidates:
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Foundational integration boundary for agentic systems; multiple
    proposals and implementations (LiteLLMClient, MockLLMClient) demonstrate cross-cutting
    reuse and deterministic testing.
  promotion_evidence:
  - recurring pattern proposals (dozens) abstracting LLM calls
  - production implementation in src/cas_runner/llm/litellm_client.py
  - deterministic mock implementation in src/cas_runner/llm/mock_client.py
  - current architecture state confirms usage across FlowRunner and governance modules
  - cross-project applicability for any agentic system
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: Global core candidate; aligns with global scope classification
  evidence_strength: high
  governance_risks:
  - duplicate promotion risk due to many overlapping proposals
  - need consensus on canonical name before formalisation
  - mock parity must be maintained across provider updates
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Explicit transition registry and governance action engine provide
    auditable state control for lifecycle transitions; evidence is strong and recurrent.
  promotion_evidence:
  - implementation in governance_action_engine.py (TransitionRegistry, GovernanceActionEngine)
  - typed models in governance/models.py
  - recurring proposals describing state machine governance
  - current architecture state includes governance engine as core component
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: Global core candidate; aligns with global scope classification
  evidence_strength: high
  governance_risks:
  - many overlapping proposals require consolidation into one canonical pattern
  - potential over-engineering if transition registry becomes too rigid
  - need clear documentation of supported transitions
  confidence: high
- pattern_id: rule-grounded-compliance-evaluation
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Rule-based compliance evaluation with structured findings is
    a universal governance need; ComplianceEngine and related models provide strong
    evidence.
  promotion_evidence:
  - implementation in compliance_engine.py (ComplianceEngine)
  - structured models (ComplianceFinding, ComplianceMetrics) in governance/models.py
  - recurring proposals for compliance guardrails and findings
  - current architecture state includes compliance validation in CI workflows
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: Global core candidate; aligns with global scope classification
  evidence_strength: high
  governance_risks:
  - duplicate proposals need consolidation into a single canonical pattern
  - rule evaluation must remain deterministic and auditable
  - risk of conflating compliance scoring with health scoring
  confidence: high
- pattern_id: file-backed-blackboard-workspace
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Version-controlled file system as shared agent knowledge and
    state is a portable, auditable persistence pattern; evidence includes bootstrap
    routines and cas-knowledge structure.
  promotion_evidence:
  - bootstrap.py workspace initialization and governance block merging
  - cas-knowledge directory hierarchy (global, projects, runtime, templates)
  - recurring proposals for file-based knowledge repositories
  - current architecture state shows persistent knowledge base used by agents and
    governance
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: Global core candidate; aligns with global scope classification
  evidence_strength: high
  governance_risks:
  - many overlapping proposals require canonical consolidation
  - risk of mixing runtime state with long-lived governance knowledge
  - need clear conventions for file naming and schema evolution
  confidence: high
- pattern_id: sequential-pipeline-flow-runner
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Deterministic sequential orchestration with shared context
    is a core execution pattern for multi-step agent workflows; FlowRunner evidence
    is strong and recurring.
  promotion_evidence:
  - implementation in runner.py (FlowRunner)
  - CLI entry point delegating to FlowRunner
  - recurring proposals for centralised flow orchestration
  - current architecture state includes multiple workflow invocations via FlowRunner
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: Global core candidate; aligns with global scope classification
  evidence_strength: high
  governance_risks:
  - duplicate proposals need consolidation into a single canonical pattern
  - overly rigid sequencing may impede future parallel execution
  - need clear documentation of step context contracts
  confidence: high
deferred_candidates:
- pattern_id: declarative-steering-projection
  recommendation: defer
  rationale: Global supporting pattern with medium readiness; evidence is present
    but primarily limited to model definitions and CI workflows, not yet demonstrated
    across multiple projects or runtime flows.
  evidence_gaps: Limited direct runtime usage evidence; no cross-project exemplars;
    implementation is still centred on steering/models.py.
  promotion_criteria_missing:
  - recurrence across multiple projects
  - governance maturity
  - cross-project applicability
  recommended_next_step: Document concrete prompt fact ingestion in a CI workflow
    and seek cross-project implementations to strengthen evidence.
  scope_alignment: Global supporting candidate; aligned but lower priority than core
    global patterns
  confidence: medium
- pattern_id: telemetry-observable-agent-steps
  recommendation: defer
  rationale: Observability is a generic cross-cutting concern, but evidence of active
    use for agent governance decisions is still medium; OpenTelemetry dependencies
    alone do not demonstrate full integration.
  evidence_gaps: Unclear how telemetry spans are persisted or used to gate/steer decisions;
    no cross-project evidence.
  promotion_criteria_missing:
  - evidence quality
  - recurrence across projects
  - clear architectural significance beyond standard observability
  recommended_next_step: Instrument a concrete agent flow and show telemetry-informed
    health or governance decisions in documentation and tests.
  scope_alignment: Global supporting candidate; aligned but requires more evidence
  confidence: medium
- pattern_id: reconciliation-agentic-merger
  recommendation: defer
  rationale: Agentic semantic reconciliation is valuable and implemented, but the
    pattern is still emerging and evidence is limited to this project; standard three-way
    merges and custom heuristics may be sufficient for many use cases.
  evidence_gaps: No cross-project validation; LLM-based merging is non-deterministic
    and risk of semantic corruption not fully quantified.
  promotion_criteria_missing:
  - governance maturity
  - recurrence across projects
  - stable solution definition
  recommended_next_step: Gather evidence of successful reconciliations across multiple
    projects and define clear schema guards to mitigate semantic corruption.
  scope_alignment: Global supporting candidate; aligned but not yet promotion-ready
  confidence: medium
- pattern_id: workspace-governance-injection-bootstrap
  recommendation: defer
  rationale: Project-scoped bootstrap pattern; although useful for onboarding, its
    implementation is tightly coupled to this project's file layout and agent tools.
  evidence_gaps: No evidence of reuse beyond this project; exact mechanics are project-specific.
  promotion_criteria_missing:
  - global scope classification
  - cross-project applicability
  - evidence quality
  recommended_next_step: Extract the general concept into a documented pattern independent
    of specific tooling and seek adoption in another project.
  scope_alignment: Project scope; defer pending global applicability evidence
  confidence: high
- pattern_id: skill-packaged-agent-procedures
  recommendation: defer
  rationale: Packaging agent procedures as skills is promising, but the skill content
    and discovery mechanism are tightly coupled to this project's agent ecosystem.
  evidence_gaps: No evidence of the same skill definitions being reused outside this
    project; evaluation harness only exists for this repository.
  promotion_criteria_missing:
  - global scope classification
  - cross-project applicability
  - recurrence across projects
  recommended_next_step: Create a minimal portable skill specification and pilot it
    in another project or agent framework to demonstrate reusability.
  scope_alignment: Project scope; defer
  confidence: medium
- pattern_id: heuristic-to-pattern-promotion-lifecycle
  recommendation: defer
  rationale: High future potential, but currently only a project-scoped practice;
    the lifecycle has not been observed in action or validated beyond documentation
    and templates.
  evidence_gaps: No evidence that the heuristic-to-pattern procedure has been successfully
    executed; no promotion decision records or metrics.
  promotion_criteria_missing:
  - global scope classification
  - evidence quality
  - governance maturity
  - recurrence across projects
  recommended_next_step: Run the lifecycle on at least one heuristic, capturing promotion
    decisions and metrics, then seek cross-project adoption.
  scope_alignment: Project scope with high future potential; defer pending evidence
  confidence: medium
- pattern_id: layered-governance-service-facade
  recommendation: defer
  rationale: The service facade pattern is a common good practice but may be too generic
    to warrant global promotion without stronger evidence that it provides unique
    architectural value in this domain.
  evidence_gaps: No evidence of reuse beyond this project; many projects implement
    service layers without documenting as an architectural pattern.
  promotion_criteria_missing:
  - distinctiveness
  - governance maturity
  - cross-project applicability
  recommended_next_step: Identify a specific governance complexity that the facade
    solves beyond ordinary layering and document it with concrete examples from other
    projects if possible.
  scope_alignment: Project scope; defer
  confidence: medium
- pattern_id: schema-enforced-domain-contracts
  recommendation: defer
  rationale: Strict Pydantic contracts are valuable but are a common Python practice
    rather than a distinctive architectural pattern; promotion would require evidence
    of specific governance or architectural benefit unique to this pattern.
  evidence_gaps: No cross-project evidence; the pattern is not distinguished from
    general schema validation.
  promotion_criteria_missing:
  - distinctiveness
  - cross-project applicability
  - architectural significance beyond standard practice
  recommended_next_step: Document how schema enforcement specifically prevents agent
    hallucination or governance failures and seek adoption in another system.
  scope_alignment: Project scope; defer
  confidence: medium
rejected_candidates:
- pattern_id: ci-workflow-constraint-suite
  recommendation: reject
  rationale: The CI workflow validation script is highly specific to this repository's
    CI/CD structure and was assessed with low future promotion potential. It does
    not meet global reuse criteria.
  governance_concern: Project-specific implementation with no evidence of cross-project
    applicability; promoting would create a pattern tied to the current CI/CD stack.
  confidence: high
