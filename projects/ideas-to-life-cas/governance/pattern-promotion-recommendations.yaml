- pattern_id: workspace-agent-steering-injection
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Injects governance constraints, tool settings, and steering
    instructions additively into local coding agent configuration files during bootstrap
    initialization.
  promotion_evidence:
