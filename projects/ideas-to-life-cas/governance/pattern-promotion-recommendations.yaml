promotion_preconditions_not_met:
- pattern_id: git-delta-prompt-facts
  unmet_preconditions:
  - scope classification is global
  - sufficient evidence
  - promotion readiness high/medium
  missing_evidence:
  - direct usage in runtime flows
  - cross-project implementations
  - concrete example of prompt fact ingestion in CI
  rationale: This candidate is a subset of the broader steering projection pattern
    and currently relies primarily on model definitions without demonstrated runtime
    use.
  recommended_next_step: Document a concrete prompt fact ingestion flow in CI and
    seek evidence from another project before reconsidering promotion.
- pattern_id: pattern-evolution-lifecycle
  unmet_preconditions:
  - scope classification is global
  - sufficient evidence
  - governance maturity
  - observed recurrence
  missing_evidence:
  - execution of the lifecycle in practice
  - promotion decision records
  - metrics on how often the lifecycle is followed
  rationale: The lifecycle is documented in templates and architecture docs but has
    not been observed in practice; no successful promotions have been recorded.
  recommended_next_step: Run the lifecycle on at least one heuristic, capture promotion
    metrics and decisions, and then assess global reuse.
- pattern_id: runtime-execution-context-store
  unmet_preconditions:
  - distinctiveness from file-backed knowledge base
  - sufficient evidence
  - clear global applicability
  missing_evidence:
  - code evidence beyond directory structure
  - unique benefits over standard configuration files
  - usage across multiple components
  rationale: The runtime context store concept has limited evidence and may overlap
    with the broader file-backed blackboard workspace pattern.
  recommended_next_step: Determine if the runtime context store provides unique benefits
    beyond standard config and whether it is used in multiple components or projects.
governance_summary:
  immediate_promotion_candidates:
  - provider-agnostic-llm-facade
  - finite-state-governance-engine
  - rule-grounded-compliance-evaluation
  - file-backed-blackboard-workspace
  - sequential-pipeline-flow-runner
  deferred_candidates:
  - declarative-steering-projection
  - telemetry-observable-agent-steps
  - reconciliation-agentic-merger
  - workspace-governance-injection-bootstrap
  - skill-packaged-agent-procedures
  - heuristic-to-pattern-promotion-lifecycle
  - layered-governance-service-facade
  - schema-enforced-domain-contracts
  rejected_candidates:
  - ci-workflow-constraint-suite
  major_governance_risks:
  - High number of duplicate/overlapping proposals requires consolidation before any
    individual pattern is formally promoted.
  - Several global supporting patterns (steering projection, telemetry, agentic merger)
    have strong conceptual alignment but insufficient cross-project evidence to justify
    immediate promotion.
  - Project-scoped candidates should not be promoted without explicit evidence of
    global applicability; current project-specific implementations are not sufficient.
  - Candidate-scoped patterns (git-delta-prompt-facts, pattern-evolution-lifecycle,
    runtime-execution-context-store) lack the required evidence and scope classification
    to enter promotion review.
  - Promotion recommendations are advisory only; architect review and ADR creation
    remain mandatory before any pattern is institutionalised.
