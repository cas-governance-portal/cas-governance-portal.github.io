promotion_preconditions_not_met:
- pattern_id: closed-loop-detect-analyse-execute-governance
  unmet_preconditions:
  - no critical governance risks exist
  - governance maturity
  - sufficient evidence exists
  missing_evidence:
  - automated rollback mechanics
  - drift remediation safety bounds
  - production incident containment audit logs
  rationale: Autonomous modification of code and architectural assets without verified
    human approval gates poses critical operational risks.
  recommended_next_step: Implement bounded simulation runs in non-mutating proposal-only
    mode to measure remediation accuracy.
- pattern_id: pattern-business-intent-traceability
  unmet_preconditions:
  - sufficient evidence exists
  - governance maturity
  missing_evidence:
  - automated test harness linking ADR drivers to runtime metrics
  - multi-repo implementation validation
  rationale: The concept has high strategic importance but currently exists primarily
    as architectural vision without runtime verification code.
  recommended_next_step: Prototype a validator linking strategic driver tags in ADRs
    to CI test outputs.
- pattern_id: pattern-architecture-knowledge-graph
  unmet_preconditions:
  - sufficient evidence exists
  - promotion readiness is high or medium
  missing_evidence:
  - graph database schema and query services in runtime codebase
  - lineage extraction integration with git commits
  rationale: Current architectural state is strictly file-backed in git; no graph
    engine or traversal layer exists to support this pattern.
  recommended_next_step: Evaluate graph database storage abstractions alongside file-backed
    representations.
- pattern_id: git-delta-prompt-fact-projection
  unmet_preconditions:
  - sufficient evidence exists
  missing_evidence:
  - benchmark tests proving token savings and hallucination reduction on large pull
    request diffs
  rationale: Typed delta models exist in code, but empirical evidence proving advantages
    over native diff ingestion is incomplete.
  recommended_next_step: Run comparative CI evaluations on PRs exceeding 500 lines
    to assess token usage and LLM reasoning accuracy.
