promotion_candidates:
- pattern_id: pattern-governance-gated-ci-pipeline
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Enforces architectural invariants deterministically via automated
    CI/CD pipeline gates before synthesis or promotion, exhibiting high cross-project
    applicability and direct implementation in workflow controls.
  promotion_evidence:
  - recurring architecture work backlog items (aw-ideas-to-life-cas-2026-05-31-005,
    aw-discovery-ideas-to-life-cas-4)
  - current architecture state control ctrl-cas-build-validation in .github/workflows/cas-build-validation.yml
  - active workflow verification gate preventing downstream steering updates upon
    build or contract failure
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Rigid gating may impede emergency hotfixes without explicit architectural bypass
    mechanisms.
  confidence: high
- pattern_id: pattern-architecture-work-registry
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Prevents state loss during automated regeneration cycles by
    designating persistent Architecture Work backlog artifacts as the authoritative
    source-of-truth while treating derived maps as disposable projections.
  promotion_evidence:
  - recurring architecture work backlog items (aw-ideas-to-life-cas-2026-05-31-001)
  - supporting architectural evidence in AEM and alignment reports
  - implemented component comp-knowledgeprovider and continuous architecture workflows
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Risk of divergence if external planning systems update without syncing to the
    git-backed Architecture Work backlog.
  confidence: high
deferred_candidates:
- pattern_id: governed-action-state-machine
  recommendation: defer
  rationale: Highly viable supporting pattern implemented in cas_runner.governance,
    but candidate requires deduplication and consolidation across four overlapping
    proposals before promotion.
  evidence_gaps: Requires consolidation with struct-002, state-transition-registry-guardrail,
    and transition-registry-state-machine to establish a unified canonical specification.
  promotion_criteria_missing:
  - deduplication resolution
  recommended_next_step: Consolidate overlapping proposals under 'governed-action-state-machine'
    and deprecate redundant variants before submitting for promotion.
  scope_alignment: global
  confidence: high
- pattern_id: typed-governance-data-contracts
  recommendation: defer
  rationale: Solid architectural pattern backed by Pydantic domain models in cas_runner,
    deferred pending consolidation with overlapping struct-001 and pydantic-domain-entity-modeling
    proposals.
  evidence_gaps: Overlap with struct-001 and pydantic-domain-entity-modeling necessitates
    consolidation into a single normative schema standard.
  promotion_criteria_missing:
  - deduplication resolution
  recommended_next_step: Merge duplicate proposals into a single canonical proposal
    and align field definitions across steering and governance models.
  scope_alignment: global
  confidence: high
- pattern_id: dual-client-llm-provider-abstraction
  recommendation: defer
  rationale: Strong implementation evidence pairing LiteLLMClient and MockLLMClient,
    but exists across multiple overlapping proposals requiring formal consolidation.
  evidence_gaps: Deduplication required against struct-004, provider-agnostic-llm-adapter,
    and pluggable-client-adapter-pattern.
  promotion_criteria_missing:
  - deduplication resolution
  recommended_next_step: Consolidate redundant adapter pattern proposals into 'dual-client-llm-provider-abstraction'.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-automated-detect-analyse-execute-loop
  recommendation: defer
  rationale: Autonomous closed-loop remediation carries high operational and regression
    risk; requires demonstrated telemetry proving safety on non-trivial architectural
    drift.
  evidence_gaps: Lacks multi-cycle telemetry demonstrating automated remediation safety,
    rollback safeguards, and containment guarantees.
  promotion_criteria_missing:
  - governance maturity
  - evidence quality
  recommended_next_step: Evaluate closed-loop outcomes under controlled PR environments
    with mandatory human verification before full promotion.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-architecture-knowledge-graph
  recommendation: defer
  rationale: Identified as strategic direction for multi-project architecture intelligence,
    but currently unverified by production runtime code or traces.
  evidence_gaps: Lacks component implementation, execution trace, and operational
    query evaluation in current codebase.
  promotion_criteria_missing:
  - recurrence
  - governance maturity
  - evidence quality
  recommended_next_step: Defer promotion until graph storage, ingestion, and query
    interfaces are implemented and empirically verified.
  scope_alignment: global
  confidence: high
- pattern_id: pattern-business-intent-traceability
  recommendation: defer
  rationale: Represents strategic alignment between business goals and technical decisions,
    but lacks machine-readable schema enforcement within the active runner.
  evidence_gaps: No concrete parser, validator, or enforcement engine present in active
    runner components.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Implement pilot Architecture Work schema extensions linking
    business intent to ADRs before re-evaluating for promotion.
  scope_alignment: global
  confidence: high
- pattern_id: declarative-agent-command-manifests
  recommendation: defer
  rationale: Designated as project-scoped pattern specific to .agents/commands/speckit
    TOML format within ideas-to-life-cas.
  evidence_gaps: Lacks multi-project validation and generalized platform harness abstraction.
  promotion_criteria_missing:
  - reusability
  - cross-project applicability
  recommended_next_step: Retain within project pattern catalog until multiple agent
    frameworks adopt the command specification.
  scope_alignment: project
  confidence: high
- pattern_id: prompt-fact-steering-projection
  recommendation: defer
  rationale: Project-scoped mechanism coupled to CAS git delta steering calculation;
    requires broader extraction before enterprise adoption.
  evidence_gaps: Multi-project extraction and reusable CLI contract absent.
  promotion_criteria_missing:
  - reusability
  - cross-project applicability
  recommended_next_step: Evaluate adoption across secondary pilot projects prior to
    global promotion consideration.
  scope_alignment: project
  confidence: high
rejected_candidates:
- pattern_id: dummy_string
  recommendation: reject
  rationale: Placeholder proposal containing dummy string values with no architectural,
    technical, or empirical substance.
  governance_concern: Pollutes pattern catalog and risks accidental inclusion in governance
    baseline.
  confidence: high
duplicate_overlapping_promotion_candidates:
- patterns_involved:
  - governed-action-state-machine
  - struct-002
  - state-transition-registry-guardrail
  - transition-registry-state-machine
  recommended_action: Consolidate into 'governed-action-state-machine' and deprecate
    redundant variations.
  rationale: All four proposals describe the TransitionRegistry and GovernanceActionEngine
    gating state mutations in src/cas_runner/governance.
- patterns_involved:
  - dual-client-llm-provider-abstraction
  - struct-004
  - provider-agnostic-llm-adapter
  - pluggable-client-adapter-pattern
  recommended_action: Consolidate under 'dual-client-llm-provider-abstraction'.
  rationale: Proposals identically capture the LiteLLMClient production adapter paired
    with MockLLMClient for offline isolation.
- patterns_involved:
  - typed-governance-data-contracts
  - struct-001
  - pydantic-domain-entity-modeling
  recommended_action: Merge into 'typed-governance-data-contracts'.
  rationale: All proposals detail Pydantic schema validation for domain entities and
    metrics in src/cas_runner/governance/models.py.
- patterns_involved:
  - sequential-flow-runner-orchestration
  - sequential-pipeline-runner
  recommended_action: Retain 'sequential-flow-runner-orchestration' as project pattern
    and retire 'sequential-pipeline-runner'.
  rationale: Both describe the linear FlowRunner step execution pipeline in src/cas_runner/runner.py.
- patterns_involved:
  - continuous-compliance-evaluator
  - compliance-first-guardrail-engine
  recommended_action: Merge into 'continuous-compliance-evaluator'.
  rationale: Both describe ComplianceEngine rule verification against repository inventory.
- patterns_involved:
  - composite-health-scoring-heuristic
  - struct-005
  - diagnostic-health-reflection
  - health-status-metric-aggregator
  recommended_action: Consolidate under 'composite-health-scoring-heuristic'.
  rationale: All four represent the calculate_health functional evaluation in src/cas_runner/dashboard/health_model.py.
- patterns_involved:
  - agentic-merge-resolution
  - agentic-knowledge-merger
  recommended_action: Merge into 'agentic-merge-resolution'.
  rationale: Both target AgenticMerger logic in src/cas_runner/governance/agentic_merger.py.
- patterns_involved:
  - struct-003
  - layered-service-engine-separation
  recommended_action: Consolidate under 'layered-service-engine-separation'.
  rationale: Both describe separating GovernanceActionService orchestration from pure
    engine computation.
promotion_preconditions_not_met:
- pattern_id: pattern-automated-detect-analyse-execute-loop
  unmet_preconditions:
  - no critical governance risks exist
  - governance maturity verified
  missing_evidence:
  - Automated remediation safety multi-cycle telemetry
  - Rollback and invariant containment proof
  rationale: Closed-loop autonomous remediation risks unintended production changes
    without deterministic rollback safety verified in staging environments.
  recommended_next_step: Test closed-loop remediation in shadow PR runs before seeking
    promotion.
- pattern_id: pattern-architecture-knowledge-graph
  unmet_preconditions:
  - sufficient evidence exists
  - promotion readiness is high or medium
  missing_evidence:
  - Runtime component implementation
  - Graph query interface benchmarks
  - Operational execution traces
  rationale: The proposal represents strategic intent without active codebase implementation.
  recommended_next_step: Defer until graph models and queries are implemented in cas_runner.
- pattern_id: pattern-business-intent-traceability
  unmet_preconditions:
  - sufficient evidence exists
  - governance maturity verified
  missing_evidence:
  - Concrete schema definition in runner models
  - Automated intent-to-code parser
  rationale: Conceptual alignment exists, but lacking runtime parser or contract enforcement
    mechanisms.
  recommended_next_step: Formalize schema in cas_runner.governance.models and re-evaluate.
governance_summary:
  immediate_promotion_candidates:
  - pattern-governance-gated-ci-pipeline
  - pattern-architecture-work-registry
  deferred_candidates:
  - governed-action-state-machine
  - typed-governance-data-contracts
  - dual-client-llm-provider-abstraction
  - pattern-automated-detect-analyse-execute-loop
  - pattern-architecture-knowledge-graph
  - pattern-business-intent-traceability
  - declarative-agent-command-manifests
  - prompt-fact-steering-projection
  rejected_candidates:
  - dummy_string
  major_governance_risks:
  - Premature promotion of duplicate overlapping patterns creating divergent architectural
    terminology.
  - High regression and stability risk associated with autonomous closed-loop remediation
    without verified rollback safeguards.
  - Risk of promoting conceptual strategic direction patterns (Knowledge Graph, Business
    Intent) prior to executable runtime validation.
