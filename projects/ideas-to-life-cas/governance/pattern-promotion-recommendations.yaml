  - finite-state-governance-engine
  - pattern-scope-classification-framework
  - provider-agnostic-llm-facade
  - pure-functional-health-evaluation
  - declarative-agent-command-registry
  deferred_candidates:
  - pattern-closed-loop-governance
  - sequential-pipeline-flow-runner
  - capability-lineage-anchoring
  - docs-as-code-portal-projection
  - file-system-knowledge-repository
  - layered-governance-service-facade
  - reconciliation-agentic-merger
  - pattern-architecture-knowledge-graph
  - pattern-business-intent-traceability
  - pattern-proposal-code-intelligence-alignment
  - telemetry-observable-agent-steps
  rejected_candidates:
  - ci-driven-steering-projection
  major_governance_risks:
  - Premature promotion of non-deterministic LLM-driven reconciliation components
