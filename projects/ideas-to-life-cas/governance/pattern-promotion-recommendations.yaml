  major_governance_risks:
  - 'Duplicate proliferation: Many proposals overlap on core global patterns (LLM
    abstraction, pipeline, transition registry, etc.) and must be consolidated to
    avoid fragmented governance.'
  - 'Premature promotion of medium-readiness patterns: compliance-evaluation-engine
    and agentic-semantic-merge-reconciliation have medium readiness; ensure evidence
    is sufficient before institutionalisation.'
  - Project-scoped patterns may be mistakenly promoted in the future without cross-project
    validation.
  - Candidate-scoped patterns require additional evidence before promotion; otherwise
    they may become speculative rules.
  - LLM-dependent patterns (agentic merger) carry nondeterminism and should be carefully
    scoped.
