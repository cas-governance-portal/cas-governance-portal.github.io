- pattern_id: steering-fact-projection
  unmet_preconditions:
  - sufficient independent consumption evidence
  - cross-project recurrence
  missing_evidence:
  - downstream PromptFact and SteeringRuntimeIndex consumers
  - examples from a second project
  rationale: The pattern is architecturally significant and globally scoped, but promotion
    readiness is medium because evidence is concentrated in model definitions and
    one projection workflow.
  recommended_next_step: Collect projected facts consumed by agents across multiple
    workflows and projects.
- pattern_id: telemetry-grounded-traceability
  unmet_preconditions:
  - operational evidence
  - downstream trace consumer evidence
  missing_evidence:
  - emitted OpenTelemetry spans
  - persisted trace artifacts
  - audit or health consumers of traces
  rationale: The proposal has global supporting scope but lacks evidence that tracing
    is operational and consumed beyond dependency declarations.
  recommended_next_step: Demonstrate trace emission, persistence, and consumption
    in a real governance run.
- pattern_id: bootstrap-governance-injection
  unmet_preconditions:
