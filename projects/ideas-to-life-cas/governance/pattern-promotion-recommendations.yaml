promotion_candidates:
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Fundamental architectural decoupling separating LLM consumption
    logic from proprietary vendor SDKs, backed by dual production-mock parity across
    multiple execution flows.
  promotion_evidence:
  - recurring implementation across src/cas_runner/llm/litellm_client.py and mock_client.py
  - current architecture state verification across multiple test and CI workflows
  - cross-project applicability for vendor neutrality and zero-cost offline testing
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Risk of provider feature drift if vendor-specific parameters are not standardized
    across facade implementations
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Essential safety invariant preventing autonomous agents from
    performing illegal lifecycle transitions or arbitrary state mutations on governed
    artifacts.
  promotion_evidence:
  - codified TransitionRegistry and GovernanceActionEngine in src/cas_runner/governance/governance_action_engine.py
  - domain exception models in src/cas_runner/governance/models.py
  - verified enforcement across pattern and capability lifecycle transitions
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Potential transition rigidity if newly emerging governance states are not incrementally
    registered in the transition matrix
  confidence: high
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Core boundary protection pattern ensuring all inputs and outputs
    between agents, storage, and CI runners adhere to deterministic, strongly typed
    Pydantic contracts.
  promotion_evidence:
  - extensively evidenced across src/cas_runner/governance/models.py and steering/models.py
  - contract enforcement in CI via cas-build-validation.yml and pytest suites
  - prevents hallucinated or malformed payloads from mutating persistent state
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Schema breaking changes require synchronized migrations across distributed repository
    workspaces
  confidence: high
- pattern_id: file-backed-blackboard-workspace
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Foundational persistence pattern enabling asynchronous agent
    and human collaboration without external database infrastructure, leveraging Git
    versioning and pull-request gating.
  promotion_evidence:
  - directory layout in cas-knowledge/ split across global, projects, runtime, and
    templates
  - workspace scaffolding and attachment routines in src/cas_runner/bootstrap.py
  - verified persistence contracts in LocalKnowledgeProvider and KnowledgeProvider
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Git tree scalability and potential merge contention under high-frequency automated
    commits
  confidence: high
- pattern_id: sequential-pipeline-flow-runner
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Core execution pattern ensuring deterministic step order and
    short-circuit failure boundaries, avoiding unbounded or divergent autonomous agent
    loops.
  promotion_evidence:
  - implemented in src/cas_runner/runner.py (FlowRunner) orchestrating linear execution
    stages
  - declared flow execution registry across src/cas_runner/steps/registry.py
  - shared execution context propagation validated across continuous architecture
    CI workflows
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Linear step dependency limits parallel execution scaling for non-dependent evaluation
    tasks
  confidence: high
- pattern_id: pattern-architecture-work-registry
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Prevents data loss during automated discovery runs by decoupling
    authoritative architectural planning and intent tracking backlogs from ephemeral
    derived visualizations.
  promotion_evidence:
  - evidenced across architecture work items (aw-ideas-to-life-cas-2026-05-31-001,
    aw-ideas-to-life-cas-20260614-1)
  - step decoupling in src/cas_runner/steps/aem_generator.py separating source work
    from derived maps
  - supported by current architecture state AEM lifecycle models
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Manual sync required if changes to derived visualizations bypass the authoritative
    Architecture Work registry
  confidence: high
deferred_candidates:
- pattern_id: declarative-steering-projection
  recommendation: defer
  rationale: Supporting pattern actively implemented in the current repository, but
    consolidation of fact projection variants across multiple projects is needed before
    global standardization.
  evidence_gaps: Requires cross-project demonstration of prompt fact token budget
    limits and verification across varied VCS platforms.
  promotion_criteria_missing:
  - recurrence across multiple projects
  - cross-project applicability validation
  recommended_next_step: Validate PromptFact extraction across a second client repository
    before advancing to global promotion.
  scope_alignment: global
  confidence: high
- pattern_id: telemetry-observable-agent-steps
  recommendation: defer
  rationale: Instrumentation dependencies (OpenTelemetry) are declared and modeled,
    but telemetry aggregation spans and trace analysis are still maturing.
  evidence_gaps: Empirical runtime logs demonstrating active OpenTelemetry trace ingestion
    and trace-driven debugging in production workflows.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Complete integration of OpenTelemetry trace persistence in
    cas-knowledge/runtime/traces/ and verify dashboard ingestion.
  scope_alignment: global
  confidence: medium
- pattern_id: rule-grounded-compliance-evaluation
  recommendation: defer
  rationale: Compliance engine implementation is operational locally, but formal cataloging
    of standardized organizational rule sets is ongoing.
  evidence_gaps: Standard rule catalog beyond local repository health rules.
  promotion_criteria_missing:
  - cross-project applicability
  - governance maturity
  recommended_next_step: Codify enterprise rule taxonomy in global rules repository
    and evaluate against diverse project deltas.
  scope_alignment: global
  confidence: medium
- pattern_id: pattern-scope-classification-framework
  recommendation: defer
  rationale: Currently functions as a project reference architecture governing taxonomy
    workflows; requires multi-project operational verification before global pattern
    promotion.
  evidence_gaps: Empirical data evaluating scope classification decisions on non-CAS
    projects.
  promotion_criteria_missing:
  - recurrence
  - cross-project applicability
  recommended_next_step: Exercise the scope classification workflow on secondary target
    repositories to assess generalizability.
  scope_alignment: project
  confidence: high
- pattern_id: reconciliation-agentic-merger
  recommendation: defer
  rationale: Semantic document reconciliation by an LLM poses governance risks regarding
    potential silent schema corruption and loss of architectural constraints.
  evidence_gaps: Lack of empirical data showing agentic merges avoid subtle schema
    corruptions across diverse project environments.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Run shadow evaluation in CI comparing LLM merge outputs against
    human architect resolution decisions.
  scope_alignment: candidate
  confidence: high
- pattern_id: pattern-business-intent-traceability
  recommendation: defer
  rationale: Represents strategic direction but lacks concrete runtime implementation
    or AST extraction engine in the codebase.
  evidence_gaps: No runtime implementation or AST extraction engine currently exists
    in the codebase.
  promotion_criteria_missing:
  - recurrence
  - evidence quality
  - governance maturity
  recommended_next_step: Develop prototype Pydantic schema and test AST linkage on
    a pilot capability before promoting to pattern.
  scope_alignment: candidate
  confidence: high
- pattern_id: pattern-architecture-knowledge-graph
  recommendation: defer
  rationale: Proposes replacing flat markdown and YAML frontmatter with a relational
    knowledge graph; storage trade-offs and GitOps compatibility remain unproven.
  evidence_gaps: Current architecture remains entirely file-backed; graph database
    schema and query engines are unproven.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Validate storage trade-offs and GitOps compatibility with
    an experimental graph indexer.
  scope_alignment: candidate
  confidence: high
- pattern_id: pattern-deterministic-lifecycle-gating
  recommendation: defer
  rationale: High overlap with Finite State Governance Engine; machine-validated ADR
    enforcement in CI requires separate rule verification.
  evidence_gaps: Overlaps significantly with Finite State Governance Engine and requires
    verification of CI gating rules.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Consolidate into transition registry rules and verify runner
    enforcement in integration tests.
  scope_alignment: candidate
  confidence: high
- pattern_id: pattern-continuous-governance-loop
  recommendation: defer
  rationale: Autonomous closed-loop detection, analysis, and execution requires strict
    safety boundaries and human approval gates to avoid unratified state mutations.
  evidence_gaps: Automated code remediation safety boundaries and human approval gates
    require formal definition.
  promotion_criteria_missing:
  - evidence quality
  - governance maturity
  recommended_next_step: Scope automated remediation to proposal-only generation before
    enabling unattended execution.
  scope_alignment: candidate
  confidence: high
rejected_candidates:
- pattern_id: layered-governance-service-facade
  recommendation: reject
  rationale: Describes standard software engineering application service layering
    wrapping domain engines rather than a distinct continuous architecture pattern.
  governance_concern: Catalog pollution and governance bloat from promoting textbook
    software layering as specialized enterprise patterns.
  confidence: high
- pattern_id: docs-as-code-portal-projection
  recommendation: reject
  rationale: Implementation is tightly coupled to MkDocs material and static asset
    bundling specifically configured for this repository's deployment target.
  governance_concern: Project-specific tooling details should not be codified into
    global architectural pattern governance.
  confidence: high
- pattern_id: pattern-proposal-only-steering-projection
  recommendation: reject
  rationale: Represents an operational pipeline configuration for CI branch protection
    rather than an architectural pattern.
  governance_concern: Conflation of operational workflow flags and environment settings
    with global architectural patterns.
  confidence: high
- pattern_id: declarative-agent-command-registry
  recommendation: reject
  rationale: Specific to local speckit TOML manifest contracts located in .agents/commands/
    for this workspace toolchain.
  governance_concern: Premature promotion of tooling-specific file conventions to
    enterprise global governance scope.
  confidence: medium
