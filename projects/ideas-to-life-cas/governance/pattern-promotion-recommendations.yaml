promotion_candidates:
- pattern_id: provider-agnostic-llm-facade
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Foundational architectural pattern decoupling autonomous orchestration
    workflows from vendor-specific model APIs, implemented robustly in LiteLLMClient
    with symmetrical offline test doubles.
  promotion_evidence:
  - recurring implementation across FlowRunner and AgenticMerger modules
  - current architecture state AST support in src/cas_runner/llm/litellm_client.py
  - cross-project applicability for LLM-driven orchestration runtimes
  - governance model alignment with deterministic CI test double capabilities
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Vendor abstraction leakage if vendor-specific parameters or error structures are
    not normalized
  confidence: high
- pattern_id: finite-state-governance-engine
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Core governance requirement preventing autonomous agents from
    fabricating invalid lifecycle states or bypassing prerequisite conditions during
    architecture transitions.
  promotion_evidence:
  - implemented in TransitionRegistry and GovernanceActionEngine (src/cas_runner/governance/governance_action_engine.py)
  - formal schema models defined in src/cas_runner/governance/models.py
  - governance model alignment verifying invariant state transition enforcement
  - system boundary control point across continuous architecture workflows
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - State graph rigidness potentially blocking valid emerging lifecycle states if
    not versioned
  confidence: high
- pattern_id: schema-enforced-domain-contracts
  recommendation: promote
  promotion_readiness: high
  promotion_rationale: Eliminates hallucinated, malformed, or incomplete structured
    outputs produced by non-deterministic agent steps prior to state ingestion and
    persistence.
  promotion_evidence:
  - formal structural typing in src/cas_runner/governance/models.py and src/cas_runner/steering/models.py
  - active validation gates in cas-build-validation and governance-validation workflows
  - high recurrence across all runner pipeline phases
  promotion_criteria_met:
  - significance
  - reusability
  - recurrence
  - evidence quality
  - governance maturity
  - strategic alignment
  scope_alignment: global
  evidence_strength: high
  governance_risks:
  - Schema evolution breaking backwards compatibility across heterogeneous project
    versions
  confidence: high
