  steps:
  - id: step:1:actions-checkout-v4
    name: actions/checkout@v4
    sequence: 1
    depends_on: []
    implementation: actions/checkout@v4
    evidence_ids:
    - ev-wf-cas-managed-steering-sync
    confidence: high
    control_roles:
    - Prevent
  - id: step:2:check-if-commit-contains-only-
    name: Check if commit contains only steering changes
    sequence: 2
    depends_on:
    - step:1:actions-checkout-v4
    implementation: "CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)\n\
      echo \"Files changed in latest commit:\"\necho \"$CHANGED_FILES\"\n\nif [ -z\
      \ \"$CHANGED_FILES\" ]; then\n  echo \"No files changed in HEAD.\"\n  echo \"\
      skip=false\" >> $GITHUB_OUTPUT\n  exit 0\nfi\n\nONLY_STEERING=true\nfor file\
      \ in $CHANGED_FILES; do\n  if [[ \"$file\" != \"AGENTS.md\" && \"$file\" !=\
      \ \"GEMINI.md\" && \"$file\" != \"CLAUDE.md\" && \"$file\" != \"README.md\"\
      \ ]]; then\n    ONLY_STEERING=false\n    break\n  fi\ndone\n\nif [ \"$ONLY_STEERING\"\
      \ = true ]; then\n  echo \"Only steering files changed. Skipping projection\
      \ generation.\"\n  echo \"skip=true\" >> $GITHUB_OUTPUT\nelse\n  echo \"Contains\
      \ other changes. Proceeding.\"\n  echo \"skip=false\" >> $GITHUB_OUTPUT\nfi\n"
    evidence_ids:
    - ev-wf-cas-managed-steering-sync
    confidence: high
    control_roles:
    - Prevent
    - Detect
