  name: CAS Managed Steering Sync
  type: workflow
  description: Applies projected managed steering sections to README and steering
    guidance artifacts.
  trigger:
    type: event
    event: push, pull_request, workflow_dispatch
    source: GitHub Actions
    evidence_id: ev-wf-cas-managed-steering-sync
  entrypoint:
    path: .github/workflows/cas-managed-steering-sync.yml
    command: github workflow CAS Managed Steering Sync
    evidence_id: ev-wf-cas-managed-steering-sync
