- pattern_id: struct-004
  name: Pluggable Infrastructure Adapter with Mock Fallback
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/llm/litellm_client.py (LiteLLMClient) - Production concrete adapter
      wrapping underlying library calls.
    - src/cas_runner/llm/mock_client.py (MockLLMClient) - Mock test-double adapter
      implementing identical interface for isolated environments.
  description: Abstracted client adapters providing uniform interfaces for external
    I/O integrations alongside in-memory mock implementations for isolated testing.
