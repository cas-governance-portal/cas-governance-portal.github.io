pattern_proposals:
- pattern_id: pydantic-domain-entity-modeling
  name: Typed Domain Entity Modeling via Pydantic
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-10-03'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/models.py (GovernanceInventory, ComplianceFinding,
      ComplianceMetrics, GovernanceAction, ResolutionResult) - Models governance entities
      and metrics using typed Pydantic models.
    - src/cas_runner/steering/models.py (CapabilityRecord, CapabilitySet, ArchitecturalDelta,
      SteeringRuntimeIndex) - Models capability catalogs and git steering state as
      Pydantic entities.
  description: Core enterprise architecture entities and governance artifacts are
    formalized using Pydantic BaseModel instances to enforce rigid data schemas and
    automated serialization.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Ensure all architectural data artifacts exchanged across the application
    and persisted to disk maintain deterministic structural validation and type guarantees.'
  - 'Context: The system processes architecture models, compliance metrics, git deltas,
    and governance records from external files and operational workflows.'
  - 'Force: Schema drift between stored markdown/yaml records and in-memory execution'
  - 'Force: Need for automatic serialization and deserialization across CLI and dashboard
    components'
  evidence_strength: high
  confidence: high
- pattern_id: transition-registry-state-machine
  name: Transition Registry State Machine
  pattern_classification: governance
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-10-07'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_engine.py#TransitionRegistry, GovernanceActionEngine
      (TransitionRegistry, GovernanceActionEngine) - Registry plus engine naming strongly
      implies a constrained state-transition design.
  description: GovernanceActionEngine and TransitionRegistry suggest that governance
    actions advance through explicitly registered transitions rather than unconstrained
    mutation.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Make legal state changes for governance actions explicit, testable, and
    extensible via a registry.'
  - 'Context: A governance subsystem with actions that likely move through statuses
    such as proposed, accepted, rejected, resolved, or blocked.'
  - 'Force: Illegal state changes are dangerous in governance workflows'
  - 'Force: Policies must be auditable'
  - 'Force: New transition rules should be addable without rewriting the engine'
  evidence_strength: medium
  confidence: medium
