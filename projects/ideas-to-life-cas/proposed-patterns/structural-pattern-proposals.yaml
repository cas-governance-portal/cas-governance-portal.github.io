pattern_proposals:
- pattern_id: pydantic-domain-entity-modeling
  name: Pydantic Domain Entity Modeling
  pattern_classification: governance
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-10-02'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/models.py (ResolutionResult, TraceableMetric, GovernanceInventory,
      GovernanceHealth, GovernanceThroughput, GovernanceRisks, ComplianceFinding,
      ComplianceMetrics, GovernanceException, GovernanceAction) - Defines core governance
      domain entities and metrics using typed Pydantic models.
    - src/cas_runner/steering/models.py (GitChangeType, RawGitDelta, PromptFact, SteeringRuntimeIndex,
      CapabilityCategory, CapabilityRecordType, CapabilityRecord, CapabilitySet, CapabilityLineage,
      ArchitecturalDelta) - Defines steering, delta, and capability lineage models.
  description: Express domain concepts, governance records, and architectural delta
    states as immutable or strongly typed Pydantic models.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Ensure strict type checking, serialization guarantees, and validation
    boundaries for all architectural governance entities across the system.'
  - 'Context: The governance system processes complex metrics, Git deltas, compliance
    findings, and capability lineages from disk, external CLI invocations, and service
    pipelines.'
  - 'Force: Need to prevent silent schema drift across Git change events and governance
    state snapshots.'
  - 'Force: Ensuring clean serialization and deserialization between JSON/YAML files
    and memory.'
  evidence_strength: high
  confidence: high
- pattern_id: transition-registry-state-machine
