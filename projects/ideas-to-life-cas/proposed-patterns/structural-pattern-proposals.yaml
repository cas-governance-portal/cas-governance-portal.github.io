  - 'Force: Explanations must be provided alongside binary green/red statuses'
  evidence_strength: high
  confidence: high
- pattern_id: pluggable-client-adapter-pattern
  name: Pluggable External Client Adapter with Test Double
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-23'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/llm/litellm_client.py (LiteLLMClient) - Production implementation
      wrapping litellm provider
    - src/cas_runner/llm/mock_client.py (MockLLMClient) - In-memory test double for
      zero-dependency execution
  description: Maintains production and mock implementations conforming to identical
    interfaces to decouple high-cost infrastructure integrations from unit tests and
    offline workflows.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Enable running runner governance and synthesis steps offline and during
    deterministic unit tests without calling external endpoints.'
  - 'Context: External model clients (LiteLLM) introduce network dependencies and
    nondeterminism into testing pipelines.'
  - 'Force: CI pipelines must run quickly and deterministically without external credentials'
  - 'Force: Production runtime requires real remote API invocation'
  evidence_strength: high
  confidence: high
