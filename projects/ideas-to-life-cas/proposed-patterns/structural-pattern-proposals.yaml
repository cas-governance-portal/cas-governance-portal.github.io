pattern_proposals:
- pattern_id: pydantic-domain-entity-modeling
  name: Pydantic Domain Entity Modeling
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-26'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/models.py (ResolutionResult, TraceableMetric, GovernanceInventory,
      GovernanceHealth, GovernanceRisks, ComplianceFinding) - Provides formal structural
      typing for governance state, health, metrics, and compliance items.
    - src/cas_runner/steering/models.py (GitChangeType, RawGitDelta, CapabilityRecord,
      CapabilitySet, ArchitecturalDelta) - Models repository changes, architectural
      capabilities, and deltas as typed schemas.
  description: Formalizes domain concepts as strongly typed, immutable or validated
    Pydantic data schemas across governance and steering domains.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Ensure strict type safety, input validation, and clear serialization
    contracts across runtime boundaries.'
  - 'Context: Governance, compliance, and steering pipelines parse heterogeneous JSON/YAML
    files and need consistent in-memory representation.'
  - 'Force: High variance in filesystem inputs requires rigorous validation before
    execution'
  - 'Force: Serialization/deserialization between disk representations and runtime
    engines must be transparent and robust'
  evidence_strength: high
  confidence: high
- pattern_id: transition-registry-state-machine
  name: Transition Registry State Machine
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-26'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_engine.py (TransitionRegistry, GovernanceActionEngine)
      - Maintains transition rules and drives deterministic action execution.
  description: Decouples lifecycle state validations and transitions from execution
    logic using an explicit registration map.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Centralize valid entity state transitions and their corresponding action
    handlers to prevent illegal lifecycle moves.'
  - 'Context: Governance artifacts (proposals, rules, decisions) transition through
    distinct lifecycle phases that must trigger specific actions.'
  - 'Force: Scattering conditional if/else blocks for lifecycle state checks leads
    to fragile transitions'
  - 'Force: New transitions must be registerable without modifying consumer execution
    paths'
  evidence_strength: high
  confidence: high
- pattern_id: pure-functional-health-evaluation
  name: Pure Functional Health Evaluation
  pattern_classification: architectural
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/dashboard/health_model.py (HealthStatus, calculate_health, get_health_reasons)
      - Deterministic health assessment driven by inputs without I/O dependencies.
  description: Evaluates architectural and repository health status using side-effect-free,
    deterministic calculation functions.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Provide consistent, easily testable health score and status derivations
    without coupling to database, file system, or network states.'
  - 'Context: Health dashboards require unambiguous status calculation (e.g. GREEN,
    YELLOW, RED) along with transparent human-readable explanations based on input
    metrics.'
  - 'Force: Calculation must be strictly reproducible given identical metrics'
  - 'Force: Diagnostic reasoning must accompany health score changes'
  evidence_strength: high
  confidence: high
- pattern_id: swappable-client-adapter
  name: Swappable Client Adapter with Mock Implementation
  pattern_classification: architectural
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/llm/litellm_client.py (LiteLLMClient) - Production network adapter
      calling external LLM proxies.
    - src/cas_runner/llm/mock_client.py (MockLLMClient) - Test-double client enabling
      offline execution without API keys.
  description: Abstracts external network service interactions behind concrete client
    adapters paired with local mock equivalents for zero-dependency testing.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Isolate external provider network dependencies and enable fast, deterministic
    unit and offline test runs.'
  - 'Context: External API calls require network connectivity and credentials; local
    test suites and isolated CI environments require predictable local stubs.'
  - 'Force: Testing without external service credentials or internet access'
  - 'Force: Swappable provider implementations without modifying core domain callers'
  evidence_strength: high
  confidence: high
- pattern_id: layered-governance-service-facade
  name: Layered Governance Service Facade
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_service.py (GovernanceActionService)
      - Coordinates governance action execution and compliance engine checks.
    - src/cas_runner/governance/compliance_engine.py (ComplianceEngine) - Domain engine
      leveraged by the service facade.
  description: Exposes a high-level application service facade orchestrating discrete
    domain engines for governance actions and compliance checks.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Present a cohesive application interface to presentation layers (CLI/Runner)
    while coordinating underlying domain engines.'
  - 'Context: Executing a governance action involves validating compliance rules,
    evaluating state transitions, and persisting findings across multiple sub-systems.'
  - 'Force: Prevent CLI commands from orchestrating low-level engine details'
  - 'Force: Maintain clear boundary between domain rule calculation and transaction
    orchestration'
  evidence_strength: high
  confidence: high
- pattern_id: docs-as-code-portal-projection
  name: Documentation-as-Code Portal Projection
  pattern_classification: architectural
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - pyproject.toml (mkdocs, mkdocs-material, mkdocs-drawio) - Tooling dependencies
      supporting static architectural portal generation.
    - portal/docs/static/js/dashboard.js - Client-side interactive visualization script
      for portal dashboard metrics.
    - .github/workflows/cas-portal-publish.yml - CI deployment pipeline compiling
      and publishing the static portal.
  description: Compiles structured domain outputs and governance diagrams into a versioned,
    static documentation portal using MkDocs and client-side visualization scripts.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Project architectural health and compliance state into an accessible,
    searchable developer portal without requiring a dedicated dynamic web backend.'
  - 'Context: Architectural guidelines and live compliance metrics need to be transparent
    to engineering teams without running specialized hosting servers.'
  - 'Force: Static hosting convenience (e.g. GitHub Pages)'
  - 'Force: Combining human-authored markdown with machine-generated governance dashboards'
  evidence_strength: high
  confidence: high
- pattern_id: service-facade-orchestration
  name: Service Facade Orchestration
  pattern_classification: architectural
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-26'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_service.py (GovernanceActionService)
      - Acts as the application entry point coordinating compliance and action engines.
  description: Aggregates fine-grained domain engines (compliance, action, transitions)
    into a cohesive service facade for consumers.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Provide a simplified, consolidated interface to complex sub-systems such
    as compliance engines and action registries.'
  - 'Context: Clients (CLI, background workflows) require single operation endpoints
    to process governance lifecycle events without manually orchestrating engines.'
  - 'Force: Consumers should not need to instantiate and chain ComplianceEngine and
    GovernanceActionEngine directly'
  - 'Force: Transactions and operational boundaries must be coordinated centrally'
  evidence_strength: high
  confidence: high
- pattern_id: client-adapter-test-double
  name: Client Adapter and Test Double
  pattern_classification: architectural
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-26'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/llm/litellm_client.py (LiteLLMClient) - Production adapter calling
      external LiteLLM APIs.
    - src/cas_runner/llm/mock_client.py (MockLLMClient) - Offline test double providing
      stubbed or simulated responses.
  description: Separates real external network/API communication from test environments
    via symmetric client interfaces.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Allow offline execution, deterministic testing, and CI validation without
    calling live external provider APIs.'
  - 'Context: External integrations (such as LiteLLM API providers) are costly, non-deterministic,
    or unavailable during local builds and unit tests.'
  - 'Force: Components requiring provider interaction must execute without active
    internet connections or credentials'
  - 'Force: Mock implementations must adhere to the identical call interface as real
    clients'
  evidence_strength: high
  confidence: high
- pattern_id: file-system-knowledge-repository
  name: File-System Structured Knowledge Repository
  pattern_classification: architectural
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-26'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - cas-knowledge/ - Directory structure containing global, projects, runtime, and
      templates sub-trees.
    - src/cas_runner/bootstrap.py (init_workspace, merge_cas_governance_block) - Provisions
      workspace directories and synchronizes governance files into target projects.
  description: Employs an organized directory hierarchy of markdown, YAML, and JSON
    files as the persistent source of truth.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Persist architecture decisions, rules, patterns, and runtimes directly
    in version-controlled directory structures.'
  - 'Context: Architecture knowledge must be transparent, reviewable via Git Pull
    Requests, and easily inspectable by human architects and scripts.'
  - 'Force: Databases add operational complexity and obscure Git-centric change tracking'
  - 'Force: Hierarchical knowledge requires clear categorization (global, project-specific,
    runtime, templates)'
  evidence_strength: high
  confidence: high
