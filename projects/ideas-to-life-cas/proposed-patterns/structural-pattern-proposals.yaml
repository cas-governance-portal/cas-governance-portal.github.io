- pattern_id: struct-001
  name: Typed Domain Model Validation via Pydantic
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/models.py (ResolutionResult, TraceableMetric, GovernanceInventory,
      GovernanceHealth, GovernanceThroughput, GovernanceRisks, ComplianceFinding,
      ComplianceMetrics, GovernanceException, GovernanceAction) - Declares declarative
      data structures defining the domain boundaries of governance assessments.
  description: Use of strongly typed, self-validating data structures to model core
    governance metrics, actions, and findings.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Ensure schema integrity, runtime validation, and clear serialization
    boundaries across internal domain entities.'
  - 'Context: Continuous governance evaluates disparate project metrics, structural
    health signals, and compliance findings which require deterministic data contracts.'
  - 'Force: Dynamic dictionary payloads lead to fragile parsing and silent runtime
    schema failures.'
  - 'Force: Manual type-checking bloats core business logic.'
  evidence_strength: high
  confidence: high
- pattern_id: struct-002
  name: Registry-Driven State Transition
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_engine.py (TransitionRegistry, GovernanceActionEngine)
      - Coordinates lifecycle transitions using an explicit transition registry.
  description: Registry pattern used to decouple state transition rules and governance
    action handlers from the action execution engine.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Allow extensible registration and dispatch of architectural state transitions
    without modifying central dispatch loops.'
  - 'Context: Governance actions transition through multiple stages (e.g., proposal,
    verification, convergence, exception handling) requiring flexible rules.'
  - 'Force: Monolithic conditional branching (`if-elif-else`) becomes fragile and
    hard to maintain.'
  - 'Force: Extending actions requires modifying existing control flows.'
  evidence_strength: high
  confidence: high
- pattern_id: struct-003
  name: Service Facade for Governance Operations
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_service.py (GovernanceActionService)
      - Encapsulates action resolution, policy coordination, and execution workflows.
  description: Coarse-grained service facade encapsulating complex domain engine interactions
    behind a single application-level interface.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Provide a simplified, unified entry point for CLI commands and runner
    flows to execute governance actions.'
  - 'Context: Executing governance actions requires orchestrating compliance checking,
    state transitions, model validation, and logging.'
  - 'Force: Clients should not need to instantiate and wire multiple low-level domain
    engines directly.'
  - 'Force: Direct domain coupling in CLI leads to code duplication across commands.'
  evidence_strength: high
  confidence: high
- pattern_id: struct-004
  name: Pluggable Infrastructure Adapter with Mock Fallback
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/llm/litellm_client.py (LiteLLMClient) - Production concrete adapter
      wrapping underlying library calls.
    - src/cas_runner/llm/mock_client.py (MockLLMClient) - Mock test-double adapter
      implementing identical interface for isolated environments.
  description: Abstracted client adapters providing uniform interfaces for external
    I/O integrations alongside in-memory mock implementations for isolated testing.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Decouple domain logic from remote infrastructure dependencies and enable
    offline unit/integration testing without network round-trips.'
  - 'Context: Components require integration with third-party APIs (such as LLM providers
    or external services) which are slow, rate-limited, and costly during local runs.'
  - 'Force: Direct coupling to remote API libraries inhibits deterministic automated
    testing.'
  - 'Force: Environment drift across development, CI, and production environments.'
  evidence_strength: high
  confidence: high
- pattern_id: struct-005
  name: Pure Functional Evaluation for Health Scoring
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/dashboard/health_model.py (HealthStatus, calculate_health, get_health_reasons)
      - Functional evaluation taking metrics and computing pure status enumerations
      and reason collections.
  description: Separating state calculation logic into pure, stateless functions operating
    over immutable status structures.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Eliminate side-effects during metric evaluation and simplify verification
    of composite health indicators.'
  - 'Context: Continuous architecture dashboards need to calculate health grades and
    explanatory failure reasons from dynamic repository inputs.'
  - 'Force: Embedding state and I/O into calculation models makes health assertions
    difficult to test.'
  - 'Force: Complex rule combinations create brittle status machines.'
  evidence_strength: high
  confidence: high
- pattern_id: pydantic-domain-entity-modeling
  name: Pydantic-Backed Typed Domain Entity Modeling
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-23'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/models.py (ResolutionResult, TraceableMetric, GovernanceInventory,
      GovernanceHealth, GovernanceRisks, ComplianceFinding, ComplianceMetrics, GovernanceException,
      GovernanceAction) - Defines core typed models for governance state, action results,
      and compliance metrics
    - src/cas_runner/steering/models.py (CapabilityRecord, CapabilitySet, CapabilityLineage,
      ArchitecturalDelta) - Models capability hierarchies and architectural deltas
      with explicit structural models
  description: Core continuous architecture entities, metrics, and actions are implemented
    as immutable/strongly-typed Pydantic models to guarantee invariant checking and
    boundary validation across layers.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Ensure that runtime governance entities such as GovernanceInventory,
    ComplianceMetrics, and CapabilityRecord are structurally valid and self-describing
    across execution stages.'
  - 'Context: Architectural governance consumes and produces heterogeneous schema
    data across file systems, CLI commands, and automated checks.'
  - 'Force: Loose JSON/YAML dictionaries cause runtime KeyError failures'
  - 'Force: Validation logic must remain coupled to entity definitions without polluting
    orchestration code'
  evidence_strength: high
  confidence: high
- pattern_id: transition-registry-state-machine
  name: Transition Registry State Machine Pattern
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-23'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_engine.py (TransitionRegistry, GovernanceActionEngine)
      - Encapsulates transition lookups and execution within a dedicated state engine
    - src/cas_runner/governance/governance_action_service.py (GovernanceActionService)
      - Delegates execution validation to GovernanceActionEngine
  description: Decouples lifecycle state transition definitions from execution engines
    by using an explicit registry that determines allowed transitions and validation
    gates.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Maintain deterministic architectural transition paths (e.g. proposed
    -> accepted -> superseded) without embedding monolithic conditional trees inside
    service classes.'
  - 'Context: Architectural governance decisions progress through multi-stage lifecycles
    that require compliance and validation hooks at each step.'
  - 'Force: Hard-coded if/else state machines become brittle as new governance stages
    are introduced'
  - 'Force: Action executions need decoupled pre-condition validations'
  evidence_strength: high
  confidence: high
- pattern_id: layered-service-engine-separation
  name: Layered Service-Engine Architectural Separation
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-23'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_service.py (GovernanceActionService)
      - Serves as orchestration boundary for governance actions
    - src/cas_runner/governance/compliance_engine.py (ComplianceEngine) - Performs
      pure compliance rule verification and metric aggregation
  description: Splits business governance logic into a Service facade coordinating
    workflows and an Engine implementing core mathematical and policy calculations.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Separate external invocation, orchestration, and parameter handling from
    underlying business compliance computation.'
  - 'Context: The runner needs to execute governance operations from CLI commands
    or CI workflows while keeping core calculation logic pure and testable.'
  - 'Force: Coupling service orchestration with low-level metric math hinders unit
    testability'
  - 'Force: Engines should not be concerned with workspace bootstrap or CLI parameter
    parsing'
  evidence_strength: high
  confidence: high
- pattern_id: file-backed-knowledge-repository
  name: File-Backed Knowledge Repository and Template Strategy
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-23'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - cas-knowledge/templates/architecture_decision_record_template.md - Standardized
      ADR template for GitOps governance
    - src/cas_runner/bootstrap.py (init_workspace, bootstrap) - Scaffolds and validates
      knowledge directory layout
  description: Stores organizational architectural decisions, governance rules, and
    signals in a version-controlled directory tree structured by scope (global vs
    project).
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Treat architecture documents, signals, rules, and decisions as first-class,
    Git-versioned assets rather than storing them in external opaque databases.'
  - 'Context: Continuous architecture relies on PR reviews, Git tracking, and transparent
    traceability of architecture evolution.'
  - 'Force: External databases disconnect architectural documentation from code commits'
  - 'Force: Human and automated agents must be able to read and modify architectural
    artifacts uniformly'
  evidence_strength: high
  confidence: high
- pattern_id: health-status-metric-aggregator
  name: Health Status Metric Aggregation Heuristic
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-23'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/dashboard/health_model.py (HealthStatus, calculate_health, get_health_reasons)
      - Aggregates compliance findings into health status classifications
  description: Evaluates architectural repository health via composite functional
    evaluation over compliance findings, yielding deterministic qualitative status
    states.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
