- pattern_id: pydantic-domain-entity-modeling
  name: Pydantic Domain Entity and Value Object Modeling
  pattern_classification: governance
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-26'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/models.py (GovernanceInventory, ComplianceFinding,
      GovernanceHealth, GovernanceAction) - Defines domain structures for tracking
      governance inventory, compliance findings, and health states.
    - src/cas_runner/steering/models.py (CapabilityRecord, CapabilityLineage, ArchitecturalDelta,
      GitChangeType) - Models capability tracking and architectural change diffs with
      typed attributes.
  description: Core governance and steering concepts are encapsulated using immutable
    and validated Pydantic data structures.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Ensure strong typing, schema validation, and safe data exchange across
    engine boundaries without coupled runtime behaviors.'
  - 'Context: Governance audits and architectural delta evaluations process disparate
    data formats from git histories and repository files.'
  - 'Force: Need for serializable models that integrate cleanly with JSON and YAML.'
  - 'Force: Requirement to catch malformed governance records early at the boundary.'
  - 'Force: Desire to keep domain entities free of execution side-effects.'
  evidence_strength: high
  confidence: high
