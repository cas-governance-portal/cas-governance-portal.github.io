- pattern_id: struct-001
  name: Typed Domain Model Validation via Pydantic
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/models.py (ResolutionResult, TraceableMetric, GovernanceInventory,
      GovernanceHealth, GovernanceThroughput, GovernanceRisks, ComplianceFinding,
      ComplianceMetrics, GovernanceException, GovernanceAction) - Declares declarative
      data structures defining the domain boundaries of governance assessments.
  description: Use of strongly typed, self-validating data structures to model core
    governance metrics, actions, and findings.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Ensure schema integrity, runtime validation, and clear serialization
    boundaries across internal domain entities.'
  - 'Context: Continuous governance evaluates disparate project metrics, structural
    health signals, and compliance findings which require deterministic data contracts.'
  - 'Force: Dynamic dictionary payloads lead to fragile parsing and silent runtime
    schema failures.'
  - 'Force: Manual type-checking bloats core business logic.'
  evidence_strength: high
  confidence: high
- pattern_id: struct-002
  name: Registry-Driven State Transition
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_engine.py (TransitionRegistry, GovernanceActionEngine)
      - Coordinates lifecycle transitions using an explicit transition registry.
  description: Registry pattern used to decouple state transition rules and governance
    action handlers from the action execution engine.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Allow extensible registration and dispatch of architectural state transitions
    without modifying central dispatch loops.'
  - 'Context: Governance actions transition through multiple stages (e.g., proposal,
    verification, convergence, exception handling) requiring flexible rules.'
  - 'Force: Monolithic conditional branching (`if-elif-else`) becomes fragile and
    hard to maintain.'
  - 'Force: Extending actions requires modifying existing control flows.'
  evidence_strength: high
  confidence: high
