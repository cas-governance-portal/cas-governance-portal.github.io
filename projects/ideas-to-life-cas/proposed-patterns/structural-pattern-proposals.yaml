- pattern_id: declarative-transition-registry
  name: Declarative Transition Registry and Action Engine
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-26'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_engine.py (TransitionRegistry, GovernanceActionEngine)
      - Houses the registry defining state transitions and the engine that executes
      verified governance actions.
  description: Encapsulates valid lifecycle transitions and actionable governance
    tasks within a centralized Transition Registry and execution engine.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Prevent invalid status transitions of governance entities and provide
