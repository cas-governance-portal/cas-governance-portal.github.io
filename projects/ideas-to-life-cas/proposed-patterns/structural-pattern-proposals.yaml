- pattern_id: struct-001
  name: Typed Domain Model Validation via Pydantic
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/models.py (ResolutionResult, TraceableMetric, GovernanceInventory,
      GovernanceHealth, GovernanceThroughput, GovernanceRisks, ComplianceFinding,
      ComplianceMetrics, GovernanceException, GovernanceAction) - Declares declarative
      data structures defining the domain boundaries of governance assessments.
  description: Use of strongly typed, self-validating data structures to model core
    governance metrics, actions, and findings.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Ensure schema integrity, runtime validation, and clear serialization
    boundaries across internal domain entities.'
  - 'Context: Continuous governance evaluates disparate project metrics, structural
    health signals, and compliance findings which require deterministic data contracts.'
  - 'Force: Dynamic dictionary payloads lead to fragile parsing and silent runtime
    schema failures.'
  - 'Force: Manual type-checking bloats core business logic.'
  evidence_strength: high
  confidence: high
- pattern_id: struct-002
  name: Registry-Driven State Transition
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_engine.py (TransitionRegistry, GovernanceActionEngine)
      - Coordinates lifecycle transitions using an explicit transition registry.
  description: Registry pattern used to decouple state transition rules and governance
    action handlers from the action execution engine.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Allow extensible registration and dispatch of architectural state transitions
    without modifying central dispatch loops.'
  - 'Context: Governance actions transition through multiple stages (e.g., proposal,
    verification, convergence, exception handling) requiring flexible rules.'
  - 'Force: Monolithic conditional branching (`if-elif-else`) becomes fragile and
    hard to maintain.'
  - 'Force: Extending actions requires modifying existing control flows.'
  evidence_strength: high
  confidence: high
- pattern_id: struct-003
  name: Service Facade for Governance Operations
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_service.py (GovernanceActionService)
      - Encapsulates action resolution, policy coordination, and execution workflows.
  description: Coarse-grained service facade encapsulating complex domain engine interactions
    behind a single application-level interface.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Provide a simplified, unified entry point for CLI commands and runner
    flows to execute governance actions.'
  - 'Context: Executing governance actions requires orchestrating compliance checking,
    state transitions, model validation, and logging.'
  - 'Force: Clients should not need to instantiate and wire multiple low-level domain
    engines directly.'
  - 'Force: Direct domain coupling in CLI leads to code duplication across commands.'
  evidence_strength: high
  confidence: high
- pattern_id: struct-004
  name: Pluggable Infrastructure Adapter with Mock Fallback
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/llm/litellm_client.py (LiteLLMClient) - Production concrete adapter
      wrapping underlying library calls.
    - src/cas_runner/llm/mock_client.py (MockLLMClient) - Mock test-double adapter
      implementing identical interface for isolated environments.
  description: Abstracted client adapters providing uniform interfaces for external
    I/O integrations alongside in-memory mock implementations for isolated testing.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Decouple domain logic from remote infrastructure dependencies and enable
    offline unit/integration testing without network round-trips.'
  - 'Context: Components require integration with third-party APIs (such as LLM providers
    or external services) which are slow, rate-limited, and costly during local runs.'
  - 'Force: Direct coupling to remote API libraries inhibits deterministic automated
    testing.'
  - 'Force: Environment drift across development, CI, and production environments.'
  evidence_strength: high
  confidence: high
- pattern_id: struct-005
  name: Pure Functional Evaluation for Health Scoring
  pattern_classification: architectural
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/dashboard/health_model.py (HealthStatus, calculate_health, get_health_reasons)
      - Functional evaluation taking metrics and computing pure status enumerations
      and reason collections.
  description: Separating state calculation logic into pure, stateless functions operating
    over immutable status structures.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Eliminate side-effects during metric evaluation and simplify verification
    of composite health indicators.'
  - 'Context: Continuous architecture dashboards need to calculate health grades and
    explanatory failure reasons from dynamic repository inputs.'
  - 'Force: Embedding state and I/O into calculation models makes health assertions
    difficult to test.'
  - 'Force: Complex rule combinations create brittle status machines.'
  evidence_strength: high
  confidence: high
