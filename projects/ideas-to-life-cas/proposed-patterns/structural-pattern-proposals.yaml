      - TransitionRegistry governs state validity while GovernanceActionEngine coordinates
      transition execution.
  description: Encapsulate legal domain state transitions and execution actions within
    an explicit transition registry table.
  pattern_type: emerging
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Decouple lifecycle state transitions from action execution logic, ensuring
    only valid promotion and deprecation steps occur.'
  - 'Context: Architectural artifacts (e.g., heuristics, rules, ADRs) progress through
    lifecycle stages (proposed, accepted, deprecated) and require strict validation
    before state changes.'
  - 'Force: Need to avoid hardcoded if-else ladders across action execution flows.'
  - 'Force: Must enforce invariant checks prior to mutating an architectural artifact''s
    lifecycle state.'
  evidence_strength: high
  confidence: high
