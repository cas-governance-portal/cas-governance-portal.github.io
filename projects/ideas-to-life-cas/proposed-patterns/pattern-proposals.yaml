- pattern_id: signal-pattern-proposal-arch-knowledge-provider-abstraction-20261107
  name: Knowledge Provider Abstraction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - KnowledgeProvider interface in current architecture state defines a comprehensive
      abstraction for knowledge access
    - Architecture Work 'Knowledge Provider Abstraction' is marked DONE as a refactor
    - AEM evolution map lists Knowledge Provider Abstraction as DONE with high confidence
    - Dependency in current state from FlowRunner to LocalKnowledgeProvider
    architecture_work:
