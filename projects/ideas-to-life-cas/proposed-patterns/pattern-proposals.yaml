- pattern_id: pattern-proposal-aw-lifecycle-enforcement
  name: Architecture Work Lifecycle Enforcement
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Architecture work marked done without ADR
    - AEM stage inconsistent with decision status
    - Proposed items without progression
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-ideas-to-life-cas-20260605-01
    - aw-ideas-to-life-cas-20260605-06
    supporting_evidence:
    - alignment_findings
    - current_architecture_state
  description: A governance pattern ensuring that architectural decisions are only
    considered complete after an accepted ADR exists, and that architecture evolution
    maps derive stage labels exclusively from accepted decision status. This prevents
    premature closure and stage ambiguity.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  rationale:
  - Addresses recurring issue of done items without ADRs
  - Ensures reliable stage derivation in AEM
  evidence_strength: high
  confidence: high
