    supporting_evidence:
    - current_architecture_state
    - aem
  description: A pattern that decouples workflows from repository structure by defining
    a stable KnowledgeProvider interface. Workflows interact with the abstraction,
    not the concrete storage implementation, enabling swap-ability of knowledge backends
    (local filesystem, future graph, external systems).
  pattern_type: implemented
  applies_to:
  - governance
  - execution
  - intelligence
  - contracts
  rationale:
  - The abstraction is visibly implemented in code (KnowledgeProvider interface, LocalKnowledgeProvider)
    and cited as a foundational decision in the AEM.
  - It addresses the recurring need to keep workflows agnostic of storage mechanisms,
    enabling future integration of external knowledge sources and graph-based repositories.
  evidence_strength: high
  confidence: high
  pattern_classification: architectural
  pattern_maturity: established
