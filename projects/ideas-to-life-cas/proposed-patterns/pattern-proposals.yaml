- pattern_id: pattern-proposal-business-intent-integration
  name: Business Intent Integration and Traceability
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Business intent as governance input
    - Traceability from business to architecture and code
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
    - aem
  description: A strategic direction to incorporate business intent (requirements,
    business cases, portfolio definitions) as first-class architecture knowledge,
    enabling traceability from business drivers through ADRs, patterns, and code.
    This pattern addresses the recurring gap between high-level business vision and
    architectural execution by defining a business-intent model, ingestion workflow,
    and traceability contracts.
  pattern_type: future_direction
  applies_to:
  - governance
  - intelligence
  - automation
  rationale:
  - Multiple architecture work items and vision artifacts repeatedly call for connecting
    business intent to architectural decisions and implementation.
  - Alignment findings highlight the absence of business intent linkage as a critical
    gap preventing strategic alignment and drift detection.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-proposal-code-intelligence
  name: Code Intelligence and Architecture Alignment
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Need for code structure understanding
    - Automated drift detection between intent and implementation
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-007
    supporting_evidence:
    - current_architecture_state
    - aem
    - alignment_findings
  description: A strategic direction to move beyond pattern extraction toward a comprehensive
    code intelligence capability that understands codebase structure, boundaries,
    and dependencies, and maps implementation evidence to architecture intent. This
    will enable continuous alignment checks, drift detection, and fit/gap analysis,
    grounding AID and AEM claims in actual code reality.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - automation
  - governance
  rationale:
  - The vision and architecture work repeatedly identify code understanding as foundational
    for closing the loop between intended architecture and implementation reality.
  - Alignment findings specifically call for a code intelligence layer to improve
    drift prevention and detection.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-proposal-architecture-knowledge-graph
