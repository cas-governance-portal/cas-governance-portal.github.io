- pattern_id: pattern-proposal-business-intent-traceability
  name: Business Intent Traceability
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Connecting Business Intent to Code Reality
    - Strategic Drift Detection
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    supporting_evidence:
    - alignment-report-ideas-to-life-cas-2026-09-26-1
    - aem-ideas-to-life-cas-2026-09-26
  description: Formalizes structured business intent artifacts as first-class constraints
    in the architectural reasoning loop, providing end-to-end evidence traceability
    from strategic objectives to ADRs and code implementation.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  - intelligence
  rationale:
  - Without formal business intent ingestion, architectural governance focuses only
    on technical consistency rather than strategic alignment.
  - Enables automated detection of strategic drift between declared business vision
    and delivered codebase reality.
  evidence_strength: high
  confidence: high
