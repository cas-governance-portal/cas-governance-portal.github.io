- pattern_id: pattern-pattern-governance-lifecycle
  name: Pattern Governance Lifecycle
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Pattern promotion workflow
    - Emerging patterns with undefined governance
    architecture_work:
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
    - architecture_evolution_map
  description: Formalize the lifecycle of patterns from proposal to promotion with
    explicit ADR-backed governance status (accepted, rejected, deferred).
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  rationale:
  - Ensure all patterns have clear governance status and traceability.
  - Prevent undefined pattern states (conditional/pending) from lingering.
  - Institutionalize the proposal-to-decision-to-acceptance path.
  evidence_strength: high
  confidence: high
