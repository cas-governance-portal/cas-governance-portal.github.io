- pattern_id: pattern-architecture-work-registry
  name: Architecture Work Registry
  pattern_classification: architectural
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Architecture Work as authoritative architectural backlog
    - Governance Artifacts Prefer Derived State
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    supporting_evidence:
    - current_architecture_state
    - architecture_work
  description: A pattern where Architecture Work artifacts serve as the authoritative
    backlog for architectural changes, while generated artifacts like the Architecture
    Evolution Map (AEM) become derived summaries. This separates planning state from
    generated views, ensuring governance is traceable and changes are not lost during
    regeneration.
  pattern_type: implemented
  applies_to:
  - governance
  - intelligence
  rationale:
  - Avoids information loss due to artifact regeneration
  - Provides a stable, authoritative source for architecture planning and decision-making
  evidence_strength: high
  confidence: high
- pattern_id: pattern-knowledge-provider-abstraction
  name: Knowledge Provider Abstraction
  pattern_classification: architectural
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Knowledge Access Abstraction
    - Knowledge provider abstraction to decouple workflows
    architecture_work:
    - aw-ideas-to-life-cas-20260605-03
    supporting_evidence:
    - current_architecture_state
    - architecture_work
  description: A pattern that decouples workflows from repository structure by introducing
    a Knowledge Provider abstraction. This allows different storage backends (local
    filesystem, external systems) to be used without impacting workflow logic, enabling
    portability and testability.
  pattern_type: implemented
  applies_to:
  - architecture
  - execution
  rationale:
  - Workflows remain independent of storage implementation details
  - Enables swapping knowledge sources without workflow changes
  evidence_strength: high
  confidence: high
- pattern_id: pattern-flowrunner-orchestration
  name: FlowRunner Orchestration
  pattern_classification: execution
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - workflow execution model
    - runtime-native workflows
    architecture_work:
    - aw-ideas-to-life-cas-20260605-04
    - aw-ideas-to-life-cas-20260605-06
    supporting_evidence:
    - current_architecture_state
  description: A pattern for orchestrating multi-step architecture workflows, separating
    the runtime orchestration (FlowRunner) from the reasoning performed by individual
    workflows. This enables deterministic execution, telemetry, and reuse across different
    architecture tasks.
  pattern_type: implemented
  applies_to:
  - execution
  - automation
  rationale:
  - Standardizes workflow execution and promotes consistency
  - Separates orchestration concerns from business logic
  evidence_strength: high
  confidence: high
- pattern_id: pattern-continuous-governance-loop
  name: Continuous Governance Loop
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Automated Detect-Analyse-Execute loop
    - Continuous architecture governance runtime
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    supporting_evidence:
    - current_architecture_state
    - architecture_work
    - alignment_findings
  description: 'A pattern for automating the governance lifecycle: Detect -> Analyse
    -> Plan -> Execute -> Publish -> Observe. This moves governance from manual, periodic
    review to a continuously operating loop that detects drift, analyzes impact, and
    proposes or executes remediation, reducing manual bottleneck and improving architecture
    freshness.'
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  rationale:
  - Reduces governance velocity bottleneck (manual review is 15:1)
  - Provides real-time drift detection and automated response
  evidence_strength: high
  confidence: high
- pattern_id: pattern-business-intent-integration
  name: Business Intent Integration
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Business intent integration and traceability
    - Business intent as a formal artifact
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    supporting_evidence:
    - architecture_work
    - aem
  description: A pattern to formally integrate business intent (strategic objectives,
    business requirements) into the architecture governance loop. It defines a schema
    for business intent artifacts and mandates them as inputs to the alignment engine,
    enabling traceability from code to business value and automated detection of strategic
    drift.
  pattern_type: future_direction
  applies_to:
  - governance
  - intelligence
  rationale:
  - Anchors architecture decisions in business drivers
  - Enables traceability from business goals to code, improving governance relevance
  evidence_strength: high
  confidence: high
- pattern_id: pattern-code-intelligence
  name: Code Intelligence
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Code intelligence and architecture alignment
    - Move from pattern extraction to full code understanding
    - map implementation evidence to patterns
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-007
    supporting_evidence:
    - architecture_work
    - aem
  description: A pattern for understanding codebase structure and aligning it with
    intended architecture. It involves representing code structure as governed architecture
    evidence, detecting boundaries and dependencies, and comparing code reality against
    AID, ADRs, and governing patterns to identify drift and guide refactoring.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - governance
  rationale:
  - Closes the loop between architecture intent and implementation reality
  - Enables early drift detection and evidence-based governance
  evidence_strength: high
  confidence: high
