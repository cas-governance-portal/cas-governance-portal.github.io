- pattern_id: pattern-authoritative-architecture-work-registry
  name: Authoritative Architecture Work Registry
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Architecture Work as authoritative backlog
    - Governance artifacts prefer derived state
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
    - architecture_evolution_map
  description: Establish Architecture Work as the single authoritative source for
    architectural planning state, ensuring all derived artifacts summarize from it.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  - contracts
  rationale:
  - Prevent regeneration from discarding manually introduced planning information.
  - Ensure derived artifacts (AEM, AID) reflect a single source of truth.
  - Enable traceability from architectural decisions to implementation.
  evidence_strength: high
  confidence: high
