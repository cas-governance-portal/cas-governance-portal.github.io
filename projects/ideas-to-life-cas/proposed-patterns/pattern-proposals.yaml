- pattern_id: pattern-continuous-governance-loop
  name: Continuous Governance Loop
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Automated Detect-Analyse-Execute loop for governance
    - Operational Intelligence Loop for ReasoningOps and GovernanceOps
    - Continuous Architecture Governance Runtime
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-2026-05-31-008
    - aw-ideas-to-life-cas-20260605-07
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
    - aem_emerging_patterns
  description: The Continuous Governance Loop pattern establishes a closed-loop, automated
    governance cycle that continuously detects architectural drift, analyses its impact,
    plans remediation, executes approved actions, and observes outcomes. It moves
    governance from periodic manual review to ongoing, automated participation in
    delivery, while keeping human approval authoritative for breaking changes.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  - intelligence
  rationale:
  - The recurring need to automate the detect-analyse-execute cycle to keep governance
    velocity (15:1 ratio) from becoming a bottleneck
  - The repeated emphasis in architecture work and vision on reducing manual governance
    effort and enabling real-time drift detection
  - The need to route operational signals into architecture intelligence and prioritised
    work without human intervention for non-breaking drift
  evidence_strength: high
  confidence: high
- pattern_id: pattern-business-intent-integration
  name: Business Intent Integration
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Business Intent Integration and Traceability (vision)
    - Strategic alignment between business and architecture
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    supporting_evidence:
    - current_architecture_state
    - aem_evolution_map
  description: Business Intent Integration is an architectural pattern that ingests
    business requirements, goals, and strategic objectives into the architecture knowledge
    model, allowing end-to-end traceability from business drivers to architectural
    decisions, patterns, and implementation evidence. It ensures architecture governance
    is anchored in strategic business value, enabling impact analysis and prioritisation
    based on business impact.
  pattern_type: future_direction
  applies_to:
  - architecture
  - governance
  - intelligence
  rationale:
  - The vision explicitly calls for connecting business intent to architecture and
    code, and current architecture lacks a first-class business intent model
  - Multiple work items propose formalising a Business Intent artifact and integrating
    it as a mandatory input for alignment
  - Without this pattern, governance remains focused on technical consistency rather
    than strategic business alignment
  evidence_strength: high
  confidence: medium
- pattern_id: pattern-code-intelligence-alignment
  name: Code Intelligence and Architecture Alignment
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Code Intelligence and Architecture Alignment (vision)
    - Need for AID-vs-code comparison and drift detection
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-007
    supporting_evidence:
    - current_architecture_state
    - aem_evolution_map
  description: Code Intelligence and Architecture Alignment is an intelligence pattern
    that transforms repository structure and code implementation into governed architecture
    evidence. It enables continuous comparison between intended architecture (AID,
    ADRs, patterns) and actual code, detecting architectural drift, boundaries, and
    dependencies, and feeding findings back into Architecture Work and CI validation
    signals.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - automation
  - governance
  rationale:
  - The recurring emphasis on understanding codebase structure and mapping it to architecture
    intent is present across vision and architecture work
  - It is essential for closing the loop between architecture decisions and implementation
    reality, grounding AID/AEM claims in evidence
  - The pattern supports both preventive and detective control roles, improving governance
    and operational delivery
  evidence_strength: medium
  confidence: medium
