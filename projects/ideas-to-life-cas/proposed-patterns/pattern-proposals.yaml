- pattern_id: pat-business-intent-integration
  name: Business Intent Integration
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Business Intent Traceability
    - Strategic Alignment
    - Vision-to-Architecture Connection
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    - aw-ideas-to-life-cas-20260605-08
    supporting_evidence:
    - current_architecture_state
    - aem
    - vision_artifacts
  description: Establish a governed capability to model, ingest, and trace business
    intent (requirements, strategic objectives, business cases) through the architecture
    knowledge base, linking business drivers to ADRs, patterns, architecture work,
    and implementation evidence. This enables end-to-end traceability from business
    value to code and supports strategic alignment validation.
  pattern_type: future_direction
  applies_to:
  - governance
  - intelligence
  - execution
  rationale:
  - Business intent currently remains implicit in vision documents and architecture
    work, preventing automated alignment checks and strategic impact analysis.
  - Recurring requests across multiple architecture work items and the vision call
    for a formal business intent model and ingestion workflow to anchor architectural
    decisions in business value.
  evidence_strength: high
  confidence: high
- pattern_id: pat-code-intelligence
  name: Code Intelligence and Architecture Alignment
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Code Structure Analysis
    - Architectural Drift Detection
    - Implementation Evidence Mapping
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-007
    - aw-ideas-to-life-cas-2026-06-06-001
    supporting_evidence:
    - current_architecture_state
    - aem
    - alignment_findings
  description: 'Develop a governed code intelligence capability that translates repository
    structure into architecture evidence: identify boundaries, dependencies, and implementational
    deviations from AID, ADRs, and patterns. This closes the loop between intended
    architecture and implementation reality, enabling preventive and detective drift
    control.'
  pattern_type: future_direction
  applies_to:
  - governance
  - intelligence
  - automation
  rationale:
  - The architecture needs to understand codebase structure to ground alignment claims
    and detect drift before it becomes costly.
  - Multiple vision and architecture work items emphasize moving from pattern extraction
    to full code understanding for continuous architecture validation.
  evidence_strength: high
  confidence: high
