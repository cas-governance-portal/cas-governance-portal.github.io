- pattern_id: pattern-governance-action-framework
  name: Governance Action Framework
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Governance Action Framework design
    - Promotion decision capture
    - promotion-to-decision-records
    architecture_work:
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - current_architecture_state
    - architecture_work
  description: A pattern for formalizing governance state changes, such as pattern
    promotion, ADR approval, or decision capture. It defines a finite-state machine
    with actions (approve, reject, defer) and a clear workflow from proposal to promotion
    to decision, enabling automation and traceability of governance decisions.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  rationale:
  - Addresses the gap in human approval automation
  - Ensures clear, auditable governance state transitions
  evidence_strength: medium
  confidence: medium
