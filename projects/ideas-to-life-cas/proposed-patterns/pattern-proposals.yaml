    supporting_evidence:
    - cas-future-vision
    - aem-ideas-to-life-cas-2026-11-18
  description: Establishes formal, machine-traceable links between high-level business
    drivers, requirements, ADRs, patterns, and implementation code artifacts.
  pattern_type: future_direction
  applies_to:
