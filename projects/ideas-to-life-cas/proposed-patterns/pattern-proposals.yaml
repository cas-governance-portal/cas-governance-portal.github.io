- pattern_id: pattern-architecture-work-registry
  name: Architecture Work Registry as Authoritative Backlog
  pattern_classification: governance
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Regenerated Artifacts Should Not Own Planning State
    - Governance Artifacts Prefer Derived State
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    supporting_evidence:
    - aem-ideas-to-life-cas-2026-09-23-01
    - alignment-report-ideas-to-life-cas-2026-09-23-1
  description: Establishes persistent Architecture Work artifacts as the authoritative
    planning backlog, while downstream maps and summaries (such as AEM) act as derived,
    reproducible projections.
  pattern_type: implemented
  applies_to:
  - governance
  - contracts
  rationale:
  - Information repeatedly lost through automated artifact regeneration must be persisted
    in authoritative source artifacts rather than derived views.
  - Decouples long-term architectural planning state from volatile downstream synthesis
    runs.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-automated-detect-analyse-execute-loop
  name: Automated Detect-Analyse-Execute Governance Loop
  pattern_classification: execution
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Automated Remediation
    - Continuous Architecture Governance Runtime
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - cas-arch-state-ideas-to-life-cas-2026-09-20
    - aem-ideas-to-life-cas-2026-09-23-01
  description: 'Automates the continuous architectural governance lifecycle through
    trigger-based CI/CD workflows: detecting drift, executing analysis, and orchestrating
    remediation without manual intervention for non-breaking changes.'
