- pattern_id: pattern-proposal-code-intelligence-alignment
  name: Continuous Code Intelligence and Empirical Drift Prevention
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Continuous Code-to-Intent Drift Detection
    - Empirical Ground-Truth AST Alignment
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-007
    - aw-ideas-to-life-cas-2026-05-31-005
    supporting_evidence:
    - cas-arch-state-ideas-to-life-cas-2026-09-20
    - alignment-report-ideas-to-life-cas-2026-09-26-1
  description: Translates codebase AST structure into empirical architecture evidence
    and compares it against Architecture Intent Documents (AID) and ADRs during CI
    execution to detect and prevent architectural boundary violations before merge.
  pattern_type: future_direction
  applies_to:
  - governance
  - automation
  - intelligence
  rationale:
  - Documentation-only architecture models drift rapidly when implementation reality
    is not verified automatically in delivery pipelines.
  - Grounds intent claims in AST-derived empirical facts, closing the gap between
    architectural intent and actual code dependencies.
  evidence_strength: high
  confidence: high
