  confidence: medium
- pattern_id: pattern-proposal-continuous-governance-runtime
  name: Continuous Governance Runtime
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Need for automated governance loop
    - Detect-Analyse-Plan-Execute-Publish-Observe lifecycle
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    supporting_evidence:
    - current_architecture_state
    - aem
    - alignment_findings
  description: 'An emerging governance pattern to automate the continuous architecture
    governance lifecycle: detection of drift and architecture change, analysis of
    impact, planning of remediation, execution of governance actions, publication
    of results, and observation of outcomes. This addresses the manual governance
    bottleneck and ensures intelligence freshness by integrating with CI/CD pipelines
    and the Architecture Work Registry.'
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  - execution
  rationale:
  - Multiple architecture work items propose moving from manual governance to a runtime-native,
    closed-loop system.
  - Alignment findings emphasize that manual review is a bottleneck and that automated
    governance is required for scalability.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-proposal-external-ecosystem-ingestion
  name: External Ecosystem and Ingestion Framework
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Integration with enterprise architecture tools
    - Plugin-based ingestion for external artifacts
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-009
    supporting_evidence:
    - current_architecture_state
    - aem
  description: A strategic direction to define a plugin or provider-based ingestion
    framework that allows CAS to consume and synchronize architecture knowledge from
    external systems (e.g., EA tools, knowledge platforms, CI/CD pipelines) following
    a standard contract. This ensures external evidence can become governed Architecture
    Work, ADRs, patterns, and maps while preserving provenance and governance rules.
  pattern_type: future_direction
  applies_to:
  - automation
  - governance
  - intelligence
  rationale:
  - The vision and architecture work repeatedly call for integration with external
    systems to prevent CAS from being repository-local.
  - External ecosystem integration is a recurring theme in the AEM and future roadmap.
  evidence_strength: medium
  confidence: medium
- pattern_id: pattern-proposal-authoritative-source-derivation
  name: Authoritative Source Derivation
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Governance artifacts must be derived from authoritative registries
    - Prevent divergence between AEM and Architecture Work Registry
    architecture_work: []
    supporting_evidence:
    - alignment_findings
  description: An emerging governance pattern to ensure that all generated governance
    artifacts (e.g., AEM, AID) are derived solely from authoritative sources such
    as the Architecture Work Registry and accepted ADRs. This prevents inconsistencies
    like items marked 'DONE' without accepted decisions, and ensures decision summaries
    accurately reflect the registry. The pattern also includes enforcing structured
    decision schemas for automated traceability.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  - automation
  rationale:
  - Alignment findings identify critical inconsistencies where AEM items are not backed
    by accepted decisions and decision records are not persisted in a structured manner.
  - The principle 'system proposes, architect decides' requires clear separation between
    source state and derived artifacts.
  evidence_strength: high
  confidence: high
