- pattern_id: pattern-decision-persistence-enforcement
  name: Decision Persistence Enforcement
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - ADRs missing for completed decisions
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-ideas-to-life-cas-2026-11-11-1
    supporting_evidence:
    - alignment_findings
    - aem
  description: Ensure that all architectural decisions marked as complete have corresponding
    accepted Architecture Decision Records (ADRs) to maintain governance traceability
    and single source of truth.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  rationale:
  - Completed decisions without ADRs break traceability and violate the ADR single-source-of-truth
    rule.
  - Recurring violation in current architecture state across multiple DONE items.
  evidence_strength: high
  confidence: high
