- pattern_id: authoritative-architecture-work-backlog
  name: Authoritative Architecture Work Backlog
  pattern_classification: governance
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Regenerated Artifacts Should Not Own Planning State
    - Governance Artifacts Prefer Derived State
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-discovery-ideas-to-life-cas-1
    supporting_evidence:
    - current_architecture_state
    - aem-ideas-to-life-cas-2026-11-16
  description: Architectural changes and evolution state are maintained within persistent,
    authoritative source records (Architecture Work) while downstream summaries such
    as Architecture Evolution Maps and status dashboards are generated strictly as
    non-authoritative read models.
  pattern_type: implemented
  applies_to:
  - governance
  - intelligence
  rationale:
  - Prevents the loss of manual architectural planning context during automated artifact
    regeneration cycles.
  - Separates persistent backlog ownership from dynamic, derived visualization and
    alignment reporting.
  evidence_strength: high
  confidence: high
