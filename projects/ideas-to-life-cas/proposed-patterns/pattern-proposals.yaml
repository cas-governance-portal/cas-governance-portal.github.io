- pattern_id: pattern-continuous-governance-loop
  name: Continuous Governance Detect-Analyse-Execute Loop
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Continuous Architecture Governance Runtime
    - Automated Remediation Signals
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - cas-arch-state-ideas-to-life-cas-2026-09-20
    - alignment-report-ideas-to-life-cas-2026-09-26-1
    - aem-ideas-to-life-cas-2026-09-26
  description: An automated closed-loop governance cycle (Detect -> Analyse -> Plan
    -> Execute -> Observe) that continuously identifies architectural drift, evaluates
    impact, and proposes structured remediation through CI/CD pipelines.
  pattern_type: emerging
  applies_to:
  - governance
  - execution
  - automation
  rationale:
  - Resolves the governance velocity bottleneck caused by periodic manual review cycles.
  - Prevents architectural drift by actively feeding delivery telemetry into continuous
    evaluation and auto-generating proposed Architecture Work.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-proposal-only-steering-projection
  name: Proposal-Only Steering Projection
  pattern_classification: execution
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Proposal-only projection generation
    - Isolated steering branch synchronisation
    architecture_work:
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - flow:workflow:github:cas-build-steering-projection
    - flow:workflow:github:cas-managed-steering-sync
  description: Decouples steering projection generation from execution by generating
    read-only projection artefacts in CI and routing managed markdown updates strictly
    through automated pull request branches.
  pattern_type: implemented
  applies_to:
  - execution
  - governance
  - contracts
  rationale:
  - Guarantees that automated projections cannot overwrite authoritative root steering
    documents unexpectedly.
  - Preserves human review authority by requiring PR review before merging managed
    sections.
  evidence_strength: high
  confidence: high
