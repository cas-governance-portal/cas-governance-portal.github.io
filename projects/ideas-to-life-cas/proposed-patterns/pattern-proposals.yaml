    - aw-ideas-to-life-cas-20260605-10
    - aw-ideas-to-life-cas-2026-05-31-010
    supporting_evidence:
    - cas-arch-state-ideas-to-life-cas-2026-09-20
    - aem-ideas-to-life-cas-2026-09-23-01
  description: Unified graph-based knowledge model defining explicit node schemas
    and multi-hop relationship edges across Decisions, Patterns, Signals, and Code
    Artefacts.
  pattern_type: future_direction
