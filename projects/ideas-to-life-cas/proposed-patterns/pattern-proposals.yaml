- pattern_id: pattern-auto-governance-loop
  name: Automated Governance Loop
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Continuous governance automation
    - Detect-Analyse-Execute loop
    - Operational intelligence feedback
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    - aw-ideas-to-life-cas-2026-05-31-008
    supporting_evidence:
    - architectural_state
    - alignment_findings
    - aem
  description: An automated governance loop that detects architectural drift, analyzes
    impact using reasoning models, and executes or proposes remediation actions without
    manual intervention for non-breaking changes. This turns governance from periodic
    review into a continuous, embedded operational capability.
  pattern_type: future_direction
  applies_to:
  - governance
  - automation
  - execution
  rationale:
  - Manual governance review creates a velocity bottleneck (evidenced by 15:1 ratio)
    and delays drift detection.
  - Recurring architecture work items propose automation of detect-analyse-execute
    phases, indicating a systemic need for continuous governance.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-architecture-intelligence-layer
  name: Architecture Intelligence Layer
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Architecture knowledge graph
    - Interactive intelligence maps
    - Portfolio intelligence and cross-project learning
    architecture_work:
    - aw-ideas-to-life-cas-20260605-08
    - aw-ideas-to-life-cas-20260605-09
    - aw-ideas-to-life-cas-20260605-10
    - aw-ideas-to-life-cas-2026-05-31-010
    supporting_evidence:
    - architectural_state
    - aem
  description: A unified intelligence layer that normalizes architectural knowledge
    into a graph-enabled model, enabling interactive exploration, cross-project impact
    analysis, temporal evolution timelines, and complex queries across decisions,
    patterns, code, and business intent.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - automation
  - governance
  rationale:
  - Multiple work items and vision documents repeatedly call for connecting architecture
    artifacts into an explorable, queryable graph.
  - Current document-centric navigation fails to support multi-hop lineage and cross-project
    analysis.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-business-intent-traceability
  name: Business Intent Traceability
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Business intent integration
    - Requirements traceability to architecture
    - Strategic drift detection
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    supporting_evidence:
    - architectural_state
    - alignment_findings
  description: A formal mechanism to ingest business intent (requirements, business
    cases, strategic objectives) and trace it through architecture decisions, patterns,
    and code, enabling strategic alignment and automated detection of architectural
    drift against business goals.
  pattern_type: future_direction
  applies_to:
  - governance
  - intelligence
  - architecture
  rationale:
  - Vision and architecture work consistently emphasize connecting business intent
    to code reality.
  - Without this, governance remains technically focused and cannot prioritize based
    on business impact.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-code-intelligence-alignment
  name: Code Intelligence and Architecture Alignment
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Code structural analysis
    - Architecture drift detection
    - AID-vs-code comparison
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-007
    supporting_evidence:
    - architectural_state
    - alignment_findings
  description: A capability that deeply understands codebase structure, maps implementation
    evidence to architecture intent, and continuously compares intended architecture
    (AID, ADRs, patterns) with code reality to detect drift early and enable evidence-backed
    governance.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - governance
  - automation
  rationale:
  - Recurring need to close the loop between architecture intent and implementation
    reality.
  - Alignment findings highlight drift and ungoverned implementation items, indicating
    a gap in code-level intelligence.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-governance-registry-integrity
  name: Governance Registry Integrity
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Dummy placeholder entries in architecture registry
    - Inconsistent stage derivation from decision status
    - Duplicate architecture work items
    architecture_work: []
    supporting_evidence:
    - alignment_findings
    - aem
  description: 'A set of validation and enforcement rules that ensure the architecture
    backlog remains clean, consistent, and traceable: rejecting placeholder or dummy
    entries, enforcing strict mapping from decision status to lifecycle stage, and
    deduplicating canonical work items.'
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  - contracts
  rationale:
  - Critical alignment findings show governance data quality issues (dummy items,
    inconsistent stages, duplicates) that erode trust in the backlog.
  - Recurring need for deterministic derivation and automated validation to maintain
    an authoritative architecture registry.
  evidence_strength: medium
  confidence: medium
