- pattern_id: pattern-continuous-governance-automation
  name: Continuous Governance Automation
  pattern_classification: governance
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - automated_detect_analyse_execute_loop
    - continuous_architecture_governance_runtime
    - governance_velocity_bottleneck
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    - aw-ideas-to-life-cas-2026-06-14-1
    supporting_evidence:
    - alignment_findings
    - architecture_evolution_map
  description: The recurring pattern of automating governance detection, analysis,
    and execution loops to replace manual review cycles with continuous, runtime-native
    governance. The system transitions from periodic alignment reports to a closed
    loop that detects drift, analyses impact, and proposes or executes remediation
    without human intervention for non-breaking changes.
  pattern_type: future_direction
  applies_to:
  - governance
  - automation
  - workflow
  rationale:
  - Multiple architecture work items and the AEM highlight a governance velocity bottleneck
    requiring automation.
  - Recurring alignment findings indicate manual governance processes cause unmanaged
    backlogs and inconsistent derivation of governance states.
  - The system vision explicitly calls for a continuous Detect-Analyse-Execute loop
    to maintain architectural integrity at scale.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-business-intent-traceability
  name: Business Intent Integration and Traceability
  pattern_classification: governance
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - business_intent_ingestion
    - strategic_alignment
    - traceability_from_business_to_code
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    - aw-ideas-to-life-cas-2026-05-31-010
    supporting_evidence:
    - architecture_evolution_map
    - alignment_findings
  description: The pattern of representing business intent as governed architecture
    knowledge, connecting strategic objectives to architecture decisions and implementation
    evidence. This enables traceability from business requirements through ADRs, patterns,
    and code, and is repeatedly identified as a missing capability in the current
    system.
  pattern_type: future_direction
  applies_to:
  - governance
  - intelligence
  - traceability
  rationale:
  - Multiple architecture work items and the AEM position business intent integration
    as a core future capability.
  - The vision and alignment findings highlight that current governance lacks strategic
    alignment, making architecture decisions disconnected from business value.
  - A formal business intent model is required to detect strategic drift and prioritize
    architecture work by business impact.
  evidence_strength: high
  confidence: high
