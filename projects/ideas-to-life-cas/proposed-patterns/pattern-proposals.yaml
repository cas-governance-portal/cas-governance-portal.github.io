  confidence: medium
- pattern_id: pattern-scope-classification-framework
  name: Scoped Pattern Classification and Governance Lifecycle
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Pattern Scope Precedence
    - Formalized Promotion Staging
    - Rule Bloating Prevention
    architecture_work:
    - aw-ideas-to-life-cas-20260614-1
    - aw-ideas-to-life-cas-2026-05-31-001
    supporting_evidence:
    - cas-arch-state-ideas-to-life-cas-2026-09-20
    - aem-ideas-to-life-cas-2026-09-23-01
    - alignment-report-ideas-to-life-cas-2026-09-23-1
  description: Multi-tier scoping and lifecycle staging model (Proposal to Promotion
    Recommendation to ADR to Promoted Pattern) establishing objective governance gates
    across global, project-specific, and step-specific patterns.
  pattern_type: emerging
  applies_to:
  - governance
  - execution
  - contracts
  rationale:
  - Unscoped pattern definitions lead to global rule pollution and premature promotion
    of unverified conventions.
  - Clear scoping and explicit promotion workflows preserve governance integrity and
    separate derived proposal signals from authoritative architectural decisions.
  evidence_strength: high
  confidence: high
