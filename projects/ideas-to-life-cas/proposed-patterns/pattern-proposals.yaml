- pattern_id: pattern-architecture-work-registry
  name: Architecture Work Registry as Authoritative Backlog
  pattern_classification: governance
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Regenerated Artifacts Should Not Own Planning State
    - Governance Artifacts Prefer Derived State
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - current_architecture_state
    - aem-ideas-to-life-cas-2026-10-03
  description: Establishes a persistent, authoritative backlog of architectural change
    (Architecture Work) that decouples planning state from regenerated analytical
    dashboards such as Architecture Evolution Maps.
  pattern_type: implemented
  applies_to:
  - governance
  - execution
  - contracts
  rationale:
  - AEM regeneration periodically discards planning information if governance state
    is embedded directly within generated views.
  - Decoupling authoritative backlog records from derived dashboard views ensures
    deterministic lifecycle tracking and lossless architecture synthesis.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-closed-loop-continuous-governance
  name: Automated Detect-Analyse-Execute Governance Loop
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Automated Remediation
    - Closed-Loop Governance Controller
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - alignment-report-ideas-to-life-cas-2026-10-03-1
    - aem-ideas-to-life-cas-2026-10-03
  description: Automates the continuous governance cycle (Detect -> Analyse -> Plan
    -> Execute -> Observe) within CI/CD pipelines to detect drift and generate actionable
    architecture proposals without manual bottlenecks.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  - execution
  rationale:
  - Manual governance reviews create an operational velocity bottleneck when codebase
    modification rates accelerate.
  - A closed-loop runtime engine maintains architectural freshness and surfaces non-breaking
    drift remediation automatically.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-business-intent-traceability
  name: Business Intent Traceability and Constraint Binding
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Strategic-to-Code Traceability
    - Business Intent Constraint Binding
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    supporting_evidence:
    - alignment-report-ideas-to-life-cas-2026-10-03-1
    - aem-ideas-to-life-cas-2026-10-03
  description: Formalises business goals and strategic portfolio objectives into strongly-typed,
    machine-readable artifacts bound directly as constraints into architectural reasoning
    engines.
  pattern_type: future_direction
  applies_to:
