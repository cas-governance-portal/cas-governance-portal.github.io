- pattern_id: pattern-architecture-work-registry
  name: Architecture Work Registry as Authoritative Change Backlog
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Regenerated Artifacts Should Not Own Planning State
    - Governance Artifacts Prefer Derived State
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - current_architecture_state
    - aem-ideas-to-life-cas-2026-10-03
  description: Establishes Architecture Work as the single authoritative source of
    architectural planning, change backlog, and intent tracking, while derived views
    like Architecture Evolution Maps (AEM) remain strictly generated dashboards.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  - intelligence
  rationale:
  - AEM regeneration discards manual planning annotations if the generated view owns
    the source of truth.
  - Separating planning backlog persistence into immutable or managed Architecture
    Work artifacts prevents information loss across automated discovery cycles.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-continuous-governance-loop
  name: Automated Detect-Analyse-Execute Governance Loop
  pattern_classification: execution
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Governance Velocity Bottleneck
    - Automated Remediation Signals
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-2026-05-31-008
    - aw-ideas-to-life-cas-20260605-07
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: A runtime-native control loop that autonomously triggers drift detection
    in CI/CD, conducts semantic impact analysis via CAS reasoning contracts, and generates
    deterministic remediation proposals into the Architecture Work registry.
  pattern_type: emerging
  applies_to:
  - governance
  - execution
  - automation
  rationale:
  - Manual architectural review cycles create a severe velocity bottleneck during
    high-frequency delivery.
  - Automating drift detection and remediation proposal generation maintains continuous
    alignment without relying on ad-hoc human inspection.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-business-intent-traceability
  name: Business Intent Schema and End-to-End Traceability
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Connecting Business Intent to Code Reality
    - Strategic Drift Detection
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    supporting_evidence:
    - alignment_findings
    - aem-ideas-to-life-cas-2026-10-03
  description: Formalizes business intent artifacts into strongly typed domain schemas
    and establishes bidirectional graph traceability connecting business goals, Architecture
    Decision Records (ADRs), pattern proposals, and AST-extracted code components.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - governance
  - contracts
  rationale:
  - Architectural governance without business intent focuses only on technical consistency
    rather than strategic business value delivery.
  - Enables automated detection of strategic drift and allows architects to query
    which decisions and components support specific business capabilities.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-architecture-knowledge-graph
  name: Unified Architecture Knowledge Graph
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Siloed Architectural Artifacts
    - Cross-Project Lineage and Impact Traversal
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-010
    - aw-ideas-to-life-cas-2026-06-06-002
    - aw-ideas-to-life-cas-20260605-10
    supporting_evidence:
    - current_architecture_state
    - aem-ideas-to-life-cas-2026-10-03
  description: A unified graph model representing relationships between decisions,
    patterns, signals, capabilities, and source components, replacing isolated flat-file
    markdown metadata with an explorable, queryable knowledge network.
  pattern_type: future_direction
