- pattern_id: signal-pattern-proposal-arch-governance-loop-20261107
  name: Continuous Governance Loop
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - AEM pattern_evolution promotes 'Continuous Governance Loop' as an accepted pattern
    - Architecture Work 'Continuous Architecture Governance Runtime' and 'Continuous
      Architecture Governance Evolution' propose automated lifecycle management
    - Alignment finding recommending ADRs for NEXT stage items to progress them
    - Existing workflow 'continuous-architecture-loop' and GitHub Actions 'cas-continuous-architecture'
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
    - aem
  description: An architectural pattern establishing a continuous, automated loop
    for detecting, analyzing, planning, executing, publishing, and observing architecture
    governance. It ensures architecture intelligence stays fresh and governance actions
    are applied proactively rather than through manual periodic reviews.
  pattern_type: implemented
  applies_to:
  - governance
  - execution
  - automation
  rationale:
  - Multiple architecture work items and the AEM explicitly identify a continuous
    governance loop as a core architectural direction.
  - The pattern addresses the recurring problem of governance intelligence staleness
    and manual bottlenecks, as evidenced by governance velocity ratio concerns and
    the proliferation of NEXT-stage items awaiting ADRs.
  evidence_strength: high
  confidence: high
  pattern_classification: architectural
  pattern_maturity: established
