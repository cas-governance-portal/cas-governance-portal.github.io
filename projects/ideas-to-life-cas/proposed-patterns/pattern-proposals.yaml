- pattern_id: pattern-cas-architecture-knowledge-graph
  name: Architecture Knowledge Graph
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Recurring vision for cross-project lineage and relationship modeling
    - AEM lists 'Architecture Knowledge Graph Development' as a NEXT decision
    - Architecture work emphasizes the need for a unified graph-based representation
      of architecture knowledge
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-002
    - aw-ideas-to-life-cas-20260605-10
    supporting_evidence:
    - aem
    - architecture_work
  description: A future architectural pattern that models architecture knowledge (decisions,
    patterns, signals, code artifacts, capabilities) as a graph to enable cross-project
