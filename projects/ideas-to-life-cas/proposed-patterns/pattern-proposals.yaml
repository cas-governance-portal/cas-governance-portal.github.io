- pattern_id: pattern-proposal-only-steering-projection
  name: Proposal-Only Steering Projection
  pattern_classification: execution
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - proposal-mode-execution
    - non-destructive-steering-projection
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-005
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - current_architecture_state
    - aem
  description: Decouples steering projection artifact synthesis from target file mutation
    by executing projection flows in proposal-only mode and gating downstream steering
    updates through validated synchronization branches.
  pattern_type: implemented
  applies_to:
  - execution
  - governance
  - automation
  rationale:
  - Directly modifying operational steering files during build validation risks race
    conditions and unreviewed architectural changes.
  - Emitting immutable projection bundles and synchronizing managed sections via automated
    PRs preserves human-in-the-loop review.
  evidence_strength: high
  confidence: high
