- pattern_id: pattern-architecture-knowledge-graph
  name: Unified Architecture Knowledge Graph
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Cross-Project Architecture Intelligence
    - Decision-Pattern-Signal Relationship Traversal
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-010
    - aw-ideas-to-life-cas-2026-06-06-002
    - aw-ideas-to-life-cas-20260605-10
    supporting_evidence:
    - aem-ideas-to-life-cas-2026-10-03
    - current_architecture_state
  description: Transitioning from siloed, flat markdown knowledge artifacts to a connected
    knowledge graph model representing entities, decisions, patterns, and code relationships
    across systems and time.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - governance
  - execution
  rationale:
  - Flat-file and isolated project artifacts cannot efficiently perform multi-hop
    lineage analysis or evaluate cross-project pattern impacts.
  - A graph structure enables complex relationship traversal, interactive exploration,
    and global governance impact reasoning.
  evidence_strength: high
  confidence: medium
- pattern_id: pattern-governance-action-framework
  name: Governance Action Framework with Human Gating
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Separation of Proposal from State Mutation
    - Human-in-the-Loop Governance Gating
    architecture_work:
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
