- pattern_id: pattern-cas-continuous-governance-loop
  name: Continuous Governance Loop
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Sustained demand for closed-loop architecture governance
    - Recurring vision and architecture work for Detect-Analyse-Execute-Plan-Publish-Observe
      lifecycle
    - Multiple references to continuous governance runtime and automation
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    - aw-ideas-to-life-cas-2026-05-31-008
    supporting_evidence:
    - aem
    - architecture_work
    - current_architecture_state
  description: A structured, automated governance operating model that continuously
    detects architectural drift, analyses impact, plans remediation, executes approved
    changes, publishes outcomes, and observes results. This pattern replaces manual,
    periodic governance reviews with a closed-loop, runtime-native process that keeps
    architectural intelligence fresh and prevents drift.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  - execution
  rationale:
  - Manual governance loops are too slow to prevent architectural drift at scale (15:1
    velocity ration).
  - Multiple architecture work items and the AEM consistently call for a Detect-Analyse-Execute-Plan-Publish-Observe
    cycle.
  - The system is evolving from documentation-heavy governance to a continuous, runtime-integrated
    platform.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-cas-adr-first-decision-enforcement
  name: ADR-First Decision Enforcement
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Architecture decisions appearing in AEM without corresponding ADRs
    - 'Critical governance finding: ''Architecture Work Registry'' marked DONE but
      decision still proposed'
    - Multiple high-severity alignment findings cite missing decision records
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-003
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - alignment_findings
    - aem
  description: A governance rule that requires every architectural decision to be
    captured as an Architecture Decision Record (ADR) before it can appear as DONE
    or be referenced in the Architecture Evolution Map. This pattern ensures decisions
    have explicit status, rationale, and traceability, preventing false completion
    and enforcing the system-proposes-architect-decides principle.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  rationale:
  - The alignment report found multiple instances where decisions were marked DONE
    without corresponding ADRs, creating a false sense of completion.
  - ADRs are the authoritative record of architectural decisions and must exist for
    any decision to be considered accepted.
  - Without enforcement, the governance layer cannot provide reliable decision provenance.
  evidence_strength: medium
  confidence: medium
- pattern_id: pattern-cas-artifact-integrity-validation
  name: Artifact Integrity Validation
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Placeholder architecture work entries (aw-discovery-ideas-to-life-cas-1, dummy_string)
      corrupting the AEM
    - Critical alignment finding on invalid artifacts in the registry
    - Need for automated validation to prevent dummy data from entering governance
      artifacts
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-002
    - aw-ideas-to-life-cas-2026-05-31-004
    supporting_evidence:
    - alignment_findings
    - aem
  description: A governance pattern that mandates validation of all architecture work,
    alignment reports, and evolution maps to reject placeholder or syntactically invalid
    content. Validation is performed at ingestion time, ensuring only real, meaningful
    evidence becomes part of the knowledge base. This prevents corruption of derived
    artifacts and maintains the integrity of the authoritative architecture state.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  - contracts
  rationale:
  - 'The alignment report identified a critical issue: dummy placeholder artifacts
    in the architecture work registry that corrupt the AEM execution summary.'
  - Without validation, any malformed or placeholder data can undermine governance
    trust and mislead downstream intelligence.
  - An automated validation gate is needed to ensure only legitimate architecture
    evidence enters the system.
  evidence_strength: medium
  confidence: medium
