- pattern_id: pattern-evidence-backed-promotion-gate
  name: Evidence-Backed Promotion Gate
  pattern_classification: governance
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Promoted patterns lack evidence links
    architecture_work:
    - aw-ideas-to-life-cas-2026-11-07
    supporting_evidence:
    - alignment_findings
    - aem
  description: A governance control that requires all pattern promotions to reference
    at least one supporting signal, architecture work item, or ADR. This ensures that
    pattern promotion decisions are evidence-based and auditable, preventing unsupported
    patterns from entering the promoted catalogue.
  pattern_type: emerging
  applies_to:
  - governance
  - intelligence
  rationale:
  - Multiple alignment findings flagged promoted patterns without supporting evidence,
    violating the principle of evidence-based promotion.
  - Ensures pattern lifecycle integrity by making promotion decisions traceable to
    underlying architectural signals.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-derived-governance-state
  name: Derived Governance State
  pattern_classification: governance
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - AEM evolution map out of sync with Architecture Work registry
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    supporting_evidence:
    - alignment_findings
    - aem
  description: A pattern where governance artifacts like AEMs are derived from authoritative
    sources such as Architecture Work and ADRs, rather than maintaining independent
    state. This ensures consistency and prevents discrepancies between claimed stages
    and actual decision statuses.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  rationale:
  - Alignment findings identified critical inconsistencies where AEM 'DONE' items
    lacked accepted ADRs or were still 'proposed' in Architecture Work.
  - Deriving governance state from authoritative sources eliminates drift and maintains
    a single source of truth.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-validation-gate-against-placeholder-artifacts
  name: Validation Gate Against Placeholder Artifacts
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Dummy entries in Architecture Work registry
    architecture_work:
    - dummy_string
    supporting_evidence:
    - alignment_findings
    - architecture_work
  description: A governance pattern that introduces validation to reject or quarantine
    dummy, placeholder, or malformed entries from polluting the architectural knowledge
    base. This protects the integrity of all downstream governance artifacts and ensures
    that only real architectural work is tracked.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  rationale:
  - Alignment findings reported multiple dummy entries (e.g., 'dummy_string') compromising
    governance evidence integrity.
  - Prevents false sense of progress and ensures downstream artifacts remain trustworthy.
  evidence_strength: medium
  confidence: medium
- pattern_id: pattern-runtime-native-governance-controller
  name: Runtime-Native Governance Controller
  pattern_classification: execution
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
