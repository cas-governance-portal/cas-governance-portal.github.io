- pattern_id: pattern-operational-intelligence-loop
  name: Operational Intelligence Loop (ReasoningOps/GovernanceOps)
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Automated Governance Loop
    - Continuous Evaluation
    - Detect-Analyse-Execute
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-008
    - aw-ideas-to-life-cas-20260605-07
    - aw-ideas-to-life-cas-2026-06-06-001
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: Establish a continuous, automated loop that detects governance signals,
    analyzes alignment, recommends architecture evolution, and feeds back into governance
    refinement while preserving human authority.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  - execution
  rationale:
  - Manual governance review is a bottleneck (15:1 velocity ratio) and leads to intelligence
    staleness.
  - Multiple work items and alignment findings call for automated detection and analysis
    without losing human governance.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-evidence-based-pattern-promotion
  name: Evidence-Based Pattern Promotion Governance
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Pattern Promotion without Evidence
    - Heuristic-derived patterns missing signals
    - Governance status inconsistencies
    architecture_work: []
    supporting_evidence:
    - alignment_findings
    - aem
  description: Ensure that every pattern promotion from 'supporting' to 'core' is
    accompanied by explicit evidence (signals, ADRs, or alignment findings) and that
    pattern classification is consistent with governance status.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  rationale:
  - Alignment findings expose promoted patterns lacking evidence and emerging patterns
    misclassified as core.
  - A formal promotion lifecycle with evidence requirements is necessary to maintain
    governance integrity.
  evidence_strength: medium
  confidence: medium
