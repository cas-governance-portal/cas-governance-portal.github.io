- pattern_id: pattern-proposal-001
  name: Governance Lifecycle Enforcement
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - DONE items without accepted ADRs
    - High proposal backlog without progression
    - Governance velocity bottleneck
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-14-1
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-ideas-to-life-cas-2026-06-06-001
    supporting_evidence:
    - alignment_findings
    - current_architecture_state
  description: Establish a formal governance lifecycle where architecture work items
    must progress through proposal, ADR acceptance, and then be reflected in governance
    artifacts. Enforcement ensures that items marked DONE have accepted persistent
    ADRs and that lifecycle stage derives from decision status.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  rationale:
  - Recurring critical and high findings show DONE items lacking accepted ADRs, violating
    decision persistence requirements.
  - A centralized governance lifecycle prevents drift and ensures traceability from
    work item to decision.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-proposal-002
  name: Bidirectional Artifact Traceability
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - AEM and AID missing mutual references
    - Incomplete relationship metadata
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    supporting_evidence:
    - alignment_findings
  description: Ensure that all governance artifacts (AEM, AID, ADRs, patterns) maintain
    bidirectional references where expected, enabling automated consistency checks
    and complete lineage.
  pattern_type: emerging
  applies_to:
  - governance
  - intelligence
  - contracts
  rationale:
  - Alignment findings highlight missing bidirectional references between AEM and
    AID, violating the AID bidirectional_traceability heuristic.
  - Complete traceability is required for governance integrity and impact analysis.
  evidence_strength: medium
  confidence: medium
