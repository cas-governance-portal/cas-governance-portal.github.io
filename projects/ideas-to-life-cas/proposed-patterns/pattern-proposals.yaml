- pattern_id: signal-pattern-proposal-architecture-work-registry
  name: Architecture Work Registry as Authoritative Backlog
  pattern_classification: governance
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Regenerated Artifacts Should Not Own Planning State
    - Governance Artifacts Prefer Derived State
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-ideas-to-life-cas-2026-05-31-002
    - aw-ideas-to-life-cas-2026-05-31-003
    - aw-ideas-to-life-cas-2026-05-31-004
    - aw-ideas-to-life-cas-2026-05-31-005
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
    - architecture_work
  description: Architecture Work is the authoritative, decision-derived backlog for
    architectural change, while generated artifacts such as AEM and alignment reports
    summarize rather than own planning state.
  pattern_type: implemented
  applies_to:
  - governance
  - contracts
  rationale:
  - Architectural evolution is repeatedly lost when generated artifacts are treated
    as planning state
  - A persistent backlog with lifecycle classification enables traceability from conversations,
    discovery, vision, and alignment into downstream governance artifacts
  evidence_strength: high
  confidence: high
- pattern_id: signal-pattern-proposal-workflow-execution-model
