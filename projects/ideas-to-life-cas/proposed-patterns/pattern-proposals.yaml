- pattern_id: bi-directional-external-review-broker
  name: Bi-Directional External Review Broker
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - External Governance Review Synchronization
    - Two-Phase Review Broker
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-009
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - flow:governance:cas-sync-archgov-reviews:execution-workflow
    - ctrl-skill-cas-sync-archgov-reviews
  description: Decoupled synchronization mechanism that pushes locally generated reference
    architectures and candidate ADRs to external governance authority platforms while
    pulling review outcomes back into version-controlled Git state to unblock downstream
    lifecycle events.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  - automation
  rationale:
  - Bridges repository-local AI development workflows with centralized human enterprise
    architecture governance boards.
  - Guarantees that asynchronous external approvals are captured immutably within
    repository Git state.
  evidence_strength: high
  confidence: high
