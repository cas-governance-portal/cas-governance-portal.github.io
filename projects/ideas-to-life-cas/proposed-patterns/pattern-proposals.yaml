- pattern_id: pattern-governance-gated-ci-pipeline
  name: Governance-Gated CI/CD Validation Pipeline
  pattern_classification: execution
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Mandatory Governance Verification Gate
    - Proposal-Only Steering Isolation
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-005
    - aw-discovery-ideas-to-life-cas-4
    supporting_evidence:
    - cas-arch-state-ideas-to-life-cas-2026-09-20
    - aem-ideas-to-life-cas-2026-09-23-01
  description: Structural enforcement of architectural constraints within CI/CD where
    automated build validation gates block downstream synthesis, steering projections
    remain proposal-only, and state changes require explicit verification.
  pattern_type: implemented
  applies_to:
  - automation
  - execution
  - governance
  rationale:
  - Prevents unverified synthesis and architectural drift by moving skill and governance
    enforcement from agent discipline to deterministic pipeline gates.
  - Guarantees that steering projections and documentation updates cannot bypass contract
    and test checks.
  evidence_strength: high
  confidence: high
