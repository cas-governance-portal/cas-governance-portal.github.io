  confidence: medium
- pattern_id: pattern-governance-artifact-derivation
  name: Governance Artifact Derivation from Authoritative Sources
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - 'Alignment finding: AEM stages must derive exclusively from Architecture Work
      lifecycle states'
    - 'Architecture Work principle: Governance artifacts prefer derived state'
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    supporting_evidence:
    - alignment_findings
    - aem_evolution_map
  description: Governance Artifact Derivation is a governance pattern that mandates
    generated governance artifacts (e.g., AEM, AID) be deterministically derived from
    authoritative sources such as Architecture Work and ADRs, rather than independently
    maintained. This ensures traceability, consistency, and readiness of derived views,
    preventing corruption and ungoverned backlog.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  - automation
  rationale:
  - The alignment findings highlight that AEM stages are not consistently derived
    from Architecture Work lifecycle states, causing critical governance gaps
  - The pattern reflects the recurring principle that generated artifacts must summarize
    authoritative state without owning planning state
  - It addresses the need to cleanse dummy entries and enforce meaningful linking
    between Architecture Work and derived maps
  evidence_strength: medium
  confidence: high
