- pattern_id: pat-prop-authoritative-backlog-derived-dashboard
  name: Authoritative Planning Backlog with Derived Governance Dashboards
  pattern_classification: governance
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Regenerated Artifacts Should Not Own Planning State
    - Governance Artifacts Prefer Derived State
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-discovery-ideas-to-life-cas-2
    supporting_evidence:
    - current_architecture_state
    - aem
  description: Separates authoritative architectural planning into persistent, immutable
    backlog records (Architecture Work) while treating visualization and evolution
    maps (AEM, AID) as deterministically regenerated dashboard projections.
  pattern_type: implemented
  applies_to:
  - governance
  - contracts
  - intelligence
  rationale:
  - Prevents the loss of manually introduced planning information and decision rationale
    during downstream artifact regeneration.
  - Establishes a single authoritative source of truth for architectural change while
    preserving dynamic reporting agility.
  evidence_strength: high
  confidence: high
