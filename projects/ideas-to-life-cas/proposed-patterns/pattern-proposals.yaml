- pattern_id: pattern-continuous-governance-loop
  name: Continuous Governance Loop
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Automated Detect-Analyse-Execute loop
    - Continuous Architecture Governance Runtime
    - Continuous Architecture Governance Evolution
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-2026-06-05-07
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: A governance loop that continuously detects architectural drift, analyzes
    impact, and executes remediation without human intervention for non-breaking changes.
    It institutionalizes the Detect-Analyse-Execute lifecycle across CI/CD pipelines,
    alignment reports, and Architecture Work.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  rationale:
  - Manual governance review is a bottleneck (velocity ratio 15:1) and leads to intelligence
    staleness.
  - Recurring signals from vision, architecture work, and alignment findings call
    for automated loop to maintain architectural integrity at scale.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-adr-centric-decision-enforcement
  name: ADR-Centric Decision Enforcement
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Missing ADRs for done items
    - Rule-decisions-must-be-persisted
    - Pattern decision lifecycle alignment
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-ideas-to-life-cas-2026-05-31-003
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - alignment_findings
    - aem
  description: A governance pattern that ensures all architectural decisions, patterns,
    and completed work items are represented by accepted ADRs. It enforces the rule
    that decision status must drive architectural stage and that every DONE item has
    a corresponding decision record.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  rationale:
  - Alignment findings highlight DONE items without ADRs, violating decision provenance.
  - Recurring emphasis on ADR centrality across governance evolution and AEM pattern
    evolution.
  evidence_strength: high
  confidence: high
