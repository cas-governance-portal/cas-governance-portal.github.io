  evidence_strength: high
  confidence: high
- pattern_id: pattern-architecture-knowledge-graph
  name: Architecture Knowledge Graph
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Cross-Project Architecture Intelligence
    - Multi-Hop Lineage Analysis
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-002
    - aw-ideas-to-life-cas-20260605-10
    - aw-ideas-to-life-cas-2026-05-31-010
    supporting_evidence:
    - aem-ideas-to-life-cas-2026-09-23-01
  description: A unified graph-based representation modeling relationships, impact
    propagation, and lineage across decisions, patterns, signals, and implementation
    artifacts across multiple projects.
  pattern_type: future_direction
