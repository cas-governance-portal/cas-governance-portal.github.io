- pattern_id: pattern-business-intent-traceability
  name: Business Intent Integration and Traceability
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Business Intent Integration
    - Traceability from business to architecture
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
    - aem
  description: Establish a governed capability to ingest business intent (requirements,
    cases, objectives) and trace them through architecture decisions, patterns, and
    implementation evidence, enabling strategic alignment and impact analysis.
  pattern_type: future_direction
  applies_to:
  - governance
  - intelligence
  - contracts
  rationale:
  - Business intent currently remains external to architecture governance, causing
    decisions to lack strategic traceability.
  - Multiple architecture work items and vision repeatedly identify the need to connect
    business drivers to architectural choices.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-code-intelligence-alignment
  name: Code Intelligence and Architecture Alignment
  pattern_classification: intelligence
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Code Structure Analysis
    - Architecture Drift Detection
    - Forensic Extraction
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-007
    - aw-ideas-to-life-cas-2026-05-31-002
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: Continuously analyze codebase structure, map implementation to intended
    architecture, and detect deviations between AID, ADRs, patterns, and actual code,
    producing actionable drift findings for governance.
  pattern_type: emerging
