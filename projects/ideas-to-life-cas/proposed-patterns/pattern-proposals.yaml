- pattern_id: pattern-proposal-005
  name: Automated Governance Loop
  pattern_classification: execution
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Necessity for continuous detect-analyse-execute
    - Inefficiency of manual governance cycles
    - Existing CI/CD automation
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    supporting_evidence:
    - current_architecture_state
    - architecture_work
  description: 'Automate the governance feedback loop: detect architecture drift,
    analyse impact, and trigger appropriate actions without manual intervention for
    non-breaking deviations.'
  pattern_type: emerging
  applies_to:
  - execution
  - automation
  - governance
  rationale:
  - Manual governance cycles create intelligence staleness and a velocity bottleneck
    (15:1 ratio).
  - Existing CI workflows provide a foundation but lack full loop automation.
  evidence_strength: high
  confidence: high
