- pattern_id: pattern-continuous-architecture-governance-loop
  name: Continuous Architecture Governance Loop
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Automated Detect-Analyse-Execute Loop for Governance
    - Governance velocity bottleneck (15:1 manual review ratio)
    - Continuous Architecture Governance Runtime
    - CI/CD governance gates and control bands
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    - aw-ideas-to-life-cas-2026-06-14-1
    - aw-ideas-to-life-cas-2026-05-31-005
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
    - architecture_work
  description: A recurring governance operating model that automates the detect-analyse-execute
    lifecycle so architectural drift is identified, assessed, and remediated through
    governed workflows rather than manual periodic review.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  - execution
  - ci-cd
  rationale:
  - Manual governance review creates a throughput bottleneck and stale architecture
    intelligence.
  - Multiple architecture work items converge on closed-loop automation of detection,
    analysis, planning, and remediation.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-architecture-work-registry
  name: Architecture Work Registry
  pattern_classification: governance
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Regenerated Artifacts Should Not Own Planning State
    - Governance Artifacts Prefer Derived State
    - Architecture Work as authoritative architectural backlog
    - Conversation/discovery/vision as Architecture Work producers
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-ideas-to-life-cas-2026-05-31-002
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-20260605-05
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
    - architecture_work
  description: Architecture Work acts as the authoritative architectural change backlog;
    generated governance artefacts such as AEMs and AIDs summarize it instead of owning
    planning state.
  pattern_type: implemented
  applies_to:
  - governance
  - intelligence
  - contracts
  - architecture
  rationale:
  - AEM regeneration was discarding manually introduced planning information.
  - A persistent backlog is needed to receive architecture work from conversations,
    discovery, vision, and alignment findings.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-knowledge-provider-abstraction
  name: Knowledge Provider Abstraction
  pattern_classification: architectural
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Knowledge Access Abstraction
    - Workflows should remain implementation agnostic regarding storage
    - LocalKnowledgeProvider as provider implementation
    architecture_work:
    - aw-ideas-to-life-cas-20260605-03
    - aw-ideas-to-life-cas-2026-06-14-1
    - aw-ideas-to-life-cas-2026-05-31-004
    supporting_evidence:
    - current_architecture_state
    - architecture_work
  description: A provider contract decouples governance workflows and reasoning from
    knowledge storage, allowing the same workflow to run against local filesystem
    or future graph/remote knowledge backends.
  pattern_type: implemented
  applies_to:
  - architecture
  - contracts
  - intelligence
  - persistence
  rationale:
  - Workflows should not depend on repository layout details.
  - Knowledge access must be swappable to support evolving storage and external ecosystem
    integration.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-cas-workflow-execution-model
  name: CAS Workflow Execution Model
  pattern_classification: execution
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Workflow Execution Model Compliance
    - Runner orchestrates, workflow reasons, knowledge provider provides knowledge,
      prompts are contracts
    - Runtime-native workflows must separate reasoning from orchestration
    architecture_work:
    - aw-ideas-to-life-cas-20260605-04
    - aw-ideas-to-life-cas-20260605-06
    - aw-ideas-to-life-cas-2026-06-14-1
    - aw-ideas-to-life-cas-2026-11-11-1
    supporting_evidence:
    - current_architecture_state
    - architecture_work
  description: A standardized execution model in which the CAS Runner handles orchestration,
    validation, and persistence while each workflow performs reasoning and uses prompts
    as contracts, keeping runtime concerns separate.
  pattern_type: implemented
  applies_to:
  - execution
  - contracts
  - automation
  - governance
  rationale:
  - Prompt-native workflows lacked runtime orchestration and became hard to validate.
  - Separating reasoning from orchestration enables deterministic, governed execution
    and compliance with architecture rules.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-pattern-governance-lifecycle
  name: Pattern Governance Lifecycle
  pattern_classification: governance
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Pattern lifecycle institutionalization
    - Proposal -> Promotion Recommendation -> Promotion Decision -> ADR -> Pattern
    - Pattern promotion decisions should not leak into proposal artefacts
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-14-1
    - aw-ideas-to-life-cas-20260605-08
    - aw-ideas-to-life-cas-2026-05-31-001
    supporting_evidence:
    - current_architecture_state
    - architecture_work
  description: A governed progression for architectural patterns from proposal through
    promotion recommendation, promotion decision, ADR, and finally institutionalized
    pattern, with each state persisted in a distinct artifact.
  pattern_type: implemented
  applies_to:
  - governance
  - intelligence
  - contracts
  - architecture
  rationale:
  - Promotion state stored in proposal artifacts causes governance state leakage.
  - A formal lifecycle gives architects a reviewable decision trail and prevents premature
    pattern adoption.
  evidence_strength: high
  confidence: high
