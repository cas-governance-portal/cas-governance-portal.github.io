- pattern_id: pattern-schema-guided-reasoning
  name: Schema-Guided Reasoning Evaluation
  pattern_classification: intelligence
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - 'Candidate Signal: Schema Enforced Domain Contracts'
    - 'Candidate Signal: Runtime-Native Reasoning Separation'
    architecture_work:
    - aw-ideas-to-life-cas-2026-11-11-1
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - aem-ideas-to-life-cas-2026-11-18
    - current_architecture_state
  description: Enforces strict machine-readable schema validation contracts on LLM
    reasoning workflows to decouple prompt evaluation from runtime persistence and
    orchestration.
  pattern_type: emerging
  applies_to:
  - intelligence
  - contracts
  - execution
  rationale:
  - Unstructured reasoning generation leads to non-deterministic orchestration behavior
    and downstream schema parsing failures.
  - Separating prompt contracts and domain schemas enables portable, deterministic
    reasoning evaluation across distinct runtime providers.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-business-intent-traceability
  name: Business Intent to Architecture Traceability
  pattern_classification: governance
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
