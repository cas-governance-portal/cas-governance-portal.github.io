    - alignment_findings
  description: The recurring need to translate codebase structure into architecture
    evidence, enabling continuous alignment between intended architecture (AID/ADRs)
    and implementation reality. This includes detecting architecture drift, mapping
    code to patterns, and generating fit/gap analysis to support governance decisions.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - automation
  - governance
  rationale:
