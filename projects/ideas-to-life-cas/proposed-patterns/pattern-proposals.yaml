    portfolio intelligence and advanced governance reasoning.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - architecture
  - governance
  rationale:
  - Multiple architecture work items and the AEM identify the need for cross-project
    impact analysis and lineage.
  - Current flat-file artifacts are insufficient for multi-hop relationship traversal
    required for portfolio intelligence.
  - The vision explicitly calls for an Architecture Knowledge Graph as part of the
    Architecture Intelligence Platform.
  evidence_strength: medium
  confidence: medium
