- pattern_id: signal-pattern-proposal-decision-derived-lifecycle-state
  name: Decision-Derived Lifecycle State for Governance Artifacts
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Decisions Must Be Accepted as ADRs Before Completion
    - Lifecycle Stage Must Be Derived from Decision Status
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - alignment_findings
    - architecture_work
    - aem
  description: Governance artifacts must derive lifecycle stage from accepted decision
    status rather than allowing manual status fields to mark work complete while the
    underlying decision remains proposed.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  rationale:
  - Alignment findings identify a done item whose contained decision is still proposed,
    contaminating AEM counts
  - Reversible lifecycle state prevents governance artifacts from asserting completion
    without authoritative ADR evidence
  evidence_strength: high
  confidence: high
