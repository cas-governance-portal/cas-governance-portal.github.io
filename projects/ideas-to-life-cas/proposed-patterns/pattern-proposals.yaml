- pattern_id: pattern-authoritative-architecture-work-registry
  name: Authoritative Architecture Work Registry
  pattern_classification: governance
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - regenerated-artifacts-should-not-own-planning-state
    - governance-artifacts-prefer-derived-state
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-discovery-ideas-to-life-cas-1
    supporting_evidence:
    - aem-ideas-to-life-cas-2026-11-15
    - alignment-report-ideas-to-life-cas-2026-11-15-1
  description: Establishes individual Architecture Work items as the authoritative,
    durable backlog for architectural changes while treating downstream syntheses
    (such as Architecture Evolution Maps and Architecture Intent Documents) as strictly
    derived, regenerable views.
  pattern_type: implemented
  applies_to:
  - governance
  - contracts
  rationale:
  - Prevents loss of planning state and architectural intent when derived dashboard
    artifacts are regenerated.
  - Decouples change initiation across multiple producers (discovery, conversation,
    vision) from state summary views.
  evidence_strength: high
  confidence: high
