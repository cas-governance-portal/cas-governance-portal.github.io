- pattern_id: pat-cas-governance-lifecycle-automation
  name: Continuous Governance Lifecycle Automation
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - AUTOMATED_DETECT_ANALYSE_EXECUTE_LOOP
    - CONTINUOUS_ARCHITECTURE_GOVERNANCE
    - OPERATIONAL_INTELLIGENCE_LOOP
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    - aw-ideas-to-life-cas-2026-05-31-008
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: Automation of the governance lifecycle from detection of architectural
    drift through analysis, planning, execution, and observation, enabling continuous
    governance with minimal human intervention for non-breaking changes.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  - execution
  rationale:
  - Manual governance review creates a velocity bottleneck (15:1 ratio) and intelligence
    staleness.
  - Recurring need to close the loop between architecture intent, implementation,
    and governance decisions.
  evidence_strength: high
  confidence: high
- pattern_id: pat-cas-decision-persistence
  name: Architecture Decision Persistence and Traceability
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - DECISION_TRACEABILITY_GAP
    - ADR_SINGLE_SOURCE_OF_TRUTH
    - DECISION_SCHEMA_STRUCTURED
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-003
    - aw-ideas-to-life-cas-2026-06-14-1
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: Establishment of a formal mechanism ensuring all architectural decisions
    are persisted as structured ADRs before influencing downstream artifacts, maintaining
    traceability from decision to implementation.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  rationale:
  - 'Alignment findings show critical issue: multiple decision-type items exist but
    no ADRs persisted, violating the single source of truth rule.'
  - Decisions drive architecture evolution; without persistence and traceability,
    governance becomes inconsistent.
  evidence_strength: high
  confidence: high
