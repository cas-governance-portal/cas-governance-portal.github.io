- pattern_id: pattern-closed-loop-continuous-governance
  name: Closed-Loop Continuous Governance
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Automated Governance Velocity
    - Closed-Loop Drift Detection
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    - aw-ideas-to-life-cas-2026-05-31-008
    supporting_evidence:
    - cas-continuous-architecture-loop
    - alignment_findings
    - aem-ideas-to-life-cas-2026-09-28-01
  description: An automated detect-analyse-execute feedback loop integrated into continuous
    delivery pipelines to detect architectural drift, evaluate alignment rules, and
    auto-generate remediation architecture work without manual intervention.
  pattern_type: emerging
  applies_to:
  - governance
  - execution
  - automation
  rationale:
  - Manual architectural governance review cycles introduce a severe delivery bottleneck
    against rapid changes.
  - Automating the loop from CI drift detection to architecture work proposal guarantees
    that governance intelligence stays synchronized with implementation reality.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-authoritative-architecture-work-registry
  name: Authoritative Architecture Work Registry
  pattern_classification: architectural
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Regenerated Artifacts Should Not Own Planning State
    - Governance Artifacts Prefer Derived State
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-001
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - cas-arch-state-ideas-to-life-cas-2026-09-28
    - aem-ideas-to-life-cas-2026-09-28-01
    - alignment_findings
  description: Separation of persistent planning state into an authoritative Architecture
    Work registry while treating architectural evolution maps and dashboard visualizations
    as derived, idempotent projections.
  pattern_type: implemented
  applies_to:
  - governance
  - contracts
  rationale:
  - Frequent regeneration of architectural dashboards and maps discards manual planning
    state unless stored in dedicated authoritative work records.
  - Downstream governance views maintain determinism when consuming immutable backlog
    records rather than owning planning state directly.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-business-intent-traceability-contract
  name: Business Intent Traceability Contract
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Business Intent Ingestion Gap
    - Strategic Drift Prevention
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    supporting_evidence:
    - alignment_findings
    - aem-ideas-to-life-cas-2026-09-28-01
  description: Schema-enforced ingestion of business drivers and strategic objectives
    into the architectural reasoning pipeline to enable end-to-end evidence-backed
    traceability from business intent to code implementation.
  pattern_type: future_direction
  applies_to:
  - governance
  - intelligence
  - contracts
  rationale:
  - Technical architectural governance operating in isolation from business objectives
    risks validating internally consistent systems that drift from strategic intent.
  - Formalizing business intent schemas provides deterministic constraints for alignment
    engines and justifies architectural choices.
  evidence_strength: medium
  confidence: high
- pattern_id: pattern-staged-governance-promotion-pipeline
  name: Staged Governance Promotion Pipeline
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Lifecycle Gating Alignment
    - Decoupled Governance State
    architecture_work:
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - alignment_findings
    - cas-arch-state-ideas-to-life-cas-2026-09-28
    - aem-ideas-to-life-cas-2026-09-28-01
  description: A formalized multi-stage lifecycle progression pipeline (Proposal ->
    Promotion Recommendation -> Promotion Decision -> ADR -> Pattern) with automated
    gatekeeping to block progression into active roadmap stages until authoritative
    decision records are approved.
  pattern_type: emerging
  applies_to:
  - governance
  - contracts
  - automation
  rationale:
  - Alignment findings identified evolution items advancing to stage NEXT without
    accepted ADR status, breaching governance heuristics.
  - Explicitly decoupling recommendations from authoritative acceptance prevents premature
    pattern institutionalization.
  evidence_strength: high
  confidence: high
- pattern_id: pattern-architecture-knowledge-graph-lineage
  name: Architecture Knowledge Graph Lineage
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Cross-Project Architecture Visibility
    - Multi-Hop Architectural Lineage
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-002
    - aw-ideas-to-life-cas-20260605-10
    - aw-ideas-to-life-cas-2026-05-31-010
    supporting_evidence:
    - cas-arch-state-ideas-to-life-cas-2026-09-28
    - aem-ideas-to-life-cas-2026-09-28-01
  description: A unified graph-based intelligence schema interconnecting decisions,
    patterns, signals, and implementation structures to enable recursive dependency
    traversal, cross-project impact analysis, and visual architectural lineage.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - governance
  rationale:
  - Flat-file and document-centric knowledge models cannot execute multi-hop impact
    analysis across distributed components or enterprise boundaries.
  - A relational graph representation permits automated reasoning about how pattern
    or decision updates in one project propagate across an entire portfolio.
  evidence_strength: medium
  confidence: medium
