- pattern_id: pattern-governance-velocity-process
  name: Governance Velocity Process
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - governance bottleneck
    - many proposed items without progression
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260614-1
    supporting_evidence:
    - alignment_findings
    - aem
  description: A governance process that defines clear prioritization, review cadence,
    and acceptance criteria to efficiently progress architecture proposals to accepted
    decisions, addressing the observed bottleneck where high proposal volume meets
    low completion.
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  rationale:
  - High proposal volume with low completion indicates governance bottleneck
  - Need for structured mechanism to move proposals to ADR acceptance
  evidence_strength: medium
  confidence: medium
