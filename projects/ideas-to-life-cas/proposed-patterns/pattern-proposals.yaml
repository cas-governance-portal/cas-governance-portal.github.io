- pattern_id: pattern-business-intent-integration
  name: Business Intent Integration
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - recurring requirement to connect business drivers to architecture decisions
    - traceability gap from business to code
    - vision-driven integration expectations
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-006
    - aw-ideas-to-life-cas-2026-06-06-003
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: Capture and model business intent (requirements, business cases, strategic
    objectives) as governed architecture knowledge, enabling traceability from business
    drivers to ADRs, patterns, and implementation evidence. This establishes a strategic
    alignment layer that grounds architectural decisions in business value.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - governance
  - execution
  rationale:
  - Recurring need to anchor architecture choices in business drivers is visible across
    multiple vision and architecture work items
  - Current knowledge artifacts do not provide a first-class path from business inputs
    to architecture decisions, limiting strategic relevance
  - End-to-end traceability supports governance review and change impact analysis
    across business, architecture, and implementation layers
  evidence_strength: high
  confidence: high
- pattern_id: pattern-code-intelligence-alignment
  name: Code Intelligence and Architecture Alignment
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - recurring need to understand code structure and map it to architecture intent
    - detection of architectural drift through code evidence
    - alignment between AID, ADRs, patterns, and implementation
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-007
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: A capability to represent codebase structure as governed architectural
    evidence, compare implementation against architecture intent, and detect drift
    through continuous alignment. This turns code into a first-class source of truth
    for architecture governance and enables preventative and detective controls.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - governance
  - automation
  rationale:
  - Multiple vision and architecture work items call for moving from pattern extraction
    to full code understanding and continuous alignment
  - Code intelligence grounds AID and AEM claims in implementation evidence, making
    governance more accurate
  - Drift detection and fit/gap analysis become automated, reducing manual review
    overhead
  evidence_strength: high
  confidence: high
- pattern_id: pattern-operational-intelligence-loop
  name: Operational Intelligence Loop
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - recurring requirement for continuous evaluation of alignment and governance
    - need to surface drift and emerging patterns from operational signals
    - feedback loop that keeps human governance authoritative
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-008
    - aw-ideas-to-life-cas-2026-06-06-001
    - aw-ideas-to-life-cas-20260605-07
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: An operational intelligence loop that continuously ingests signals
    from conversations, CI/CD, alignment checks, and governance activities, evaluates
    them against architectural intent, and produces actionable intelligence such as
    drift findings, pattern promotions, and prioritized architecture work. It emphasizes
    a prevent-detect-feedback cycle where human review remains the decision authority.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - governance
  - execution
  - automation
  rationale:
  - Recurring vision and architecture work describe the need for lightweight, continuous
    participation of governance in delivery
  - Current state relies on periodic manual review, creating a governance velocity
    bottleneck
  - Automation of the loop enables earlier detection of drift and reduces manual overhead
    while keeping architects in control
  evidence_strength: high
  confidence: high
- pattern_id: pattern-external-ecosystem-ingestion
  name: External Ecosystem and Ingestion Framework
  pattern_classification: architectural
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - recurring need to integrate with enterprise architecture tools and knowledge
      platforms
    - requirements for standardized ingestion of external artifacts
    - vision of CAS as part of broader ecosystem
    architecture_work:
    - aw-ideas-to-life-cas-2026-05-31-009
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: A framework for connecting CAS to external systems (EA tools, knowledge
    platforms, source control, CI/CD) via a standardized ingestion provider interface,
    ensuring provenance, synchronization rules, and governed transformation of external
    evidence into architecture knowledge. This prevents CAS from becoming an isolated
    tool and enables enterprise-wide architecture intelligence.
  pattern_type: future_direction
  applies_to:
  - architecture
  - automation
  - contracts
  rationale:
  - Multiple vision and architecture work items call for integrating external inputs
    and exporting governed knowledge
  - Without a standard ingestion boundary, integration becomes ad-hoc and unmanageable
  - Provenance and synchronization are critical for maintaining trust in imported
    architecture evidence
  evidence_strength: high
  confidence: high
- pattern_id: pattern-architecture-knowledge-graph
  name: Architecture Knowledge Graph
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - recurring need for cross-project relationship modeling and lineage analysis
    - desire for interactive architecture intelligence maps
    - limitations of document-centric exploration
    architecture_work:
    - aw-ideas-to-life-cas-2026-06-06-002
    - aw-ideas-to-life-cas-20260605-10
    - aw-ideas-to-life-cas-2026-05-31-010
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: A unified graph-based representation of architecture knowledge (ADRs,
    patterns, architecture work, business intent, code evidence) to enable cross-artifact
    and cross-project queries, impact analysis, and visual navigation. This moves
    beyond siloed documents to an interconnected intelligence layer that supports
    reasoning and exploration.
  pattern_type: future_direction
  applies_to:
  - intelligence
  - contracts
  - governance
  rationale:
  - Recurring vision and architecture work highlight the need to explore relationships
    and perform impact analysis across the architecture landscape
  - Current artifacts contain relationships but lack a normalized graph model that
    can power queries and visualizations
  - A knowledge graph enables deeper insight and supports cross-project learning and
    pattern promotion
  evidence_strength: high
  confidence: high
- pattern_id: pattern-governance-evidence-reconciliation
  name: Governance Evidence Reconciliation
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - recurring misalignment between decision status and governance status in ADRs
    - AEM items marked DONE without accepted ADR evidence
    - placeholder records and dummy data in architecture work
    architecture_work:
    - aw-ideas-to-life-cas-2026-11-11-1
    - aw-ideas-to-life-cas-2026-05-31-001
    supporting_evidence:
    - current_architecture_state
    - alignment_findings
  description: 'A governance practice to systematically reconcile architectural evidence:
    enforce that DONE statuses are only derived from accepted ADR decisions, audit
    decision status vs governance forum status, and clean placeholder records. This
    ensures that architecture evolution maps and backlogs accurately reflect the true
    governance state, preventing false confidence and drift.'
  pattern_type: emerging
  applies_to:
  - governance
  - automation
  rationale:
  - Alignment findings reveal critical inconsistencies in governance evidence, such
    as DONE items without ADRs and dummy data
  - Recurring need to maintain a single source of truth for decision status
  - Without reconciliation, governance artifacts become unreliable and erode trust
    in the system
  evidence_strength: high
  confidence: high
