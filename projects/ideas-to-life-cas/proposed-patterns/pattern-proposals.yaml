- pattern_id: pattern-deterministic-lifecycle-gating
  name: Deterministic ADR-Gated Lifecycle Stage Enforcement
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Unratified State Progression Drift
    - ADR-Gated Evolution Stages
    architecture_work:
    - aw-ideas-to-life-cas-20260614-1
    - aw-discovery-ideas-to-life-cas-4
    supporting_evidence:
    - alignment_findings
    - aem-ideas-to-life-cas-2026-10-03
  description: Enforces strict machine-validated gating in the CAS Runner pipeline
    to prevent architecture work items and capabilities from progressing from 'PROPOSED'
    to 'NEXT' or 'ACTIVE' stages without an accepted Architecture Decision Record
    (ADR).
  pattern_type: emerging
  applies_to:
  - governance
  - execution
  - contracts
  rationale:
  - Items in the evolution map frequently advance to implementation staging without
    formal governance acceptance, causing unratified architecture drift.
  - Programmatic gating in CI and runner steps guarantees that system state mirrors
    explicit architectural decisions.
  evidence_strength: high
  confidence: high
