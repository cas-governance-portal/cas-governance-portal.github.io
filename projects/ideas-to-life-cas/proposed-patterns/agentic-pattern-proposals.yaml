pattern_proposals:
- pattern_id: provider-agnostic-llm-facade
  name: Provider-Agnostic LLM Facade
  pattern_classification: intelligence
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/llm/litellm_client.py (LiteLLMClient) - Provides consistent invocation
      wrapper around LiteLLM for agent steps.
  description: Encapsulates LLM interactions behind a unified client interface to
    ensure provider portability and uniform call semantics across agent tasks.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Decouple agent business logic from specific model providers (OpenAI,
    Anthropic, Ollama, etc.) while standardizing call contracts.'
  - 'Context: Used across all runner steps and governance modules requiring LLM generation
    or structured output parsing.'
  - 'Force: Different model providers feature varying API schemas and error structures'
  - 'Force: Pipeline components need uniform invocation mechanics without vendor coupling'
  evidence_strength: high
  confidence: high
