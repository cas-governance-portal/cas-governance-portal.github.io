  confidence: high
- pattern_id: sequential-pipeline-flow-runner
  name: Sequential Pipeline Flow Runner
  pattern_classification: intelligence
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/runner.py (FlowRunner) - Coordinates execution of workflow steps
      and accumulates execution context.
    - src/cas_runner/cli.py (main) - Serves as the entrypoint invoking FlowRunner
      for CLI commands.
  description: Executes discrete agentic and verification steps sequentially through
    an orchestrator passing updated execution context.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Coordinate multi-stage architectural assessment and generation tasks
    with deterministic ordering and failure handling.'
  - 'Context: Implemented in `src/cas_runner/runner.py` via `FlowRunner`.'
  - 'Force: Complex agent tasks require clear ordering (e.g. assess -> plan -> specify
    -> implement)'
  - 'Force: Uncontrolled agent self-looping can lead to infinite execution cycles
    and high token spend'
  evidence_strength: high
  confidence: high
- pattern_id: schema-enforced-domain-contracts
  name: Schema-Enforced Domain Contracts
  pattern_classification: intelligence
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/models.py (GovernanceInventory, ComplianceFinding,
      GovernanceHealth, GovernanceRisks, GovernanceAction) - Defines rigid contracts
      for state, action payloads, and compliance results.
  description: Enforces strict Pydantic and JSON Schema models for all governance
    entities, ensuring agent outputs are validated prior to consumption.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Eliminate malformed, incomplete, or hallucinated payloads generated by
    LLM steps before modifying repository state.'
  - 'Context: Defined across `src/cas_runner/governance/models.py` and validated by
    `ComplianceEngine`.'
  - 'Force: LLMs frequently omit required attributes or produce inconsistent data
    structures'
  - 'Force: Downstream visualization and health calculators expect strongly-typed
    models'
  evidence_strength: high
  confidence: high
- pattern_id: telemetry-observable-agent-steps
  name: Telemetry-Observable Agent Steps
  pattern_classification: intelligence
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - pyproject.toml - Includes opentelemetry-api and opentelemetry-sdk dependencies.
    - src/cas_runner/governance/models.py (TraceableMetric) - Encapsulates metric
      records carrying trace context.
  description: Instruments pipeline execution and agent interactions with OpenTelemetry
    to track latency, token usage, and step errors.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Provide comprehensive visibility into the latency, cost, and error boundaries
    of agentic runs.'
  - 'Context: Integrated via OpenTelemetry SDK dependencies configured in the runner
    runtime.'
  - 'Force: Multi-step agent pipelines suffer from opacity when failures occur inside
    nested LLM calls'
  - 'Force: Debugging cost spikes and slow steps requires distributed trace context'
  evidence_strength: high
  confidence: high
