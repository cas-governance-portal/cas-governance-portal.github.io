pattern_proposals:
- pattern_id: provider-agnostic-llm-facade
  name: Provider-Agnostic LLM Facade
  pattern_classification: intelligence
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/llm/litellm_client.py (LiteLLMClient) - Provides consistent invocation
      wrapper around LiteLLM for agent steps.
  description: Encapsulates LLM interactions behind a unified client interface to
    ensure provider portability and uniform call semantics across agent tasks.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Decouple agent business logic from specific model providers (OpenAI,
    Anthropic, Ollama, etc.) while standardizing call contracts.'
  - 'Context: Used across all runner steps and governance modules requiring LLM generation
    or structured output parsing.'
  - 'Force: Different model providers feature varying API schemas and error structures'
  - 'Force: Pipeline components need uniform invocation mechanics without vendor coupling'
  evidence_strength: high
  confidence: high
- pattern_id: deterministic-mock-evaluation-harness
  name: Deterministic Mock Evaluation Harness
  pattern_classification: intelligence
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/llm/mock_client.py (MockLLMClient) - Implements deterministic
      mock LLM interface for testing runner flows.
  description: Provides a drop-in mock LLM client to execute agent pipelines deterministically
    in CI/CD without network or model flakiness.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Enable fast, zero-cost, and deterministic end-to-end testing of agentic
    workflows and governance decision flows.'
  - 'Context: Implemented alongside the production LLM client to support offline unit
    tests, regression suites, and CI pipelines.'
  - 'Force: Live LLM calls in CI are nondeterministic, slow, and incur cost'
  - 'Force: Agent pipelines must be validated end-to-end including state transitions
    and schema validation'
  evidence_strength: high
  confidence: high
- pattern_id: declarative-agent-command-registry
  name: Declarative Agent Command Registry
  pattern_classification: intelligence
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - .agents/commands/speckit.plan.toml - Defines declarative command contract for
      the planning agentic skill.
    - .agents/commands/speckit.analyze.toml - Defines declarative specification for
      analysis workflows.
  description: Externalizes agent task specifications and skills into declarative
    TOML manifests in the repository.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Standardize how agent capabilities (planning, specifying, analyzing,
    migrating) are defined, shared, and triggered.'
  - 'Context: Located in `.agents/commands/` and `.agents/skills/` to configure speckit
    lifecycle operations.'
  - 'Force: Hardcoded CLI commands make agent workflows rigid and difficult to configure
    per project'
  - 'Force: Agents and human developers need identical interfaces to invoke standardized
    architectural skills'
  evidence_strength: high
  confidence: high
- pattern_id: finite-state-governance-engine
  name: Finite-State Governance Engine
  pattern_classification: intelligence
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-24'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_engine.py (TransitionRegistry, GovernanceActionEngine)
      - Encapsulates valid state transitions and gating rules for governance changes.
    - src/cas_runner/governance/models.py (GovernanceAction, GovernanceHealth) - Provides
      typed schema definitions for transitions and state tracking.
  description: Constrains agent-driven architecture changes using a TransitionRegistry
    and state transition engine that validates precondition constraints.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Prevent agents or automated runs from transitioning architectural states
    or closing compliance issues without meeting formal criteria.'
  - 'Context: Implemented in `cas_runner.governance` to manage governance actions
    and artifact statuses.'
  - 'Force: Unconstrained LLM outputs can declare architecture tasks ''complete''
    prematurely'
  - 'Force: Transitions between architecture stages require formal invariant checking'
  evidence_strength: high
  confidence: high
