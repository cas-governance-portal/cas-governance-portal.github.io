- pattern_id: declarative-agent-command-manifests
  name: Declarative Agent Command Manifests
  pattern_classification: intelligence
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - .agents/commands/speckit.specify.toml - Defines the specification agent task
      declaration
    - .agents/commands/speckit.plan.toml - Defines the planning agent command manifest
  description: Agent behaviors, skills, and subcommands are declared in isolated TOML
    configuration files to decouple prompting from runtime harnesses.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Standardize agent invocations across different lifecycle phases (plan,
    specify, clarify, tasks) using human-readable configuration.'
  - 'Context: Used in `.agents/commands/` to control speckit agent skills (e.g. speckit.plan.toml,
    speckit.specify.toml, speckit.tasks.toml).'
  - 'Force: Need consistent command execution without hardcoding prompt strings into
    python source'
  - 'Force: Support rapid iteration on agent instructions without rebuilding binaries'
  evidence_strength: high
  confidence: high
- pattern_id: governed-action-state-machine
  name: Governed Action State Machine
  pattern_classification: intelligence
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/governance_action_engine.py (TransitionRegistry, GovernanceActionEngine)
      - Registry checks valid state transitions before applying governance actions
    - src/cas_runner/governance/governance_action_service.py (GovernanceActionService)
      - Service layer executing validated governance actions
  description: Constrains autonomous mutations by routing all candidate operations
    through a formal TransitionRegistry and GovernanceActionEngine.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Prevent unauthorized or out-of-order state mutations proposed by LLMs
    or automated tools.'
  - 'Context: Employed in `src/cas_runner/governance/governance_action_engine.py`
    to gate project state updates.'
  - 'Force: LLMs can generate arbitrary actions that violate domain business logic'
  - 'Force: State changes must be auditable and reproducible'
  evidence_strength: high
  confidence: high
- pattern_id: agentic-merge-resolution
  name: Agentic Merge and Conflict Resolution
  pattern_classification: intelligence
  pattern_maturity: established
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-09-21'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/cas_runner/governance/agentic_merger.py (AgenticMerger) - Performs merge
      logic on agent outputs
    - src/cas_runner/governance/models.py (ResolutionResult) - Typed contract containing
      outcome of merge resolution
  description: Resolves divergent agent-generated changes and branch specifications
    through an automated semantic merge engine.
  pattern_type: implemented
  applies_to:
  - ideas-to-life-cas
  rationale:
  - 'Intent: Resolve discrepancies between parallel agent workstreams without requiring
    manual human git cherry-picking.'
  - 'Context: Found in `src/cas_runner/governance/agentic_merger.py` handling concurrent
    specs and artifact changes.'
  - 'Force: Multiple agents or run steps can generate conflicting updates to project
    specifications'
  - 'Force: Simple textual 3-way git merges fail on semantic JSON/Markdown schema
    conflicts'
  evidence_strength: high
  confidence: high
