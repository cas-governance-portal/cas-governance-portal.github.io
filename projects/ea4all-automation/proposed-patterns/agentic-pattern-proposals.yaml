- pattern_id: model-test-double-seam
  name: Model Test-Double Seam
  pattern_classification: intelligence
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-11-14'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/ea4all/llm/mock_client.py (MockLLMClient) - Identifies an explicit test-double
      component.
    - tests/test_llm_client.py (TestSharedLLMClient) - Identifies tests around the
      shared client.
    - tests/test_orchestrator_llm.py (TestOrchestratorLLM) - Suggests model integration
      is tested at the orchestration boundary.
    - tests/test_cli_llm_options.py (TestCLILLMOptions) - Adds an entry-point-level
      testing signal.
  description: A dedicated mock client and tests at client, CLI, and orchestrator
    boundaries suggest testing model-dependent behaviour without relying solely on
    live providers.
  pattern_type: emerging
  applies_to:
  - ea4all-automation
  rationale:
  - 'Intent: Separate application integration checks from external model execution.'
  - 'Context: The repository exposes MockLLMClient and three LLM-focused test classes.'
  evidence_strength: low
  confidence: low
- pattern_id: layered-reasoning-failure-vocabulary
  name: Layered Reasoning Failure Vocabulary
  pattern_classification: intelligence
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-11-14'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/ea4all/llm/client.py (LLMError, LLMAuthenticationError, LLMTimeoutError,
      LLMRateLimitError, LLMProviderError) - Shows a client-level failure vocabulary;
      hierarchy and mapping are unknown.
    - src/ea4all/llm/structured_engine.py (StructuredReasoningEngine, StructuredReasoningError,
      StructuredReasoningExhaustedError) - Suggests a separate reasoning failure boundary;
      does not prove retries or schema repair.
  description: Separate client and structured-reasoning error names distinguish provider
    failures from reasoning-layer failure.
  pattern_type: emerging
  applies_to:
  - ea4all-automation
  rationale:
  - 'Intent: Expose failures at the boundary where they can be interpreted without
    conflating provider access and reasoning completion.'
  - 'Context: Client errors and structured-reasoning errors are declared in different
    modules.'
  evidence_strength: low
  confidence: low
- pattern_id: orchestrator-capability-separation
  name: "Orchestrator\u2013Capability Separation"
  pattern_classification: intelligence
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-11-14'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/ea4all/engagement_intake/orchestrator.py (EngagementOrchestrator) - Suggests
      an explicit coordination boundary.
    - src/ea4all/engagement_intake/capabilities.py (assess_engagement_context, ingest_call_evidence,
      generate_intro_call_field_guide, generate_scoping_questionnaire) - Identifies
      candidate work units, not their execution graph.
    - tests/test_orchestrator_llm.py (TestOrchestratorLLM) - Suggests the orchestration
      boundary participates in model integration.
  description: An orchestration class is separated from domain operations for assessment,
    evidence ingestion, and document generation.
  pattern_type: emerging
  applies_to:
  - ea4all-automation
  rationale:
  - 'Intent: Keep coordination concerns distinct from engagement-specific operations.'
  - 'Context: EngagementOrchestrator and the capabilities module form separate architectural
    surfaces.'
  evidence_strength: low
  confidence: low
