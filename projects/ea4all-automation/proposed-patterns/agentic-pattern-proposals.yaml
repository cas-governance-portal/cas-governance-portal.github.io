pattern_proposals:
- pattern_id: provider-neutral-llm-boundary
  name: Provider-Neutral LLM Boundary
  pattern_classification: intelligence
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: '2026-11-14'
  derived_from:
    signals: []
    architecture_work: []
    supporting_evidence:
    - src/ea4all/llm/client.py (LLMClient) - Identifies the shared client boundary;
      its methods are unavailable.
    - src/ea4all/llm/litellm_client.py (LiteLLMClient) - Identifies a provider-integration
      component; inheritance and delegation are unverified.
    - src/ea4all/llm/mock_client.py (MockLLMClient) - Supports the interpretation
      of replaceable model access.
  description: A shared LLM client surface is separated from named provider and mock
    implementations.
  pattern_type: emerging
  applies_to:
  - ea4all-automation
  rationale:
  - 'Intent: Isolate application reasoning from provider-specific integration details.'
  - 'Context: The llm package contains LLMClient, LiteLLMClient, and MockLLMClient
    in separate modules.'
  evidence_strength: medium
  confidence: medium
