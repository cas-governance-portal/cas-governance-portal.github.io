- pattern_id: evidence-qualified-runtime-capability-baseline
  name: Evidence-Qualified Runtime Capability Baseline
  pattern_classification: intelligence
  pattern_maturity: strategic_direction
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Runtime inventory work calls for deterministic tracking of implemented modules
      and entrypoints.
    - Component decomposition work requires a verified responsibility map rather than
      an undifferentiated component.
    - Alignment findings identify insufficient implementation evidence for evaluating
      capability boundaries.
    - Current-state discovery represents schema fields and dependency-map entries
      as flows, leaving executable semantics unverified.
    architecture_work:
    - aw-discovery-ea4all-automation-1
    - aw-discovery-ea4all-automation-3
    supporting_evidence:
    - cas-arch-state-ea4all-automation-2026-11-03
    - alignment-report-ea4all-automation-2026-11-14-1
    - ev-manifest-pyproject
    - ev-reg-src-ea4all-engagement_intake-prompts.py-reasoning_output_schema
    - ev-reg-src-ea4all-engagement_intake-staleness.py-dependency_map
    - ev-ast-91281
  description: Establish a reusable capability baseline that distinguishes executable
    entrypoints, declarative contracts, dependency relationships, test expectations,
    and documented responsibilities. Require evidence appropriate to each entity and
    relationship before using it to assess implementation boundaries. Knowledge Providers
    supply target-project-bounded evidence; CAS Runner orchestrates and persists the
    baseline; reasoning workflows qualify observations and retain unresolved semantics.
    The proposed evolution is evidence qualification of discovery, not merely creation
    of an inventory file.
  pattern_type: future_direction
  applies_to:
  - architecture discovery
  - capability inventories
  - intelligence
  - alignment assessment
  - component boundary verification
  rationale:
  - Inventory and decomposition work independently require a trustworthy implementation
    baseline, making this reusable beyond either work item.
  - The supplied state contains an evidenced CLI entrypoint, but schema requirements
    and artifact dependency lists do not independently establish executable flows
    or CLI invocation relationships.
  - Test symbols demonstrate verification intent, not successful execution or a complete
    production responsibility map.
  - The alignment report describes an evidence gap in its supplied AEM and work context,
    while the current state supplies partial entrypoint evidence; qualification should
    reconcile these scopes rather than assert total absence or completeness.
  - The direction recurs across two architecture work items, current-state discovery
    limitations, and alignment recommendations; an implemented qualified baseline
    is not demonstrated.
  evidence_strength: high
  confidence: high
- pattern_id: independent-governance-lifecycle-projections
  name: Independent Governance Lifecycle Projections
  pattern_classification: governance
  pattern_maturity: emerging
  knowledgeType: signal
  decision:
    status: proposed
    decided_by: system
    date: null
  derived_from:
    signals:
    - Alignment findings report six unresolved ADR lifecycles with separate proposed
      decision status and accepted or rejected forum status.
    - Alignment recommendations require authorized disposition rather than automatic
      status normalization.
    - The ArchGov synchronization workflow distinguishes local status, remote review
      status, review cycles, ratification, and downstream lifecycle actions.
    architecture_work:
    - aw-discovery-ea4all-automation-2
    supporting_evidence:
    - alignment-report-ea4all-automation-2026-11-14-1
    - ev-skill-cas-sync-archgov-reviews
    - flow:governance:cas-sync-archgov-reviews:execution-workflow
  description: Preserve authoritative decision status, forum outcome, synchronization
    state, and downstream eligibility as distinct governance dimensions. Generated
    reports and synchronization processes should expose unresolved combinations without
    rewriting them into a single inferred status. Downstream ADR generation or pattern
    institutionalization should require the applicable authoritative decision and
    evidence prerequisites. This proposal extends the documented synchronization approach
    with explicit projection and eligibility semantics; it does not propose a second
    synchronization mechanism or authorize changes to existing decisions.
  pattern_type: emerging
  applies_to:
  - governance
  - ADR lifecycle management
  - external review synchronization
  - architecture evolution reporting
  - pattern institutionalization
  rationale:
  - The reported recurrence across six ADR projections indicates a reusable lifecycle
    concern rather than an isolated record correction.
  - The synchronization skill already exposes multiple status dimensions, while the
    alignment findings show that their downstream interpretation remains unresolved.
  - Separating recorded outcomes from derived eligibility avoids treating forum acceptance
    as an authoritative decision or treating a proposed decision as completed work.
  - Rejected proposals should remain outside active evolution unless a subsequent
    authorized decision changes their disposition.
  - The available evidence establishes documented governance behavior and reported
    friction, but does not include the six authoritative ADRs or synchronization execution
    results; transition rules require architect and governance-owner review.
  - No equivalent catalog entry is supplied, but the existing synchronization skill
    must be reviewed for overlap before adopting this proposed extension.
  evidence_strength: medium
  confidence: medium
