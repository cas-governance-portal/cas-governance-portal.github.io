global_pattern_candidates:
- id: provider-neutral-llm-boundary
  scope: global
  classification: supporting
  evidence_summary: 'Medium-quality evidence: the proposal identifies separate LLMClient,
    LiteLLMClient, and MockLLMClient modules. Architectural-state test symbols cover
    provider switching, model routing, cross-step dependency injection, and downstream
    client injection (ev-ast-539282, ev-ast-265370, ev-ast-563773). These establish
    structure and verification intent, not passing tests or verified adapter conformance.'
  rationale: A provider-independent application boundary is reusable across model-enabled
    systems without engagement-intake knowledge. It is complementary rather than foundational
    to every architecture. Global scope is defensible, but promotion should wait for
    interface inspection, adapter-conformance evidence, and architect review; neither
    multiple providers in production nor cross-project adoption is demonstrated.
  promotion_readiness: medium
- id: evidence-qualified-runtime-capability-baseline
  scope: global
  classification: core
  evidence_summary: Strong evidence of a recurring need across two cited architecture
    work items and discovery limitations; medium evidence for the proposed solution.
    The supplied state confirms a manifest-declared CLI entrypoint while also representing
    schema fields and artifact dependency lists as executable-looking flows. The referenced
    alignment report and work-item bodies are not supplied, and an implemented qualified
    baseline is not demonstrated.
  rationale: Distinguishing executable behavior, declarations, dependencies, documented
    responsibilities, and test expectations is foundational to trustworthy architecture
    discovery across systems. Core classification describes that general principle,
    not a mandate to adopt CAS-specific implementation roles. Promotion remains deferred
    until evidence rules, unresolved-semantics handling, and ownership boundaries
    are validated. High entity-evidence coverage must not be interpreted as verified
    relationship semantics or runtime completeness.
  promotion_readiness: medium
project_pattern_candidates:
- id: model-test-double-seam
  scope: project
  rationale: Keep as a project-level testing practice supporting the LLM boundary.
    MockLLMClient and the hermetic and structured-completion test names in ev-ast-539282
    strengthen the original low-evidence proposal. However, test bodies, network isolation,
    determinism, and execution results are unavailable. CLI option-parsing tests do
    not independently establish use of a model test double. Independent global promotion
    could duplicate part of the provider-neutral boundary.
  future_promotion_potential: high
- id: orchestrator-capability-separation
  scope: project
  rationale: Keep the engagement-intake decomposition project-scoped. Separate module
    names, documented independently invocable capabilities, and tests named for isolated
    invocation, step reordering, and optional omission support a local design intent.
    They do not establish actual responsibility allocation or an execution graph.
    A reusable coordination-versus-operation mechanism could emerge after implementation
    dependencies and independent invocation are verified.
  future_promotion_potential: high
- id: configuration-preflight-boundary
  scope: project
  rationale: Keep as an engagement-intake safeguard. Named validation and cycle-detection
    functions are corroborated by test symbols for missing approval policy, cycles,
    and unknown capabilities in ev-ast-91281. This supports a local validation concern,
    not proof that every execution path fails before side effects. Generalization
    requires verified validation inputs, enforcement order, and consistent coverage
    of CLI and direct invocation paths.
  future_promotion_potential: high
- id: explicit-evidence-assessment-vocabulary
  scope: project
  rationale: Keep the current evidence-assessment taxonomy project-scoped. The evidence-sufficiency
    skill and validator test symbols for vocabulary, referential integrity, conflicts,
    and human review strengthen its domain relevance. They do not prove integration
    with ingest_call_evidence or establish that these particular assessment dimensions
    transfer unchanged across domains. Separate a future general representation principle
    from this project's taxonomy before considering global scope.
  future_promotion_potential: medium
- id: explicit-approval-and-finding-state
  scope: project
  rationale: Keep the engagement-intake state vocabulary project-scoped. The supplied
    skill documents approval checks bound to content digests, while test symbols describe
    gate halting and stale-approval handling. This is stronger evidence of local governance
    intent than enum names alone, but not verified enforcement. Approval, finding
    disposition, staleness, and execution status should not be promoted as a single
    global workflow without transition semantics and clear ownership.
  future_promotion_potential: medium
candidate_patterns_requiring_review:
- id: explicit-model-call-contract
  rationale: Separate configuration, request, and response names suggest a reusable
    contract, but the evidence does not distinguish a substantive architectural mechanism
    from ordinary data containers or a facet of the provider-neutral boundary.
  evidence_gaps: Fields, validation rules, provider-specific leakage, compatibility
    guarantees, adapter usage, and independent consumers are unknown. No separate
    recurrence is demonstrated.
  recommended_next_step: Have CAS Runner supply interface definitions, representative
    callers, adapter mappings, and contract-test results. Prefer documenting this
    as part of provider-neutral-llm-boundary unless review establishes an independently
    reusable contract mechanism.
- id: layered-reasoning-failure-vocabulary
  rationale: Error names suggest distinct provider and reasoning concerns, but they
    do not establish a stable layered failure mechanism or sufficient independence
    from the shared client boundary.
  evidence_gaps: Exception hierarchy, translation sites, preservation of causes, caller
    handling, and reasoning-exhaustion semantics are missing. The error-normalization
    test name in ev-ast-539282 does not prove implementation behavior, retries, or
    schema repair.
  recommended_next_step: Request exception definitions, translation and handling paths,
    and negative-test results. Determine whether provider normalization belongs within
    the LLM boundary and whether reasoning failures justify a separate pattern.
- id: independent-governance-lifecycle-projections
  rationale: The distinction between authoritative decisions, forum outcomes, synchronization
    state, and downstream eligibility is broadly relevant. However, the proposed projection
    semantics extend an existing synchronization workflow, and authority and transition
    rules remain unresolved.
  evidence_gaps: The six authoritative ADRs, complete alignment findings, synchronization
    results, approved authority mapping, and eligibility transition rules are unavailable.
    Six records in one governance process do not establish cross-project stability.
  recommended_next_step: Obtain governance-owner and architect review of the authoritative
    records and existing synchronization skill. Define a decision and eligibility
    matrix, including rejected and unresolved combinations, and validate it through
    dry-run evidence. Do not normalize statuses, authorize downstream actions, or
    create a parallel synchronization mechanism.
duplicate_overlapping_patterns:
- patterns:
  - provider-neutral-llm-boundary
  - explicit-model-call-contract
  - model-test-double-seam
  recommended_action: Treat the boundary as the parent candidate; retain the contract
    and test seam as linked supporting facets pending evidence of independent applicability.
  rationale: All three rely on the same shared-client subsystem. They address related
    but distinct concerns, so exact duplication is not established. Independent promotion
    now risks turning one architectural boundary into several overlapping catalog
    entries.
- patterns:
  - provider-neutral-llm-boundary
  - layered-reasoning-failure-vocabulary
  recommended_action: Review provider-error normalization as part of the boundary;
    preserve a separate reasoning-layer proposal only if distinct semantics and handling
    are verified.
  rationale: Provider-neutral error handling can be part of adapter conformance. Reasoning-completion
    failures may be independent, but the current evidence does not establish that
    separation.
- patterns:
  - explicit-approval-and-finding-state
  - independent-governance-lifecycle-projections
  recommended_action: Keep separate and cross-reference the shared state-separation
    principle; do not merge their status models.
  rationale: Engagement deliverable approval and ADR review synchronization concern
    different authorities and lifecycles. Similar vocabulary is not evidence of interchangeable
    transitions. Conflation could incorrectly turn a recorded forum outcome into execution
    authorization.
- patterns:
  - explicit-evidence-assessment-vocabulary
  - evidence-qualified-runtime-capability-baseline
  recommended_action: Keep separate, with a possible supporting relationship after
    compatibility review.
  rationale: One represents assessment concepts; the other qualifies architectural
    observations and relationships. They share evidence-quality concerns but solve
    different problems. Do not assume the existing assessment models already implement
    discovery qualification.
- patterns:
  - independent-governance-lifecycle-projections
  - flow:governance:cas-sync-archgov-reviews:execution-workflow
  recommended_action: Review as a possible semantic extension to the existing workflow
    rather than a new synchronization pattern.
  rationale: The second identifier is an existing documented workflow, not a supplied
    global pattern. It already covers local and remote status, review cycles, ratification,
    and downstream verification. Only unresolved projection and eligibility semantics
    may be novel. The supplied global catalog is empty, which does not prove that
    no equivalent exists elsewhere.
promotion_recommendations:
  immediate_candidates: []
  deferred_candidates:
  - provider-neutral-llm-boundary
  - explicit-model-call-contract
  - model-test-double-seam
  - layered-reasoning-failure-vocabulary
  - orchestrator-capability-separation
  - configuration-preflight-boundary
  - explicit-evidence-assessment-vocabulary
  - explicit-approval-and-finding-state
  - evidence-qualified-runtime-capability-baseline
  - independent-governance-lifecycle-projections
  additional_evidence_required:
  - 'For provider-neutral-llm-boundary, explicit-model-call-contract, model-test-double-seam,
    and layered-reasoning-failure-vocabulary: obtain interface and adapter definitions,
    dependency-injection paths, error mappings, test bodies, and execution results.
    Test names establish intent, not conformance, hermeticity, or successful execution.'
  - 'For orchestrator-capability-separation and configuration-preflight-boundary:
    obtain implementation responsibility maps, capability invocation paths, validation
    ordering, and negative-test results demonstrating rejection before execution side
    effects.'
  - 'For explicit-evidence-assessment-vocabulary and explicit-approval-and-finding-state:
    obtain model consumers, validation and transition rules, integration evidence,
    and human-authority boundaries. Do not infer enforced governance from named states
    or skill documentation alone.'
  - 'For evidence-qualified-runtime-capability-baseline: obtain the cited architecture
    work and alignment findings, a reviewed evidence taxonomy, and a pilot separating
    executable entrypoints from declarations, artifact dependencies, test expectations,
    and documented responsibilities. Validate relationship semantics and retain unknowns
    rather than treating evidence coverage as completeness.'
  - 'For independent-governance-lifecycle-projections: obtain authoritative ADRs,
    review-cycle records, synchronization dry-run results, and governance-owner-approved
    authority and downstream-eligibility rules. Preserve unresolved and rejected dispositions
    until an authorized decision changes them.'
  - Before any global promotion, resolve overlap against the supplied proposals and
    existing synchronization workflow; have CAS Runner supply the relevant catalog
    context because an empty existing_global_patterns input establishes only that
    no entries were supplied.
  - Mitigate premature promotion and scope ambiguity by validating reusable mechanisms
    through an independent application or architect-reviewed transfer scenario. All
    classifications and readiness assessments are advisory; promotion and any authoritative
    lifecycle changes remain architect decisions.
