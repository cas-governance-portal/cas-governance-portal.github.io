promotion_candidates: []
deferred_candidates:
- pattern_id: provider-neutral-llm-boundary
  recommendation: defer
  rationale: Priority global supporting candidate with medium readiness. Architectural
    significance and strategic alignment are supported by separate LLMClient, LiteLLMClient,
    and MockLLMClient modules and injection/provider-switching test symbols in ev-ast-539282,
    ev-ast-265370, and ev-ast-563773. These establish structure and verification intent,
    not adapter conformance or successful substitution. Reusability is plausible but
    transfer is unvalidated.
  evidence_gaps: Interface methods, adapter implementations, actual injection paths,
    provider leakage, contract-test bodies and execution results, and independent
    transfer evidence are unavailable.
  promotion_criteria_missing:
  - Sufficient behavioral evidence of adapter conformance and provider independence
  - Validated reuse through an independent application or architect-reviewed transfer
    scenario
  - Resolved overlap with contract, test-double, and failure-vocabulary proposals
  - Architect-reviewed stability and governance suitability
  recommended_next_step: Have CAS Runner supply interfaces, adapter mappings, representative
    callers, and contract-test results. Review this as the parent boundary candidate
    before independently considering its supporting facets.
  scope_alignment: Preserves the classifier's global supporting classification; medium
    readiness does not by itself justify entry into promotion review.
  confidence: high
- pattern_id: evidence-qualified-runtime-capability-baseline
  recommendation: defer
  rationale: 'Priority global core candidate with medium readiness. Architectural
    significance and discovery-direction alignment are supported by cas-arch-state-ea4all-automation-2026-11-03:
    the manifest declares a CLI entrypoint, while schema fields and artifact dependency
    lists are represented with unverified executable relationships. Recurring need
    is reported across aw-discovery-ea4all-automation-1 and aw-discovery-ea4all-automation-3,
    but their bodies and the alignment report are absent. Evidence for the need is
    stronger than evidence for an implemented solution.'
  evidence_gaps: The cited work items and alignment findings, reviewed evidence taxonomy,
    relationship-validation rules, unknown-semantics handling, ownership agreement,
    and an evaluated baseline pilot are unavailable.
  promotion_criteria_missing:
  - Validated evidence qualification and relationship semantics
  - Demonstrated handling of unresolved observations and bounded completeness claims
  - Reviewed ownership boundaries
  - Pilot evidence and independent transfer validation
  - Corroboration of reported recurrence from source work items
  recommended_next_step: Have CAS Runner supply the cited source artifacts and a pilot
    separating executable behavior, declarations, dependencies, test expectations,
    and documented responsibilities. Obtain architect review of qualification rules
    and ownership without making CAS-specific roles a universal requirement.
  scope_alignment: Preserves global core classification for the evidence-qualification
    principle, not a mandate to adopt the proposed CAS implementation.
  confidence: high
- pattern_id: explicit-model-call-contract
  recommendation: defer
  rationale: LLMConfig, LLMRequest, and LLMResponse in src/ea4all/llm/client.py support
    an explicit representation concern aligned with the shared boundary. Names alone
    do not establish substantive architectural significance, a stable contract mechanism,
    or independent recurrence.
  evidence_gaps: Fields, validation rules, compatibility guarantees, adapter mappings,
    provider-specific leakage, actual consumers, and contract-test results are unknown.
  promotion_criteria_missing:
  - Demonstrated architectural mechanism beyond ordinary data containers
  - Verified contract enforcement and compatibility
  - Independent applicability and recurrence
  - Resolved independence from provider-neutral-llm-boundary
  recommended_next_step: Request interface definitions, representative callers, adapter
    mappings, and contract-test results through CAS Runner. Prefer a supporting facet
    of provider-neutral-llm-boundary unless distinct applicability is demonstrated.
  scope_alignment: Retains candidate-under-review status; no exceptional evidence
    supports overriding the classifier.
  confidence: high
- pattern_id: model-test-double-seam
  recommendation: defer
  rationale: Project-level testing significance and alignment with the shared LLM
    boundary are supported by MockLLMClient and hermetic/structured-completion test
    symbols in ev-ast-539282. Test names do not demonstrate isolation, determinism,
    or successful execution. CLI option-parsing tests in ev-ast-179629 do not establish
    test-double usage.
  evidence_gaps: Test bodies, fixture and injection paths, network-isolation controls,
    deterministic behavior, execution results, and independent reuse evidence are
    unavailable.
  promotion_criteria_missing:
  - Verified hermeticity and determinism
  - Successful execution evidence
  - Validated global applicability
  - Resolved overlap with the parent LLM boundary
  recommended_next_step: Retain as a project testing practice linked to provider-neutral-llm-boundary.
    Obtain test bodies and isolated execution results before evaluating independent
    promotion.
  scope_alignment: Preserves project scope and high future promotion potential without
    treating potential as readiness.
  confidence: high
- pattern_id: layered-reasoning-failure-vocabulary
  recommendation: defer
  rationale: Separate client and structured-reasoning error names indicate a potentially
    significant separation of concerns. The error-normalization test symbol in ev-ast-539282
    adds verification intent, but neither stable failure semantics nor independence
    from the LLM boundary is established.
  evidence_gaps: Exception hierarchy, translation sites, cause preservation, caller
    handling, reasoning-exhaustion semantics, negative-test bodies, and execution
    results are unavailable. Retries and schema repair are not established.
  promotion_criteria_missing:
  - Verified layered failure mechanism and handling semantics
  - Stable distinction between provider and reasoning failures
  - Independent recurrence and reuse
  - Resolved overlap with provider-neutral-llm-boundary
  recommended_next_step: Have CAS Runner supply exception definitions, translation
    and handling paths, and negative-test results. Review provider normalization within
    the parent boundary; retain a separate reasoning pattern only if distinct semantics
    are verified.
  scope_alignment: Preserves candidate-under-review status rather than inferring global
    readiness from error names.
  confidence: high
- pattern_id: orchestrator-capability-separation
  recommendation: defer
  rationale: Local structural significance and strategic alignment are supported by
    separate orchestrator/capability modules, documented independently invocable capabilities,
    and isolation, reordering, and omission test symbols in ev-ast-91281. Actual responsibility
    allocation and an execution graph are not verified.
  evidence_gaps: Implementation dependency maps, representative invocation paths,
    responsibility allocation, independent-invocation test bodies and results, and
    transfer evidence are missing.
  promotion_criteria_missing:
  - Verified coordination-versus-operation responsibility separation
  - Demonstrated independent capability invocation
  - Reusable mechanism separated from engagement-specific decomposition
  - Validated applicability beyond the project
  recommended_next_step: Retain project scope. Request implementation responsibility
    and dependency maps plus independent-invocation results, then evaluate a domain-neutral
    coordination mechanism through architect review.
  scope_alignment: Preserves the classifier's project classification and high future
    promotion potential.
  confidence: high
- pattern_id: configuration-preflight-boundary
  recommendation: defer
  rationale: Local execution-safeguard significance is supported by validate_config_data,
    validate_preflight, detect_cycles, and rejection test symbols for missing policy,
    cycles, and unknown capabilities in ev-ast-91281. This does not establish rejection
    before side effects across every entry path.
  evidence_gaps: Validated input structures, enforcement ordering, CLI and direct-invocation
    coverage, side-effect instrumentation, and negative-test execution results are
    unavailable.
  promotion_criteria_missing:
  - Verified fail-before-side-effects enforcement
  - Consistent CLI and direct-invocation coverage
  - Stable validation contract
  - Validated transfer beyond engagement intake
  recommended_next_step: Have CAS Runner supply validation and execution call paths
    and negative tests demonstrating rejection before model calls, writes, or other
    execution side effects. Retain the local safeguard pending review.
  scope_alignment: Preserves project scope; test symbols do not justify exceptional
    global promotion.
  confidence: high
- pattern_id: explicit-evidence-assessment-vocabulary
  recommendation: defer
  rationale: Project-level assessment significance and strategic alignment are supported
    by evidence_sufficiency models, ev-skill-evidence-sufficiency, and vocabulary,
    integrity, conflict, and human-review test symbols in ev-ast-436554. Integration
    with ingest_call_evidence and cross-domain stability of this taxonomy are not
    established.
  evidence_gaps: Actual model consumers, validation implementations and results, engagement-ingestion
    integration, human-review enforcement, and cross-domain mapping are missing.
  promotion_criteria_missing:
  - Verified model integration and validation behavior
  - Separation of a reusable representation principle from the local taxonomy
  - Cross-domain applicability evidence
  - Reviewed human-authority boundaries
  recommended_next_step: Retain the taxonomy at project scope. Request model consumers
    and validation/integration results, then review whether a general representation
    principle can be transferred without imposing these assessment dimensions unchanged.
  scope_alignment: Preserves project scope and medium future promotion potential.
  confidence: high
- pattern_id: explicit-approval-and-finding-state
  recommendation: defer
  rationale: Local governance significance is supported by explicit state symbols,
    documented digest-bound approval in ev-skill-engagement-intake, and gate-halting/stale-approval
    test symbols in ev-ast-91281. Documentation and test names do not prove enforcement
    or justify combining approval, findings, staleness, and execution status into
    a global workflow.
  evidence_gaps: State-transition definitions, authoritative owners, integration paths,
    digest-validation implementation, bypass coverage, and execution results are unavailable.
  promotion_criteria_missing:
  - Explicit and verified transition semantics
  - Clear human approval authority and ownership
  - Enforcement evidence across invocation paths
  - Reusable state-separation mechanism distinct from local status vocabulary
  recommended_next_step: Request a transition/authority matrix and tests covering
    approval changes, stale digests, gate halting, and direct invocation. Keep approval,
    finding disposition, staleness, and execution dimensions distinct during review.
  scope_alignment: Preserves project scope; local governance intent is not evidence
    of global workflow stability.
  confidence: high
- pattern_id: independent-governance-lifecycle-projections
  recommendation: defer
  rationale: Governance significance and strategic alignment are supported by the
    existing cas-sync-archgov-reviews workflow's distinct local/remote statuses, review
    cycles, ratification, and downstream verification. Recurrence across six ADRs
    is reported, not independently inspectable. Proposed projection and eligibility
    semantics remain unresolved and may be an extension of the existing workflow.
  evidence_gaps: The six authoritative ADRs, full alignment findings, review-cycle
    records, synchronization dry-run results, approved authority mapping, and downstream-eligibility
    rules are unavailable.
  promotion_criteria_missing:
  - Authoritative source-record validation
  - Governance-owner-approved authority and eligibility matrix
  - Dry-run validation of rejected, unresolved, and accepted combinations
  - Resolved overlap with the synchronization workflow
  - Independent transfer evidence beyond one governance process
  recommended_next_step: Have CAS Runner supply authoritative records and dry-run
    evidence. Obtain governance-owner and architect review of the decision/eligibility
    matrix within the existing synchronization workflow. Do not normalize statuses,
    authorize downstream actions, or create parallel synchronization.
  scope_alignment: Preserves candidate-under-review status; broad relevance does not
    resolve authority or establish global maturity.
  confidence: high
rejected_candidates: []
duplicate_overlapping_promotion_candidates:
- patterns_involved:
  - provider-neutral-llm-boundary
  - explicit-model-call-contract
  - model-test-double-seam
  recommended_action: Review the boundary as the parent candidate and retain contract
    and test seam as supporting facets unless independent applicability is demonstrated.
  rationale: The proposals draw on the same shared-client subsystem. Related concerns
    are established, not exact duplication; independent promotion now risks fragmenting
    one boundary into overlapping catalog entries.
- patterns_involved:
  - provider-neutral-llm-boundary
  - layered-reasoning-failure-vocabulary
  recommended_action: Review provider-error normalization within boundary conformance;
    consider a separate reasoning-layer pattern only after verifying distinct semantics
    and handling.
  rationale: Error normalization can be part of adapter conformance. Current names
    and test symbols do not establish an independent reasoning-failure mechanism.
- patterns_involved:
  - explicit-approval-and-finding-state
  - independent-governance-lifecycle-projections
  recommended_action: Keep separate and cross-reference only the shared state-separation
    principle; do not merge status models.
  rationale: Engagement approvals and ADR/forum synchronization have different authorities
    and lifecycles. Conflation could incorrectly convert a recorded forum outcome
    into execution authorization.
- patterns_involved:
  - explicit-evidence-assessment-vocabulary
  - evidence-qualified-runtime-capability-baseline
  recommended_action: Keep separate; evaluate a supporting relationship only after
    compatibility review.
  rationale: Assessment taxonomy and qualification of architectural observations solve
    different problems. Existing assessment models are not demonstrated to implement
    discovery qualification.
- patterns_involved:
  - independent-governance-lifecycle-projections
  - flow:governance:cas-sync-archgov-reviews:execution-workflow
  recommended_action: Assess projection and eligibility semantics as a possible extension
    of the existing synchronization workflow, not a second synchronization mechanism.
  rationale: The existing identifier denotes a documented workflow, not a supplied
    promoted pattern. It already covers multiple status dimensions and downstream
    verification. An empty supplied global catalog does not establish catalog-wide
    novelty.
promotion_preconditions_not_met:
- pattern_id: provider-neutral-llm-boundary
  unmet_preconditions:
  - Sufficient implementation and behavioral evidence
  - Validated transfer and resolved catalog overlap
  - Architect-reviewed stability
  missing_evidence:
  - LLM interface and adapter definitions
  - Injection paths and provider-conformance test results
  - Independent application or reviewed transfer scenario
  rationale: Global scope and medium readiness are supported, but test symbols and
    module names are insufficient to establish reliable substitution.
  recommended_next_step: Prioritize a parent-boundary evidence package and architect
    review, including relevant catalog context supplied by CAS Runner.
- pattern_id: evidence-qualified-runtime-capability-baseline
  unmet_preconditions:
  - Validated qualification mechanism
  - Reviewed relationship semantics and ownership
  - Evaluated pilot and transfer evidence
  missing_evidence:
  - Cited work-item bodies and alignment report
  - Evidence taxonomy and unresolved-semantics rules
  - Pilot distinguishing executable, declarative, dependency, test, and documented
    observations
  rationale: Global significance and recurring need do not demonstrate a stable solution.
    The manifest supports a declared CLI entrypoint, not runtime completeness; 100%
    entity-evidence coverage does not validate relationships.
  recommended_next_step: Prioritize a bounded pilot with explicit unknowns, source
    traceability, relationship checks, and architect-reviewed ownership.
- pattern_id: explicit-model-call-contract
  unmet_preconditions:
  - Scope review completed
  - Substantive independent mechanism established
  - Sufficient contract evidence
  missing_evidence:
  - Fields and validation rules
  - Compatibility guarantees and adapter mappings
  - Independent consumers and contract-test results
  rationale: Named representations may be ordinary containers or facets of the parent
    boundary rather than a distinct reusable pattern.
  recommended_next_step: Inspect the supplied contract evidence through CAS Runner
    and resolve parent-facet treatment before reconsidering independent promotion.
- pattern_id: model-test-double-seam
  unmet_preconditions:
  - Global scope justification
  - Verified isolation and determinism
  - Resolved independence from parent boundary
  missing_evidence:
  - Test-double implementation and injection paths
  - Network-isolation checks
  - Repeatable successful test results
  rationale: Project-level testing intent is credible, but hermetic behavior and independent
    global applicability remain unverified.
  recommended_next_step: Validate the local testing seam and retain it as supporting
    guidance under the shared-client candidate.
- pattern_id: layered-reasoning-failure-vocabulary
  unmet_preconditions:
  - Scope review completed
  - Stable layered failure semantics
  - Independent reuse and overlap resolution
  missing_evidence:
  - Exception hierarchy and translation paths
  - Cause-preservation and caller-handling behavior
  - Reasoning-exhaustion definitions and negative-test results
  rationale: Error names do not establish an enforced architectural boundary or recovery
    semantics.
  recommended_next_step: Validate provider normalization with the parent boundary
    and separately assess any verified reasoning-layer mechanism.
- pattern_id: orchestrator-capability-separation
  unmet_preconditions:
  - Global scope justification
  - Verified responsibility allocation
  - Demonstrated independent invocation and transfer
  missing_evidence:
  - Implementation responsibility and dependency maps
  - Actual invocation paths
  - Independent-invocation test bodies and results
  rationale: Local module decomposition and documented capability intent do not prove
    domain-neutral operational separation.
  recommended_next_step: Validate the project decomposition, then submit a reusable
    coordination mechanism and transfer scenario for architect review.
- pattern_id: configuration-preflight-boundary
  unmet_preconditions:
  - Global scope justification
  - Verified enforcement before side effects
  - Coverage of all supported invocation paths
  missing_evidence:
  - Validated input contract
  - Validation-to-execution ordering
  - CLI and direct-invocation negative-test results with side-effect checks
  rationale: Named validators and rejection tests establish intent, not a universally
    enforced preflight boundary.
  recommended_next_step: Demonstrate rejection before execution side effects for each
    supported entry path and review transferability.
- pattern_id: explicit-evidence-assessment-vocabulary
  unmet_preconditions:
  - Global scope justification
  - Verified consumer integration
  - Stable cross-domain abstraction
  missing_evidence:
  - Model consumers and ingestion integration
  - Validation implementations and execution results
  - Cross-domain mappings and human-authority rules
  rationale: The local taxonomy has documented relevance, but its particular assessment
    dimensions are not proven portable.
  recommended_next_step: Validate local integration and separate the general representation
    principle from domain-specific vocabulary.
- pattern_id: explicit-approval-and-finding-state
  unmet_preconditions:
  - Global scope justification
  - Approved transition and authority semantics
  - Verified approval and staleness enforcement
  missing_evidence:
  - Transition and ownership matrix
  - Digest-bound approval implementation
  - Gate-halting, stale-approval, and bypass-path execution results
  rationale: Explicit states and documented gates do not establish enforced governance
    or a transferable combined lifecycle.
  recommended_next_step: Validate each state dimension and enforcement path under
    human authority before considering a general state-separation pattern.
- pattern_id: independent-governance-lifecycle-projections
  unmet_preconditions:
  - Scope review completed
  - Authoritative decision and eligibility rules validated
  - Critical authority ambiguity resolved
  - Existing-workflow overlap resolved
  missing_evidence:
  - Six authoritative ADRs and complete alignment findings
  - Review-cycle and synchronization dry-run records
  - Governance-owner-approved authority and eligibility matrix
  rationale: Six reported records within one governance process do not establish independent
    stability. Unresolved authority rules could cause unauthorized lifecycle transitions
    or downstream institutionalization.
  recommended_next_step: Review source records and dry-run all relevant status combinations
    within the existing synchronization mechanism; preserve unresolved and rejected
    dispositions until authorized changes occur.
governance_summary:
  immediate_promotion_candidates: []
  deferred_candidates:
  - provider-neutral-llm-boundary
  - evidence-qualified-runtime-capability-baseline
  - explicit-model-call-contract
  - model-test-double-seam
  - layered-reasoning-failure-vocabulary
  - orchestrator-capability-separation
  - configuration-preflight-boundary
  - explicit-evidence-assessment-vocabulary
  - explicit-approval-and-finding-state
  - independent-governance-lifecycle-projections
  rejected_candidates: []
  major_governance_risks:
  - 'Premature promotion: module names, AST test symbols, and skill documentation
    establish structure or intent, not passing tests, conformance, hermeticity, or
    enforced governance.'
  - 'Discovery overclaiming: schema fields, artifact dependencies, and extracted document
    order must not be treated as verified executable flows; entity-evidence coverage
    does not establish relationship correctness or runtime completeness.'
  - 'Catalog fragmentation: contract, test seam, and provider-error handling may be
    supporting facets of one LLM boundary rather than independent global patterns.'
  - 'Incomplete duplication context: existing_global_patterns is empty only in the
    supplied input. CAS Runner should supply relevant catalog context before any promotion
    recommendation.'
  - 'Authority conflation: forum outcomes, authoritative decisions, synchronization
    state, deliverable approval, and downstream eligibility must remain distinct.
    No status normalization or downstream authorization follows from this assessment.'
  - 'Scope inflation: project practices and unresolved candidates lack exceptional
    evidence for bypassing their classifications; global potential is not promotion
    readiness.'
  - 'Solution maturity inflation: strong evidence of a strategic need does not establish
    a validated implementation, stable ownership model, or transferable mechanism.'
  - No Pattern Governance Model was supplied; model-specific alignment cannot be verified.
    All recommendations are advisory, no proposal is rejected as invalid, and architect
    review remains mandatory. No approvals, ADRs, promoted patterns, lifecycle changes,
    or persisted outcomes are produced.
