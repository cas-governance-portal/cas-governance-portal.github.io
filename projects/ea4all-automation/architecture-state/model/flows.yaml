    name: 'For each task in the list, use the GitHub MCP server to create a new issue
      in the repository that is representative of the Git remote. Task lines in `tasks.md`
      start with a markdown checkbox, so first strip the leading `- [ ]` (and any
      `[P]` / `[US#]` markers) to recover the task ID and its description. Create
