      \ cover those IDs. Do not pass a `state` value, since omitting it makes the\
      \ tool return both open and closed issues. Request `perPage: 100` to keep the\
      \ number of calls down, and since the tool uses cursor-based pagination, request\
      \ pages with the `after` parameter (using the `endCursor` from the previous\
      \ response). For each issue title, match it against the task ID pattern `\\\
      bT\\d{3,}\\b` (the `{3,}` accepts four-digit and longer IDs \u2014 with `\\\
      d{3}` a title containing `T1000` would not match at all, because the trailing\
      \ `\\b` cannot fall between two digits, so that task would be silently neither\
      \ deduplicated nor created; word boundaries still stop a token like `ST001`\
      \ from matching, and force the whole digit run to be consumed so `T100` can\
      \ never match inside `T1000`; this also recognises titles written as `T001 ...`,\
      \ `T001: ...` or `[T001] ...`) and, when it matches one of your task IDs, mark\
      \ that ID as already having an issue. Stop paginating as soon as every task\
      \ ID has been matched, or when there are no more pages, so you do not keep fetching\
      \ the whole repository's issue history once all task IDs are accounted for.\
      \ This bounds the number of calls on repos with large issue histories and still\
      \ prevents duplicates when the command is re-run after `tasks.md` is regenerated\
      \ or the skill is re-invoked."
