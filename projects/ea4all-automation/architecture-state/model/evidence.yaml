- id: ev-wf-93311
  path: .github/workflows/cas-validate-sdd.yml
  type: workflow
  reference: cas-validate-sdd.yml
  snippet: "name: CAS SDD Validation\n\non:\n  pull_request:\n    branches: [ main,\
    \ master ]\n    paths:\n      - 'src/**'\n\njobs:\n  validate-sdd:\n    runs-on:\
    \ ubuntu-latest\n    steps:\n      - name: Checkout Code\n        uses: actions/checkout@v4\n\
    \        with:\n          fetch-depth: 0\n\n      - name: Validate Specification\
    \ Presence\n        run: |\n          echo \"[CAS][INFO] Validating Specification-Driven\
    \ Development (SDD) compliance...\"\n          \n          # Check for exemptions\
    \ in commit messages\n          EXEMPT=$(git log --format=%B -n 1 ${{ github.event.pull_request.head.sha\
    \ }} | grep -E \"\\[skip-governance\\]|\\[bugfix\\]\" || true)\n          if [\
    \ -n \"$EXEMPT\" ]; then\n            echo \"[CAS][SKIP] Exemption found in commit\
    \ message: $EXEMPT\""
  confidence: high
